name: xenia_internal_bridge
resolution: workspace
description: Isolated in-process XeniOS (Xenia) Core bridge for the RewindBox Xbox 360 playlist.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.2'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: XeniaInternalBridgePlugin
