publish_to: none
environment:
  sdk: '>=3.9.2'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AchievementTranslationPlugin
