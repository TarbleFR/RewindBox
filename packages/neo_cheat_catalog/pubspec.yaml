name: neo_cheat_catalog
resolution: workspace
description: Verified, unified cheat catalogue shared by RewindBox's embedded engines.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.2'
  flutter: '>=3.35.0'

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: NeoCheatCatalogPlugin
        dartPluginClass: NeoCheatCatalog
