name: s2arm_probe
resolution: workspace
description: RewindBox diagnostic only. Feasibility probe for running S2Arm-rewritten code from JIT memory; no player-facing feature.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.2'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: S2ArmProbePlugin
