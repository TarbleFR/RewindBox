name: RetroAchievementsSession
options:
  bundleIdPrefix: org.rewindbox.tests.ra-session
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # Flutter's distributed framework quotes its own internal headers. Disable
    # only that vendor packaging-style diagnostic; keep all other warnings fatal.
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: '-'
    DEVELOPMENT_TEAM: ''
    HEADER_SEARCH_PATHS:
      - $(inherited)
      - ${REWIND_ROOT}/packages/retro_achievements_session/ios/Classes
      - ${REWIND_ROOT}/packages/retro_achievements_session/ios/Classes/Public
targets:
  RetroAchievementsSessionHost:
    type: application
    platform: iOS
    sources:
      - path: ${REWIND_ROOT}/packages/retro_achievements_session/ios/Classes
      - path: ${REWIND_ROOT}/packages/retro_achievements_session/ci/TestHost
    dependencies:
      - framework: ${FLUTTER_ROOT}/bin/cache/artifacts/engine/ios/Flutter.xcframework
        embed: true
        codeSign: true
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.rewindbox.tests.ra-session.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Tests load the actual plugin and C entry points from this application.
        # They must remain linkable even though the tiny host never runs Flutter.
        DEAD_CODE_STRIPPING: NO
        OTHER_LDFLAGS: $(inherited) -ObjC
  RetroAchievementsSessionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ${REWIND_ROOT}/packages/retro_achievements_session/Tests
    dependencies:
      - target: RetroAchievementsSessionHost
      - framework: ${FLUTTER_ROOT}/bin/cache/artifacts/engine/ios/Flutter.xcframework
        embed: false
      - sdk: Foundation.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.rewindbox.tests.ra-session.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RetroAchievementsSessionHost.app/RetroAchievementsSessionHost
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  RetroAchievementsSession:
    build:
      targets:
        RetroAchievementsSessionHost: all
        RetroAchievementsSessionTests: [test]
    test:
      targets:
        - RetroAchievementsSessionTests
