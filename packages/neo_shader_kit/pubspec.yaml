name: neo_shader_kit
resolution: workspace
description: Shader catalogs, downloads, profiles and Metal translation shared by NeoStation iOS's embedded engines.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.2'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: NeoShaderKitPlugin
