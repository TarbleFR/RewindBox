name: s2arm_engine_bridge
resolution: workspace
description: Host side of the embedded Switch 2 engine (S2Arm) in RewindBox, behind the Switch 2 playlist.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.2'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: S2ArmEngineBridgePlugin
