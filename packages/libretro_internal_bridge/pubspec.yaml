name: libretro_internal_bridge
resolution: workspace
description: Embedded libretro host for RewindBox, running the cores RetroArch uses inside RewindBox.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.2'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LibretroInternalBridgePlugin
