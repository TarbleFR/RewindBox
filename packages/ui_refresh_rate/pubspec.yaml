name: ui_refresh_rate
resolution: workspace
description: NeoStation iOS "120 Hz interface" setting. Keeps or caps the refresh rate requested by the Flutter engine only; emulators are not touched.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.2'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: UiRefreshRatePlugin
