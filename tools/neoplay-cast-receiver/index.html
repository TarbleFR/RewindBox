<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>RewindBox</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #d7dae2; font: 24px/1.4 system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #canvas, #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; }
  #splash h1 { margin: 0; font-size: 64px; font-weight: 700; letter-spacing: .03em; color: #fff; }
  #status { font-size: 24px; opacity: .72; }
  #hud { position: fixed; left: 24px; bottom: 18px; padding: 4px 10px; border-radius: 6px; background: rgba(0,0,0,.6); font: 15px/1.3 ui-monospace, monospace; color: #9fe39f; }
  [hidden] { display: none !important; }
</style>
<script type="module" src="receiver.mjs"></script>
</head>
<body>
  <div id="stage"><canvas id="canvas" hidden></canvas><video id="video" hidden playsinline></video></div>
  <div id="splash"><h1>RewindBox</h1><div id="status"></div></div>
  <div id="hud" hidden></div>
</body>
</html>
