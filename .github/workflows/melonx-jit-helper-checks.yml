name: MeloNX complete JIT helper regression
'on':
  push:
    branches: [Claude]
    paths:
      - .github/workflows/melonx-jit-helper-checks.yml
      - packages/melonx_jit_helper/ios/Resources/melonx-universal.js
      - build-utils/melonx/helper_initialization.py
      - test/melonx_jit_helper_initialization_test.py
      - test/melonx_sized_jit_session_test.js
      - test/melonx_sized_jit/Session.js
      - test/melonx_sized_jit/Session.swift
permissions:
  contents: read
jobs:
  helper:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproduce delivered601 failure and execute complete corrected script in JavaScriptCore
        run: python3 test/melonx_jit_helper_initialization_test.py --require-apple
      - uses: actions/upload-artifact@v4
        with:
          name: MeloNX-helper-init-${{ github.sha }}
          path: build/delivery/melonx-jit-helper-init.json
          if-no-files-found: error
          retention-days: 30
