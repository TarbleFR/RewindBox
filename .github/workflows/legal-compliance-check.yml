name: Source and legal checks

on:
  push:
    branches:
      - main
      - experimental
    paths:
      - 'NOTICE.md'
      - 'README.md'
      - 'assets/legal/**'
      - 'docs/LEGAL_AND_CREDITS.md'
      - 'docs/RELEASE_0.0.1_SOURCE_MANIFEST.md'
      - 'lib/l10n/legal_credits_locale.dart'
      - 'lib/screens/settings_screen/legal_credits_dialog.dart'
      - 'lib/screens/settings_screen/new_settings_options/about_settings_content.dart'
      - 'lib/screens/settings_screen/new_settings_options/system_art_settings_content.dart'
      - 'lib/services/neo_assets_service.dart'
      - 'lib/services/system_art/**'
      - 'tools/system_art/**'
      - 'test/services/neo_assets_service_external_pack_test.dart'
      - 'lib/widgets/setup_wizard.dart'
      - 'build-utils/embed_legal_bundle.py'
      - 'build-utils/validate_legal_bundle_ipa.py'
      - 'build-utils/libretro/cores.json'
      - 'build-utils/*/source.json'
      - 'build-utils/rpcs3/canonical-source.json'
      - 'packages/neo_shader_kit/ios/ThirdParty/*/SOURCE.txt'
      - 'test/legal_bundle_preflight_test.py'
      - 'test/legal_credits_dialog_test.dart'
      - 'pubspec.yaml'
      - '.github/workflows/legal-compliance-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate legal bundle and UI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get --enforce-lockfile

      - name: Analyze all Dart sources
        run: flutter analyze

      - name: Test bundled credits and all supported locales
        run: flutter test test/legal_credits_dialog_test.dart

      - name: Test source cleanup regressions
        run: |
          flutter test \
            test/frontend_media_gate_test.dart \
            test/ios_gamepad_navigation_test.dart \
            test/neoswap_shader_storage_test.dart \
            test/retro_achievements_layout_test.dart \
            test/retroarch_real_export_test.dart \
            test/rpcs3_library_service_test.dart \
            test/game_deletion_regression_test.dart \
            test/library_metadata_provider_service_test.dart \
            test/dolphin_system_files_test.dart \
            test/armsx2_bios_selection_test.dart \
            test/armsx2_in_game_localization_test.dart \
            test/rpcs3_bridge_memory_mode_test.dart \
            test/armsx2_retroarch_routing_isolation_test.dart \
            test/rpcs3_stage6_test.dart \
            test/theme_provider_background_persistence_test.dart \
            test/video_preview_lifecycle_test.dart \
            test/grid_preview_audio_contract_test.dart \
            test/external_display_games_list_test.dart \
            test/secondary_background_fallback_test.dart \
            test/neo_swap_locale_test.dart \
            test/services/neo_assets_service_external_pack_test.dart
          python3 test/retroarch_baseline_scope_test.py

      - name: Validate legal scripts and source pins
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             build-utils/embed_legal_bundle.py             build-utils/validate_legal_bundle_ipa.py
          python3 test/legal_bundle_preflight_test.py
          python3 tools/system_art/canvas_es_de.py --check

          python3 - <<'PY'
          from pathlib import Path

          locale_text = Path('lib/l10n/legal_credits_locale.dart').read_text()
          for locale in (
              'en', 'es', 'ru', 'zh', 'zh_Hant', 'pt',
              'fr', 'de', 'it', 'id', 'ja', 'ko',
          ):
              count = locale_text.count("'" + locale + "':")
              assert count == 9, (locale, count)

          assets_service = Path('lib/services/neo_assets_service.dart').read_text()
          art_picker = Path(
              'lib/screens/settings_screen/new_settings_options/'
              'system_art_settings_content.dart'
          ).read_text()
          wizard = Path('lib/widgets/setup_wizard.dart').read_text()
          credits = Path(
              'lib/screens/settings_screen/legal_credits_dialog.dart'
          ).read_text()

          assert "final String author;" in assets_service
          assert "author: json['author']" in assets_service
          assert "author: 'iiSU Network / RiiSU'" in assets_service
          assert "item.author" in art_picker
          assert "recommended.author" in wizard
          assert "NeoStation Assets" in credits
          assert "RiiSU / iiSU System Art" in credits
          assert "author: 'zenandiko, from Canvas by Siddy212'" in assets_service
          assert "zenandiko/canvas-es-de" in assets_service
          assert "Canvas (ES-DE) System Art" in credits
          assert "rootBundle.loadString" in credits
          for asset in (
              'NeoStation-GPL-3.0.txt',
              'RPCS3-GPL-2.0.txt',
              'ARMSX2-GPL-3.0.txt',
              'Dusklight-CC0-1.0.txt',
              'StikJIT-MPL-2.0.txt',
              'GameDB-PS3-GPL-3.0.txt',
              'NeoStation-Assets-CC-BY-NC-SA-4.0.txt',
              'RiiSU-ATTRIBUTION.md',
              'Canvas-ES-DE-ATTRIBUTION.md',
          ):
              assert (Path('assets/legal') / asset).is_file(), asset
          PY

      - name: Exercise future app legal embedding
        shell: bash
        env:
          TEST_SHA: 0000000000000000000000000000000000000350
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/legal-test/Payload/Runner.app"
          mkdir -p "$APP"

          GITHUB_SHA="$TEST_SHA" python3 build-utils/embed_legal_bundle.py             --app "$APP"             --build-number 350             --dolphin-sha 7cac54161659421ed95c2cd1c0b0746539a4cd38

          (
            cd "$RUNNER_TEMP/legal-test"
            zip -qr legal-test.ipa Payload
          )

          python3 build-utils/validate_legal_bundle_ipa.py             "$RUNNER_TEMP/legal-test/legal-test.ipa"             --build-number 350             --commit "$TEST_SHA"
