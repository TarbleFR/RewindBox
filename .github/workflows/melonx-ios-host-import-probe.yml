name: "MeloNX iOS host-import regression probe"
on:
  push:
    branches:
      - fix/melonx-ios-vulkan-host-import-20261025
    paths:
      - build-utils/melonx/adapt_runtime.py
      - test/melonx_ios_vulkan_host_import_test.py
      - .github/workflows/melonx-ios-host-import-probe.yml
permissions:
  contents: read
jobs:
  guarded-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run focused no-device regression checks
        run: |
          python3 -m py_compile build-utils/melonx/adapt_runtime.py test/melonx_ios_vulkan_host_import_test.py
          python3 test/melonx_ios_vulkan_host_import_test.py
      - name: Test against exact pinned native MeloNX sources
        run: |
          set -euo pipefail
          mkdir -p .native-sources
          git init .native-sources/MeloNX
          git -C .native-sources/MeloNX remote add origin https://starforgejo.dev/projects/MeloNX.git
          git -C .native-sources/MeloNX fetch --depth 1 origin 13700519f3abc4e6d7ed8a065b118b2cc59bcd67
          git -C .native-sources/MeloNX checkout --detach FETCH_HEAD
          echo "========== exact Vulkan extension source =========="
          grep -n -C 5 -E 'enabledExtensions|desirableExtensions|ExtExternalMemoryHost|SupportsHostImportedMemory' .native-sources/MeloNX/src/Ryujinx.Graphics.Vulkan/VulkanInitialization.cs | tail -95
          echo "========== exact renderer source =========="
          grep -n -C 3 -E 'ExtExternalMemoryHost|PrepareHostMapping' .native-sources/MeloNX/src/Ryujinx.Graphics.Vulkan/VulkanRenderer.cs | tail -65
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'build-utils/melonx')
          from adapt_runtime import disable_ios_host_import
          src = Path('.native-sources/MeloNX')
          paths = disable_ios_host_import(src)
          assert len(paths) == 2
          init = (src/'src/Ryujinx.Graphics.Vulkan/VulkanInitialization.cs').read_text()
          renderer = (src/'src/Ryujinx.Graphics.Vulkan/VulkanRenderer.cs').read_text()
          assert '.Where(extension => !OperatingSystem.IsIOS() || extension != ExtExternalMemoryHost.ExtensionName)' in init
          assert '!OperatingSystem.IsIOS() && _physicalDevice.IsDeviceExtensionPresent(ExtExternalMemoryHost.ExtensionName)' in renderer
          assert 'TextureGroup.FlushIntoBuffer' not in init
          print('Exact pinned source host-import masking applied and existing texture readback fallback verified.')
          PY
