name: MeloNX mapped pipeline cache memory measure
run-name: Mapped pipeline cache memory • ${{ github.sha }}
# Lot 9. MoltenVK v1.4.2 with the candidate patch built for macOS: the footprint of a loaded pipeline cache, copied
# against referenced in a read-only mapping, on the runner's real Metal device. Nothing is packaged, pinned or delivered.
'on':
  push:
    branches:
    - work/melonx-fps-stability-20261103
    paths:
    - .github/workflows/melonx-mapped-cache.yml
    - test/melonx_library_share/run_mapped_cache.py
    - test/melonx_library_share/mvk_library_share_test.cpp
    - build-utils/melonx/moltenvk-candidates/**
permissions:
  contents: read
concurrency:
  group: melonx-mapped-cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Build the candidate MoltenVK for macOS and measure a loaded cache's footprint, copied and referenced
      run: python3 test/melonx_library_share/run_mapped_cache.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: MeloNX-mapped-cache-${{ github.sha }}
        path: dist/melonx-mapped-cache
        retention-days: 14
        if-no-files-found: error
