name: Shared cheat installation and PS2 PS3 editions
on:
  push:
    branches: [Claude]
    paths: ['packages/neo_cheat_catalog/**', 'test/*477*', 'test/unified_catalog_browser_ui*', 'test/fixtures/cheats477/**', '.github/workflows/cheats477.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cheats477-${{ github.sha }}
  cancel-in-progress: false
jobs:
  targeted:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cheats477]') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Exact 476 negative control, common installation, restart, priority and immutable source chunks
        run: python3 test/cheats477_regression.py --prove-baseline
      - name: Compile and link the shared catalogue with the iPhone SDK
        run: python3 test/unified_catalog_ios_test.py IPhoneCatalogTests
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Shared installation in reopened console menus and guarded direct switches
        run: python3 test/unified_catalog_browser_ui_test.py --native --followup477-only --result evidence/cheats477.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheats477-${{ github.sha }}
          path: evidence/
          retention-days: 14
