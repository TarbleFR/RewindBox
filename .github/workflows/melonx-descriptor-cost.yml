name: MeloNX descriptor write cost measure
run-name: Descriptor write cost • ${{ github.sha }}
# Lot 9 (render thread). MoltenVK v1.4.2 with the pinned recipe patch, built for macOS: the cost of writing a texture
# descriptor set (8, 32, 74 combined image samplers) against binding one already written, on the runner's real Metal
# device with Metal3 argument buffers. Nothing is packaged, pinned or delivered.
'on':
  push:
    branches:
    - work/melonx-fps-stability-20261103
    paths:
    - .github/workflows/melonx-descriptor-cost.yml
    - test/melonx_descriptor_cost/**
permissions:
  contents: read
concurrency:
  group: melonx-descriptor-cost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Build MoltenVK v1.4.2 (recipe patch) for macOS and time descriptor writes and binds
      run: python3 test/melonx_descriptor_cost/run_descriptor_cost.py
    - uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      if: always()
      with:
        name: MeloNX-descriptor-cost-${{ github.sha }}
        path: dist/melonx-descriptor-cost
        retention-days: 14
        if-no-files-found: error
