name: Actions history cleanup (old skipped runs only; preserve latest 300)
run-name: One-time Actions history cleanup — 30 October 2026

on:
  push:
    branches: [Claude]
    paths:
      - build-utils/maintenance/actions-cleanup-2026-10-30.json

permissions:
  contents: read
  actions: write

concurrency:
  group: neostation-actions-history-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'TarbleFR/RewindBox' &&
      github.ref == 'refs/heads/Claude' &&
      github.event_name == 'push' &&
      github.event.before == '7bd908d682bdefc1e93b33b7eb0fbaaf7fd9be43' &&
      contains(github.event.head_commit.message, '[actions-cleanup-2026-10-30]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Read the exact maintenance commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /build-utils/maintenance/
            /test/actions_cleanup_test.py
      - name: Check deletion safeguards
        run: python -m unittest discover -s test -p actions_cleanup_test.py -v
      - name: Apply the bounded cleanup plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -u build-utils/maintenance/cleanup_actions.py
          --plan build-utils/maintenance/actions-cleanup-2026-10-30.json
          --expected-plan-sha256 a2a4d6c88a52c8cc2fd6229c5e178adb98fd7a2f3fc281e4732a6a862adc0106
          --execute
      - name: Preserve the cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Actions-history-cleanup-${{ github.run_id }}
          path: cleanup-output/
          if-no-files-found: error
          retention-days: 90
      - name: Publish the execution summary
        if: always()
        run: |
          if [ -f cleanup-output/summary.md ]; then
            cat cleanup-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
