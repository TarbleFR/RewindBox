name: MeloNX display and memory settings
on:
  push:
    branches: [Claude]
    paths:
      - .github/workflows/melonx-display.yml
      - lib/services/melonx_internal_service.dart
      - lib/widgets/melonx_internal_playlist_actions.dart
      - lib/l10n/melonx_library_locale.dart
      - build-utils/melonx/ui-strings.json
      - test/melonx_display_test.dart
  workflow_dispatch:
permissions: {contents: read}
jobs:
  display:
    if: ${{ !contains(github.event.head_commit.message, '[retroarch-delivery]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.2', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - name: Analyze changed settings, persistence and labels
        run: >-
          flutter analyze --no-pub --no-fatal-infos
          lib/services/melonx_internal_service.dart lib/widgets/melonx_internal_playlist_actions.dart
          lib/l10n/melonx_library_locale.dart test/melonx_display_test.dart
      - name: Exercise preferences, imported settings and twelve translations
        run: flutter test test/melonx_display_test.dart
      - name: Preserve successful import after playlist disposal
        run: flutter test test/melonx_presentation_widgets_test.dart
