name: Libretro simulator probe
# NeoStation's embedded libretro session in the iOS Simulator: launch, run,
# "Quit game" and relaunch with the real PPSSPP core (a PSP test program,
# directly and inside an ISO), a Vulkan test core that tears down like
# Azahar (the simulator GPU cannot start Azahar itself) and the NeoTest
# core, including a core that stops while starting, and a PSP game in an
# address space as crowded as the iPhone's; since Build 455, the internal
# resolution chosen during a game with the real DeSmuME core (frames, saved
# for the core and for one game, relaunch) and refused for PPSSPP in its
# software context. See test/libretro_simulator_probe.py. A simulator run
# is not an iPhone test.
'on':
  push:
    branches:
    - Claude
    paths:
    - .github/workflows/libretro-simulator.yml
    - packages/libretro_internal_bridge/ios/**
    - lib/services/libretro_core_catalog.dart
    - test/libretro_simulator/**
    - test/libretro_simulator_probe.py
    - packages/neo_shader_kit/ios/**
    - test/neo_shader_kit_ios_build.py
    - test/neo_shader_kit_test.py
    - test/libretro_ios_syntax_test.py
    - test/libretro_host/test_core.c
    - test/libretro_host/vulkan_test_core.c
  workflow_dispatch:
    inputs:
      shaders_only:
        description: Run only the embedded shader session scenarios
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: libretro-simulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    if: ${{ !inputs.shaders_only }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-df0124b86f14aa16e8d1bbfa4ba4a43b0a20abaf
        run-id: '38627332377'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Launch, close and relaunch every scenario on this commit
      run: |
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --evidence evidence/this-commit --label "${GITHUB_SHA}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-simulator-probe-${{ github.sha }}
        path: |
          evidence/
          ${{ runner.temp }}/probe-inputs/identities.json
        if-no-files-found: warn
        retention-days: 14
  # Lot 1 (docs/libretro-consoles-lot1.md): the sixteen cores added for the
  # hidden consoles of the Consoles tab, each launched twice on a test
  # program the probe writes itself, run, closed with "Quit game"; three
  # cores refuse content they cannot run. On a runner of its own, so its
  # verdict does not depend on the main job's scenarios.
  lot1:
    if: ${{ !inputs.shaders_only }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-df0124b86f14aa16e8d1bbfa4ba4a43b0a20abaf
        run-id: '38627332377'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Launch, close and relaunch every lot 1 core on its test program
      run: |
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --lot1 --evidence evidence/lot1 --label "${GITHUB_SHA}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-simulator-lot1-${{ github.sha }}
        path: evidence/
        if-no-files-found: warn
        retention-days: 14
  # The same Vulkan scenario with the sources before the teardown fix, on a
  # runner of its own (a second probe app in the same simulator session
  # never started). Informational: it records whether closing the game ends
  # the process; it does not fail the run.
  shaders:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-df0124b86f14aa16e8d1bbfa4ba4a43b0a20abaf
        run-id: '38627332377'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Download, install, apply and relaunch shaders in real embedded sessions
      run: |
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --only shader-software shader-software-relaunch shader-vulkan shader-vulkan-relaunch \
          shader-desmume shader-desmume-relaunch --evidence evidence/shaders --label "${GITHUB_SHA}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-shader-session-probe-${{ github.sha }}
        path: evidence/shaders/
        if-no-files-found: warn
        retention-days: 14
  official-shaders:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-df0124b86f14aa16e8d1bbfa4ba4a43b0a20abaf
        run-id: '38627332377'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Official HTTPS downloads and presets in the embedded session menu
      run: |
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --official-shaders --only official-software official-software-relaunch official-vulkan official-vulkan-relaunch \
          official-desmume official-desmume-relaunch --evidence evidence/official-shaders --label "${GITHUB_SHA}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-official-shader-session-probe-${{ github.sha }}
        path: evidence/official-shaders/
        if-no-files-found: warn
        retention-days: 14
  before-fix:
    if: ${{ !inputs.shaders_only }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-df0124b86f14aa16e8d1bbfa4ba4a43b0a20abaf
        run-id: '38627332377'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Close a Vulkan game (Azahar's teardown) with the sources before the fix
      run: |
        git worktree add "$RUNNER_TEMP/before-fix" 940f114975c9ae4761b227e5efa9381ef9fa976e
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --sources "$RUNNER_TEMP/before-fix/packages/libretro_internal_bridge/ios" --only neovk-1 \
          --expect unfixed --evidence evidence/before-fix --label 940f114975c9ae4761b227e5efa9381ef9fa976e \
          --timeout 300
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-simulator-before-fix-${{ github.sha }}
        path: evidence/
        if-no-files-found: warn
        retention-days: 14
  # The crowded PSP scenario with the sources before PPSSPP's window was
  # reserved (Build 431), on a runner of its own. Informational: it records
  # whether PPSSPP finds no memory base, as on the iPhone; it does not fail
  # the run.
  before-reservation:
    if: ${{ !inputs.shaders_only }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-df0124b86f14aa16e8d1bbfa4ba4a43b0a20abaf
        run-id: '38627332377'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Start a PSP game in a crowded window with the sources before the reservation
      run: |
        git worktree add "$RUNNER_TEMP/before-reservation" 15a24516bf198f8f1dd43c300aadbbc7c313926c
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --sources "$RUNNER_TEMP/before-reservation/packages/libretro_internal_bridge/ios" --only ppsspp-crowded \
          --expect unfixed --evidence evidence/before-reservation \
          --label 15a24516bf198f8f1dd43c300aadbbc7c313926c --timeout 300
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-simulator-before-reservation-${{ github.sha }}
        path: evidence/
        if-no-files-found: warn
        retention-days: 14
