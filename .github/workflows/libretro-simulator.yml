name: Libretro simulator probe
# NeoStation's embedded libretro session in the iOS Simulator: launch, run,
# "Quit game" and relaunch with the real PPSSPP core (a PSP test program,
# directly and inside an ISO), a Vulkan test core that tears down like
# Azahar (the simulator GPU cannot start Azahar itself) and the NeoTest
# core, including a core that stops while starting, and a PSP game in an
# address space as crowded as the iPhone's; since Build 455, the internal
# resolution chosen during a game with the real DeSmuME core (frames, saved
# for the core and for one game, relaunch) and refused for PPSSPP in its
# software context; since Build 489, Beetle PSX HW in Vulkan presenting a
# stand-in BIOS's picture and reporting a replacement pack in the folder it
# reads, through pause, background, state save and rotation (--beetle).
# See test/libretro_simulator_probe.py. A simulator run is not an iPhone test.
'on':
  push:
    branches:
    - Claude
    paths:
    - .github/workflows/libretro-simulator.yml
    - packages/libretro_internal_bridge/ios/**
    - lib/services/libretro_core_catalog.dart
    - test/libretro_simulator/**
    - test/libretro_simulator_probe.py
    - packages/neo_shader_kit/ios/**
    - test/neo_shader_kit_ios_build.py
    - test/neo_shader_kit_test.py
    - test/libretro_ios_syntax_test.py
    - test/libretro_host/test_core.c
    - test/libretro_host/vulkan_test_core.c
  workflow_dispatch:
    inputs:
      legacy_only:
        description: Run only the two historical implementation controls
        type: boolean
        default: false
      shaders_only:
        description: Run only the embedded shader session scenarios
        type: boolean
        default: false
      beetle_only:
        description: Run only the Beetle PSX HW Vulkan texture replacement scenarios (Build 489)
        type: boolean
        default: false
      mesen_only:
        description: Run only the Mesen NES HD pack scenarios (core package with Mesen)
        type: boolean
        default: false
      cores_sha:
        description: 'mesen_only: commit of the LibretroCores artifact that has Mesen'
        type: string
        default: ''
      cores_run:
        description: 'mesen_only: run id of that artifact'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: libretro-simulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    if: ${{ !inputs.shaders_only && !inputs.beetle_only && !inputs.mesen_only && !inputs.legacy_only && !contains(github.event.head_commit.message, '[libretro-legacy-compat]') && !contains(github.event.head_commit.message, '[unified-cheats]') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
        run-id: '38638115521'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Launch, close and relaunch every scenario on this commit
      run: |
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --evidence evidence/this-commit --label "${GITHUB_SHA}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-simulator-probe-${{ github.sha }}
        path: |
          evidence/
          ${{ runner.temp }}/probe-inputs/identities.json
        if-no-files-found: warn
        retention-days: 14
  # Lot 1 (docs/libretro-consoles-lot1.md): the sixteen cores added for the
  # hidden consoles of the Consoles tab, each launched twice on a test
  # program the probe writes itself, run, closed with "Quit game"; three
  # cores refuse content they cannot run. On a runner of its own, so its
  # verdict does not depend on the main job's scenarios.
  lot1:
    if: ${{ !inputs.shaders_only && !inputs.beetle_only && !inputs.mesen_only && !inputs.legacy_only && !contains(github.event.head_commit.message, '[libretro-legacy-compat]') && !contains(github.event.head_commit.message, '[unified-cheats]') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
        run-id: '38638115521'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Launch, close and relaunch every lot 1 core on its test program
      run: |
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --lot1 --evidence evidence/lot1 --label "${GITHUB_SHA}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-simulator-lot1-${{ github.sha }}
        path: evidence/
        if-no-files-found: warn
        retention-days: 14
  # Lot 2 (docs/libretro-consoles-lot2.md): FreeChaF, FreeIntv, O2EM and
  # Beetle PC-FX, each launched twice, run and closed; O2EM and Beetle PC-FX
  # boot stand-in BIOS images the probe writes (a single jump to itself).
  lot2:
    if: ${{ !inputs.shaders_only && !inputs.beetle_only && !inputs.mesen_only && !inputs.legacy_only && !contains(github.event.head_commit.message, '[libretro-legacy-compat]') && !contains(github.event.head_commit.message, '[unified-cheats]') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
        run-id: '38638115521'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Launch, close and relaunch every lot 2 core on its test program
      run: |
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --lot2 --evidence evidence/lot2 --label "${GITHUB_SHA}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-simulator-lot2-${{ github.sha }}
        path: evidence/
        if-no-files-found: warn
        retention-days: 14
  # Build 489: Beetle PSX HW with NeoStation's Vulkan context and options,
  # its texture dump, a green replacement pack made from it (the quad must
  # turn green) and replacement off again. Stand-in BIOS written by the probe.
  beetle:
    if: ${{ !inputs.shaders_only && !inputs.mesen_only && !inputs.legacy_only && !contains(github.event.head_commit.message, '[libretro-legacy-compat]') && !contains(github.event.head_commit.message, '[unified-cheats]') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
        run-id: '38638115521'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Beetle PSX HW in Vulkan presents its picture and reports a replacement pack
      run: |
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --beetle --evidence evidence/beetle --label "${GITHUB_SHA}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-simulator-beetle-${{ github.sha }}
        path: evidence/
        if-no-files-found: warn
        retention-days: 14
  # Mesen (NES HD packs): the real core on a test program and an HD pack the
  # probe writes, without a pack (256x240), with it (512x480, read from
  # <system>/HdPacks/<content name>) and with mesen_hdpacks off. Needs the
  # core package that has Mesen (lot 3).
  # Mesen (lot 3): on dispatch with mesen_only, or on every push with the package the delivery pins.
  mesen:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mesen_only) || github.event_name == 'push' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores with Mesen
      uses: actions/download-artifact@v4
      with:
        # retroarch-delivery.yml LIBRETRO_CORES_HOST_SHA and RUN_ID (35 cores, Mesen included).
        name: LibretroCores-${{ inputs.cores_sha || '4c2186204ce06b50b989689a9c2322068f523a58' }}
        run-id: ${{ inputs.cores_run || '39366986940' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Mesen draws 256x240 without a pack and 512x480 with the probe's HD pack
      run: |
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --mesen --evidence evidence/mesen --label "${GITHUB_SHA}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-simulator-mesen-${{ github.sha }}
        path: evidence/
        if-no-files-found: warn
        retention-days: 14
  # The same Vulkan scenario with the sources before the teardown fix, on a
  # runner of its own (a second probe app in the same simulator session
  # never started). Informational: it records whether closing the game ends
  # the process; it does not fail the run.
  shaders:
    if: ${{ !inputs.beetle_only && !inputs.mesen_only && !inputs.legacy_only && !contains(github.event.head_commit.message, '[libretro-legacy-compat]') && !contains(github.event.head_commit.message, '[unified-cheats]') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
        run-id: '38638115521'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Download, install, apply and relaunch shaders in real embedded sessions
      run: |
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --only shader-software shader-software-relaunch shader-vulkan shader-vulkan-relaunch \
          shader-desmume shader-desmume-relaunch --evidence evidence/shaders --label "${GITHUB_SHA}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-shader-session-probe-${{ github.sha }}
        path: evidence/shaders/
        if-no-files-found: warn
        retention-days: 14
  official-shaders:
    if: ${{ !inputs.beetle_only && !inputs.mesen_only && !inputs.legacy_only && !contains(github.event.head_commit.message, '[libretro-legacy-compat]') && !contains(github.event.head_commit.message, '[unified-cheats]') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
        run-id: '38638115521'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Official HTTPS downloads and presets in the embedded session menu
      run: |
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --official-shaders --only official-software official-software-relaunch official-vulkan official-vulkan-relaunch \
          official-desmume official-desmume-relaunch --evidence evidence/official-shaders --label "${GITHUB_SHA}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-official-shader-session-probe-${{ github.sha }}
        path: evidence/official-shaders/
        if-no-files-found: warn
        retention-days: 14
  before-fix:
    if: ${{ !inputs.shaders_only && !inputs.beetle_only && !inputs.mesen_only && !contains(github.event.head_commit.message, '[unified-cheats]') }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
        run-id: '38638115521'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Close a Vulkan game (Azahar's teardown) with the sources before the fix
      run: |
        git worktree add "$RUNNER_TEMP/before-fix" 940f114975c9ae4761b227e5efa9381ef9fa976e
        # The modern probe retains a typed controller pointer even when
        # skin scenarios are excluded. Supply only its forward declaration
        # to the historical compile; implementation bodies stay untouched.
        python3 - "$RUNNER_TEMP/before-fix/packages/libretro_internal_bridge/ios/Classes/LibretroSession.h" <<'PY'
        from pathlib import Path
        import sys
        path = Path(sys.argv[1])
        path.write_bytes(path.read_bytes() + b"\n@class LibretroGameViewController;\n")
        PY
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --sources "$RUNNER_TEMP/before-fix/packages/libretro_internal_bridge/ios" --only neovk-1 \
          --expect unfixed --evidence evidence/before-fix --label 940f114975c9ae4761b227e5efa9381ef9fa976e \
          --timeout 300
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-simulator-before-fix-${{ github.sha }}
        path: evidence/
        if-no-files-found: warn
        retention-days: 14
  # The crowded PSP scenario with the sources before PPSSPP's window was
  # reserved (Build 431), on a runner of its own. Informational: it records
  # whether PPSSPP finds no memory base, as on the iPhone; it does not fail
  # the run.
  before-reservation:
    if: ${{ !inputs.shaders_only && !inputs.beetle_only && !inputs.mesen_only && !contains(github.event.head_commit.message, '[unified-cheats]') }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
        run-id: '38638115521'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned MoltenVK simulator slice and test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Start a PSP game in a crowded window with the sources before the reservation
      run: |
        git worktree add "$RUNNER_TEMP/before-reservation" 15a24516bf198f8f1dd43c300aadbbc7c313926c
        # The modern probe retains a typed controller pointer even when
        # skin scenarios are excluded. Supply only its forward declaration
        # to the historical compile; implementation bodies stay untouched.
        python3 - "$RUNNER_TEMP/before-reservation/packages/libretro_internal_bridge/ios/Classes/LibretroSession.h" <<'PY'
        from pathlib import Path
        import sys
        path = Path(sys.argv[1])
        path.write_bytes(path.read_bytes() + b"\n@class LibretroGameViewController;\n")
        PY
        python3 test/libretro_simulator_probe.py run --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --sources "$RUNNER_TEMP/before-reservation/packages/libretro_internal_bridge/ios" --only ppsspp-crowded \
          --expect unfixed --evidence evidence/before-reservation \
          --label 15a24516bf198f8f1dd43c300aadbbc7c313926c --timeout 300
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-simulator-before-reservation-${{ github.sha }}
        path: evidence/
        if-no-files-found: warn
        retention-days: 14
