name: UI refresh rate (120 Hz interface) native checks
# Build 440. Runs when its inputs change on the Claude branch, or manually
# once the workflow exists on the default branch:
#   gh workflow run ui-refresh-rate-check.yml --ref Claude
# (GitHub only dispatches workflows known to the default branch, hence the
# push trigger for this new check.)
on:
  push:
    branches:
    - Claude
    paths:
    - .github/workflows/ui-refresh-rate-check.yml
    - packages/ui_refresh_rate/**
    - test/ui_refresh_rate_hook_test.py
    - test/ui_refresh_rate_scope_test.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-refresh-rate-${{ github.sha }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[frontend-motion]') }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Fetch the iOS engine of the pinned Flutter
        run: |
          set -euo pipefail
          flutter --version
          flutter precache --ios
      - name: Scope guard (hook limited to the Flutter engine seam)
        run: python3 test/ui_refresh_rate_scope_test.py
      - name: Hook against the real Flutter.xcframework (iPhone syntax and simulator XCTest)
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 test/ui_refresh_rate_hook_test.py > /tmp/ui-refresh-rate.log 2>&1 || { tail -n 150 /tmp/ui-refresh-rate.log; exit 1; }
          grep -E 'Testing on|syntax check|range|Executed|OK' /tmp/ui-refresh-rate.log | tail -n 40
      - name: Upload simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UI-Refresh-Rate-Diagnostics-${{ github.run_id }}
          path: |
            /tmp/ui-refresh-rate.log
            build/ui-refresh-rate/
          retention-days: 3
