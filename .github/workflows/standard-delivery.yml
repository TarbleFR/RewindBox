# Standard private IPA delivery (AGENTS.md "Same recipe for every build").
# One workflow for every build: the build number, recipient and artifact names come from the
# preflight outputs, which read build-utils/delivery/<N>.json named by the commit subject tag.
# A push whose subject has no delivery tag runs nothing (every job is skipped).
# Every job that reads product files restores the frozen effective tree first (materialize)
# and never checks out again. The application job does not wait for the test jobs to build;
# it authenticates them (await-tests) right before embedding the test identity and sealing.
name: RewindBox standard private IPA delivery
run-name: RewindBox standard delivery - ${{ github.sha }}
'on':
  push:
    branches:
    - Claude
permissions:
  contents: read
  actions: read
concurrency:
  group: rewindbox-ipa-delivery-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  preflight:
    name: preflight
    if: ${{ github.ref == 'refs/heads/Claude' && startsWith(github.event.head_commit.message, '[ipa-delivery:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.manifest.outputs.build }}
      recipient: ${{ steps.manifest.outputs.recipient }}
      artifact-prefix: ${{ steps.manifest.outputs.artifact-prefix }}
      flutter-mode: ${{ steps.manifest.outputs.flutter-mode }}
      native-mode: ${{ steps.manifest.outputs.native-mode }}
      contract-artifact-id: ${{ steps.contract-log.outputs.artifact-id }}
      contract-artifact-digest: ${{ steps.contract-log.outputs.artifact-digest }}
    steps:
    - name: Checkout the exact candidate and its history
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Materialize the frozen effective product tree
      id: manifest
      run: python3 -B .github/diagnostics/standard_delivery.py materialize
    - name: Run the delivery contract
      if: ${{ steps.manifest.outputs.build != '' }}
      env:
        BUILD_NUMBER: ${{ steps.manifest.outputs.build }}
        DELIVERY_RECIPIENT: ${{ steps.manifest.outputs.recipient }}
      run: python3 -B .github/diagnostics/standard_delivery.py contract
    - name: Preserve the delivery contract log
      id: contract-log
      if: ${{ steps.manifest.outputs.build != '' }}
      uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: ${{ steps.manifest.outputs.artifact-prefix }}-attempt${{ github.run_attempt }}-contract
        path: build/standard-delivery/contract/
        if-no-files-found: error
        retention-days: 14
  flutter:
    name: flutter
    needs: preflight
    if: ${{ needs.preflight.outputs.build != '' && needs.preflight.outputs.flutter-mode == 'fresh' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_NUMBER: ${{ needs.preflight.outputs.build }}
      DELIVERY_RECIPIENT: ${{ needs.preflight.outputs.recipient }}
    steps:
    - name: Checkout the exact candidate and its history
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Materialize the frozen effective product tree
      run: python3 -B .github/diagnostics/standard_delivery.py materialize
    - name: Set up Flutter3.47.2
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
    - name: Resolve exact workspace lock
      run: flutter pub get --enforce-lockfile
    - name: Provide the pinned Pillow of the skin verifiers
      run: |
        set -euo pipefail
        python3 -m venv --system-site-packages "$RUNNER_TEMP/delivery-python"
        "$RUNNER_TEMP/delivery-python/bin/python" -m pip install --quiet --disable-pip-version-check pillow==12.3.0
        "$RUNNER_TEMP/delivery-python/bin/python" -c 'import PIL; print("Pillow " + PIL.__version__)'
        echo "$RUNNER_TEMP/delivery-python/bin" >> "$GITHUB_PATH"
    - name: Run source contracts and Flutter behavior
      run: python3 -B .github/diagnostics/standard_delivery.py tests flutter
    - name: Preserve actual command results
      if: always()
      uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: ${{ needs.preflight.outputs.artifact-prefix }}-attempt${{ github.run_attempt }}-tests-flutter
        path: build/validation/flutter/
        if-no-files-found: error
        retention-days: 14
  native:
    name: native
    needs: preflight
    if: ${{ needs.preflight.outputs.build != '' && needs.preflight.outputs.native-mode == 'fresh' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ needs.preflight.outputs.build }}
      DELIVERY_RECIPIENT: ${{ needs.preflight.outputs.recipient }}
    steps:
    - name: Checkout the exact candidate and its history
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Materialize the frozen effective product tree
      run: python3 -B .github/diagnostics/standard_delivery.py materialize
    - name: Select targeted Xcode16.4 and Swift6
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'
    - name: Boot the targeted iOS simulator once for every XCTest
      run: |
        set -euo pipefail
        # docs/delivery-speed.md: the translation XCTest let xcodebuild boot this simulator and shut it
        # down after its run, so the central session XCTest booted it again and waited minutes before its
        # first launch, while the later XCTests found it booted. Booted here, while Flutter is set up, it
        # stays booted for the whole group. Same device as every XCTest of the group: the first available
        # iPhone of the iOS runtime of the selected SDK. No test is changed; each still checks its device.
        UDID="$(python3 -B - <<'PY_DEVICE'
        import json, subprocess
        sdk = subprocess.check_output(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], text=True).strip()
        runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-' + sdk.replace('.', '-')
        devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
        matches = [d for d in devices.get(runtime, []) if d['name'].startswith('iPhone') and d.get('isAvailable')]
        print(matches[0]['udid'] if matches else '')
        PY_DEVICE
        )"
        if [ -z "$UDID" ]; then
          echo 'No matching simulator; each XCTest keeps its own refusal.'
          exit 0
        fi
        echo "TARGET_SIMULATOR=$UDID" >> "$GITHUB_ENV"
        nohup xcrun simctl bootstatus "$UDID" -b < /dev/null > "$RUNNER_TEMP/target-simulator-boot.log" 2>&1 &
        echo "Booting $UDID in the background"
    - name: Set up Flutter3.47.2
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
    - name: Resolve exact workspace lock
      run: flutter pub get --enforce-lockfile
    - name: Prepare real Flutter iOS headers and simulator project tool
      run: |
        set -euo pipefail
        flutter precache --ios
        command -v xcodegen || brew install xcodegen
    - name: Wait for the targeted iOS simulator to finish booting
      run: |
        set -euo pipefail
        if [ -n "${TARGET_SIMULATOR:-}" ]; then
          xcrun simctl bootstatus "$TARGET_SIMULATOR" -b
          cat "$RUNNER_TEMP/target-simulator-boot.log" || true
          xcrun simctl list devices booted
        fi
    - name: Run actual Xcode16.4 tests and host compilation
      run: python3 -B .github/diagnostics/standard_delivery.py tests native
    - name: Preserve actual command results
      if: always()
      uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: ${{ needs.preflight.outputs.artifact-prefix }}-attempt${{ github.run_attempt }}-tests-native
        path: build/validation/native/
        if-no-files-found: error
        retention-days: 14
    - name: Preserve real XCTest bundles and native diagnostics
      if: always()
      uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: ${{ needs.preflight.outputs.artifact-prefix }}-attempt${{ github.run_attempt }}-tests-xctest
        path: |
          build/AchievementTranslation*.xcresult
          build/ra-session-validation/
          build/rpcs3-ci/DolphinAccount*.xcresult
          build/armsx2-validation/
        if-no-files-found: warn
        retention-days: 14
  republish:
    name: republish
    # Independent of the application build: it authenticates the replaced and retained component
    # archives and re-uploads them first, so a later failure of the application (or a retry after an
    # expiry such as libretro 12280822192 on 2026-11-03T16:19:42Z) never loses what the next build
    # retains. Component archives only; never the IPA.
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.build != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ needs.preflight.outputs.build }}
    steps:
    - name: Checkout the exact candidate and its history
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Materialize the frozen effective product tree
      run: python3 -B .github/diagnostics/standard_delivery.py materialize
    - name: Download and authenticate the replaced RPCS3 Core bytes
      run: python3 -B .github/diagnostics/standard_delivery.py download-rpcs3
    - name: Download and authenticate the replaced MeloNX Core producer artifact
      run: python3 -B .github/diagnostics/standard_delivery.py download-melonx
    - name: Download and authenticate the exact retained libretro runtime
      run: python3 -B .github/diagnostics/standard_delivery.py download-libretro
    - name: Download and authenticate the exact retained native MeloNX dependencies
      run: python3 -B .github/diagnostics/standard_delivery.py download-melonx-dependencies
    - name: Authenticate the retained Dolphin session Core
      run: python3 -B .github/diagnostics/standard_delivery.py authenticate-dolphin
    - name: Authenticate the retained ARMSX2 ABI9 Core
      run: python3 -B .github/diagnostics/standard_delivery.py authenticate-armsx2
    - name: Stage the authenticated component archives for republication
      run: python3 -B .github/diagnostics/standard_delivery.py republish
    - name: Republish the authenticated rpcs3-core archive
      if: ${{ hashFiles('build/republish/rpcs3-core/republication.json') != '' }}
      uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: ${{ needs.preflight.outputs.artifact-prefix }}-attempt${{ github.run_attempt }}-component-rpcs3-core
        path: build/republish/rpcs3-core/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Republish the authenticated rpcs3-host-tests archive
      if: ${{ hashFiles('build/republish/rpcs3-host-tests/republication.json') != '' }}
      uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: ${{ needs.preflight.outputs.artifact-prefix }}-attempt${{ github.run_attempt }}-component-rpcs3-host-tests
        path: build/republish/rpcs3-host-tests/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Republish the authenticated melonx-core archive
      if: ${{ hashFiles('build/republish/melonx-core/republication.json') != '' }}
      uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: ${{ needs.preflight.outputs.artifact-prefix }}-attempt${{ github.run_attempt }}-component-melonx-core
        path: build/republish/melonx-core/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Republish the authenticated dolphin archive
      if: ${{ hashFiles('build/republish/dolphin/republication.json') != '' }}
      uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: ${{ needs.preflight.outputs.artifact-prefix }}-attempt${{ github.run_attempt }}-component-dolphin
        path: build/republish/dolphin/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Republish the authenticated armsx2 archive
      if: ${{ hashFiles('build/republish/armsx2/republication.json') != '' }}
      uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: ${{ needs.preflight.outputs.artifact-prefix }}-attempt${{ github.run_attempt }}-component-armsx2
        path: build/republish/armsx2/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Republish the authenticated libretro archive
      if: ${{ hashFiles('build/republish/libretro/republication.json') != '' }}
      uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: ${{ needs.preflight.outputs.artifact-prefix }}-attempt${{ github.run_attempt }}-component-libretro
        path: build/republish/libretro/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Republish the authenticated melonx-dependencies archive
      if: ${{ hashFiles('build/republish/melonx-dependencies/republication.json') != '' }}
      uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: ${{ needs.preflight.outputs.artifact-prefix }}-attempt${{ github.run_attempt }}-component-melonx-dependencies
        path: build/republish/melonx-dependencies/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
  application:
    name: application
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.build != '' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BUILD_NUMBER: ${{ needs.preflight.outputs.build }}
      DELIVERY_RECIPIENT: ${{ needs.preflight.outputs.recipient }}
      IPA_NAME: NeoStation
      ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact-prefix }}-attempt${{ github.run_attempt }}-cold
      CONTRACT_ARTIFACT_ID: ${{ needs.preflight.outputs.contract-artifact-id }}
      CONTRACT_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.contract-artifact-digest }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
      DELIVERY_METRICS: ${{ github.workspace }}/build/delivery/timings.jsonl
      CACHE_NAMESPACE: normal
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_PATH: ${{ github.workspace }}/build/ruby-gems
      DELIVERY_MODE: cold
    steps:
    - name: Checkout the exact candidate and its history
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Materialize the frozen effective product tree
      run: python3 -B .github/diagnostics/standard_delivery.py materialize
    - name: Authenticate the delivered base and the frozen effective product tree
      run: python3 -B .github/diagnostics/standard_delivery.py baseline
    - name: Select Xcode 26.3 for NeoPlay and Google Cast
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Set up Flutter 3.47.2
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
        cache-key: neostation-benchmark-sdk-${{ runner.os }}-${{ runner.arch }}-3.47.2-${{ env.CACHE_NAMESPACE }}
        pub-cache-key: neostation-benchmark-pub-${{ runner.os }}-${{ runner.arch }}-3.47.2-${{ hashFiles('pubspec.lock') }}-${{ env.CACHE_NAMESPACE }}
    - name: Record exact build environment and start measurement
      run: |
        mkdir -p build/delivery
        python3 build-utils/delivery_benchmark.py environment
        python3 -B .github/diagnostics/standard_delivery.py source-contract
    - name: Resolve locked Dart dependencies
      run: python3 build-utils/delivery_metrics.py dart_dependencies flutter pub get --enforce-lockfile
    - name: Prepare lightweight build tools
      shell: bash
      run: |
        set -euo pipefail
        export BUNDLE_PATH="$GITHUB_WORKSPACE/build/ruby-gems"
        echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
        python3 build-utils/delivery_metrics.py ruby_dependencies bundle install
    - name: Generate iOS host
      shell: bash
      run: |
        set -euo pipefail
        flutter config --no-enable-swift-package-manager
        test ! -d ios
        python3 build-utils/delivery_metrics.py host_scaffold_and_registrant python3 packages/dolphin_internal_bridge/ci/build_support.py scaffold
    - name: Download and authenticate the pinned donor release for unchanged native resources
      run: python3 -B .github/diagnostics/standard_delivery.py donor
    - name: Restore unchanged canonical StikJIT compilation interfaces
      id: stik
      uses: actions/cache@v4
      with:
        path: build/stikjit-current
        key: stikjit-interfaces-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('build-utils/stikjit/source.json','build-utils/patch_stikjit_rpcs3.py','build-utils/patch_stikjit_compat.py','build-utils/install_patched_stikjit.py','build-utils/build_patched_stikjit.py') }}-37844950677
    - name: Build canonical StikJIT from pinned sources for iOS 18 26 and 27
      shell: bash
      run: |
        set -euo pipefail
        command -v xcodegen || brew install xcodegen
        python3 build-utils/build_patched_stikjit.py 2>&1 | tee "$RUNNER_TEMP/neoswap-stikjit-step.log"
        python3 test/stikjit_unified_build_test.py 2>&1 | tee -a "$RUNNER_TEMP/neoswap-stikjit-step.log"
      if: ${{ steps.stik.outputs.cache-hit != 'true' }}
    - name: Install verified cached StikJIT interfaces
      if: ${{ steps.stik.outputs.cache-hit == 'true' }}
      run: python3 build-utils/install_patched_stikjit.py build/stikjit-current/StikJIT.xcframework
    - name: Download and authenticate the replaced RPCS3 Core bytes
      run: python3 -B .github/diagnostics/standard_delivery.py download-rpcs3
    - name: Verify and install the authenticated RPCS3 Core with unchanged ABI checks
      shell: bash
      run: |
        set -euo pipefail
        SOURCE=dist/rpcs3-native/libRPCS3Core.dylib
        IDENTITY=dist/rpcs3-native/identity.json
        CORE=packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib
        test -s "$SOURCE"
        test -s "$IDENTITY"
        test -s "$CORE"
        python3 -B .github/diagnostics/standard_delivery.py install-rpcs3
        file "$CORE"
        test "$(lipo -archs "$CORE")" = arm64
        nm -gU "$CORE" > build/rpcs3-core-exports.txt
        python3 -B .github/diagnostics/standard_delivery.py rpcs3-exports build/rpcs3-core-exports.txt
    - name: Authenticate and install the retained Dolphin session Core
      run: python3 -B .github/diagnostics/standard_delivery.py dolphin
    - name: Authenticate and install the retained ARMSX2 ABI9 Core
      run: python3 -B .github/diagnostics/standard_delivery.py armsx2
    - name: Prepare the retained libretro artifact destination
      run: |
        rm -rf dist/libretro
    - name: Download and authenticate the exact retained libretro runtime
      run: python3 -B .github/diagnostics/standard_delivery.py download-libretro
    - name: Verify retained libretro digests, source identity and exported ABI
      run: python3 -B .github/diagnostics/standard_delivery.py libretro
    - name: Authenticate the replaced engine producer runs
      run: python3 -B .github/diagnostics/standard_delivery.py component-runs
    - name: Download the replaced MeloNX Core producer artifact
      run: python3 -B .github/diagnostics/standard_delivery.py download-melonx
    - name: Authenticate the replaced MeloNX Core inputs, gates and runtime evidence
      run: python3 -B .github/diagnostics/standard_delivery.py melonx-evidence
    - name: Download and authenticate the exact retained native MeloNX dependencies
      run: python3 -B .github/diagnostics/standard_delivery.py download-melonx-dependencies
    - name: Verify and materialize the six private MeloNX frameworks and original controls
      run: |-
        set -euo pipefail
        python3 build-utils/melonx/package_runtime.py
        python3 - <<'PY_FETCH'
        import json,pathlib,subprocess
        pin=json.loads(pathlib.Path('build-utils/melonx/source.json').read_text())
        path='.native-sources/MeloNX'
        subprocess.run(['git','init',path],check=True)
        urls=[pin['repository'],'https://github.com/AzureDominus/melonx.git']
        for url in urls:
            try:
                subprocess.run(['git','-C',path,'-c','http.lowSpeedLimit=1000','-c','http.lowSpeedTime=30',
                    'fetch','--depth','1',url,pin['revision']],check=True,timeout=120)
                break
            except (subprocess.CalledProcessError,subprocess.TimeoutExpired):
                if url==urls[-1]:raise
                print('Primary source transfer failed; retrying identical commit via verified mirror',flush=True)
        subprocess.run(['git','-C',path,'checkout','--detach','FETCH_HEAD'],check=True)
        assert subprocess.check_output(['git','-C',path,'rev-parse','HEAD'],text=True).strip()==pin['revision']
        assert subprocess.check_output(['git','-C',path,'rev-parse','HEAD^{tree}'],text=True).strip()=='82a29e6f593f6244869481e9a489b8d5154175fe'
        PY_FETCH
        git init .native-sources/Melo-Controller
        git -C .native-sources/Melo-Controller remote add origin https://github.com/stossy11/Melo-Controller.git
        git -C .native-sources/Melo-Controller fetch --depth 1 origin c049ce88a5635bddcd88e1965c42aa8fc92fe961
        git -C .native-sources/Melo-Controller checkout --detach FETCH_HEAD
        python3 build-utils/melonx/vendor_controller.py .native-sources/Melo-Controller .native-sources/MeloNX
    - name: Package the standalone MeloNX app's own MoltenVK (maintainer exception, pinned upstream bytes)
      run: python3 build-utils/melonx/package_standalone_moltenvk.py --source .native-sources/MeloNX
    - name: Prepare emulator build definitions
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        required=('SCREENSCRAPER_DEV_ID','SCREENSCRAPER_DEV_PASSWORD')
        values={key:os.environ.get(key,'').strip() for key in required}
        missing=[key for key,value in values.items() if not value]
        if missing:
            raise SystemExit('Missing build secrets: '+', '.join(missing))
        values.update({
            'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX':'true',
            'NEOSTATION_MELONX_BUNDLE_ID':'com.nur.nx',
        })
        Path('.dart-defines.json').write_text(json.dumps(values))
        PY

        python3 build-utils/delivery_benchmark.py record-inputs
    - name: Configure release host
      shell: bash
      run: |
        set -euo pipefail
        python3 build-utils/configure_neoswap_storage.py
        python3 build-utils/patch_ios_video_player_audio_session.py
        # Flutter's config-only build also invokes CocoaPods. Align its host
        # first, then reapply after legacy host generators below.
        python3 build-utils/configure_neoplay_ios.py --deployment-only
        python3 build-utils/delivery_metrics.py flutter_configuration_and_first_pods flutter build ios --release --no-codesign --config-only --no-pub \
          --build-number="$BUILD_NUMBER" \
          --dart-define-from-file=.dart-defines.json
        python3 packages/dolphin_internal_bridge/ci/build_support.py configure
        python3 build-utils/configure_rpcs3_ios_v2.py
        python3 build-utils/configure_armsx2_ios.py
        python3 build-utils/configure_neoswap_donor.py
        python3 build-utils/configure_neoplay_ios.py
        python3 build-utils/configure_external_display_ios.py
        python3 build-utils/configure_melonx_ios.py
        python3 build-utils/configure_rewind_launch.py
        dart run flutter_launcher_icons
        bash build-utils/force_ios_fork_icon.sh
        # Fallback PNGs are generated in ios/Runner and referenced from the same Xcode group.
        python3 build-utils/prepare_ios_icon_fallback.py
        bundle exec ruby build-utils/add_ios_icon_fallback_resources.rb
        python3 build-utils/configure_neoplay_ios.py --deployment-only
        python3 build-utils/delivery_metrics.py cocoa_pods env -u BUNDLE_GEMFILE -u BUNDLE_PATH pod install --project-directory=ios
        python3 - <<'PY'
        import plistlib
        from pathlib import Path

        entitlements = plistlib.loads(
            Path('ios/Runner/Runner.entitlements').read_bytes()
        )
        retired = {
            'com.apple.developer.networking.networkextension',
            'com.apple.developer.networking.vpn.api',
        }
        remaining = retired.intersection(entitlements)
        if remaining:
            raise SystemExit(
                'Retired VPN entitlements remain: ' + ', '.join(sorted(remaining))
            )
        generated = (
            Path('ios/Runner.xcodeproj/project.pbxproj').read_text(),
            Path('ios/Podfile').read_text(),
        )
        markers = (
            'NeoStationLocalTunnel',
            'NetworkExtension.framework',
            'com.apple.NetworkExtensions.iOS',
            'packet-tunnel-provider',
        )
        found = [marker for marker in markers if any(marker in text for text in generated)]
        if found:
            raise SystemExit('Generated iOS host retains internal VPN markers: ' + ', '.join(found))
        if Path('ios/NeoStationLocalTunnel').exists():
            raise SystemExit('Generated iOS host retains the internal VPN directory')
        print('Generated iOS host is LocalDevVPN-only.')
        PY
        git diff --exit-code -- pubspec.yaml pubspec.lock
    - name: Verify central session pod is in the actual generated host
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        registrant = Path('ios/Runner/GeneratedPluginRegistrant.m').read_text()
        assert 'RetroAchievementsSessionPlugin' in registrant
        pod = Path('ios/Pods/Local Podspecs/retro_achievements_session.podspec.json')
        assert pod.is_file()
        for name in ('armsx2_internal_bridge', 'dolphin_internal_bridge', 'libretro_internal_bridge'):
            spec = json.loads(Path('ios/Pods/Local Podspecs/' + name + '.podspec.json').read_text())
            assert 'retro_achievements_session' in spec['dependencies'], name
        spec = json.loads(Path('ios/Pods/Local Podspecs/rpcs3_internal_bridge.podspec.json').read_text())
        missing = {'retro_achievements_session', 'achievement_translation'} - set(spec['dependencies'])
        assert not missing, 'rpcs3_internal_bridge lacks pod dependencies: ' + ', '.join(sorted(missing))
        assert 'retro_achievements_session' in Path('ios/Podfile.lock').read_text()
        PY
