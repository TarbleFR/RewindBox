name: MeloNX external retirement and embedded route
'on':
  push:
    branches:
    - Claude
    - work/melonx-embedded-20261022
    paths:
    - .github/workflows/melonx-integration.yml
    - lib/services/melonx_internal_service.dart
    - lib/services/melonx_embedded_library_service.dart
    - lib/widgets/melonx_internal_playlist_actions.dart
    - lib/l10n/melonx_library_locale.dart
    - lib/utils/switch_title_extractor.dart
    - lib/screens/settings_screen/legal_credits_dialog.dart
    - test/single_ipa_distribution_test.py
    - test/melonx_library_test.dart
    - test/melonx_transfer_test.dart
    - test/melonx_library_files_test.dart
    - lib/services/melonx_library_scanner.dart
    - lib/services/melonx_file_transaction.dart
    - lib/services/melonx_migration_service.dart
    - lib/services/melonx_transfer_source.dart
    - lib/widgets/melonx_transfer_dialog.dart
    - lib/widgets/melonx_multi_delete_dialog.dart
    - lib/widgets/playlist_import_button.dart
    - lib/l10n/melonx_transfer_locale.dart
    - lib/l10n/melonx_launch_access_locale.dart
    - pubspec.yaml
    - pubspec.lock
    - lib/l10n/melonx_locale.dart
    - test/melonx_embedded_route_test.dart
    - test/melonx_native_sdk_test.py
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  host:
    if: ${{ !contains(github.event.head_commit.message, '[melonx-keys-only]') && !contains(github.event.head_commit.message, '[frontend-motion]') && ((!contains(github.event.head_commit.message, '[retroarch-delivery]') && !contains(github.event.head_commit.message,
      '[melonx-validated-integration]')) && !contains(github.event.head_commit.message, '[melonx-native]')) }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
    - run: flutter pub get --enforce-lockfile
    - name: Analyze the final app and retired locale-key removal
      run: flutter analyze --no-fatal-infos
    - name: Exercise the adjusted console and retirement scenarios
      run: flutter test test/melonx_embedded_route_test.dart test/console_manager_test.dart test/dolphin_isolation_contract_test.dart
        test/melonx_library_test.dart test/melonx_transfer_test.dart test/melonx_library_files_test.dart
        test/libretro_playlist_actions_test.dart
    - name: Protect unchanged libraries, the remaining JIT helpers and routing
      run: 'python3 test/retroarch_baseline_scope_test.py

        python3 test/local_dev_vpn_route_contract_test.py

        python3 test/embedded_engine_route_contract_test.py

        python3 test/stikjit_unified_build_test.py

        python3 test/single_ipa_distribution_test.py

        '
    - name: Type-check the actual shared route plugin against the iPhone SDK
      run: python3 test/melonx_native_sdk_test.py
  native:
    if: ${{ !contains(github.event.head_commit.message, '[melonx-keys-only]') && !contains(github.event.head_commit.message, '[frontend-motion]') && ((!contains(github.event.head_commit.message, '[retroarch-delivery]') && !contains(github.event.head_commit.message,
      '[melonx-validated-integration]')) && contains(github.event.head_commit.message, '[melonx-native]')) }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Reuse the exact successful Flutter and contract phases
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        git diff --exit-code faa281043ffdb82166c6af4ea069d442fb859cdc HEAD -- lib packages assets pubspec.yaml pubspec.lock
        analysis_options.yaml test '':!test/melonx_native_sdk_test.py''

        python3 - <<''PY''

        import json, subprocess

        from pathlib import Path

        job = json.loads(subprocess.check_output([''gh'', ''api'', ''repos/TarbleFR/RewindBox/actions/jobs/118900258241'']))

        assert job[''head_sha''] == ''faa281043ffdb82166c6af4ea069d442fb859cdc''

        names = [''Analyze the final app and retired locale-key removal'', ''Exercise the adjusted console and retirement
        scenarios'', ''Protect unchanged libraries, the remaining JIT helpers and routing'']

        phases = [next(s for s in job[''steps''] if s[''name''] == n) for n in names]

        assert all(s[''conclusion''] == ''success'' for s in phases), phases

        out = Path(''build/melonx-retirement-reuse.json''); out.parent.mkdir(parents=True, exist_ok=True)

        out.write_text(json.dumps(dict(source=job[''head_sha''], run=job[''run_id''], job=job[''id''], phases=phases, inputsUnchanged=True,
        reexecuted=False), indent=2))

        print(''Reused three successful phases; the earlier SDK-path failure remains recorded.'')

        PY

        '
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
    - name: Compile only the registered Swift plugin against the actual Flutter and iPhone SDK
      run: python3 test/melonx_native_sdk_test.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: MeloNX-retirement-proof-${{ github.sha }}
        path: build/melonx-retirement-*.json
        if-no-files-found: error
        retention-days: 14
