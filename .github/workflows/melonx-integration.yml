name: MeloNX external retirement and embedded route
'on':
  push:
    branches: [Claude]
    paths:
      - '.github/workflows/melonx-integration.yml'
      - 'lib/services/melonx_internal_service.dart'
      - 'lib/l10n/melonx_locale.dart'
      - 'test/melonx_embedded_route_test.dart'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  host:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Reuse successful app analysis and analyze the adjusted tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code 127b527f2eb773598b025072cd9dbbfaad275bb2 HEAD -- lib 'packages/*/lib' pubspec.yaml pubspec.lock analysis_options.yaml
          python3 - <<'PY'
          import json, subprocess
          job = json.loads(subprocess.check_output(['gh', 'api', 'repos/TarbleFR/neostation-ios/actions/jobs/118896956043']))
          assert job['head_sha'] == '127b527f2eb773598b025072cd9dbbfaad275bb2'
          step = next(s for s in job['steps'] if s['name'] == 'Run flutter analyze --no-fatal-infos')
          assert step['conclusion'] == 'success', step
          print('Reused successful app analysis from job 118896956043 on identical app and Dart dependency inputs.')
          PY
          flutter analyze --no-fatal-infos test/console_manager_test.dart test/dolphin_isolation_contract_test.dart test/melonx_embedded_route_test.dart
      - name: Exercise the adjusted console and retirement scenarios
        run: >-
          flutter test test/melonx_embedded_route_test.dart
          test/console_manager_test.dart test/dolphin_isolation_contract_test.dart
      - name: Protect unchanged libraries, the remaining JIT helpers and routing
        run: |
          python3 test/retroarch_baseline_scope_test.py
          python3 test/local_dev_vpn_route_contract_test.py
          python3 test/embedded_engine_route_contract_test.py
          python3 test/stikjit_unified_build_test.py
          python3 test/single_ipa_distribution_test.py
      - name: Type-check the actual shared route plugin against the iPhone SDK
        run: |
          set -euo pipefail
          FLUTTER_SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          xcrun swiftc -typecheck -swift-version 5 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios18.0 -F "$FLUTTER_SDK/bin/cache/artifacts/engine/ios-release" packages/stikjit_bridge/ios/Classes/NeoStationStikjitBridgePlugin.swift packages/stikjit_bridge/ios/Classes/LocalDevVpnRouteProbe.swift
