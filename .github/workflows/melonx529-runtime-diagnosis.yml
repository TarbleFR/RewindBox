name: MeloNX 529 runtime diagnosis
run-name: "MeloNX actual runtime \u2022 ${{ github.sha }}"
'on':
  push:
    branches:
    - Claude
    paths:
    - .github/workflows/melonx529-runtime-diagnosis.yml
permissions:
  contents: read
  actions: read
jobs:
  actual-runtime:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: MeloNX-engine-084fdb5d71609d3529c39cca9efa26093459827d
        run-id: 40143289330
        github-token: ${{ github.token }}
        path: dist/melonx
    - uses: actions/download-artifact@v4
      with:
        name: MeloNX-native-dependencies-66737aa9c959eb5915264bf178f179bda8643314
        run-id: 39854858591
        github-token: ${{ github.token }}
        path: dist/melonx-native
    - name: Initialize actual NativeAOT with private native libraries in an ARM64
        iOS app
      run: python3 test/melonx_runtime_smoke.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: MeloNX-actual-runtime-${{ github.sha }}
        path: dist/melonx-smoke
        if-no-files-found: ignore
        retention-days: 30
