name: Libretro directional skin checks
'on':
  push:
    branches: [Claude]
    paths:
    - .github/workflows/libretro-skin-checks.yml
    - packages/libretro_internal_bridge/ios/Classes/LibretroSkin*.h
    - packages/libretro_internal_bridge/ios/Classes/LibretroSkin*.m
    - test/libretro_host/frontend/skin*_test.m
    - test/libretro_simulator/skin_press_probe.h
    - test/libretro_skin_press_probe.py
  workflow_dispatch:
    inputs:
      scenario:
        description: Optional exact scenario for focused reproduction
        required: false
        default: ''
      device:
        description: Optional iphone or ipad
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: libretro-directional-skins-${{ github.sha }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Frontend behaviour and pressure pixel tests
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 test/skin_frontend_reuse_test.py
        python3 build-utils/reuse_skin_frontend.py
    - name: Compile and link every bridge source for iPhone
      if: ${{ !cancelled() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 build-utils/reuse_skin_frontend.py --iphone
    - name: Frontend UI source contract
      if: ${{ !cancelled() }}
      run: python3 test/libretro_frontend_ui_contract_test.py
  skin-press:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - uses: actions/download-artifact@v4
      with:
        name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
        run-id: '38638115521'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch pinned simulator inputs
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Actual sessions, per-arm pixels and existing input lifecycle
      env:
        PROBE_SCENARIO: ${{ inputs.scenario }}
        PROBE_DEVICE: ${{ inputs.device }}
      run: |
        args=()
        if [ -n "$PROBE_SCENARIO" ]; then args+=(--scenario "$PROBE_SCENARIO"); fi
        if [ -n "$PROBE_DEVICE" ]; then args+=(--device "$PROBE_DEVICE"); fi
        python3 test/libretro_skin_press_probe.py --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --evidence evidence/skin-press --label "${GITHUB_SHA}" "${args[@]}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-directional-skins-${{ github.sha }}
        path: evidence/skin-press/
        retention-days: 14
        if-no-files-found: warn
