name: MeloNX native session host
run-name: MeloNX host • ${{ github.sha }}
'on':
  push:
    branches: [Claude]
    paths:
      - '.github/workflows/melonx-host.yml'
      - 'packages/melonx_internal_bridge/**'
      - 'test/melonx_session_host_test.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile the iPhone host and execute its native ABI scenarios
        run: python3 test/melonx_session_host_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MeloNX-host-${{ github.sha }}
          path: dist/melonx-host/
          if-no-files-found: ignore
          retention-days: 14
