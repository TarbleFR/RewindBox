name: HD texture catalogue (Build 486)
on:
  push:
    branches: [Claude]
    paths:
      - packages/neo_texture_catalog/**
      - tools/textures/**
      - native/textures/**
      - lib/services/texture_catalog_service.dart
      - lib/l10n/texture_catalog_locale.dart
      - test/texture_*
      - test/native/texture_*
      - test/build486_targeted_test.py
      - test/validate_hd_textures_ipa_test.py
      - build-utils/validate_hd_textures_ipa.py
      - .github/workflows/hd-textures.yml
  workflow_dispatch:
    inputs:
      parts:
        description: Parts to run
        type: choice
        options: [all, host, native, uikit, repositories, discover, links, cores, summarize, research]
        default: all
      only:
        description: 'repositories: comma-separated pack ids (empty: every pack without a record)'
        type: string
        default: ''
      run:
        description: 'summarize: the run id of a discover run (its candidates artifact)'
        type: string
        default: ''
      queries:
        description: 'discover: searches replacing the built-in ones, separated by | (topics after a #, e.g. n64 texture pack|gliden64#gliden64)'
        type: string
        default: ''
      research:
        description: 'research: reference selection for tools/textures/research.py refs, e.g. --console gc,wii --pages 6 (or --ids S001,S005 --urls a|b)'
        type: string
        default: '--console gc'
permissions: {contents: read, actions: read}
concurrency:
  # Pushes of one commit share a group; each dispatch has its own, so review and
  # verification runs dispatched together on one commit are never cancelled.
  group: ${{ github.event_name == 'workflow_dispatch' && format('hd-textures-dispatch-{0}', github.run_id) || format('hd-textures-{0}', github.sha) }}
  cancel-in-progress: false
jobs:
  host:
    name: Readers, identities, installer, labels, catalogue, contracts and Flutter
    if: ${{ github.event_name == 'push' || inputs.parts == 'all' || inputs.parts == 'host' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.2', channel: stable, cache: true}
      - name: Restore exact locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: New and affected host checks
        # The token reads the repository-archive verification artifacts (tools/textures/ci-records.json).
        env: {CXX: g++, GH_TOKEN: '${{ github.token }}'}
        run: python3 test/build486_targeted_test.py --part host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build486-host-${{ github.sha }}
          path: build/build486/
          if-no-files-found: ignore
          retention-days: 14

  native:
    name: Store and adapters on Foundation, iPhone SDK build of every changed source
    if: ${{ github.event_name == 'push' || inputs.parts == 'all' || inputs.parts == 'native' }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Foundation store test, iPhone compilation and the affected UIKit suites
        run: python3 test/build486_targeted_test.py --part native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build486-native-${{ github.sha }}
          path: |
            build/build486/
            build/armsx2-validation/
          if-no-files-found: ignore
          retention-days: 14

  uikit:
    name: The HD textures page on UIKit with the bundled catalogue
    if: ${{ github.event_name == 'push' || inputs.parts == 'all' || inputs.parts == 'uikit' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Unified page in the Simulator
        run: python3 test/build486_targeted_test.py --part uikit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build486-uikit-${{ github.sha }}
          path: build/build486/
          if-no-files-found: ignore
          retention-days: 14

  repositories:
    name: Packs published as repository archives (${{ matrix.console }})
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.parts == 'all' || inputs.parts == 'repositories') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        console: [ps2, dolphin, psp, 3ds, n64]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Free runner disk for multi-gigabyte packs
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h "$RUNNER_TEMP"
      - name: Build the verification driver (the app's installers)
        run: |
          set -euo pipefail
          mkdir -p build/hdtex486
          gcc -O2 -c -I packages/neo_texture_catalog/ios/ThirdParty/lzma packages/neo_texture_catalog/ios/Classes/NeoTextureLZMA.c -o build/hdtex486/lzma.o
          g++ -std=c++20 -O2 -Wall -Wextra -I packages/neo_texture_catalog/ios/Classes -I packages/neo_texture_catalog/ios/ThirdParty/lzma \
            -I packages/armsx2_internal_bridge/ios/Classes tools/textures/native/texture_verify.cpp build/hdtex486/lzma.o -lz \
            -o build/hdtex486/texture_verify
      - name: Download each pack from its author's repository and install it with the app's code
        run: |
          python3 tools/textures/verify_packs.py --sources tools/textures/sources/${{ matrix.console }}.json \
            --driver build/hdtex486/texture_verify --kind repository --work "$RUNNER_TEMP" --max-gb 12 \
            --skip-recorded tools/textures/verified.jsonl --only "$ONLY" \
            --out build/hdtex486/verified-${{ matrix.console }}.jsonl
        env: {ONLY: '${{ inputs.only }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdtex486-repositories-${{ matrix.console }}-${{ github.sha }}
          path: build/hdtex486/verified-${{ matrix.console }}.jsonl
          if-no-files-found: warn
          retention-days: 14

  discover:
    name: Candidate packs on GitHub (review list, nothing published)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.parts == 'discover' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Search GitHub and describe each repository
        env: {GH_TOKEN: '${{ github.token }}', QUERIES: '${{ inputs.queries }}'}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$QUERIES" ]; then
            searches="${QUERIES%%#*}"; topics=""
            case "$QUERIES" in *'#'*) topics="${QUERIES#*#}" ;; esac
            IFS='|' read -ra items <<< "$searches"; for item in "${items[@]}"; do [ -n "$item" ] && args+=(--query "$item"); done
            IFS='|' read -ra items <<< "$topics"; for item in "${items[@]}"; do [ -n "$item" ] && args+=(--topic "$item"); done
            args+=(--skip-code)
          fi
          python3 tools/textures/discover.py github "${args[@]}" --out build/hdtex/candidates.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdtex-candidates-${{ github.sha }}
          path: build/hdtex/candidates.jsonl
          if-no-files-found: warn
          retention-days: 14

  links:
    name: Links of the catalogued packs (reachability, size, newer release)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.parts == 'links' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check every page and download part
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/textures/discover.py links --out build/hdtex/links.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdtex-links-${{ github.sha }}
          path: build/hdtex/links.jsonl
          if-no-files-found: warn
          retention-days: 14

  cores:
    name: Texture replacement in the pinned libretro cores (N64, PS1, NES)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.parts == 'cores' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
          run-id: '38638115521'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/libretro
      - name: Option keys and folders compiled into the pinned binaries
        run: |
          find dist/libretro -maxdepth 3 | head -60
          python3 tools/textures/probe_cores.py --cores dist/libretro --out build/hdtex/cores.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdtex-cores-${{ github.sha }}
          path: build/hdtex/cores.json
          if-no-files-found: warn
          retention-days: 14

  summarize:
    name: Engine-relevant candidates of a discover run (review list)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.parts == 'summarize' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: hdtex-candidates-*
          run-id: ${{ inputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/hdtex/candidates
          merge-multiple: true
      - name: One short line per candidate an engine can read
        run: python3 tools/textures/discover.py summarize --candidates build/hdtex/candidates/candidates.jsonl --out build/hdtex/summary.jsonl

  research:
    name: Reference pages of the maintainer's list (review list, nothing published)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.parts == 'research' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read each reference page, its GameBanana or GitHub details and its links
        env: {GH_TOKEN: '${{ github.token }}', RESEARCH: '${{ inputs.research }}'}
        run: |
          set -euo pipefail
          read -ra args <<< "$RESEARCH"
          python3 tools/textures/research.py refs "${args[@]}" --heads --out build/hdtex/research.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdtex-research-${{ github.run_id }}
          path: build/hdtex/research.jsonl
          if-no-files-found: warn
          retention-days: 14
