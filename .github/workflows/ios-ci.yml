name: Neostation iOS 0.0.2 private • Build 365
run-name: Neostation iOS 0.0.2 private • Build 365 • ${{ github.sha }}

on:
  push:
    branches:
      - experimental
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Candidate build number (used only for manual runs)'
        required: true
        default: '365'
        type: string

permissions:
  contents: write
  actions: read

# Keep candidate IPA runs separate from native validation.
concurrency:
  group: ${{ contains(github.event.head_commit.message, '[rpcs3-host-only]') && format('neostation-host-check-{0}', github.sha) || 'neostation-ios-private-365' }}
  cancel-in-progress: true

jobs:
  build:
    # Core-only development commits validate their native engine separately,
    # not a mislabeled full NeoStation IPA.
    if: ${{ !contains(github.event.head_commit.message, '[retroarch-delivery]') && !contains(github.event.head_commit.message, '[neoswap-maintenance]') && !contains(github.event.head_commit.message, '[neoswap-ipa]') && !contains(github.event.head_commit.message, '[armsx2-core-only]') && !contains(github.event.head_commit.message, '[rpcs3-core-only]') && !contains(github.event.head_commit.message, '[rpcs3-host-only]') && !contains(github.event.head_commit.message, '[dolphin-core-only]') }}
    name: Neostation iOS 0.0.2 private IPA (365)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUILD_NUMBER: ${{ inputs.build_number || '365' }}
      IPA_NAME: NeoStation
      ARTIFACT_NAME: Neostation-iOS-0.0.2-Build-365-Private
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      DOLPHIN_CORE_HOST_SHA: ae7d46f90dff64ce698b8c18e0c12510dbae96fe
      ARMSX2_CORE_HOST_SHA: f4bdeb5e25f7622118a5c8ba23d8fc538e07ba07
      ARMSX2_CORE_RUN_ID: '37164423042'
      RPCS3_CORE_HOST_SHA: 7fbdc9fd26c094499179bf6f42727b8b2e59c281
      RPCS3_CORE_RUN_ID: '36418910869'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Validate canonical host sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rpcs3-ci build/fast-native

          git diff --check
          python3 - <<'PY'
          import re
          from pathlib import Path

          roots = (
              Path('lib'),
              Path('native'),
              Path('packages/stikjit_bridge'),
              Path('packages/rpcs3_internal_bridge'),
              Path('packages/armsx2_internal_bridge'),
              Path('packages/armsx2_jit_helper'),
          )
          suffixes = {
              '.dart', '.swift', '.m', '.mm', '.h', '.podspec', '.plist',
              '.entitlements',
          }
          retired = re.compile(
              r'NeoStationLocalTunnel|NeoStationVPNDiagnostics|'
              r'PacketTunnelProvider|NETunnelProvider|NEVPN|'
              r'NetworkExtension|packet-tunnel-provider'
          )
          matches = []
          for root in roots:
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in suffixes:
                      for line_number, line in enumerate(
                          path.read_text(errors='replace').splitlines(),
                          start=1,
                      ):
                          if retired.search(line):
                              matches.append(f'{path}:{line_number}:{line}')
          if matches:
              raise SystemExit(
                  'Retired internal VPN implementation remains in production '
                  'sources:\n' + '\n'.join(matches)
              )
          print('Production sources contain no internal VPN implementation.')
          PY
          retired_vpn_build_files=(
            build-utils/configure_local_jit_tunnel.py
            build-utils/patch_local_tunnel_build269.py
            build-utils/patch_rpcs3_build268_tunnel.py
            build-utils/patch_rpcs3_build270_transport.py
            build-utils/patch_rpcs3_build274_launch.py
            build-utils/patch_stikjit_remote_pairing.py
            build-utils/patch_vpn_build271.py
            build-utils/patch_vpn_build273.py
            build-utils/patch_vpn_build276_final.py
            build-utils/reuse_build266_rpcs3_for267.py
            build-utils/rpcs3/build270_packet_pump.swift.inc
            build-utils/validate_build266_identity.py
            build-utils/validate_build269_identity.py
            build-utils/validate_build270_identity.py
            build-utils/validate_build271_identity.py
            build-utils/validate_build273_identity.py
            build-utils/validate_build274_identity.py
            build-utils/validate_build275_identity.py
            build-utils/validate_build276_identity.py
            build-utils/validate_vpn_build279_artifact.py
            build-utils/validate_vpn_build282_handoff.py
            build-utils/validate_vpn_build284_frozen.py
            build-utils/validate_vpn_build284_manager.py
            build-utils/vpn271/manager.swift.inc
            build-utils/vpn271/provider.swift.inc
          )
          for retired in "${retired_vpn_build_files[@]}"; do
            test ! -e "$retired" || {
              echo "Retired internal-VPN build source remains: $retired" >&2
              exit 1
            }
          done
          python3 -m py_compile \
            build-utils/configure_rpcs3_ios_v2.py \
            build-utils/embed_rpcs3_host_entitlements.py \
            build-utils/prepare_ios_icon_fallback.py \
            build-utils/prepare_fast_native_runtime.py \
            build-utils/validate_rpcs3_ipa.py \
            build-utils/validate_rpcs3_embedded_core.py \
            build-utils/validate_rpcs3_passive_dlopen.py \
            build-utils/validate_single_ipa_distribution.py \
            packages/dolphin_internal_bridge/ci/build_support.py \
            packages/dolphin_internal_bridge/ci/verify_ipa.py \
            test/neoswap_bridge_syntax_stub_test.py
          python3 test/neoswap_bridge_syntax_stub_test.py
          python3 test/dolphin_account_267_test.py
          ruby -c build-utils/add_ios_icon_fallback_resources.rb

      - name: Syntax-check embedded Objective-C++ bridges
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          STUB="$RUNNER_TEMP/flutter-stub"
          mkdir -p "$STUB/Flutter"
          cat > "$STUB/Flutter/Flutter.h" <<'EOF'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          typedef void (^FlutterResult)(id _Nullable result);
          FOUNDATION_EXPORT NSObject* const FlutterMethodNotImplemented;
          @protocol FlutterBinaryMessenger <NSObject>
          @end
          @class FlutterMethodCall;
          @class FlutterMethodChannel;
          @protocol FlutterPluginRegistrar <NSObject>
          @property(nonatomic, readonly) NSObject<FlutterBinaryMessenger>* messenger;
          @property(nonatomic, readonly, nullable) UIViewController* viewController;
          - (void)addMethodCallDelegate:(id)delegate channel:(FlutterMethodChannel*)channel;
          @end
          @protocol FlutterPlugin <NSObject>
          + (void)registerWithRegistrar:(NSObject<FlutterPluginRegistrar>*)registrar;
          @end
          @interface FlutterViewController : UIViewController
          @end
          @interface FlutterMethodCall : NSObject
          @property(nonatomic, readonly) NSString* method;
          @property(nonatomic, readonly) id arguments;
          @end
          @interface FlutterMethodChannel : NSObject
          + (instancetype)methodChannelWithName:(NSString*)name
                            binaryMessenger:(NSObject<FlutterBinaryMessenger>*)messenger;
          - (void)invokeMethod:(NSString*)method arguments:(id)arguments;
          @end
          EOF
          mkdir -p "$STUB/neo_swap"
          cp packages/neo_swap/ios/Classes/*.h "$STUB/neo_swap/"
          # Build 447: the RPCS3 bridge imports
          # <external_display/NeoExternalDisplayCoordinator.h>. Stage the headers
          # the external_display pod publishes (public_header_files), and only
          # those, as the framework exposes them: the same staging as the
          # libretro iPhone check, so an unpublished import fails here too.
          python3 - "$STUB" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'test')
          from libretro_ios_syntax_test import stage_external_display
          stage_external_display(Path(sys.argv[1]))
          PY
          COMMON=(
            -std=c++20 -fobjc-arc -fblocks -fsyntax-only -x objective-c++
            -isysroot "$SDK" -miphoneos-version-min=17.4
            -I"$STUB" -I"$STUB/include"
            -Ipackages/rpcs3_internal_bridge/ios/Classes
          )
          xcrun --sdk iphoneos clang++ "${COMMON[@]}" \
            packages/rpcs3_internal_bridge/ios/Classes/Rpcs3InternalBridgePlugin.mm
          xcrun --sdk iphoneos clang++ "${COMMON[@]}" \
            packages/rpcs3_internal_bridge/ios/Classes/Rpcs3JitBridgePlugin.mm
          xcrun --sdk iphoneos clang++ "${COMMON[@]}" \
            packages/armsx2_internal_bridge/ios/Classes/Armsx2SessionMenu.mm
          xcrun --sdk iphoneos clang++ "${COMMON[@]}" \
            packages/dolphin_internal_bridge/ios/Classes/DolphinSessionMenu.mm

      - name: Resolve Flutter and analyze
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos

      - name: Run route, debugger, packaging and deletion regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 test/dolphin_account_267_test.py
          python3 test/dolphin_cheats_menu_test.py
          python3 test/dolphin_https_resource_test.py
          python3 test/integrated_import_tab_contract_test.py
          # KartPad (19 October 2026), then Dusklight and the Ports playlist
          # (20 October 2026) left NeoStation: their absence is checked instead.
          python3 test/no_kartpad_ipa_test.py
          python3 test/no_dusklight_ipa_test.py
          python3 test/cheats_media_source_contract_test.py
          flutter test test/frontend_media_gate_test.dart test/video_preview_lifecycle_test.dart
          clang++ -std=c++20 -Wall -Wextra -Werror -Inative/cheats test/cheat_parser_test.cpp -o "$RUNNER_TEMP/cheat-parser"
          "$RUNNER_TEMP/cheat-parser"
          clang++ -std=c++20 -Wall -Wextra -Werror -Inative/cheats test/cheat_bulk_parser_test.cpp -o "$RUNNER_TEMP/cheat-bulk-parser"
          "$RUNNER_TEMP/cheat-bulk-parser"
          clang++ -std=c++20 -fobjc-arc -fblocks -Wno-deprecated-declarations -Inative/cheats test/cheat_bulk_store_test.mm -framework Foundation -o "$RUNNER_TEMP/cheat-bulk-store"
          "$RUNNER_TEMP/cheat-bulk-store"
          python3 test/cheat_bulk_scope_test.py
          clang++ -std=c++20 -fobjc-arc -fblocks -Inative/cheats test/cheat_store_test.mm -framework Foundation -o "$RUNNER_TEMP/cheat-store"
          "$RUNNER_TEMP/cheat-store"
          clang++ -std=c++20 -fobjc-arc -fblocks -Inative/cheats test/cheat_import_delete361_test.mm -framework Foundation -o "$RUNNER_TEMP/cheat-import-delete"
          "$RUNNER_TEMP/cheat-import-delete"
          python3 test/ar_block361_upstream_test.py
          flutter test test/retired_ports_backup_test.dart test/retired_ports_launch_test.dart
          flutter test test/scraper_repository_test.dart test/dolphin_import_ui_test.dart
          python3 test/rpcs3_loader_stability_280_test.py
          python3 test/rpcs3_build283_boot_stability_test.py
          python3 test/rpcs3_build285_core_handoff_test.py
          python3 test/rpcs3_diagnostics_native_test.py
          python3 test/rpcs3_jit_handshake_test.py
          python3 test/rpcs3_atomic_startup_test.py
          python3 test/rpcs3_early_escrow_integration_test.py
          c++ -std=c++20 -Wall -Wextra -Werror \
            -Ipackages/rpcs3_internal_bridge/ios/Classes \
            test/rpcs3_early_address_space_escrow_test.cpp \
            -o "$RUNNER_TEMP/rpcs3-early-address-space-escrow-test"
          "$RUNNER_TEMP/rpcs3-early-address-space-escrow-test"
          # The pinned RPCS3 Core run compiles this native failure-path test
          # against its materialized source before publishing its identity.
          python3 test/game_launch_route_test.py
          python3 test/game_audio_handoff_test.py
          flutter test test/audio_policy_service_test.dart
          python3 test/carousel_chrome_layout_test.py
          python3 test/armsx2_patch_catalog_test.py
          python3 test/armsx2_graphics_test.py
          python3 test/rpcs3_pod_header_visibility_test.py
          python3 test/rpcs3_reporter_send_order_test.py
          python3 test/rpcs3_host_entitlements_test.py
          python3 test/rpcs3_ipa_validation_test.py
          python3 test/rpcs3_savestate_overwrite_regression_test.py
          flutter test test/rpcs3_save_export_contract_test.dart
          python3 test/diagnostics_files_workspace_test.py
          python3 test/rpcs3_ui_status_cleanup_test.py
          python3 test/localization_12_locale_coverage_test.py
          python3 test/dolphin_ipa_validator_test.py
          python3 test/local_dev_vpn_route_contract_test.py
          python3 test/armsx2_vm_shutdown_test.py
          node test/rpcs3_debugger_handshake_test.js
          python3 test/rpcs3_build306_single_path_test.py
          python3 test/build351_native_donor_test.py
          python3 test/build353_rpcs3_core_pin_test.py
          flutter test test/rpcs3_bridge_memory_mode_test.dart test/local_jit_route_proof_test.dart test/rpcs3_boot_watchdog_test.dart test/rpcs3_internal_integration_test.dart test/rpcs3_lazy_load_contract_test.dart test/game_deletion_regression_test.dart test/game_repository_test.dart test/rpcs3_library_service_test.dart test/rpcs3_regular_arena_dolphin_multidelete_contract_test.dart test/stikjit_armsx2_isolation_test.dart test/armsx2_launch_url_encoding_test.dart test/armsx2_retroarch_routing_isolation_test.dart test/armsx2_embedded_library_contract_test.dart test/armsx2_bios_selection_test.dart test/jit_backend_preference_service_test.dart test/emulator_seed_default_test.dart test/rpcs3_embedded_identity_test.dart test/system_info_catalog_coverage_test.dart

      - name: Prepare lightweight build tools
        shell: bash
        run: |
          set -euo pipefail
          export BUNDLE_PATH="$RUNNER_TEMP/dolphin-ruby-gems"
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
          bundle install

      - name: Generate iOS host
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          rm -rf ios
          python3 packages/dolphin_internal_bridge/ci/build_support.py scaffold

      - name: Download validated Build 350 native donor without KartPad
        shell: bash
        run: |
          set -euo pipefail
          # Artifact 10932894067 was purged; the same Build 350 IPA is release
          # 0.0.1. Its old KartPad donor (code translated from Mario Kart Wii)
          # must never enter this job: only the reused members are fetched by
          # range from its pinned central directory.
          mkdir -p build/native-donor
          python3 build-utils/fetch_native_donor_subset.py build/native-donor/NeoStation.ipa \
            --report build/native-donor/subset-report.json
          python3 build-utils/game_content_gate.py build/native-donor/NeoStation.ipa

      - name: Reuse validated native runtimes
        shell: bash
        run: |
          set -euo pipefail
          # Core/resource bootstrap only. JIT comes exclusively from source below.
          python3 build-utils/prepare_fast_native_runtime.py \
            build/native-donor --build-number "$BUILD_NUMBER"

      - name: Build canonical StikJIT from pinned sources for iOS 18 26 and 27
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen || brew install xcodegen
          python3 build-utils/build_patched_stikjit.py
          python3 test/stikjit_unified_build_test.py

      - name: Download pinned passive RPCS3 Core
        uses: actions/download-artifact@v4
        with:
          name: RPCS3Core-${{ env.RPCS3_CORE_HOST_SHA }}
          run-id: ${{ env.RPCS3_CORE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/rpcs3-native

      - name: Verify and install passive RPCS3 Core
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=dist/rpcs3-native/libRPCS3Core.dylib
          IDENTITY=dist/rpcs3-native/identity.json
          CORE=packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib
          test -s "$SOURCE"
          test -s "$IDENTITY"
          test -s "$CORE"
          # The artifact's source, canonical patch, compiler recipe, binary
          # checks and native ABI must all be from the same Core commit.
          git diff --exit-code "$RPCS3_CORE_HOST_SHA" "$GITHUB_SHA" -- \
            build-utils/build_rpcs3_embedded_core.sh \
            build-utils/materialize_rpcs3_core.py \
            build-utils/apply_rpcs3_llvm_patch.py \
            build-utils/rpcs3/canonical-source.json \
            build-utils/rpcs3/embedded-core.patch \
            build-utils/rpcs3/llvm-aarch64-ghc-emergency-spill.patch \
            build-utils/rpcs3_core_syntax_gate.py \
            test/rpcs3_core_syntax_gate_test.py \
            test/rpcs3_armsx3_performance_patch_test.py \
            test/rpcs3_build352_gow3_memory_test.py \
            test/rpcs3_ios_ppu_compile_budget_test.cpp \
            test/rpcs3_ppu_no_size_split_policy_test.cpp \
            test/rpcs3_preprocessor_balance_test.py \
            build-utils/validate_rpcs3_embedded_core.py \
            build-utils/validate_rpcs3_passive_dlopen.py \
            packages/rpcs3_internal_bridge/ios/Classes/Rpcs3CoreABI.h
          git diff --exit-code "$RPCS3_CORE_HOST_SHA" "$GITHUB_SHA" -- \
            .github/workflows/rpcs3-core.yml
          python3 - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'build-utils')
          from validate_rpcs3_ipa import validate_core_identity
          from validate_rpcs3_embedded_core import validate_core
          from validate_rpcs3_passive_dlopen import validate as validate_passive_dlopen

          source = Path('dist/rpcs3-native/libRPCS3Core.dylib')
          identity_path = Path('dist/rpcs3-native/identity.json')
          destination = Path('packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib')
          data = source.read_bytes()
          identity = validate_core_identity(data, identity_path, os.environ['RPCS3_CORE_HOST_SHA'])
          validate_core(data)
          passive = validate_passive_dlopen(data)
          assert passive['forbiddenReachability'] is False, passive

          shutil.copy2(source, destination)
          destination.chmod(0o755)
          assert destination.read_bytes() == data, 'RPCS3 Core installation changed artifact bytes'
          fast_path = Path('build/fast-native/identity.json')
          fast = json.loads(fast_path.read_text())
          fast.update({
              'rpcs3CoreSha256': identity['sha256'],
              'rpcs3CoreHostCommit': identity['host_commit'],
              'rpcs3CoreSourceCommit': identity['source_commit'],
              'rpcs3CorePatchSha256': identity['source_patch_sha256'],
              'rpcs3CoreAbiVersion': identity['abi_version'],
              'rpcs3CoreRunId': int(os.environ['RPCS3_CORE_RUN_ID']),
              'rpcs3PassiveDlopen': passive,
          })
          fast_path.write_text(json.dumps(fast, indent=2) + '\n')
          shutil.copy2(identity_path, 'build/fast-native/rpcs3-core-identity.json')
          print(json.dumps({'identity': identity, 'passiveDlopen': passive}, indent=2))
          PY
          file "$CORE"
          test "$(lipo -archs "$CORE")" = arm64
          nm -gU "$CORE" > build/rpcs3-core-exports.txt
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'build-utils')
          from validate_rpcs3_ipa import REQUIRED_CORE_SYMBOLS, FORBIDDEN_CORE_SYMBOLS
          exports = Path('build/rpcs3-core-exports.txt').read_text().splitlines()
          symbols = {line.split()[-1] for line in exports if line.split()}
          missing = set(REQUIRED_CORE_SYMBOLS) - symbols
          forbidden = set(FORBIDDEN_CORE_SYMBOLS) & symbols
          assert not missing, f'Missing RPCS3 Core exports: {sorted(missing)}'
          assert not forbidden, f'Retired RPCS3 Core exports: {sorted(forbidden)}'
          PY

      - name: Verify retained stable Dolphin Core
        shell: bash
        run: |
          set -euo pipefail
          CORE="packages/dolphin_internal_bridge/ios/Frameworks/DolphinCore.framework/DolphinCore"
          test -s "$CORE"
          test -d ios/Runner/Sys
          test -s ios/Runner/cacert.pem

          # The Build 350 IPA carries the exact previously validated Dolphin
          # runtime. Refuse it if any source defining that ABI has changed.
          git diff --exit-code "$DOLPHIN_CORE_HOST_SHA" "$GITHUB_SHA" -- \
            build-utils/patch_dolphin_internal_core_v2.py \
            packages/dolphin_internal_bridge/core \
            test/dolphin_cheat_manager_test.py \
            test/dolphin_cheats_menu_test.py \
            .github/workflows/dolphin-core.yml

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          # This is a recompiled UIKit host API, not the retained core's C ABI.
          # Permit only the UIKit navigation callbacks, preserving every core declaration.
          import subprocess
          menu_path='packages/dolphin_internal_bridge/ios/Classes/DolphinSessionMenu.h'
          original=subprocess.check_output(['git','show',os.environ['DOLPHIN_CORE_HOST_SHA']+':'+menu_path],text=True)
          current=Path(menu_path).read_text()
          for callback in ('openDisplaySettings','openShaderSettings','openTextureSettings'):
              addition='@property(nonatomic, copy, nullable) dispatch_block_t '+callback+';\n'
              assert current.count(addition)==1
              current=current.replace(addition,'')
          assert current==original, 'Unexpected UIKit menu interface change'

          core = Path(
              "packages/dolphin_internal_bridge/ios/Frameworks/"
              "DolphinCore.framework/DolphinCore"
          )
          actual = hashlib.sha256(core.read_bytes()).hexdigest()
          baseline = json.loads(Path("build-utils/baselines/ios-322.json").read_text())
          expected = baseline["nativeIdentity"]["dolphinCoreSha256"]
          assert actual == expected, (actual, expected)
          fast_path = Path("build/fast-native/identity.json")
          fast = json.loads(fast_path.read_text())
          fast["dolphinCoreSha256"] = actual
          fast["dolphinCoreHostCommit"] = os.environ["DOLPHIN_CORE_HOST_SHA"]
          fast["dolphinSourceRevision"] = os.environ["DOLPHIN_SHA"]
          fast["dolphinCheatCatalogues"] = [
              "Gecko/WiiRD", "Action Replay/local INI"
          ]
          fast_path.write_text(json.dumps(fast, indent=2) + "\n")
          print(json.dumps({"sha256": actual, "baseline": expected}, indent=2))
          PY

          file packages/dolphin_internal_bridge/ios/Frameworks/DolphinCore.framework/DolphinCore
          nm -gU packages/dolphin_internal_bridge/ios/Frameworks/DolphinCore.framework/DolphinCore \
            > build/dolphin-native-exports.txt
          for symbol in \
            _neostation_dolphin_initialize \
            _neostation_dolphin_launch \
            _neostation_dolphin_menu_snapshot \
            _neostation_dolphin_cheats_snapshot \
            _neostation_dolphin_set_cheats_enabled \
            _neostation_dolphin_set_cheat_enabled \
            _neostation_dolphin_download_gecko_codes; do
            grep -q " $symbol$" build/dolphin-native-exports.txt
          done

      - name: Require completed exact ARMSX2 2.6 Core and remove its donor bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil, subprocess
          endpoint='repos/TarbleFR/RewindBox/actions/runs/'+os.environ['ARMSX2_CORE_RUN_ID']
          result=json.loads(subprocess.check_output(['gh','api',endpoint]))
          assert result['head_sha'] == os.environ['ARMSX2_CORE_HOST_SHA'], result
          assert result['path'] == '.github/workflows/armsx2-core.yml', result
          assert result['status'] == 'completed' and result['conclusion'] == 'success', result
          shutil.rmtree('dist/armsx2')
          PY

      - name: Download pinned ARMSX2 2.6 Core
        uses: actions/download-artifact@v4
        with:
          name: ARMSX2Core-${{ env.ARMSX2_CORE_HOST_SHA }}
          run-id: ${{ env.ARMSX2_CORE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/armsx2

      - name: Verify pinned ARMSX2 Core identity
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/armsx2/ARMSX2Core.framework/ARMSX2Core
          test -f dist/armsx2/identity.json
          # Refuse a stale core even when both artifacts report the same ABI.
          git diff --exit-code "$ARMSX2_CORE_HOST_SHA" "$GITHUB_SHA" -- \
            packages/armsx2_internal_bridge/core \
            packages/armsx2_internal_bridge/ios/Classes/ARMSX2CoreABI.h \
            build-utils/armsx2
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          identity=json.loads(Path('dist/armsx2/identity.json').read_text())
          source=json.loads(Path('build-utils/armsx2/source.json').read_text())
          assert identity['revision'] == source['revision'], identity
          assert identity['host_commit'] == os.environ['ARMSX2_CORE_HOST_SHA'], identity
          assert identity['architectures'] == ['arm64'], identity
          assert identity['abi_version'] == source['abi_version'] == 6, identity
          assert identity['release'] == source['release'] == 'iOSv2.6.0', identity
          assert identity['shader_chains'] and identity['performance_overlays'], identity
          assert identity['bundled_shader_presets'] == 12 and identity['bundled_shader_files'] == 28, identity
          resources=Path('dist/armsx2/ARMSX2Core.framework/shaders')
          shader_hashes=identity['bundled_shader_sha256']
          assert len(shader_hashes) == identity['bundled_shader_files'], identity
          assert len(list(resources.glob('**/*.slangp'))) == identity['bundled_shader_presets'], identity
          for relative,expected in shader_hashes.items():
              asset=resources/relative
              assert asset.is_file() and hashlib.sha256(asset.read_bytes()).hexdigest() == expected, relative
          binary=Path('dist/armsx2/ARMSX2Core.framework/ARMSX2Core')
          assert hashlib.sha256(binary.read_bytes()).hexdigest() == identity['sha256'], identity
          binary.chmod(0o755)
          fast_path=Path('build/fast-native/identity.json')
          fast=json.loads(fast_path.read_text())
          fast.update(armsx2CoreSha256=identity['sha256'],
                      armsx2CoreHostCommit=identity['host_commit'],
                      armsx2SourceRevision=identity['revision'],
                      armsx2CoreRunId=int(os.environ['ARMSX2_CORE_RUN_ID']))
          fast_path.write_text(json.dumps(fast,indent=2)+'\n')
          print(identity)
          PY
          python3 test/armsx2_packaging_test.py --core-directory dist/armsx2

      - name: Prepare emulator build definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          required=('SCREENSCRAPER_DEV_ID','SCREENSCRAPER_DEV_PASSWORD')
          values={key:os.environ.get(key,'').strip() for key in required}
          missing=[key for key,value in values.items() if not value]
          if missing:
              raise SystemExit('Missing build secrets: '+', '.join(missing))
          values.update({
              'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX':'true',
              'NEOSTATION_MELONX_BUNDLE_ID':'com.nur.nx',
          })
          Path('.dart-defines.json').write_text(json.dumps(values))
          PY

      - name: Configure release host
        shell: bash
        run: |
          set -euo pipefail
          python3 build-utils/patch_ios_video_player_audio_session.py
          flutter build ios --release --no-codesign --config-only --no-pub \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=.dart-defines.json
          python3 packages/dolphin_internal_bridge/ci/build_support.py configure
          python3 build-utils/configure_rpcs3_ios_v2.py
          python3 build-utils/configure_armsx2_ios.py
          dart run flutter_launcher_icons
          bash build-utils/force_ios_fork_icon.sh
          # Fallback PNGs are generated in ios/Runner and referenced from the same Xcode group.
          python3 build-utils/prepare_ios_icon_fallback.py
          bundle exec ruby build-utils/add_ios_icon_fallback_resources.rb
          env -u BUNDLE_GEMFILE -u BUNDLE_PATH pod install --project-directory=ios
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          entitlements = plistlib.loads(
              Path('ios/Runner/Runner.entitlements').read_bytes()
          )
          retired = {
              'com.apple.developer.networking.networkextension',
              'com.apple.developer.networking.vpn.api',
          }
          remaining = retired.intersection(entitlements)
          if remaining:
              raise SystemExit(
                  'Retired VPN entitlements remain: ' + ', '.join(sorted(remaining))
              )
          generated = (
              Path('ios/Runner.xcodeproj/project.pbxproj').read_text(),
              Path('ios/Podfile').read_text(),
          )
          markers = (
              'NeoStationLocalTunnel',
              'NetworkExtension.framework',
              'com.apple.NetworkExtensions.iOS',
              'packet-tunnel-provider',
          )
          found = [marker for marker in markers if any(marker in text for text in generated)]
          if found:
              raise SystemExit('Generated iOS host retains internal VPN markers: ' + ', '.join(found))
          if Path('ios/NeoStationLocalTunnel').exists():
              raise SystemExit('Generated iOS host retains the internal VPN directory')
          print('Generated iOS host is LocalDevVPN-only.')
          PY
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Align application and extension versions to 0.0.2
        run: python3 build-utils/stamp_host_version.py

      - name: Compile only NeoStation and extensions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DolphinDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO build \
            2>&1 | tee "$RUNNER_TEMP/neostation-fast-xcodebuild.log"

      - name: Embed verified RPCS3 Core and signing metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 build-utils/embed_rpcs3_core_lazy.py
          python3 build-utils/embed_rpcs3_host_entitlements.py

      - name: Embed lazy-loaded ARMSX2 Core framework
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/DolphinDerivedData/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP"
          mkdir -p "$APP/Frameworks"
          rm -rf "$APP/Frameworks/ARMSX2Core.framework"
          ditto dist/armsx2/ARMSX2Core.framework "$APP/Frameworks/ARMSX2Core.framework"
          test -f "$APP/Frameworks/ARMSX2Core.framework/ARMSX2Core"
          file "$APP/Frameworks/ARMSX2Core.framework/ARMSX2Core"
          nm -gj "$APP/Frameworks/ARMSX2Core.framework/ARMSX2Core" > build/armsx2-exports.txt
          grep -qx '_NeoARMSX2_GetAPI' build/armsx2-exports.txt

      - name: Embed legal, license and source notices
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/DolphinDerivedData/Build/Products/Release-iphoneos/Runner.app"
          python3 build-utils/embed_legal_bundle.py \
            --app "$APP" \
            --build-number "$BUILD_NUMBER" \
            --dolphin-sha "$DOLPHIN_SHA"

      - name: Require exact candidate display, motion and cheat simulator evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time,os
          for workflow in ('dolphin-pacing-check.yml','dolphin-motion-check.yml','cheats-media-check.yml'):
              deadline=time.monotonic()+1800
              while True:
                  endpoint='repos/TarbleFR/RewindBox/actions/workflows/'+workflow+'/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=10'
                  rows=json.loads(subprocess.check_output(['gh','api',endpoint]))['workflow_runs']
                  rows=[r for r in rows if r['head_sha']==os.environ['GITHUB_SHA']]
                  if rows and rows[0]['status']=='completed':
                      assert rows[0]['conclusion']=='success',rows[0]
                      print('Verified exact candidate',workflow,rows[0]['id'])
                      break
                  assert time.monotonic()<deadline,'Candidate evidence did not complete: '+workflow
                  time.sleep(15)
          subprocess.run(['python3','test/stikjit_scoped_host_test.py'],check=True)
          subprocess.run(['python3','test/dolphin_phone_shake_test.py'],check=True)
          subprocess.run(['python3','test/dolphin_phone_shake_routing_test.py'],check=True)
          PY

      - name: Package and validate NeoStation IPA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 packages/dolphin_internal_bridge/ci/build_support.py package
          python3 build-utils/validate_legal_bundle_ipa.py "dist/$IPA_NAME.ipa" \
            --build-number "$BUILD_NUMBER" --commit "$GITHUB_SHA"
          python3 build-utils/validate_rpcs3_ipa.py \
            --build-number "$BUILD_NUMBER" --commit "$GITHUB_SHA" \
            --core-identity build/fast-native/rpcs3-core-identity.json \
            --core-host-commit "$RPCS3_CORE_HOST_SHA" \
            --core-run-id "$RPCS3_CORE_RUN_ID"
          python3 build-utils/validate_single_ipa_distribution.py \
            "dist/$IPA_NAME.ipa" --report dist/localdevvpn-distribution.json
          python3 build-utils/validate_debugger_probe_ipa.py "dist/$IPA_NAME.ipa"
          python3 build-utils/validate_cheat_bulk_ipa.py "dist/$IPA_NAME.ipa" --report dist/cheat-bulk-validation.json
          python3 build-utils/validate_release002_ipa.py "dist/$IPA_NAME.ipa" \
            --build-number "$BUILD_NUMBER" --report dist/0.0.2-validation.json
          python3 build-utils/validate_stikjit_ipa.py "dist/$IPA_NAME.ipa" \
            --identity build/stikjit-current/identity.json \
            --report dist/stikjit-compatibility.json
          python3 - <<'PY'
          import zipfile,plistlib,os
          with zipfile.ZipFile('dist/'+os.environ['IPA_NAME']+'.ipa') as z:
              apps={n.split('/')[1] for n in z.namelist() if n.startswith('Payload/') and len(n.split('/'))>2 and n.split('/')[1].endswith('.app')}
              assert len(apps)==1,apps
              root='Payload/'+apps.pop()+'/'
              info=plistlib.loads(z.read(root+'Info.plist'))
              assert info.get('CADisableMinimumFrameDurationOnPhone') is True, 'iPhone ProMotion opt-in missing'
              bridge=z.read(root+'Frameworks/dolphin_internal_bridge.framework/dolphin_internal_bridge')
              for marker in (b'DolphinFramePacing',b'DOLDisplaySettings',b'MTLUsePresentDrawable',b'ShaderCompilationMode',b'setPreferredFrameRateRange:'):
                  assert marker in bridge,marker
          PY
          ARMSX2_SOURCE_REVISION="$(python3 -c 'import json; print(json.load(open("build-utils/armsx2/source.json"))["revision"])')"
          python3 build-utils/validate_armsx2_ipa.py "dist/$IPA_NAME.ipa" \
            --build-number "$BUILD_NUMBER" \
            --source-revision "$ARMSX2_SOURCE_REVISION"
          # KartPad left NeoStation: no part of it and no file of game origin.
          python3 build-utils/validate_no_kartpad_ipa.py "dist/$IPA_NAME.ipa" \
            --build-number "$BUILD_NUMBER" --report dist/no-kartpad-validation.json
          # Dusklight and the Ports playlist left NeoStation as well.
          python3 build-utils/validate_no_dusklight_ipa.py "dist/$IPA_NAME.ipa" \
            --build-number "$BUILD_NUMBER" --report dist/no-dusklight-validation.json
          cp build/fast-native/identity.json dist/fast-native-identity.json
          cp build/fast-native/rpcs3-core-identity.json dist/rpcs3-core-identity.json
          shasum -a 256 dist/*.ipa | tee "dist/$IPA_NAME.sha256"
          ls -lah dist

      - name: Publish NeoStation iOS 0.0.2
        if: ${{ contains(github.event.head_commit.message, '[publish-0.0.2]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: '0.0.2'
          RELEASE_SOURCE_SHA: 'f4583c6a3083b8aed358da28b2f8f849256e0e8b'
        run: |
          set -euo pipefail
          git diff --exit-code "$RELEASE_SOURCE_SHA" "$GITHUB_SHA" -- \
            . \
            ':(exclude).github/workflows/ios-ci.yml' \
            ':(exclude).github/workflows/cheats-media-check.yml'

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG already exists; refusing to move it." >&2
            exit 1
          fi

          OUT="$RUNNER_TEMP/release-0.0.2"
          mkdir -p "$OUT/legal"
          cp "dist/$IPA_NAME.ipa" "$OUT/NeoStation.ipa"
          cp LICENSE.md "$OUT/legal/NeoStation-GPL-3.0.txt"
          cp NOTICE.md "$OUT/legal/NeoStation-NOTICE.md"
          cp docs/LEGAL_AND_CREDITS.md "$OUT/legal/LEGAL_AND_CREDITS.md"
          cp -R assets/legal/. "$OUT/legal/"
          (cd "$OUT" && zip -qr NeoStation-0.0.2-Licenses-and-Notices.zip legal)

          STIK_VERSION="$(python3 -c 'import json; print(json.load(open("build-utils/stikjit/source.json"))["version"])')"
          STIK_REVISION="$(python3 -c 'import json; print(json.load(open("build-utils/stikjit/source.json"))["revision"])')"
          cat > "$OUT/NeoStation-0.0.2-Source-Manifest.md" <<EOF
          # NeoStation iOS 0.0.2 — Source Manifest

          - Release tag: 0.0.2
          - Validated internal build: 365
          - Application source commit: $RELEASE_SOURCE_SHA
          - StikJIT: $STIK_VERSION
          - StikJIT pinned source revision: $STIK_REVISION

          The application source archive is generated directly from the exact
          application source commit recorded above. The publishing commit changes
          only the GitHub Actions release workflow and is not part of the
          application source identity.

          Third-party projects retain their own licenses, copyrights and source
          boundaries. See NeoStation-0.0.2-Licenses-and-Notices.zip, NOTICE.md and
          docs/LEGAL_AND_CREDITS.md for the maintained legal record.
          EOF

          git archive \
            --format=tar.gz \
            --prefix=neostation-ios-0.0.2/ \
            --output="$OUT/NeoStation-0.0.2-NeoStation-Source.tar.gz" \
            "$RELEASE_SOURCE_SHA"

          cat > "$RUNNER_TEMP/release-notes-0.0.2.md" <<'RELEASE_NOTES'
          <p align="center">
            <img src="https://raw.githubusercontent.com/TarbleFR/RewindBox/f4583c6a3083b8aed358da28b2f8f849256e0e8b/assets/images/fork-icon-valid.jpg" width="180" alt="NeoStation iOS logo">
          </p>

          <h1 align="center">🎮 NeoStation iOS — 0.0.2</h1>

          <p align="center"><strong>JIT compatibility, DolphiniOS improvements and overall stability update.</strong></p>

          ---

          ## ⚡ StikJIT updated

          NeoStation now integrates **StikJIT 1.9.0**, replacing the previous 1.5.0 integration.

          The JIT layer has been updated to improve compatibility across:

          - **iOS 18**
          - **iOS 26**
          - **iOS 27**

          Pairing validation and JIT diagnostics have also been improved to help reduce silent or indefinite loading states.

          ---

          ## 🐬 DolphiniOS improvements

          The embedded Dolphin integration receives several display and runtime improvements:

          - improved frame pacing
          - reduced micro-stutter
          - **120 Hz support**
          - improved Metal presentation
          - improved shader handling
          - cleaner resource handling between game sessions
          - improved display diagnostics

          > 120 Hz support improves presentation on compatible devices but does not turn a 30/60 FPS game into a native 120 FPS game.

          ---

          ## 📱 Requirements

          - iPhone or iPad
          - **iOS 18 or later**
          - Developer Mode enabled
          - NeoStation installed as a standalone IPA
          - compatible JIT configuration when required

          **LiveContainer is not supported.**

          ---

          ## 🎮 Game files

          NeoStation does not distribute ROMs, ISOs, BIOS files, firmware or copyrighted commercial game assets.

          ---

          ## 📦 Release

          Download **NeoStation.ipa** from the Assets section.

          **Version:** 0.0.2  
          **Internal build:** 365  
          **Source:** f4583c6a3083b8aed358da28b2f8f849256e0e8b

          Full credits, licenses, source information and checksums are included with the release assets.

          ---

          **One app. One library. Multiple systems.**
          RELEASE_NOTES

          if grep -Eiq 'RPCS3|ARMSX2|cheat|Wiimote|Wii Motion|ProMotion' "$RUNNER_TEMP/release-notes-0.0.2.md"; then
            echo "Release notes contain an excluded topic." >&2
            exit 1
          fi

          IPA_SIZE="$(stat -f%z "$OUT/NeoStation.ipa")"
          IPA_SHA="$(shasum -a 256 "$OUT/NeoStation.ipa" | awk '{print $1}')"
          {
            echo "$IPA_SHA  NeoStation.ipa"
            cd "$OUT"
            shasum -a 256 \
              NeoStation-0.0.2-Licenses-and-Notices.zip \
              NeoStation-0.0.2-Source-Manifest.md \
              NeoStation-0.0.2-NeoStation-Source.tar.gz
          } > "$OUT/NeoStation-0.0.2-SHA256SUMS.txt"

          gh release create "$RELEASE_TAG" \
            "$OUT/NeoStation.ipa" \
            "$OUT/NeoStation-0.0.2-Licenses-and-Notices.zip" \
            "$OUT/NeoStation-0.0.2-Source-Manifest.md" \
            "$OUT/NeoStation-0.0.2-NeoStation-Source.tar.gz" \
            "$OUT/NeoStation-0.0.2-SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SOURCE_SHA" \
            --title "NeoStation iOS 0.0.2" \
            --notes-file "$RUNNER_TEMP/release-notes-0.0.2.md"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-0.0.2.json"
          jq -e --arg commit "$RELEASE_SOURCE_SHA" \
            '.tag_name=="0.0.2" and .name=="NeoStation iOS 0.0.2" and .draft==false and .prerelease==false and .target_commitish==$commit' \
            "$RUNNER_TEMP/release-0.0.2.json" >/dev/null

          for asset in \
            NeoStation.ipa \
            NeoStation-0.0.2-Licenses-and-Notices.zip \
            NeoStation-0.0.2-Source-Manifest.md \
            NeoStation-0.0.2-NeoStation-Source.tar.gz \
            NeoStation-0.0.2-SHA256SUMS.txt; do
            jq -e --arg asset "$asset" '.assets[] | select(.name==$asset)' \
              "$RUNNER_TEMP/release-0.0.2.json" >/dev/null
          done

          mkdir -p "$RUNNER_TEMP/release-download-check"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'NeoStation.ipa' \
            --dir "$RUNNER_TEMP/release-download-check"
          echo "$IPA_SHA  $RUNNER_TEMP/release-download-check/NeoStation.ipa" | shasum -a 256 -c -

          echo "Published NeoStation iOS 0.0.2"
          echo "NeoStation.ipa size: $IPA_SIZE"
          echo "NeoStation.ipa SHA-256: $IPA_SHA"

      - name: Encrypt private test IPA before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/private-test
          openssl cms -encrypt -binary -aes256 -in "dist/$IPA_NAME.ipa" -out build/private-test/NeoStation.ipa.p7m -outform DER build-utils/private-test-365-recipient.pem
          shasum -a 256 "dist/$IPA_NAME.ipa" > build/private-test/NeoStation.ipa.sha256
          cp dist/stikjit-compatibility.json build/private-test/
          cp dist/cheat-bulk-validation.json build/private-test/
          cp docs/cheats-bulk365.md build/private-test/Notes-Build365.md
          cp dist/0.0.2-validation.json build/private-test/
          cp build/dolphin-motion/tests.json build/private-test/phone-shake-tests.json
          cp docs/releases/0.0.2.md build/private-test/Notes-0.0.2.md
          printf '%s\n' 'Neostation iOS 0.0.2.ipa' > build/private-test/delivery-name.txt
          cp build/stikjit-current/modern-baseline.json build/private-test/
          cp build/fast-native/identity.json build/private-test/native-identity.json
          printf 'commit=%s\nbuild=%s\nrelease_published=false\n' "$GITHUB_SHA" "$BUILD_NUMBER" > build/private-test/identity.txt
          # Only ciphertext leaves the build runner. The matching private key
          # is not in GitHub, workflow variables, logs or repository secrets.
          test -z "$(find build/private-test -type f -name '*.ipa' -print)"

      - name: Upload encrypted private test only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/private-test/
          if-no-files-found: error
          retention-days: 3

      - name: Collect fast diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build/fast-diagnostics
          test -f "$RUNNER_TEMP/neostation-fast-xcodebuild.log" &&             tail -n 350 "$RUNNER_TEMP/neostation-fast-xcodebuild.log" > build/fast-diagnostics/xcodebuild.log || true
          cp -f build/fast-native/identity.json build/fast-diagnostics/ 2>/dev/null || true
          cp -f build/fast-native/rpcs3-core-identity.json build/fast-diagnostics/ 2>/dev/null || true
          printf 'commit=%s\nbuild=%s\n' "$GITHUB_SHA" "$BUILD_NUMBER" > build/fast-diagnostics/build.txt

      - name: Upload fast diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-diagnostics
          path: build/fast-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary secrets
        if: always()
        shell: bash
        run: rm -f .dart-defines.json
