name: RPCS3 CELL554 Apple ARM64 texture hash measurements
run-name: "RPCS3 CELL554 host texture benchmark • ${{ github.sha }}"
'on':
  push:
    branches: [Claude]
    paths:
      - '.github/workflows/rpcs3-cell554-bench.yml'
      - 'build-utils/rpcs3/**'
      - 'test/rpcs3_texture_hash554_test.py'
      - 'test/native/*texture*554*'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rpcs3-cell554-bench]') }}
    runs-on: macos-15
    timeout-minutes: 30
    concurrency:
      group: rewindbox-rpcs3-cell554-bench-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the pinned Apple compiler
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Materialize the exact candidate, without building an iPhone Core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import platform
          assert platform.system() == 'Darwin' and platform.machine() == 'arm64'
          PY
          SOURCE="$RUNNER_TEMP/cell554-texture-source"
          git init -q "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/XITRIX/rpcs3.git
          UPSTREAM=$(python3 -c 'import json; print(json.load(open("build-utils/rpcs3/canonical-source.json"))["upstream_commit"])')
          git -C "$SOURCE" fetch --depth 1 origin "$UPSTREAM"
          git -C "$SOURCE" checkout -q --detach FETCH_HEAD
          python3 build-utils/materialize_rpcs3_core.py "$SOURCE"
      - name: Execute source-bound correctness checks and host timings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rpcs3-cell554-bench
          CXX="$(xcrun --sdk macosx --find clang++)" \
          HOST_MACOS_SDK="$(xcrun --sdk macosx --show-sdk-path)" \
            python3 test/rpcs3_texture_hash554_test.py "$RUNNER_TEMP/cell554-texture-source" \
              --benchmark --keep build/rpcs3-cell554-bench \
              --report build/rpcs3-cell554-bench/texture-result.json \
              2>&1 | tee build/rpcs3-cell554-bench/output.txt
          python3 - <<'PY'
          import hashlib, json, platform, subprocess
          from pathlib import Path
          files = ['test/rpcs3_texture_hash554_test.py', 'build-utils/rpcs3/canonical-source.json',
                   'build-utils/rpcs3/embedded-core.patch', '.github/workflows/rpcs3-cell554-bench.yml',
                   'test/native/rpcs3_texture_hash554.inc', 'test/native/rpcs3_texture_hash554_pair.inc',
                   'test/native/rpcs3_texture_hash554_group4.inc', 'test/native/rpcs3_texture_hash554_hybrid4.inc',
                   'test/native/rpcs3_texture_hash554_twins6.inc', 'test/native/rpcs3_texture_hash554_twins8.inc']
          record = dict(source=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                        system=platform.system(), machine=platform.machine(),
                        compiler=subprocess.check_output(['xcrun', 'clang++', '--version'], text=True),
                        inputSHA256={p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},
                        physicalDeviceTested=False, iPhoneCoreBuilt=False, ipaBuilt=False,
                        scope='Apple ARM64 host correctness and texture-hash microbenchmark only; not iPhone gameplay or FPS.')
          Path('build/rpcs3-cell554-bench/environment.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Preserve measurements and emitted assembly, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3Texture554-host-${{ github.sha }}
          path: build/rpcs3-cell554-bench/
          if-no-files-found: error
          retention-days: 14
