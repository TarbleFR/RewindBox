# Compile-check of the RPCS3 host bridge with the iPhone SDK, without an application build, a Core or an IPA.
# Run request: the bridge of RPCS3 Core 914 (capture request when the in-game menu closes, one per closing), 10 November 2026.
# Run request 2: same bridge; the check stages every pod the bridge imports (request 1: Rpcs3InternalBridgePlugin.mm compiled,
# Rpcs3SessionMenu.mm stopped on a pod the check had not staged).
name: RPCS3 host bridge iPhone compile check
run-name: "RPCS3 host bridge iPhone compile check • ${{ github.sha }}"
'on':
  push:
    branches: [Claude]
    paths:
      - '.github/workflows/rpcs3-host-bridge-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rewindbox-rpcs3-host-bridge-check-${{ github.sha }}
  cancel-in-progress: false
jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rpcs3-host-check]') }}
    name: RPCS3 bridge sources with the iPhone SDK (syntax and types)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Parse and type-check the bridge for arm64 iPhone
        run: python3 test/rpcs3_host_bridge_ios_syntax_test.py --report build/rpcs3-host-bridge-check/report.json
      - name: Preserve the report
        if: always()
        uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        with:
          name: RPCS3-host-bridge-check-${{ github.sha }}
          path: build/rpcs3-host-bridge-check
          if-no-files-found: warn
