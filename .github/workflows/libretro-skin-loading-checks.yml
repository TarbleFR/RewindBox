name: Libretro installed skin loading regression
on:
  push:
    branches: [Claude]
    paths:
      - .github/workflows/libretro-skin-loading-checks.yml
      - packages/libretro_internal_bridge/ios/Classes/LibretroSkin*
      - packages/libretro_internal_bridge/ios/Classes/LibretroSession.m
      - packages/libretro_internal_bridge/ios/Classes/LibretroFrontendMenu*
      - test/libretro_skin_loading_probe.py
      - test/libretro_skin_press_probe.py
      - test/libretro_simulator/skin_loading_probe.h
      - test/libretro_simulator/skin_resource_legacy.m
      - test/libretro_simulator/probe.m
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: libretro-skin-loading-${{ github.sha }}
  cancel-in-progress: false
jobs:
  existing-install:
    # The unified-cheats workflow checks the changed cheat inputs; reuse the
    # recorded successful evidence for the unchanged skins/shaders/gameplay.
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[hogwarts606-checks]')) && (!contains(github.event.head_commit.message, '[unified-cheats]')) }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: actions/download-artifact@v4
        with:
          name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
          run-id: '38638115521'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/libretro
      - name: Fetch pinned simulator inputs
        run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
      - name: Reproduce exact 463 rejection then test already installed skins in the candidate
        run: |
          git worktree add --detach "$RUNNER_TEMP/skin-build463" 73b0aabc81ffec7e14873b1e466c294980ea28fc
          # A pre-delegate stall can leave simctl's PID line buffered until
          # termination. Observe the actual installed Simulator process rather
          # than relying on that console line; preserve bounded stack samples.
          python3 -u - <<'PY' &
          import pathlib, subprocess, time
          folder = pathlib.Path('evidence/skin-loading/diagnostics')
          folder.mkdir(parents=True, exist_ok=True)
          seen, sampled = {}, set()
          while True:
              listing = subprocess.check_output(['ps', '-axo', 'pid=,args='], text=True)
              for line in listing.splitlines():
                  if '/CoreSimulator/Devices/' not in line or '/Probe.app/Probe' not in line:
                      continue
                  pid, command = line.strip().split(None, 1)
                  start = seen.setdefault(pid, time.monotonic())
                  age = time.monotonic() - start
                  for threshold in (90, 180):
                      key = (pid, threshold)
                      if age >= threshold and key not in sampled:
                          sampled.add(key)
                          (folder / f'process-{pid}.txt').write_text(command + '\n')
                          subprocess.run(['sample', pid, '3', '-file', str(folder / f'probe-{pid}-{threshold}s.txt')],
                                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              time.sleep(5)
          PY
          skin_sampler_pid=$!
          trap 'kill "$skin_sampler_pid" 2>/dev/null || true' EXIT
          python3 test/libretro_skin_loading_probe.py --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
            --legacy-sources "$RUNNER_TEMP/skin-build463/packages/libretro_internal_bridge/ios" \
            --evidence evidence/skin-loading --label "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libretro-skin-loading-${{ github.sha }}
          path: evidence/skin-loading/
          retention-days: 14
          if-no-files-found: warn
