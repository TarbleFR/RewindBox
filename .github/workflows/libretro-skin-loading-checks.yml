name: Libretro installed skin loading regression
on:
  push:
    branches: [Claude]
    paths:
      - .github/workflows/libretro-skin-loading-checks.yml
      - packages/libretro_internal_bridge/ios/Classes/LibretroSkin*
      - packages/libretro_internal_bridge/ios/Classes/LibretroSession.m
      - packages/libretro_internal_bridge/ios/Classes/LibretroFrontendMenu*
      - test/libretro_skin_loading_probe.py
      - test/libretro_skin_press_probe.py
      - test/libretro_simulator/skin_loading_probe.h
      - test/libretro_simulator/skin_resource_legacy.m
      - test/libretro_simulator/probe.m
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: libretro-skin-loading-${{ github.sha }}
  cancel-in-progress: false
jobs:
  existing-install:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: actions/download-artifact@v4
        with:
          name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
          run-id: '38638115521'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/libretro
      - name: Fetch pinned simulator inputs
        run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
      - name: Reproduce exact 463 rejection then test already installed skins in the candidate
        run: |
          git worktree add --detach "$RUNNER_TEMP/skin-build463" 73b0aabc81ffec7e14873b1e466c294980ea28fc
          python3 test/libretro_skin_loading_probe.py --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
            --legacy-sources "$RUNNER_TEMP/skin-build463/packages/libretro_internal_bridge/ios" \
            --evidence evidence/skin-loading --label "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libretro-skin-loading-${{ github.sha }}
          path: evidence/skin-loading/
          retention-days: 14
          if-no-files-found: warn
