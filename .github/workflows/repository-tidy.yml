name: Repository tidy — reviewed merged branches and skipped history
run-name: Repository tidy — 7 merged branches, 4 obsolete launchers, old skipped runs
on:
  push:
    branches: [Claude]
    paths:
      - build-utils/maintenance/repository-tidy-2026-11-13.json
      - build-utils/maintenance/actions-cleanup-2026-11-13.json
permissions:
  contents: write
  actions: write
concurrency:
  group: rewindbox-repository-tidy
  cancel-in-progress: false
jobs:
  tidy:
    if: >-
      github.repository == 'TarbleFR/RewindBox' &&
      github.ref == 'refs/heads/Claude' &&
      github.event_name == 'push' &&
      github.event.before == '30ee5beb204a9c972f85c5e9cd249aa341887283' &&
      contains(github.event.head_commit.message, '[repository-tidy-2026-11-13]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Read the exact maintenance commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check cleanup and coordination guards
        run: |
          python3 -m unittest discover -s test -p repository_tidy_test.py -v
          python3 -m unittest discover -s test -p actions_cleanup_test.py -v
          python3 -m unittest discover -s test -p coordination_status_test.py -v
      - name: Remove reviewed merged branches and disable obsolete delivery launchers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -u build-utils/maintenance/tidy_repository.py
          --plan build-utils/maintenance/repository-tidy-2026-11-13.json
          --expected-plan-sha256 04d961766feaf4da4fa266931c798b57732aa7557b440f21982c9801efe29ac9 --execute
      - name: Remove old skipped runs without executed jobs or artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -u build-utils/maintenance/cleanup_actions.py
          --plan build-utils/maintenance/actions-cleanup-2026-11-13.json
          --expected-plan-sha256 ec98e0afab2e32b8ed2ca312560d604f7c6871c9c66ffb2f647e7fbbe0879773 --execute
      - name: Snapshot shared handoffs and active producers
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cleanup-output
          python3 tools/coordination/status.py > cleanup-output/shared-status.json
      - name: Preserve maintenance receipts
        if: always()
        uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        with:
          name: Repository-tidy-${{ github.run_id }}
          path: cleanup-output/
          if-no-files-found: error
          retention-days: 90
      - name: Publish execution summary
        if: always()
        run: |
          if [ -f cleanup-output/summary.md ]; then
            cat cleanup-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f cleanup-output/repository-tidy.json ]; then
            python3 -c 'import json; d=json.load(open("cleanup-output/repository-tidy.json")); print("Repository tidy: " + d["result"]); [print("- " + x["result"] + ": " + x.get("branch", x.get("path", ""))) for x in d["operations"]]' >> "$GITHUB_STEP_SUMMARY"
          fi
