      with:
        path: .ci-cache
        key: neostation-device-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.3-flutter3.47.2-${{ github.sha }}-${{ env.BUILD_NUMBER }}-${{ hashFiles('pubspec.lock',
          'build-utils/Gemfile.dolphin') }}-${{ env.CACHE_NAMESPACE }}
    - name: Upload encrypted IPA and verification reports
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: build/encrypted-delivery/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - name: Collect diagnostic evidence
      if: always()
      run: |
        mkdir -p build/delivery
        cp "$RUNNER_TEMP/neostation-fast-xcodebuild.log" build/delivery/xcodebuild.log 2>/dev/null || true
        cp "$RUNNER_TEMP/flutter-aot-timings.json" build/delivery/flutter-aot-timings.json 2>/dev/null || true

        python3 build-utils/delivery_cipher.py artifact build/delivery build/encrypted-diagnostics
    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}-diagnostics
        path: build/encrypted-diagnostics/
        if-no-files-found: warn
        retention-days: 14
    - name: Remove temporary secrets
      if: always()
      shell: bash
      run: rm -f .dart-defines.json
  cleanup_melonx_branch:
    name: Remove the integrated temporary MeloNX branch
    needs: cold
    if: ${{ github.ref == 'refs/heads/Claude' && needs.cold.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Delete only the exact integrated source branch after successful IPA validation
      run: |-
        python3 - <<'PYTHON'
        import json, os, subprocess
        expected = '254739601c45b5f8f792d7098b46a8b0f40388cb'
        endpoint = 'repos/TarbleFR/RewindBox/git/refs/heads/work/melonx-embedded-20261022'
        subprocess.run(['git','merge-base','--is-ancestor',expected,os.environ['GITHUB_SHA']],check=True)
        current=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
        assert current['object']['sha']==expected, 'Temporary branch advanced; preserve it'
        subprocess.run(['gh','api','--method','DELETE',endpoint],check=True)
        print('Removed only the integrated temporary MeloNX branch; Claude and main preserved.')
        PYTHON
