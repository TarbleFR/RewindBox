name: RewindBox embedded MeloNX • Build 506 • SideStore
run-name: RewindBox Build 506 • ${{ github.sha }} • embedded MeloNX
'on':
  push:
    branches:
    - Claude
    paths:
    - .github/workflows/retroarch-delivery.yml
    - .github/diagnostics/melonx506_delivery.py
    - build-utils/delivery-506-chatgpt-recipient.pem
  workflow_dispatch:
    inputs:
      build_number:
        description: New delivery build number
        required: true
        default: '506'
        type: string
      validation_scope:
        description: Reuse pinned unchanged evidence for the selected candidate scope
        type: choice
        options:
        - full
        - rpcs3_neoswap
        - library_covers
        default: full
      benchmark:
        description: Measure a cold and a cached build on comparable macOS runners
        type: boolean
        default: false
      recipient:
        description: Public key (PEM in build-utils) the encrypted artifact is addressed to; each session decrypts with its own private key
        required: false
        default: build-utils/delivery-506-chatgpt-recipient.pem
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: neostation-retroarch-delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[retroarch-delivery]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - &id001
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Require final exact component proofs and preserve other engines
      run: python3 .github/diagnostics/melonx506_delivery.py
    - name: Verify legal packaging including the added MeloNX notices
      run: python3 test/legal_bundle_preflight_test.py
  native:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[retroarch-delivery]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - *id001
    - name: Require source-built engine, actual simulator runtime and private dependencies
      run: python3 .github/diagnostics/melonx506_delivery.py --source-only
  cold:
    name: Release device build • cold
    runs-on: macos-15
    timeout-minutes: 90
    needs:
    - checks
    - native
    env:
      BUILD_NUMBER: ${{ inputs.build_number || '506' }}
      DELIVERY_RECIPIENT: ${{ inputs.recipient || 'build-utils/delivery-506-chatgpt-recipient.pem' }}
      IPA_NAME: NeoStation
      ARTIFACT_NAME: RewindBox-Build-${{ inputs.build_number || '506' }}-${{ github.sha }}-cold
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      DOLPHIN_CORE_HOST_SHA: ae7d46f90dff64ce698b8c18e0c12510dbae96fe
      ARMSX2_CORE_HOST_SHA: 1343906f05e33b40f10f7026a1a6e2327c338d0e
      ARMSX2_CORE_RUN_ID: '39178893158'
      RPCS3_CORE_HOST_SHA: 28371bd12169af9bf506d9d2cff98e0c13d44f24
      RPCS3_CORE_RUN_ID: '39788462742'
      LIBRETRO_CORES_HOST_SHA: ab9361c29f7c9ab769c4263dd8b7427fc4f4c036
      LIBRETRO_CORES_VALIDATED_SHA: ab9361c29f7c9ab769c4263dd8b7427fc4f4c036
      LIBRETRO_CORES_RUN_ID: '39455712245'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
      DELIVERY_METRICS: ${{ github.workspace }}/build/delivery/timings.jsonl
      CACHE_NAMESPACE: ${{ (inputs.benchmark == true || contains(github.event.head_commit.message, '[benchmark-build]')) && github.run_id || 'normal'
        }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_PATH: ${{ github.workspace }}/build/ruby-gems
      DELIVERY_MODE: cold
    steps:
    - name: Checkout exact candidate
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Require exact successful skin sessions and cheat catalogue/core checks
      run: python3 .github/diagnostics/melonx506_delivery.py --skin-session-evidence --output build/delivery/skin-session-evidence.json
    - name: Select Xcode 26.3 for NeoPlay and Google Cast
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Set up Flutter 3.47.2
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
        cache-key: neostation-benchmark-sdk-${{ runner.os }}-${{ runner.arch }}-3.47.2-${{ env.CACHE_NAMESPACE }}
        pub-cache-key: neostation-benchmark-pub-${{ runner.os }}-${{ runner.arch }}-3.47.2-${{ hashFiles('pubspec.lock') }}-${{ env.CACHE_NAMESPACE
          }}
    - name: Record exact build environment and start measurement
      run: |
        mkdir -p build/delivery
        python3 build-utils/delivery_benchmark.py environment
        python3 .github/diagnostics/melonx506_delivery.py --scope "${{ inputs.validation_scope || 'full' }}"
    - name: Record empty device build cache
      id: state
      uses: actions/cache/restore@v4
      with:
        path: .ci-cache
        key: neostation-device-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.3-flutter3.47.2-${{ github.sha }}-${{ env.BUILD_NUMBER }}-${{ hashFiles('pubspec.lock',
          'build-utils/Gemfile.dolphin') }}-${{ env.CACHE_NAMESPACE }}
    - name: Assert the benchmark device cache is empty
      if: ${{ inputs.benchmark == true || contains(github.event.head_commit.message, '[benchmark-build]') }}
      run: test "${{ steps.state.outputs.cache-hit }}" != true
    - name: Resolve locked Dart dependencies
      run: python3 build-utils/delivery_metrics.py dart_dependencies flutter pub get --enforce-lockfile
    - name: Prepare lightweight build tools
      shell: bash
      run: |
        set -euo pipefail
        export BUNDLE_PATH="$GITHUB_WORKSPACE/build/ruby-gems"
        echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
        python3 build-utils/delivery_metrics.py ruby_dependencies bundle install
    - name: Generate iOS host
      shell: bash
      run: |
        set -euo pipefail
        flutter config --no-enable-swift-package-manager
        test ! -d ios
        python3 build-utils/delivery_metrics.py host_scaffold_and_registrant python3 packages/dolphin_internal_bridge/ci/build_support.py scaffold
    - name: Download validated Build 350 native donor without KartPad
      shell: bash
      run: |
        set -euo pipefail
        # Artifact 10932894067 (run 36323843067) was purged on 7 October 2026.
        # The same Build 350 IPA is published as release 0.0.1. It also holds
        # the old KartPad donor (code translated from Mario Kart Wii), which
        # must never enter this job: only the members the native preparer
        # reuses are fetched by range from its pinned central directory, and
        # their names and hashes must match a pinned aggregate.
        mkdir -p build/native-donor
        python3 build-utils/fetch_native_donor_subset.py build/native-donor/NeoStation.ipa \
          --report build/native-donor/subset-report.json
        python3 build-utils/game_content_gate.py build/native-donor/NeoStation.ipa
    - name: Reuse validated native runtimes
      shell: bash
      run: |
        set -euo pipefail
        # Core/resource bootstrap only. JIT comes exclusively from source below.
        python3 build-utils/prepare_fast_native_runtime.py \
          build/native-donor --build-number "$BUILD_NUMBER"
    - name: Restore unchanged canonical StikJIT compilation interfaces
      id: stik
      uses: actions/cache@v4
      with:
        path: build/stikjit-current
        key: stikjit-interfaces-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('build-utils/stikjit/source.json','build-utils/patch_stikjit_rpcs3.py','build-utils/patch_stikjit_compat.py','build-utils/install_patched_stikjit.py','build-utils/build_patched_stikjit.py')
          }}-37844950677
    - name: Build canonical StikJIT from pinned sources for iOS 18 26 and 27
      shell: bash
      run: |
        set -euo pipefail
        command -v xcodegen || brew install xcodegen
        python3 build-utils/build_patched_stikjit.py 2>&1 | tee "$RUNNER_TEMP/neoswap-stikjit-step.log"
        python3 test/stikjit_unified_build_test.py 2>&1 | tee -a "$RUNNER_TEMP/neoswap-stikjit-step.log"
      if: ${{ steps.stik.outputs.cache-hit != 'true' }}
    - name: Install verified cached StikJIT interfaces
      if: ${{ steps.stik.outputs.cache-hit == 'true' }}
      run: python3 build-utils/install_patched_stikjit.py build/stikjit-current/StikJIT.xcframework
    - name: Require completed exact NeoSwap Core before artifact download
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        python3 - <<'PYCOREWAIT'
        import json,os,subprocess,time
        endpoint='repos/TarbleFR/RewindBox/actions/runs/'+os.environ['RPCS3_CORE_RUN_ID']
        deadline=time.monotonic()+7200
        while True:
            result=json.loads(subprocess.check_output(['gh','api',endpoint]))
            assert result['head_sha']==os.environ['RPCS3_CORE_HOST_SHA'],result
            if result['status']=='completed':
                assert result['conclusion']=='success',result
                print('Verified successful exact NeoSwap Core',result['id'],result['head_sha'])
                break
            assert time.monotonic()<deadline,'NeoSwap Core did not finish within the allowed wait'
            print('Waiting for exact Core',result['id'],result['status'],flush=True)
            time.sleep(30)
        PYCOREWAIT
    - name: Download pinned passive RPCS3 Core
      uses: actions/download-artifact@v4
      with:
        name: RPCS3Core-${{ env.RPCS3_CORE_HOST_SHA }}
        run-id: ${{ env.RPCS3_CORE_RUN_ID }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/rpcs3-native
    - name: Verify and install passive RPCS3 Core
      shell: bash
      run: |
        set -euo pipefail
        SOURCE=dist/rpcs3-native/libRPCS3Core.dylib
        IDENTITY=dist/rpcs3-native/identity.json
        CORE=packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib
        test -s "$SOURCE"
        test -s "$IDENTITY"
        test -s "$CORE"
        # The artifact's source, canonical patch, compiler recipe, binary
        # checks and native ABI must all be from the same Core commit.
        RPCS3_PIN_GUARD=.github/diagnostics/melonx506_delivery.py
        # RPCS3_CORE_INPUTS_BEGIN
        python3 "$RPCS3_PIN_GUARD" --rpc-core-inputs "$RPCS3_CORE_HOST_SHA" -- \
          build-utils/build_rpcs3_embedded_core.sh \
          build-utils/materialize_rpcs3_core.py \
          build-utils/apply_rpcs3_llvm_patch.py \
          build-utils/rpcs3/canonical-source.json \
          build-utils/rpcs3/embedded-core.patch \
          build-utils/rpcs3/llvm-aarch64-ghc-emergency-spill.patch \
          build-utils/rpcs3_core_syntax_gate.py \
          build-utils/validate_rpcs3_embedded_core.py \
          build-utils/validate_rpcs3_passive_dlopen.py \
          build-utils/patch_rpcs3_build301_passive_dlopen.py \
          packages/rpcs3_internal_bridge/ios/Classes/Rpcs3CoreABI.h \
          packages/neo_swap/ios/Classes/NeoSwap.h \
          packages/neo_swap/ios/Classes/NeoSwapClientStats.h \
          packages/neo_swap/ios/Classes/NeoSwapRelay.h \
          native/neoswap/NeoSwapClient.h \
          test/neo_swap_core_pin_test.py \
          test/neoswap_rpcs3_allocator_test.cpp \
          test/neoswap_cpu_buffers_test.cpp \
          test/rpcs3_neoswap_vulkan_buffer_test.py \
          test/native/rpcs3_neoswap_vulkan_buffer_test.cpp \
          test/rpcs3_neoswap_relay_test.py \
          test/native/rpcs3_neoswap_relay_test.cpp \
          test/rpcs3_core_syntax_gate_test.py \
          test/rpcs3_embedded_core_validator_test.py \
          test/rpcs3_preprocessor_balance_test.py \
          test/rpcs3_build301_passive_dlopen_test.py \
          test/rpcs3_atomic_startup_test.py \
          test/rpcs3_failed_startup_test.py \
          test/rpcs3_build264_gow3_core_test.py \
          test/rpcs3_build351_gow3_engine_test.py \
          test/rpcs3_build353_xitrix_v010_test.py \
          test/rpcs3_armsx3_performance_patch_test.py \
          test/rpcs3_build435_core_delta_test.py \
          test/native/rpcs3_build435_core_delta_test.cpp \
          test/rpcs3_build444_core_delta_test.py \
          test/native/rpcs3_build444_core_delta_test.cpp \
          test/rpcs3_build481_spu_object_cache_test.py \
          test/native/rpcs3_build481_spu_object_cache_test.cpp \
          test/native/rpcs3_spu_object_relocation_test.cpp \
          test/rpcs3_build483_llvm_pipeline_test.py \
          test/native/rpcs3_llvm_pipeline_harness.cpp \
          test/rpcs3_build499_spu_audit_test.py \
          test/native/rpcs3_build499_spu_audit_test.cpp \
          test/rpcs3_build487_core_diagnostics_test.py \
          test/native/rpcs3_build487_profiler_helpers_test.cpp \
          test/native/rpcs3_build487_boot_diagnostics_test.cpp \
          test/native/rpcs3_build487_lever_helpers_test.cpp \
          test/native/rpcs3_build487_retention_sequence_test.cpp \
          test/rpcs3_build487_host_diagnostics_test.py \
          test/rpcs3_build258_core_architecture_test.py \
          test/rpcs3_build352_gow3_memory_test.py \
          test/rpcs3_ios_ppu_compile_budget_test.cpp \
          test/rpcs3_ppu_no_size_split_policy_test.cpp \
          test/rpcs3_xitrix_v0101_native_test.py \
          test/rpcs3_xitrix_v011_native_test.py \
          test/native/rpcs3_spu_analyzer_support.h \
          test/native/rpcs3_spu_branch_analyzer_test.cpp \
          test/rpcs3_spu_warmup_test.py \
          test/native/rpcs3_spu_warmup_test.cpp \
          test/native/rpcs3_vk_memory_pressure_test.cpp \
          test/native/rpcs3_vk_conditional_render_test.cpp \
          test/native/rpcs3_neoswap_stats_getter_test.cpp \
          .github/workflows/rpcs3-core.yml \
          native/neoswap-storage/StorageABI.h \
          native/neoswap-storage/Client.h \
          native/neoswap-storage/ShaderKey.h \
          test/rpcs3_shader_storage_test.py \
          test/native/rpcs3_shader_storage_client_test.cpp \
          native/neoswap-storage/SourceABI.h \
          native/neoswap-storage/SourceClient.h \
          native/neoswap-storage/SourceClient.cpp \
          native/neoswap-storage/FrameClient.h \
          native/neoswap-storage/VideoBuffer.h \
          test/rpcs3_video_frame_archive_test.py \
          test/native/rpcs3_video_frame_archive_test.cpp \
          build-utils/run_vdec_archive_validation.sh \
          test/rpcs3_source_archive_test.py \
          test/native/rpcs3_source_archive_client_test.cpp
        # RPCS3_CORE_INPUTS_END
        # The independent host broker/donation is rebuilt by this IPA job.
        # Only the Core source, client ABI, recipe and native tests are pinned.
        # The guard above validates all original Core inputs in an exact ABI view.
        python3 - <<'PY'
        import json, os, shutil, sys
        from pathlib import Path
        sys.path.insert(0, 'build-utils')
        sys.path.insert(0, 'test')
        sys.path.insert(0, '.github/diagnostics')
        from liquid505_delivery import validate_rpc_core_identity as validate_core_input_identity
        from validate_rpcs3_ipa import validate_core_identity
        from validate_rpcs3_embedded_core import validate_core
        from validate_rpcs3_passive_dlopen import validate as validate_passive_dlopen

        source = Path('dist/rpcs3-native/libRPCS3Core.dylib')
        identity_path = Path('dist/rpcs3-native/identity.json')
        destination = Path('packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib')
        data = source.read_bytes()
        identity = validate_core_identity(data, identity_path, os.environ['RPCS3_CORE_HOST_SHA'])
        validate_core(data)
        assert identity['neoswap_client_abi'] == 1, identity
        assert identity['neoswap_client_stats_abi'] == 1, identity
        assert identity['neoswap_relay_abi'] == 1, identity
        assert identity['neoswap_prepared_relay_abi'] == 1, identity
        assert identity['neoswap_relay_client_stats_abi'] == 1, identity
        assert identity['neoswap_storage_abi'] == 1, identity
        assert identity['neoswap_source_archive_abi'] == 1, identity
        validate_core_input_identity(identity)
        passive = validate_passive_dlopen(data)
        assert passive['forbiddenReachability'] is False, passive

        shutil.copy2(source, destination)
        destination.chmod(0o755)
        assert destination.read_bytes() == data, 'RPCS3 Core installation changed artifact bytes'
        fast_path = Path('build/fast-native/identity.json')
        fast = json.loads(fast_path.read_text())
        fast.update({
            'rpcs3CoreSha256': identity['sha256'],
            'rpcs3CoreHostCommit': identity['host_commit'],
            'rpcs3CoreSourceCommit': identity['source_commit'],
            'rpcs3CorePatchSha256': identity['source_patch_sha256'],
            'rpcs3CoreAbiVersion': identity['abi_version'],
            'rpcs3CoreRunId': int(os.environ['RPCS3_CORE_RUN_ID']),
            'rpcs3PassiveDlopen': passive,
        })
        fast_path.write_text(json.dumps(fast, indent=2) + '\n')
        shutil.copy2(identity_path, 'build/fast-native/rpcs3-core-identity.json')
        print(json.dumps({'identity': identity, 'passiveDlopen': passive}, indent=2))
        PY
        file "$CORE"
        test "$(lipo -archs "$CORE")" = arm64
        nm -gU "$CORE" > build/rpcs3-core-exports.txt
        python3 - <<'PY'
        import sys
        from pathlib import Path
        sys.path.insert(0, 'build-utils')
        from validate_rpcs3_ipa import REQUIRED_CORE_SYMBOLS, FORBIDDEN_CORE_SYMBOLS
        exports = Path('build/rpcs3-core-exports.txt').read_text().splitlines()
        symbols = {line.split()[-1] for line in exports if line.split()}
        missing = (set(REQUIRED_CORE_SYMBOLS) | {
            '_rpcs3_ios_set_neoswap_api', '_rpcs3_ios_get_neoswap_client_stats',
            '_rpcs3_ios_install_patch_repository', '_rpcs3_ios_enumerate_runtime_patches',
            '_rpcs3_ios_set_runtime_patch_enabled', '_rpcs3_ios_enumerate_games',
        }) - symbols
        forbidden = set(FORBIDDEN_CORE_SYMBOLS) & symbols
        assert not missing, f'Missing RPCS3 Core exports: {sorted(missing)}'
        assert not forbidden, f'Retired RPCS3 Core exports: {sorted(forbidden)}'
        PY
    - name: Verify retained stable Dolphin Core
      shell: bash
      run: |
        set -euo pipefail
        CORE="packages/dolphin_internal_bridge/ios/Frameworks/DolphinCore.framework/DolphinCore"
        test -s "$CORE"
        test -d ios/Runner/Sys
        test -s ios/Runner/cacert.pem

        # The Build 350 IPA carries the exact previously validated Dolphin
        # runtime. Refuse it if any source defining that ABI has changed.
        git diff --exit-code "$DOLPHIN_CORE_HOST_SHA" "$GITHUB_SHA" -- \
          build-utils/patch_dolphin_internal_core_v2.py \
          packages/dolphin_internal_bridge/core \
          test/dolphin_cheat_manager_test.py \
          test/dolphin_cheats_menu_test.py

        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path

        import subprocess
        recipe = '.github/workflows/dolphin-core.yml'
        original = subprocess.check_output(['git', 'show', os.environ['DOLPHIN_CORE_HOST_SHA'] + ':' + recipe])
        current = Path(recipe).read_bytes()
        assert current == original.replace(b'Checkout exact NeoStation commit', b'Checkout exact RewindBox commit'), 'Unreviewed Dolphin recipe change'

        # This is a recompiled UIKit host API, not the retained core's C ABI.
        # Permit exactly the added navigation callback, preserving every other declaration.
        import subprocess
        menu_path='packages/dolphin_internal_bridge/ios/Classes/DolphinSessionMenu.h'
        original=subprocess.check_output(['git','show',os.environ['DOLPHIN_CORE_HOST_SHA']+':'+menu_path],text=True)
        current=Path(menu_path).read_text()
        for callback in ('openDisplaySettings','openShaderSettings','openTextureSettings'):
            addition='@property(nonatomic, copy, nullable) dispatch_block_t '+callback+';\n'
            assert current.count(addition)==1
            current=current.replace(addition,'')
        # Build 484: the Touch controls page callbacks (UIKit host only).
        touch=('// Build 484: Touch controls page (editor and "hide with a controller").\n'
               '// Without openTouchEditor the root page has no Touch controls row.\n'
               '@property(nonatomic, copy, nullable) dispatch_block_t openTouchEditor;\n'
               '@property(nonatomic, copy, nullable) BOOL (^readTouchHideWithController)(void);\n'
               '@property(nonatomic, copy, nullable) void (^setTouchHideWithController)(BOOL hide);\n')
        assert current.count(touch)==1
        current=current.replace(touch,'')
        assert current==original, 'Unexpected UIKit menu interface change'

        core = Path(
            "packages/dolphin_internal_bridge/ios/Frameworks/"
            "DolphinCore.framework/DolphinCore"
        )
        actual = hashlib.sha256(core.read_bytes()).hexdigest()
        baseline = json.loads(Path("build-utils/baselines/ios-322.json").read_text())
        expected = baseline["nativeIdentity"]["dolphinCoreSha256"]
        assert actual == expected, (actual, expected)
        fast_path = Path("build/fast-native/identity.json")
        fast = json.loads(fast_path.read_text())
        fast["dolphinCoreSha256"] = actual
        fast["dolphinCoreHostCommit"] = os.environ["DOLPHIN_CORE_HOST_SHA"]
        fast["dolphinSourceRevision"] = os.environ["DOLPHIN_SHA"]
        fast["dolphinCheatCatalogues"] = [
            "Gecko/WiiRD", "Action Replay/local INI"
        ]
        fast_path.write_text(json.dumps(fast, indent=2) + "\n")
        print(json.dumps({"sha256": actual, "baseline": expected}, indent=2))
        PY

        file packages/dolphin_internal_bridge/ios/Frameworks/DolphinCore.framework/DolphinCore
        nm -gU packages/dolphin_internal_bridge/ios/Frameworks/DolphinCore.framework/DolphinCore \
          > build/dolphin-native-exports.txt
        for symbol in \
          _neostation_dolphin_initialize \
          _neostation_dolphin_launch \
          _neostation_dolphin_menu_snapshot \
          _neostation_dolphin_cheats_snapshot \
          _neostation_dolphin_set_cheats_enabled \
          _neostation_dolphin_set_cheat_enabled \
          _neostation_dolphin_download_gecko_codes; do
          grep -q " $symbol$" build/dolphin-native-exports.txt
        done
    - name: Require completed exact ARMSX2 2.6 Core and remove its donor bootstrap
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, shutil, subprocess
        endpoint='repos/TarbleFR/RewindBox/actions/runs/'+os.environ['ARMSX2_CORE_RUN_ID']
        result=json.loads(subprocess.check_output(['gh','api',endpoint]))
        assert result['head_sha'] == os.environ['ARMSX2_CORE_HOST_SHA'], result
        assert result['path'] == '.github/workflows/armsx2-core.yml', result
        assert result['status'] == 'completed' and result['conclusion'] == 'success', result
        shutil.rmtree('dist/armsx2')
        PY
    - name: Download pinned ARMSX2 2.6 Core
      uses: actions/download-artifact@v4
      with:
        name: ARMSX2Core-${{ env.ARMSX2_CORE_HOST_SHA }}
        run-id: ${{ env.ARMSX2_CORE_RUN_ID }}
