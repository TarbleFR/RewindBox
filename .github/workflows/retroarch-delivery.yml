    - name: Verify pinned ARMSX2 Core identity
      shell: bash
      run: |
        set -euo pipefail
        test -f dist/armsx2/ARMSX2Core.framework/ARMSX2Core
        test -f dist/armsx2/identity.json
        # Refuse a stale core even when both artifacts report the same ABI.
        git diff --exit-code "$ARMSX2_CORE_HOST_SHA" "$GITHUB_SHA" -- \
          packages/armsx2_internal_bridge/core \
          packages/armsx2_internal_bridge/ios/Classes/ARMSX2CoreABI.h \
          build-utils/armsx2
        python3 - <<'PY'
        import hashlib, json, os
        from pathlib import Path
        identity=json.loads(Path('dist/armsx2/identity.json').read_text())
        source=json.loads(Path('build-utils/armsx2/source.json').read_text())
        assert identity['revision'] == source['revision'], identity
        assert identity['host_commit'] == os.environ['ARMSX2_CORE_HOST_SHA'], identity
        assert identity['architectures'] == ['arm64'], identity
        assert identity['abi_version'] == source['abi_version'] == 8, identity
        assert identity['release'] == source['release'] == 'iOSv2.6.0', identity
        assert identity['shader_chains'] and identity['performance_overlays'], identity
        assert identity['bundled_shader_presets'] == 12 and identity['bundled_shader_files'] == 28, identity
        resources=Path('dist/armsx2/ARMSX2Core.framework/shaders')
        shader_hashes=identity['bundled_shader_sha256']
        assert len(shader_hashes) == identity['bundled_shader_files'], identity
        assert len(list(resources.glob('**/*.slangp'))) == identity['bundled_shader_presets'], identity
        for relative,expected in shader_hashes.items():
            asset=resources/relative
            assert asset.is_file() and hashlib.sha256(asset.read_bytes()).hexdigest() == expected, relative
        binary=Path('dist/armsx2/ARMSX2Core.framework/ARMSX2Core')
        assert hashlib.sha256(binary.read_bytes()).hexdigest() == identity['sha256'], identity
        binary.chmod(0o755)
        fast_path=Path('build/fast-native/identity.json')
        fast=json.loads(fast_path.read_text())
        fast.update(armsx2CoreSha256=identity['sha256'],
                    armsx2CoreHostCommit=identity['host_commit'],
                    armsx2SourceRevision=identity['revision'],
                    armsx2CoreRunId=int(os.environ['ARMSX2_CORE_RUN_ID']))
        fast_path.write_text(json.dumps(fast,indent=2)+'\n')
        print(identity)
        PY
