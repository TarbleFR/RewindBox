        bundle exec ruby build-utils/add_ios_icon_fallback_resources.rb
        python3 build-utils/delivery_metrics.py cocoa_pods env -u BUNDLE_GEMFILE -u BUNDLE_PATH pod install --project-directory=ios
        python3 - <<'PY'
        import plistlib
        from pathlib import Path

        entitlements = plistlib.loads(
            Path('ios/Runner/Runner.entitlements').read_bytes()
        )
        retired = {
            'com.apple.developer.networking.networkextension',
            'com.apple.developer.networking.vpn.api',
        }
        remaining = retired.intersection(entitlements)
        if remaining:
            raise SystemExit(
                'Retired VPN entitlements remain: ' + ', '.join(sorted(remaining))
            )
        generated = (
            Path('ios/Runner.xcodeproj/project.pbxproj').read_text(),
            Path('ios/Podfile').read_text(),
        )
        markers = (
            'NeoStationLocalTunnel',
            'NetworkExtension.framework',
            'com.apple.NetworkExtensions.iOS',
            'packet-tunnel-provider',
        )
        found = [marker for marker in markers if any(marker in text for text in generated)]
        if found:
            raise SystemExit('Generated iOS host retains internal VPN markers: ' + ', '.join(found))
        if Path('ios/NeoStationLocalTunnel').exists():
            raise SystemExit('Generated iOS host retains the internal VPN directory')
        print('Generated iOS host is LocalDevVPN-only.')
        PY
        git diff --exit-code -- pubspec.yaml pubspec.lock
