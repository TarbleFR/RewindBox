            --build-number "$BUILD_NUMBER" --expect-absent
        fi
        cp build/fast-native/identity.json dist/fast-native-identity.json
        cp build/fast-native/rpcs3-core-identity.json dist/rpcs3-core-identity.json
        python3 build-utils/validate_neoplay_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --commit "$GITHUB_SHA" --report dist/neoplay-validation.json
        shasum -a 256 dist/*.ipa | tee "dist/$IPA_NAME.sha256"
