    - name: Compile every external display plugin source for iPhone
      if: ${{ !cancelled() && inputs.validation_scope != 'rpcs3_neoswap' && inputs.validation_scope != 'library_covers' && steps.libretro-evidence.outputs.reused == 'false' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/delivery/external-display
        flutter precache --ios
        root="${FLUTTER_ROOT:-$(cd "$(dirname "$(command -v flutter)")/.." && pwd)}"
        xcframework="$root/bin/cache/artifacts/engine/ios/Flutter.xcframework"
        slice="$xcframework/ios-arm64"
        if [ ! -f "$slice/Flutter.framework/Flutter" ]; then
          slice="$(find "$xcframework" -maxdepth 1 -type d -name 'ios-arm64*' ! -name '*simulator*' | head -n 1)"
        fi
        test -f "$slice/Flutter.framework/Flutter" || { echo "Flutter device slice missing under $xcframework (flutter precache --ios)"; exit 1; }
        sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
        sources=(packages/external_display/ios/Classes/*.m)
        test -f "${sources[0]}" || { echo 'No Objective-C source in packages/external_display/ios/Classes'; exit 1; }
        status=0
        for source in "${sources[@]}"; do
          if xcrun clang -fsyntax-only -x objective-c -fobjc-arc -fmodules -Wall -arch arm64 -isysroot "$sdk" -miphoneos-version-min=17.4 \
              -F "$slice" -I packages/external_display/ios/Classes "$source" 2>>build/delivery/external-display/iphone-arm64-syntax.txt; then
            echo "ok     $source"
          else
            echo "FAILED $source"
            status=1
          fi
        done
        cat build/delivery/external-display/iphone-arm64-syntax.txt
        exit "$status"
