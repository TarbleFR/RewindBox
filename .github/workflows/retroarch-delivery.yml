name: NeoStation RetroArch • Build 488 • SideStore
# The closed evidence reader captures historical ANSI-bearing logs privately.
run-name: NeoStation Build ${{ inputs.build_number || '488' }} • ${{ github.sha }} • embedded libretro
'on':
  push:
    branches:
    - Claude
    paths:
    - .github/workflows/retroarch-delivery.yml
  workflow_dispatch:
    inputs:
      build_number:
        description: New delivery build number
        required: true
        default: '488'
        type: string
      validation_scope:
        description: Reuse pinned unchanged evidence for the selected candidate scope
        type: choice
        options: [full, rpcs3_neoswap, library_covers]
        default: full
      benchmark:
        description: Measure a cold and a cached build on comparable macOS runners
        type: boolean
        default: false
      recipient:
        description: Public key (PEM in build-utils) the encrypted artifact is addressed to; each session decrypts with its own private key
        required: false
        default: build-utils/delivery-424-recipient.pem
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: neostation-retroarch-delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: ${{ github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[retroarch-delivery]') && !contains(github.event.head_commit.message, '[retroarch-relaunch-only]') && !contains(github.event.head_commit.message, '[retroarch-source-proof]') && !contains(github.event.head_commit.message, '[retroarch-receiver-ipa]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
    - &id001
      name: Checkout exact candidate
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Reuse successful unchanged Dart validation
      id: dart-cache
      if: ${{ inputs.validation_scope != 'rpcs3_neoswap' && inputs.validation_scope != 'library_covers' }}
      uses: actions/cache@v4
      # The key also covers the native files some Dart tests read (the bridge's
      # Objective-C sources and headers, the cores manifest, NeoSwap's canonical
      # settings catalogue), plus this test recipe, so an input-only
      # change re-runs them instead of reusing an older result. The same
      # expression is recorded and re-checked below.
      with:
        path: build/delivery/dart-validation.json
        key: neostation-validation-v1-ubuntu24.04-${{ runner.arch }}-flutter3.47.2-${{ hashFiles('lib/**','packages/**/*.dart','packages/**/pubspec.yaml','assets/**','test/**/*.dart','pubspec.lock','pubspec.yaml','packages/libretro_internal_bridge/ios/Classes/*.m','packages/libretro_internal_bridge/ios/Classes/*.h','build-utils/libretro/cores.json','native/neoswap/localizations.json','.github/workflows/retroarch-delivery.yml')
          }}
    - name: Reuse exact successful Dart phases before rerunning changed pipeline guards
      id: dart-evidence
      if: ${{ inputs.validation_scope != 'rpcs3_neoswap' && inputs.validation_scope != 'library_covers' }}
      env:
        DART_VALIDATION_KEY: neostation-validation-v1-ubuntu24.04-${{ runner.arch }}-flutter3.47.2-${{ hashFiles('lib/**','packages/**/*.dart','packages/**/pubspec.yaml','assets/**','test/**/*.dart','pubspec.lock','pubspec.yaml','packages/libretro_internal_bridge/ios/Classes/*.m','packages/libretro_internal_bridge/ios/Classes/*.h','build-utils/libretro/cores.json','native/neoswap/localizations.json','.github/workflows/retroarch-delivery.yml')
          }}
      run: |
        if [ "${{ steps.dart-cache.outputs.cache-hit }}" = 'true' ]; then
          echo 'cache-hit=true' >> "$GITHUB_OUTPUT"
        else
          python3 .github/diagnostics/hdtex488_delivery.py --dart-evidence --output build/delivery/dart-validation.json
          echo 'cache-hit=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
      if: ${{ inputs.validation_scope == 'rpcs3_neoswap' || steps.dart-evidence.outputs.cache-hit != 'true' }}
    - name: Verify closed validation input tree and previous CI success
      run: python3 .github/diagnostics/hdtex488_delivery.py --scope "${{ inputs.validation_scope || 'full' }}"
    - name: Analyze the changed integration and its restored dependencies
      run: |-
        flutter pub get --enforce-lockfile
        flutter analyze --no-fatal-infos
      if: ${{ inputs.validation_scope != 'rpcs3_neoswap' && inputs.validation_scope != 'library_covers' && steps.dart-evidence.outputs.cache-hit != 'true' }}
    - name: Reproduce the seven-root registration defect on the unchanged 422 code
      if: ${{ inputs.validation_scope != 'rpcs3_neoswap' && inputs.validation_scope != 'library_covers' && steps.dart-evidence.outputs.cache-hit != 'true' }}
      run: |
        python3 - <<'PYTHON'
        import json,subprocess
        from pathlib import Path
        source=Path('lib/providers/sqlite_config_provider/scanning.dart')
        candidate=source.read_bytes()
        try:
            source.write_bytes(subprocess.check_output(['git','show','00285ba5cfec694d59e1ca2bcf9de31418fd4e1a:'+str(source)]))
            result=subprocess.run(['flutter','test','--machine','test/rom_folder_registration_test.dart','--plain-name','seven old roots do not block a new RetroArch folder or its games'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            lines=[]
            for line in result.stdout.splitlines():
                try: lines.append(json.loads(line))
                except json.JSONDecodeError: pass
            failures=[x for x in lines if isinstance(x,dict) and x.get('type')=='error' and 'NEW_RETROARCH_ROOT_NOT_REGISTERED' in x.get('error','')]
            if result.returncode==0 or not failures:
                print(result.stdout)
                raise SystemExit('Expected registration failure was not reproduced; refusing the IPA')
            Path('build/delivery/folder-cap-reproduction.json').write_text(json.dumps({'baseline':'00285ba5cfec694d59e1ca2bcf9de31418fd4e1a','existingRootCount':7,'expectedFailureObserved':True,'errors':failures},indent=2))
            print('Confirmed: Build422 refuses the eighth root before scanning. Candidate restored for validation.')
        finally:
            source.write_bytes(candidate)
        PYTHON
    - name: Validate changed library, callback, launch and restart behavior
      run: |
        flutter test test/rom_folder_registration_test.dart test/library_scan_restart_test.dart test/retroarch_library_protocol_test.dart test/retroarch_library_cache_test.dart test/retroarch_launch_diagnostics_test.dart test/retroarch_sync_locale_test.dart test/rom_scan_symlink_alias_test.dart test/rom_scan_emulator_default_test.dart test/ios_selective_rollback_test.dart test/armsx2_retroarch_routing_isolation_test.dart test/game_repository_test.dart test/system_repository_test.dart test/config_repository_test.dart test/scraper_repository_test.dart test/sqlite_database_service_hidden_files_test.dart test/ios_rom_library_root_resolver_test.dart test/libretro_locale_test.dart test/libretro_core_catalog_test.dart test/frontend_media_gate_test.dart test/rpcs3_embedded_identity_test.dart test/libretro_skin_service_test.dart test/libretro_skin_catalog_test.dart test/libretro_skin_catalogs_test.dart test/libretro_skin_catalog_audit_test.dart test/libretro_skin_manager_test.dart test/libretro_playlist_actions_test.dart test/ios_library_root_relocation_test.dart test/neostation_rom_library_test.dart test/header_battery_test.dart
        # Build 437 reading Library: services, catalogue import, readers, sections,
        # hub and the 12-locale catalog checks (the live source check skips itself).
        flutter test test/library_*_test.dart
        # Donation settings and the canonical twelve-locale catalogue changed.
        flutter test test/neo_swap_locale_test.dart test/neo_swap_channel_test.dart test/neo_swap_dialog_test.dart
        # Build 447: storage analysis and cleanup (services, picker copies,
        # pages, Tools row and 12-locale catalog; docs/storage-audit-cleanup.md).
        flutter test test/storage_*_test.dart
        # Build 448 (docs/build448-plan.md): ambient music manager and its
        # settings rows, Consoles tab catalog and built-in engine policy, skin
        # browser texts, encrypted 3DS game check; then the real SoLoud render
        # of 21 loops of the bundled asset (C++ harness against the resolved
        # flutter_soloud sources) and the game audio hand-off harness.
        flutter test test/ambient_music_service_test.dart test/ambient_music_locale_test.dart test/home_music_silent_mode_test.dart test/console_manager_test.dart test/skin_browser_locale_test.dart test/libretro_3ds_encrypted_launch_test.dart
        python3 test/ambient_music_loop_test.py
        python3 test/game_audio_handoff_test.py
        # Build 442: Wii phone-shake sensitivity panel (Dolphin external
        # display and pacing run natively in dolphin-motion-check).
        # Build 440: Wii Shake catalog, RAP licences, consoles tab, 120 Hz
        # interface, BIOS checker and Embedded RetroArch settings (the reader
        # Back button and Library source files are in test/library_*).
        flutter test test/dolphin_shake_locale_test.dart test/dolphin_wii_motion_panel_test.dart test/rpcs3_save_exchange_service_test.dart test/rpcs3_saves_locale_test.dart test/rpcs3_rap_licence_service_test.dart test/rpcs3_rap_locale_test.dart test/rpcs3_rap_import_menu_test.dart test/rpcs3_firmware_library_test.dart test/rpcs3_internal_integration_test.dart test/rpcs3_save_export_contract_test.dart test/rpcs3_lazy_load_contract_test.dart test/nav_tabs_test.dart test/main_menu_tab_strip_test.dart test/libretro_main_menu_test.dart test/libretro_consoles_tab_test.dart test/frame_cadence_estimator_test.dart test/ui_refresh_rate_service_test.dart test/ui_refresh_rate_locale_test.dart test/general_settings_ui_refresh_rate_test.dart test/notification_bell_idle_test.dart test/libretro_bios_catalog_test.dart test/libretro_bios_check_service_test.dart test/libretro_bios_checker_screen_test.dart test/libretro_bios_launch_test.dart test/jit_backend_preference_service_test.dart test/libretro_engine_settings_test.dart test/gamepad_settings_scrolling_test.dart test/armsx2_embedded_library_contract_test.dart test/external_display_locale_test.dart test/external_display_service_test.dart test/external_display_unsupported_engine_test.dart test/external_display_games_list_test.dart test/general_settings_external_display_test.dart test/external_menu_screen_test.dart test/libretro_3ds_language_test.dart test/libretro_core_option_store_test.dart test/libretro_3ds_system_data_service_test.dart test/libretro_3ds_system_screen_test.dart test/libretro_3ds_launch_default_test.dart test/libretro_session_probe_codec_test.dart test/libretro_resolution_test.dart test/libretro_resolution_screen_test.dart
        python3 - <<'PY'
        import json,os
        from pathlib import Path
        Path("build/delivery/dart-validation.json").write_text(json.dumps({"result":"passed","testedSHA":os.environ["GITHUB_SHA"],"key":"neostation-validation-v1-ubuntu24.04-${{ runner.arch }}-flutter3.47.2-${{ hashFiles('lib/**','packages/**/*.dart','packages/**/pubspec.yaml','assets/**','test/**/*.dart','pubspec.lock','pubspec.yaml','packages/libretro_internal_bridge/ios/Classes/*.m','packages/libretro_internal_bridge/ios/Classes/*.h','build-utils/libretro/cores.json','native/neoswap/localizations.json','.github/workflows/retroarch-delivery.yml') }}","tool":"Flutter 3.47.2, Ubuntu 24.04"}))
        PY
      if: ${{ inputs.validation_scope != 'rpcs3_neoswap' && inputs.validation_scope != 'library_covers' && steps.dart-evidence.outputs.cache-hit != 'true' }}
    - name: Verify reused Dart evidence and targeted UI provenance
      if: ${{ inputs.validation_scope != 'rpcs3_neoswap' && inputs.validation_scope != 'library_covers' }}
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        record=json.loads(Path('build/delivery/dart-validation.json').read_text())
        assert record['result']=='passed'
        assert record['key']
        assert record['tool']=='Flutter 3.47.2, Ubuntu 24.04'
        assert record['key']=='neostation-validation-v1-ubuntu24.04-${{ runner.arch }}-flutter3.47.2-${{ hashFiles('lib/**','packages/**/*.dart','packages/**/pubspec.yaml','assets/**','test/**/*.dart','pubspec.lock','pubspec.yaml','packages/libretro_internal_bridge/ios/Classes/*.m','packages/libretro_internal_bridge/ios/Classes/*.h','build-utils/libretro/cores.json','native/neoswap/localizations.json','.github/workflows/retroarch-delivery.yml') }}'
        print('Dart tests validated at',record['testedSHA'],'; exact locked input key verified')
        PY
        # Scope, prior native evidence and the new UI witness were verified
        # above. New composition guard unit tests already passed locally;
        # do not repeat successful unchanged checks during IPA compilation.
    - name: Validate only changed RPCS3 and NeoSwap contracts
      if: ${{ inputs.validation_scope == 'rpcs3_neoswap' }}
      shell: bash
      run: |
        set -euo pipefail
        flutter pub get --enforce-lockfile
        flutter analyze --no-fatal-infos packages/neo_swap lib/l10n/neoswap_locale.dart lib/screens/settings_screen/neoswap_dialog.dart
        flutter test test/neo_swap_locale_test.dart test/neo_swap_channel_test.dart test/neo_swap_dialog_test.dart test/rpcs3_embedded_identity_test.dart test/rpcs3_internal_integration_test.dart test/rpcs3_save_export_contract_test.dart test/rpcs3_lazy_load_contract_test.dart
        python3 test/delivery_pipeline_test.py
        python3 test/neo_swap_core_pin_test.py --source-only
        # These two host contracts use no macOS signing/project fixture.
        python3 test/neoswap_donor_contract_test.py DonorContractTests.test_ipa_validator_matches_single_relay_lifecycle_ownership DonorContractTests.test_rpcs3_waits_before_first_map_and_uses_session_scoped_adaptive_pool
        python3 test/rpcs3_neoswap_build_comparison_test.py
        python3 test/localization_12_locale_coverage_test.py
        python3 - <<'PYTHON'
        import json,os
        from pathlib import Path
        Path('build/delivery/neoswap-host-validation.json').write_text(json.dumps({
            'result':'passed','testedSHA':os.environ['GITHUB_SHA'],
            'scope':'rpcs3_neoswap','tool':'Flutter 3.47.2, Ubuntu 24.04',
            'historicalEvidence':'reused-validation.json','deviceGameplayValidated':False},indent=2)+'\n')
        PYTHON
    - name: Validate changed library covers and the closed delivery gate
      if: ${{ inputs.validation_scope == 'library_covers' }}
      shell: bash
      run: |
        set -euo pipefail
        flutter pub get --enforce-lockfile
        flutter analyze --no-fatal-infos lib/widgets/library_book_cover.dart lib/screens/library_screen/library_screen.dart test/library_book_cover_test.dart test/library_ui_hub_test.dart
        flutter test test/library_book_cover_test.dart test/library_ui_hub_test.dart test/library_ui_hub_open_test.dart
        python3 test/library_cover_delivery_test.py
        python3 test/delivery_pipeline_test.py DeliveryPipeline.test_targeted_lane_checks_changed_native_inputs_and_separates_evidence
        python3 - <<'PYTHON'
        import hashlib,json,os,subprocess
        from pathlib import Path
        paths=['lib/widgets/library_book_cover.dart','lib/screens/library_screen/library_screen.dart',
               'test/library_book_cover_test.dart','test/library_ui_hub_test.dart','test/library_ui_hub_open_test.dart',
               'test/library_cover_delivery_test.py','test/delivery_pipeline_test.py',
               'build-utils/verify_delivery_reuse.py','.github/workflows/retroarch-delivery.yml','pubspec.lock','pubspec.yaml']
        Path('build/delivery/library-covers-validation.json').write_text(json.dumps({
            'result':'passed','testedSHA':os.environ['GITHUB_SHA'],'scope':'library_covers',
            'tool':json.loads(subprocess.check_output(['flutter','--version','--machine'])),
            'runner':'ubuntu-24.04','historicalEvidence':'reused-validation.json',
            'inputsSHA256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
            'deviceGameplayValidated':False},indent=2)+'\n')
        PYTHON
    - name: Preserve validation provenance
      uses: actions/upload-artifact@v4
      with:
        name: NeoStation-${{ inputs.build_number || '488' }}-validation-${{ github.sha }}
        path: build/delivery/
        if-no-files-found: error
        retention-days: 14
  native:
    if: ${{ github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[retroarch-delivery]') && !contains(github.event.head_commit.message, '[retroarch-relaunch-only]') && !contains(github.event.head_commit.message, '[retroarch-source-proof]') && !contains(github.event.head_commit.message, '[retroarch-receiver-ipa]')) }}
    runs-on: macos-15
    # Room for the frontend, shader (possibly with a Metal toolchain download)
    # and iPhone compile-and-link checks added to the Swift and host checks,
    # and for the channel codec test in the iOS Simulator (Build 454).
    timeout-minutes: 50
    steps:
    - *id001
    - name: Select Xcode 26.3 for NeoPlay and Google Cast
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Verify exact Build 440 inputs before targeted native reuse
      if: ${{ inputs.validation_scope == 'rpcs3_neoswap' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 build-utils/verify_delivery_reuse.py --scope rpcs3_neoswap
    - name: Verify exact Build 442 inputs and successful native evidence
      if: ${{ inputs.validation_scope == 'library_covers' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 build-utils/verify_delivery_reuse.py --scope library_covers --output build/delivery/library-covers-native-reuse.json
    - name: Download exact Build 442 native toolchain and input record
      if: ${{ inputs.validation_scope == 'library_covers' }}
      uses: actions/download-artifact@v4
      with:
        name: NeoStation-442-neoswap-native-e8808dd32301f71fdd421a70c0ac6be2ed6fba47
        run-id: 38170927050
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: build/delivery/build442-native
    - name: Verify reused native toolchain and exact runtime inputs
      if: ${{ inputs.validation_scope == 'library_covers' }}
      run: |
        python3 - <<'PYTHON'
        import hashlib,json,subprocess
        from pathlib import Path
        record=json.loads(Path('build/delivery/build442-native/identity.json').read_text())
        assert record['result']=='passed'
        assert record['testedSHA']=='e8808dd32301f71fdd421a70c0ac6be2ed6fba47'
        assert record['xcode']==subprocess.check_output(['xcodebuild','-version'],text=True).strip()
        assert record['iphoneSDK']==subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-version'],text=True).strip()
        # Only the delivery guards changed; their new tests run in checks.
        guards={'.github/workflows/retroarch-delivery.yml','build-utils/verify_delivery_reuse.py','test/delivery_pipeline_test.py'}
        assert len(record['inputsSHA256'])>30
        for path,digest in record['inputsSHA256'].items():
            if path not in guards:
                assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
        print('Native tests reused from Build 442; exact runtime inputs, Xcode and iPhone SDK verified')
        PYTHON
    - name: Preserve reused native evidence
      if: ${{ inputs.validation_scope == 'library_covers' }}
      uses: actions/upload-artifact@v4
      with:
        name: NeoStation-${{ inputs.build_number || '488' }}-native-reuse-${{ github.sha }}
        path: build/delivery/
        if-no-files-found: error
        retention-days: 14
    - name: Reuse unchanged NeoSwap and the validated unified native bridge
      if: ${{ inputs.validation_scope != 'library_covers' && inputs.validation_scope != 'rpcs3_neoswap' }}
      id: neoswap-evidence
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 .github/diagnostics/hdtex488_delivery.py --libretro-evidence --output build/delivery/neoswap/identity.json
        echo 'reused=true' >> "$GITHUB_OUTPUT"
    - name: Validate changed RPCS3 NeoSwap allocators and iPhone control plane
      if: ${{ inputs.validation_scope != 'library_covers' && steps.neoswap-evidence.outputs.reused != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/delivery/neoswap "$RUNNER_TEMP/neoswap-delivery-include"
        ln -s "$GITHUB_WORKSPACE/native/neoswap-donation" "$RUNNER_TEMP/neoswap-delivery-include/Donation"
        ln -s "$GITHUB_WORKSPACE/native/neoswap-relay" "$RUNNER_TEMP/neoswap-delivery-include/Relay"
        ln -s "$GITHUB_WORKSPACE/packages/neo_swap/ios/Classes" "$RUNNER_TEMP/neoswap-delivery-include/neo_swap"
        # New allocator inputs cannot inherit earlier native results. Execute
        # production best-fit, lifetime and demand logic on the selected Xcode.
        common=(-std=c++20 -O1 -g -Wall -Wextra -Werror -pthread -fsanitize=address,undefined)
        includes=(-I"$RUNNER_TEMP/neoswap-delivery-include" -Ipackages/neo_swap/ios/Classes -Inative/neoswap)
        xcrun clang++ "${common[@]}" native/neoswap-donation/Pool.cpp \
          test/neoswap_pool_fragmentation_test.cpp -o "$RUNNER_TEMP/neoswap-pool-fragmentation"
        "$RUNNER_TEMP/neoswap-pool-fragmentation" 2>&1 | tee build/delivery/neoswap/pool.txt
        xcrun clang++ "${common[@]}" "${includes[@]}" native/neoswap-donation/Pool.cpp \
          test/neoswap_preparation_test.cpp -o "$RUNNER_TEMP/neoswap-preparation"
        "$RUNNER_TEMP/neoswap-preparation" 2>&1 | tee build/delivery/neoswap/preparation.txt
        xcrun clang++ "${common[@]}" "${includes[@]}" -DNEOSWAP_DONATION=1 \
          native/neoswap-donation/Broker.cpp native/neoswap-donation/Pool.cpp \
          packages/neo_swap/ios/Classes/NeoSwap.cpp test/neoswap_demand_test.cpp \
          -o "$RUNNER_TEMP/neoswap-demand"
        "$RUNNER_TEMP/neoswap-demand" 2>&1 | tee build/delivery/neoswap/demand.txt
        xcrun clang++ "${common[@]}" native/neoswap-relay/Backend.cpp \
          native/neoswap-donation/Broker.cpp test/relay_backend_test.cpp \
          -o "$RUNNER_TEMP/neoswap-relay-backend"
        "$RUNNER_TEMP/neoswap-relay-backend" 2>&1 | tee build/delivery/neoswap/relay-backend.txt
        xcrun clang++ "${common[@]}" "${includes[@]}" -DNEOSWAP_TESTING -DNEOSWAP_RELAY=1 \
          packages/neo_swap/ios/Classes/NeoSwap.cpp native/neoswap-relay/Backend.cpp \
          native/neoswap-donation/Broker.cpp test/neoswap_relay_loans_test.cpp \
          -o "$RUNNER_TEMP/neoswap-relay-loans"
        "$RUNNER_TEMP/neoswap-relay-loans" 2>&1 | tee build/delivery/neoswap/relay-loans.txt
        xcrun clang++ "${common[@]}" "${includes[@]}" -Ipackages/rpcs3_internal_bridge/ios/Classes \
          test/neoswap_usage_policy_test.cpp -o "$RUNNER_TEMP/neoswap-usage-policy"
        "$RUNNER_TEMP/neoswap-usage-policy" 2>&1 | tee build/delivery/neoswap/usage-policy.txt
        xcrun clang++ "${common[@]}" "${includes[@]}" test/neoswap_budget_test.cpp \
          -o "$RUNNER_TEMP/neoswap-budget"
        "$RUNNER_TEMP/neoswap-budget" 2>&1 | tee build/delivery/neoswap/budget.txt
        # Executes all twelve Foundation catalogues and compiles the actual
        # UIKit memory graph for arm64 iPhone; no device runtime claim.
        python3 test/rpcs3_neoswap_localizations_test.py 2>&1 | tee build/delivery/neoswap/overlay-locales.txt
        # Flutter messaging is declared by the existing test header. All
        # allocator, IPC and plugin sources below are the canonical originals;
        # production donation/relay/storage branches are enabled together.
        SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
        xcrun clang++ -x objective-c++ -std=c++20 -fobjc-arc -fblocks -Wall -Wextra -Werror -fsyntax-only \
