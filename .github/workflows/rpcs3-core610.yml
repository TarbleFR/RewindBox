# RPCS3 Core producer on Claude; the current version comes from core-build.json.
# [rpcs3-core-build] compiles the canonical source and validates its binary/ABI.
# Deep Apple regression suites are not part of the normal compilation route.
# The private IPA consumes the authenticated Core artifact without recompiling it.
# Core compile request: Core 935 (core-build.json build 935, canonical patch 05c365a4), request 1 (heat and energy lot of the IPA 726 device logs, Black Ops II flip done replay, ARMSX3 iOS 0.0.2 (3) canary patches, RPCS3 upstream fixes; codegen identities unchanged; compile only).
# Core compile request: Core 936 (core-build.json build 936, canonical patch 7327095e), request 1 (Core 935, compiled by run 43490423702, plus the second part of the heat and energy lot: texture pre-hash pause, wake census and PPU wait-site probes; codegen identities unchanged; compile only).
# Core compile request: Core 937 (core-build.json build 937, canonical patch 92786a69), request 1 (Core 936, compiled by run 43526948724 and pinned, plus the third part of the heat and energy lot: the polling GETLLAR wait under the self-validating idle backoff, chosen around process_mfc_cmd; codegen identities unchanged; compile only).
# Core compile request: Core 938 (core-build.json build 938, canonical patch 7367a3ef), request 1 (Core 937 plus the fourth part of the heat and energy lot: long idle of the RSX park and SPU memory of a long busy freeze; codegen identities unchanged; compile only).
# Core compile request: Core 939 (core-build.json build 939, canonical patch 4922a89d), request 1 (Core 938, compiled by run 43574977307 and pinned, plus the IPA 745 lot: asynchronous shader compilation by default with a one-time migration of the global value, the 256 MiB pipeline cache limit, the glslang prewarm, the guest memory of the Black Ops II freeze, and the heat part: idle SPU pollers wait longer and sleep on the efficiency cores, the God of War III pre-validation worker leaves the PPU class, WFE and other-thread probes; codegen identities unchanged by an exact SPUThread.cpp alias)
# Core compile request: Core 939 (core-build.json build 939, canonical patch 53790583), request 2 (the fixes of the adversarial review of request 1, run 43788845920: no yield for a skipped draw on iOS, the shader worker stops between builds at teardown, deferred builds keep their origin, the freeze capture limited to Black Ops II with numbered files, a free-space check and fault-free copies, the utility class of idle SPU pollers only under a light load with a self-check; codegen identities unchanged by an exact SPUThread.cpp alias)
# Core compile request: Core 940 (core-build.json build 940, canonical patch 55552845), request 1 (Core 939 request 2, compiled by run 43794178205 and pinned, plus the IPA 756 lot: the Black Ops II freeze fix as a guarded patch of the r_draw_* SPU images on the exact executable, the WFE sleep without CLREX after a self-test, the reservation-lost wait under the idle backoff, and the work interval probe; codegen identities unchanged by an exact SPUThread.cpp alias)
# Core compile request: Core 940 (core-build.json build 940, canonical patch 0c4d0ed1), request 2 (request 1, stopped by run 43838124437 at the iOS syntax gate, with the work interval log channel moved to file scope in RPCS3IOS.cpp)
# Core compile request: Core 941 (core-build.json build 941, canonical patch 922b95cf), request 1 (Core 940 request 2, compiled by run 43841141271 and pinned, plus the heat lot of the IPA 760 logs: the light-load class of the PPU, SPU and RSX threads, the RSX idle park slices and the grace event waits; no codegen input changes)
# Core compile request: Core 941 (core-build.json build 941, canonical patch b40913ed), request 2 (the fixes of the independent review of request 1, run 43922916468: guest flips as the frame count, exit on a busy thread, reference rate following upwards, early load exits blamed, a state check asked of every PPU and SPU thread on leaving, the Metal compile queue of a demoted interactive thread kept, the RSX grace turns bounded in time)
# Core compile request: Core 942 (core-build.json build 942, canonical patch c3e20c37), request 1 (Core 941 request 2, compiled by run 43929679850 and pinned, plus the God of War III lot of the IPA 760 logs: the scoped revalidation of CPU image transfers, FXAA at presentation while the MLAA bypass is applied, the code words of the profile captures; reviewed independently before this request; no codegen input changes)
# Core compile request: Core 943 (core-build.json build 943, canonical patch dc890982), request 1 (Core 942 request 1, compiled by run 43950007115 and pinned, plus the lot of the IPA 763 logs: the God of War III wait loop sleep, the frame work interval of the PPU and RSX threads, MoltenVK's encoding in the SPU threads' class and the PPU short wait floor for Black Ops II, the scheduler and texture validation censuses; reviewed independently before this request; no codegen input changes)
# Core compile request: Core 944 (core-build.json build 944, canonical patch 97e47ec5), request 1 (Core 943 request 1, compiled by run 44012653815 and pinned, plus the lot of the IPA 767 logs: the PPU suspension of waiting threads without acknowledgment, the PUT horizon for Black Ops II and the PPU short wait floor for God of War III; reviewed independently three times before this request; no codegen input changes)
name: RPCS3 Core
# run-name is evaluated before any job and cannot read the spec; the build
# number is in the step names, the artifact names and the identity type.
run-name: "RPCS3 Core producer • ${{ github.sha }}"
'on':
  push:
    branches: [Claude]
    paths:
      - '.github/workflows/rpcs3-core610.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact full commit SHA, equal to the selected workflow ref
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: rewindbox-rpcs3-core-${{ github.sha }}
  cancel-in-progress: false
env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
jobs:
  core:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rpcs3-core-build]') }}
    name: RPCS3 iPhone Core with authenticated source-built MoltenVK
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Bind the request to exact source identities
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" == "$GITHUB_SHA" ]]
      - name: Checkout immutable candidate and retained source history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the declared Core build
        id: core-build
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/diagnostics/rpcs3_core610.py --github-outputs | tee -a "$GITHUB_OUTPUT"
      - name: Select the retained Core toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Restore compiler objects of the same frozen recipe
        id: candidate-objects
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/Library/Caches/ccache
          key: rpcs3-mvk-cache-arm64-xcode26.3-llvm22-${{ hashFiles('build-utils/build_rpcs3_embedded_core.sh','build-utils/rpcs3/llvm-aarch64-ghc-emergency-spill.patch') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rpcs3-mvk-cache-arm64-xcode26.3-llvm22-${{ hashFiles('build-utils/build_rpcs3_embedded_core.sh','build-utils/rpcs3/llvm-aarch64-ghc-emergency-spill.patch') }}-
      - name: Authenticate the Core ${{ steps.core-build.outputs.build }} source closure and the native dependency
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RPCS3_MVK_DEPENDENCY_RUN: ${{ steps.core-build.outputs.dependency_run }}
          RPCS3_MVK_DEPENDENCY_SOURCE: ${{ steps.core-build.outputs.dependency_source }}
        run: |
          set -euo pipefail
          mkdir -p build/rpcs3-core-diagnostics
          git diff --check
          for formula in ccache ninja cmake llvm@22 ffmpeg; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          SOURCE="$RUNNER_TEMP/rpcs3-core-source-preflight"
          git init -q "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/XITRIX/rpcs3.git
          UPSTREAM=$(python3 -c 'import json; print(json.load(open("build-utils/rpcs3/canonical-source.json"))["upstream_commit"])')
          git -C "$SOURCE" fetch --depth 1 origin "$UPSTREAM"
          git -C "$SOURCE" checkout -q --detach FETCH_HEAD
          python3 build-utils/materialize_rpcs3_core.py "$SOURCE"
          CXX="$(brew --prefix llvm@22)/bin/clang++" \
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
          HOST_MACOS_SDK="$(xcrun --sdk macosx --show-sdk-path)" \
          LLVM_CONFIG="$(brew --prefix llvm@22)/bin/llvm-config" \
          LLVM_DIR="$(brew --prefix llvm@22)/lib/cmake/llvm" \
            python3 .github/diagnostics/rpcs3_core610.py \
              --prepare --source "$SOURCE" \
              --dependency-run "$RPCS3_MVK_DEPENDENCY_RUN" --dependency-source "$RPCS3_MVK_DEPENDENCY_SOURCE" \
              2>&1 | tee build/rpcs3-core-diagnostics/core610-preflight.log
      - name: Preserve the authenticated preflight
        uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        with:
          name: RPCS3Core-${{ steps.core-build.outputs.build }}-preflight-${{ github.sha }}
          path: |
            build/rpcs3-core-diagnostics/core610-proof.json
            build/rpcs3-core-diagnostics/core610-preflight.log
          if-no-files-found: error
          retention-days: 14
      - name: Compile and link the actual iPhone Core ${{ steps.core-build.outputs.build }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats > build/rpcs3-core-diagnostics/ccache-before.txt
          ccache --print-stats > build/rpcs3-core-diagnostics/ccache-before-counters.txt
          date +%s > build/rpcs3-core-diagnostics/core-compile-start-epoch.txt
          env -u GITHUB_ENV BUILD_JOBS=3 \
            python3 build-utils/rpcs3/build_rpcs3_core610.py \
              --proof "$PWD/build/rpcs3-core-diagnostics/core610-proof.json" \
              --output "$PWD/dist/rpcs3" \
              --work-root "$RUNNER_TEMP/neostation-rpcs3-embedded" \
              2>&1 | tee build/rpcs3-core-diagnostics/core-driver.log
      - name: Verify the actual binary and write its Core ${{ steps.core-build.outputs.build }} identity
        shell: bash
        run: |
          set -euo pipefail
          CORE=dist/rpcs3/libRPCS3Core.dylib
          test -s "$CORE"
          python3 build-utils/validate_rpcs3_embedded_core.py "$CORE"
          python3 build-utils/validate_rpcs3_passive_dlopen.py "$CORE" \
            | tee build/rpcs3-core-diagnostics/passive-dlopen.txt
          file "$CORE" | tee build/rpcs3-core-diagnostics/file.txt
          lipo -archs "$CORE" | tee build/rpcs3-core-diagnostics/archs.txt
          nm -gU "$CORE" > build/rpcs3-core-diagnostics/exports.txt
          python3 .github/diagnostics/rpcs3_core610.py \
            --write-core-identity "$PWD/dist/rpcs3"
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          dist = Path('dist/rpcs3')
          diagnostics = Path('build/rpcs3-core-diagnostics')
          identity = json.loads((dist / 'identity.json').read_text())
          if (diagnostics / 'identity.json').read_bytes() != (dist / 'identity.json').read_bytes():
              raise RuntimeError('Core and diagnostic identities differ after ABI validation')
          proof = json.loads((dist / 'core610-proof.json').read_text())
          build = Path(proof['build_root']).resolve(strict=True)
          saved = {}
          for index, (name, expected) in enumerate(identity['actual_link']['response_files'].items()):
              source = Path(name)
              if source.is_symlink() or not source.resolve(strict=True).is_relative_to(build):
                  raise RuntimeError('Validated linker response file escaped the actual build')
              raw = source.read_bytes()
              if len(raw) != expected['bytes'] or hashlib.sha256(raw).hexdigest() != expected['sha256']:
                  raise RuntimeError('Validated linker response file changed')
              relative = Path('link-response') / f'{index:03d}.rsp'
              destination = dist / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(raw)
              saved[name] = dict(expected, artifact_path=str(relative))
          (dist / 'link-response-manifest.json').write_text(json.dumps(saved, indent=2) + '\n')
          PYCODE
      - name: Preserve an unverified binary and actual inputs after metadata failure
        if: always()
        shell: bash
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 build-utils/rpcs3/collect_rpcs3_mvk_unverified_core.py \
            --dist "$PWD/dist/rpcs3" \
            --proof "$PWD/build/rpcs3-core-diagnostics/core610-proof.json" \
            --diagnostics "$PWD/build/rpcs3-core-diagnostics" \
            --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --job-status "$PRIOR_JOB_STATUS"
      - name: Record observed compiler-cache counters and compile duration
        if: always()
        shell: bash
        env:
          CANDIDATE_CACHE_MATCH: ${{ steps.candidate-objects.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          mkdir -p build/rpcs3-core-diagnostics
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats > build/rpcs3-core-diagnostics/ccache-after.txt
            ccache --print-stats > build/rpcs3-core-diagnostics/ccache-after-counters.txt
          fi
          python3 - <<'PYCODE'
          import json, os, time
          from pathlib import Path
          out = Path('build/rpcs3-core-diagnostics')
          def counters(name):
              path = out / name
              if not path.is_file():
                  return None
              return {parts[0]: int(parts[1]) for line in path.read_text().splitlines()
                      if len(parts := line.split()) == 2 and parts[1].isdigit()}
          before = counters('ccache-before-counters.txt')
          after = counters('ccache-after-counters.txt')
          start = out / 'core-compile-start-epoch.txt'
          receipt = {'schema': 1, 'source': os.environ['GITHUB_SHA'],
                     'candidate_cache_match': os.environ['CANDIDATE_CACHE_MATCH'],
                     'ccache_before': before, 'ccache_after': after,
                     'ccache_counter_deltas': {key: after[key] - value for key, value in before.items()
                                               if key in after} if before is not None and after is not None else None,
                     'core_compile_started': start.is_file(),
                     'elapsed_seconds_since_compile_start': int(time.time()) - int(start.read_text())
                                                             if start.is_file() else None,
                     'cache_speedup_claimed': False, 'fps_gain_claimed': False}
          (out / 'compiler-cache-observed.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYCODE
      - name: Upload the verified Core ${{ steps.core-build.outputs.build }} without an application delivery
        uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        with:
          name: RPCS3Core-${{ steps.core-build.outputs.build }}-${{ github.sha }}
          path: dist/rpcs3/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve compiler objects for the same recipe
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/Library/Caches/ccache
          key: rpcs3-mvk-cache-arm64-xcode26.3-llvm22-${{ hashFiles('build-utils/build_rpcs3_embedded_core.sh','build-utils/rpcs3/llvm-aarch64-ghc-emergency-spill.patch') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve real diagnostics including partial failures
        if: always()
        uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        with:
          name: RPCS3Core-${{ steps.core-build.outputs.build }}-diagnostics-${{ github.sha }}
          path: |
            build/rpcs3-core-diagnostics/*.json
            build/rpcs3-core-diagnostics/*.txt
            build/rpcs3-core-diagnostics/*.log
            build/rpcs3-core-diagnostics/*.sh
            build/rpcs3-core-diagnostics/mvk-cache-dependency/
            build/rpcs3-core-diagnostics/unverified-core/
            build/rpcs3-core-diagnostics/captured-build-inputs/
          if-no-files-found: warn
          retention-days: 14
