# Core-only producer route of the RPCS3 iPhone Core, for the build declared in
# build-utils/rpcs3/core-build.json (build number, delivered reference Core,
# canonical delta, expected exports, pins, reused and rerun Apple harnesses).
# The route keeps its Core 610 file names: the frozen recipe patch and the
# driver pins name its gate path, so every build executes the same recipe.
# Source changes use [skip ci]; a separate marker commit touching only this
# workflow requests the build: '[rpcs3-core-build]' runs both jobs and
# '[rpcs3-core-build-apple]' only the Apple host harnesses. No application
# build, IPA, release or publication is performed here: the private IPA
# consumes the verified artifact of a successful run in its own delivery route.
