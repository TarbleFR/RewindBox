name: RPCS3 Core
# run-name is evaluated before any job and cannot read the spec; the build
# number is in the step names, the artifact names and the identity type.
run-name: "RPCS3 Core producer • ${{ github.sha }}"
'on':
  push:
    branches: [Claude]
    paths:
      - '.github/workflows/rpcs3-core610.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact full commit SHA, equal to the selected workflow ref
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: rewindbox-rpcs3-core-${{ github.sha }}
  cancel-in-progress: false
env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
jobs:
  core:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rpcs3-core-build]') }}
    name: RPCS3 iPhone Core with authenticated source-built MoltenVK
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Bind the request to exact source identities
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" == "$GITHUB_SHA" ]]
      - name: Checkout immutable candidate and retained source history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the declared Core build
        id: core-build
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/diagnostics/rpcs3_core610.py --github-outputs | tee -a "$GITHUB_OUTPUT"
      - name: Select the retained Core toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Restore compiler objects of the same frozen recipe
        id: candidate-objects
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: rpcs3-mvk-cache-arm64-xcode26.3-llvm22-${{ hashFiles('build-utils/build_rpcs3_embedded_core.sh','build-utils/rpcs3/llvm-aarch64-ghc-emergency-spill.patch') }}-${{ github.sha }}
          restore-keys: rpcs3-mvk-cache-arm64-xcode26.3-llvm22-${{ hashFiles('build-utils/build_rpcs3_embedded_core.sh','build-utils/rpcs3/llvm-aarch64-ghc-emergency-spill.patch') }}-
      - name: Authenticate the Core ${{ steps.core-build.outputs.build }} source closure and the native dependency
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RPCS3_MVK_DEPENDENCY_RUN: ${{ steps.core-build.outputs.dependency_run }}
          RPCS3_MVK_DEPENDENCY_SOURCE: ${{ steps.core-build.outputs.dependency_source }}
        run: |
          set -euo pipefail
          mkdir -p build/rpcs3-core-diagnostics
          git diff --check
          for formula in ccache ninja cmake llvm@22 ffmpeg; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          python3 test/rpcs3_mvk_dependency_artifact_test.py \
            2>&1 | tee build/rpcs3-core-diagnostics/dependency-protocol-tests.log
          python3 test/rpcs3_mvk_unverified_core_collector_test.py \
            2>&1 | tee build/rpcs3-core-diagnostics/recovery-collector-tests.log
          SOURCE="$RUNNER_TEMP/rpcs3-core-source-preflight"
          git init -q "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/XITRIX/rpcs3.git
          UPSTREAM=$(python3 -c 'import json; print(json.load(open("build-utils/rpcs3/canonical-source.json"))["upstream_commit"])')
          git -C "$SOURCE" fetch --depth 1 origin "$UPSTREAM"
          git -C "$SOURCE" checkout -q --detach FETCH_HEAD
          python3 build-utils/materialize_rpcs3_core.py "$SOURCE"
          CXX="$(brew --prefix llvm@22)/bin/clang++" \
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
          HOST_MACOS_SDK="$(xcrun --sdk macosx --show-sdk-path)" \
          LLVM_CONFIG="$(brew --prefix llvm@22)/bin/llvm-config" \
          LLVM_DIR="$(brew --prefix llvm@22)/lib/cmake/llvm" \
            python3 .github/diagnostics/rpcs3_core610.py \
              --prepare --source "$SOURCE" \
              --dependency-run "$RPCS3_MVK_DEPENDENCY_RUN" --dependency-source "$RPCS3_MVK_DEPENDENCY_SOURCE" \
              2>&1 | tee build/rpcs3-core-diagnostics/core610-preflight.log
      - name: Preserve the authenticated preflight
        uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        with:
          name: RPCS3Core-${{ steps.core-build.outputs.build }}-preflight-${{ github.sha }}
          path: |
            build/rpcs3-core-diagnostics/core610-proof.json
            build/rpcs3-core-diagnostics/core610-preflight.log
          if-no-files-found: error
          retention-days: 14
      - name: Compile and link the actual iPhone Core ${{ steps.core-build.outputs.build }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats > build/rpcs3-core-diagnostics/ccache-before.txt
          ccache --print-stats > build/rpcs3-core-diagnostics/ccache-before-counters.txt
          date +%s > build/rpcs3-core-diagnostics/core-compile-start-epoch.txt
          env -u GITHUB_ENV BUILD_JOBS=3 \
            python3 build-utils/rpcs3/build_rpcs3_core610.py \
              --proof "$PWD/build/rpcs3-core-diagnostics/core610-proof.json" \
              --output "$PWD/dist/rpcs3" \
              --work-root "$RUNNER_TEMP/neostation-rpcs3-embedded" \
              2>&1 | tee build/rpcs3-core-diagnostics/core-driver.log
      - name: Verify the actual binary and write its Core ${{ steps.core-build.outputs.build }} identity
        shell: bash
        run: |
          set -euo pipefail
          CORE=dist/rpcs3/libRPCS3Core.dylib
          test -s "$CORE"
          python3 build-utils/validate_rpcs3_embedded_core.py "$CORE"
          python3 build-utils/validate_rpcs3_passive_dlopen.py "$CORE" \
            | tee build/rpcs3-core-diagnostics/passive-dlopen.txt
          file "$CORE" | tee build/rpcs3-core-diagnostics/file.txt
          lipo -archs "$CORE" | tee build/rpcs3-core-diagnostics/archs.txt
          nm -gU "$CORE" > build/rpcs3-core-diagnostics/exports.txt
          python3 .github/diagnostics/rpcs3_core610.py \
            --write-core-identity "$PWD/dist/rpcs3"
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          dist = Path('dist/rpcs3')
          diagnostics = Path('build/rpcs3-core-diagnostics')
          identity = json.loads((dist / 'identity.json').read_text())
          if (diagnostics / 'identity.json').read_bytes() != (dist / 'identity.json').read_bytes():
              raise RuntimeError('Core and diagnostic identities differ after ABI validation')
          proof = json.loads((dist / 'core610-proof.json').read_text())
          build = Path(proof['build_root']).resolve(strict=True)
          saved = {}
          for index, (name, expected) in enumerate(identity['actual_link']['response_files'].items()):
              source = Path(name)
              if source.is_symlink() or not source.resolve(strict=True).is_relative_to(build):
                  raise RuntimeError('Validated linker response file escaped the actual build')
              raw = source.read_bytes()
              if len(raw) != expected['bytes'] or hashlib.sha256(raw).hexdigest() != expected['sha256']:
                  raise RuntimeError('Validated linker response file changed')
              relative = Path('link-response') / f'{index:03d}.rsp'
              destination = dist / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(raw)
              saved[name] = dict(expected, artifact_path=str(relative))
          (dist / 'link-response-manifest.json').write_text(json.dumps(saved, indent=2) + '\n')
          PYCODE
      - name: Preserve an unverified binary and actual inputs after metadata failure
        if: always()
        shell: bash
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 build-utils/rpcs3/collect_rpcs3_mvk_unverified_core.py \
            --dist "$PWD/dist/rpcs3" \
            --proof "$PWD/build/rpcs3-core-diagnostics/core610-proof.json" \
            --diagnostics "$PWD/build/rpcs3-core-diagnostics" \
            --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --job-status "$PRIOR_JOB_STATUS"
      - name: Record observed compiler-cache counters and compile duration
        if: always()
        shell: bash
        env:
          CANDIDATE_CACHE_MATCH: ${{ steps.candidate-objects.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          mkdir -p build/rpcs3-core-diagnostics
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats > build/rpcs3-core-diagnostics/ccache-after.txt
            ccache --print-stats > build/rpcs3-core-diagnostics/ccache-after-counters.txt
          fi
          python3 - <<'PYCODE'
          import json, os, time
          from pathlib import Path
          out = Path('build/rpcs3-core-diagnostics')
          def counters(name):
              path = out / name
              if not path.is_file():
                  return None
              return {parts[0]: int(parts[1]) for line in path.read_text().splitlines()
                      if len(parts := line.split()) == 2 and parts[1].isdigit()}
          before = counters('ccache-before-counters.txt')
          after = counters('ccache-after-counters.txt')
          start = out / 'core-compile-start-epoch.txt'
          receipt = {'schema': 1, 'source': os.environ['GITHUB_SHA'],
                     'candidate_cache_match': os.environ['CANDIDATE_CACHE_MATCH'],
                     'ccache_before': before, 'ccache_after': after,
                     'ccache_counter_deltas': {key: after[key] - value for key, value in before.items()
                                               if key in after} if before is not None and after is not None else None,
                     'core_compile_started': start.is_file(),
                     'elapsed_seconds_since_compile_start': int(time.time()) - int(start.read_text())
                                                             if start.is_file() else None,
                     'cache_speedup_claimed': False, 'fps_gain_claimed': False}
          (out / 'compiler-cache-observed.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYCODE
      - name: Upload the verified Core ${{ steps.core-build.outputs.build }} without an application delivery
        uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        with:
          name: RPCS3Core-${{ steps.core-build.outputs.build }}-${{ github.sha }}
          path: dist/rpcs3/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve compiler objects for the same recipe
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: rpcs3-mvk-cache-arm64-xcode26.3-llvm22-${{ hashFiles('build-utils/build_rpcs3_embedded_core.sh','build-utils/rpcs3/llvm-aarch64-ghc-emergency-spill.patch') }}-${{ github.sha }}
      - name: Preserve real diagnostics including partial failures
        if: always()
        uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        with:
          name: RPCS3Core-${{ steps.core-build.outputs.build }}-diagnostics-${{ github.sha }}
          path: |
            build/rpcs3-core-diagnostics/*.json
            build/rpcs3-core-diagnostics/*.txt
            build/rpcs3-core-diagnostics/*.log
            build/rpcs3-core-diagnostics/*.sh
            build/rpcs3-core-diagnostics/mvk-cache-dependency/
            build/rpcs3-core-diagnostics/unverified-core/
            build/rpcs3-core-diagnostics/captured-build-inputs/
          if-no-files-found: warn
          retention-days: 14
  apple-host-tests:
    # '[rpcs3-core-build-apple]' reruns only this job (the core job needs '[rpcs3-core-build]').
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rpcs3-core-build]') || contains(github.event.head_commit.message, '[rpcs3-core-build-apple]') }}
    name: Core host harnesses on Apple ARM64 (changed, new and reused)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout immutable candidate and the delivered Core history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the declared Core build
        id: core-build
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/diagnostics/rpcs3_core610.py --github-outputs | tee -a "$GITHUB_OUTPUT"
      - name: Select the retained Core toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Materialize the Core ${{ steps.core-build.outputs.build }} sources and the delivered ${{ steps.core-build.outputs.apple_baseline_short }} sources
        shell: bash
        env:
          RPCS3_DELIVERED_CORE_SOURCE: ${{ steps.core-build.outputs.apple_baseline_source }}
          RPCS3_DELIVERED_CORE_PATCH: ${{ steps.core-build.outputs.apple_baseline_patch_sha256 }}
        run: |
          set -euo pipefail
          UPSTREAM=$(python3 -c 'import json; print(json.load(open("build-utils/rpcs3/canonical-source.json"))["upstream_commit"])')
          for tree in core delivered; do
            git init -q "$RUNNER_TEMP/$tree"
            git -C "$RUNNER_TEMP/$tree" remote add origin https://github.com/XITRIX/rpcs3.git
            git -C "$RUNNER_TEMP/$tree" fetch --depth 1 origin "$UPSTREAM"
            git -C "$RUNNER_TEMP/$tree" checkout -q --detach FETCH_HEAD
          done
          python3 build-utils/materialize_rpcs3_core.py "$RUNNER_TEMP/core"
          git worktree add --detach "$RUNNER_TEMP/repo-delivered" "$RPCS3_DELIVERED_CORE_SOURCE"
          python3 "$RUNNER_TEMP/repo-delivered/build-utils/materialize_rpcs3_core.py" "$RUNNER_TEMP/delivered"
          test "$(python3 -c 'import json; print(json.load(open("'"$RUNNER_TEMP"'/repo-delivered/build-utils/rpcs3/canonical-source.json"))["patch_sha256"])')" \
            = "$RPCS3_DELIVERED_CORE_PATCH"
      - name: Authenticate the reused Core ${{ steps.core-build.outputs.reference_build }} Apple harness evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/diagnostics/rpcs3_core_apple_host.py --authenticate-reused \
            --source "$RUNNER_TEMP/core" --baseline "$RUNNER_TEMP/delivered" --output build/core-apple-host
      - name: Run the affected and new Core ${{ steps.core-build.outputs.build }} harnesses with Apple clang
        shell: bash
        run: |
          set -euo pipefail
          export HOST_MACOS_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          python3 .github/diagnostics/rpcs3_core_apple_host.py --run \
            --source "$RUNNER_TEMP/core" --baseline "$RUNNER_TEMP/delivered" --output build/core-apple-host
      - name: Preserve the Apple host harness reports
        if: always()
        uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        with:
          name: RPCS3Core-${{ steps.core-build.outputs.build }}-apple-host-tests-${{ github.sha }}
          path: |
            build/core-apple-host/*.json
            build/core-apple-host/*.log
            build/core-apple-host/reused-reference/*.json
          if-no-files-found: warn
          retention-days: 30
