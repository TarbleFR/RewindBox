name: Fast compatible cheat discovery 479
on:
  push:
    branches: [Claude]
    paths: ['packages/neo_cheat_catalog/**', 'test/cheats479*', 'test/unified_catalog_browser_ui*', '.github/workflows/cheats479.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  targeted:
    if: ${{ !contains(github.event.head_commit.message, '[frontend-motion]') && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cheats479]')) }}
    runs-on: macos-15
    timeout-minutes: 25
    env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Reuse exact successful unchanged service and memory components
        run: python3 .github/diagnostics/cheats479_service_reuse.py
      - name: Changed iPhone SDK compile and link
        run: |
          git rev-parse HEAD
          python3 test/unified_catalog_ios_test.py IPhoneCatalogTests
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Incremental deduplication and all affected direct menu controls in UIKit
        run: python3 test/unified_catalog_browser_ui_test.py --native --followup479-only --result evidence/cheats479.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheats479-${{ github.sha }}
          path: evidence/
          retention-days: 14
