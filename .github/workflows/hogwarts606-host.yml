name: Hogwarts performance diagnostics host checks
run-name: RewindBox console journals and diagnostics - ${{ github.sha }}
'on':
  push:
    branches: [Claude]
    paths:
      - .github/workflows/hogwarts606-host.yml
      - .github/diagnostics/hogwarts606_host.py
      - lib/**
      - packages/**
      - test/**
permissions:
  contents: read
jobs:
  host:
    if: ${{ contains(github.event.head_commit.message, '[hogwarts606-checks]') }}
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout exact diagnostics source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Resolve locked host dependencies
        run: flutter pub get --enforce-lockfile
      - name: Bind affected code and transitive host inputs
        run: python3 .github/diagnostics/hogwarts606_host.py prepare
      - name: Exercise console routing and retained-log safety
        run: python3 .github/diagnostics/hogwarts606_host.py flutter
      - name: Analyze changed Dart sources and targeted tests
        run: python3 .github/diagnostics/hogwarts606_host.py analyze
      - name: Prepare the pinned iOS simulator Flutter framework
        run: flutter precache --ios
      - name: Exercise native journal routing and bounded output
        run: python3 .github/diagnostics/hogwarts606_host.py native
      - name: Bind fresh executed host results
        run: python3 .github/diagnostics/hogwarts606_host.py finalize
      - name: Preserve exact host checks and failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hogwarts606-host-${{ github.sha }}
          path: build/hogwarts606-host
          if-no-files-found: error
          retention-days: 14
