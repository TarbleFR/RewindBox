name: S2Arm on-device preparation checks
# Batch 4 of docs/s2arm-study-2026-11-11.md: each packing stage ported off
# bash/Python is compared with S2Arm at the pinned commit. Synthetic input only.
'on':
  workflow_dispatch:
  push:
    branches: [work/s2arm-switch2-prototype-20261110]
    paths:
      - .github/workflows/s2arm-prepare.yml
      - native/s2arm/**
      - tools/s2arm_prototype/**
permissions:
  contents: read
concurrency:
  group: s2arm-prepare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the LZ4 module the original addr_need.py imports
        run: python3 -m pip install lz4==4.4.5
      # nx_unpack (and its ZBIC test) target net10.0; their packages are vendored in S2Arm's
      # compat/packages (local feed in pack/nx_unpack/nuget.config), so no extra feed is used.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch S2Arm at the pinned commit and build its rewriter
        run: |
          set -euo pipefail
          commit=$(python3 -c "import json;print(json.load(open('tools/s2arm_prototype/pin.json'))['s2arm']['commit'])")
          repository=$(python3 -c "import json;print(json.load(open('tools/s2arm_prototype/pin.json'))['s2arm']['repository'])")
          git init -q "$RUNNER_TEMP/s2arm"
          git -C "$RUNNER_TEMP/s2arm" fetch -q --depth 1 "$repository" "$commit"
          git -C "$RUNNER_TEMP/s2arm" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/s2arm" rev-parse HEAD)" = "$commit"
          python3 "$RUNNER_TEMP/s2arm/runtime/rewriter/prepare_deps.py" "$RUNNER_TEMP/deps"
          cmake -S "$RUNNER_TEMP/s2arm/runtime/rewriter" -B "$RUNNER_TEMP/rewriter" \
            -DS2A_REWRITER_DEPS="$RUNNER_TEMP/deps" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/rewriter" --parallel 4
      - name: Build S2Arm's nx_unpack and ZBIC test, and the ZBIC batch driver over S2Arm's decoder
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          set -euo pipefail
          s2arm="$RUNNER_TEMP/s2arm"; bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          dotnet build "$s2arm/pack/nx_unpack/nx_unpack.csproj" -c Release --artifacts-path "$RUNNER_TEMP/nxu-art" -nologo -v quiet
          dotnet build "$s2arm/tests/nx_unpack_zbic/ZbicTest.csproj" -c Release --artifacts-path "$RUNNER_TEMP/zbictest-art" -nologo -v quiet
          dotnet build tools/s2arm_prototype/zbic_batch/ZbicBatch.csproj -c Release -p:S2ArmRoot="$s2arm" \
            --artifacts-path "$RUNNER_TEMP/zbicbatch-art" -nologo -v quiet
          for tool in nx_unpack:nxu-art ZbicTest:zbictest-art ZbicBatch:zbicbatch-art; do
            name=${tool%%:*}; dll=$(find "$RUNNER_TEMP/${tool#*:}/bin" -name "$name.dll" -print -quit)
            test -n "$dll"
            printf '#!/bin/sh\nexec dotnet "%s" "$@"\n' "$dll" > "$bin/$name"; chmod +x "$bin/$name"
          done
      - name: Build the preparation library and compare with S2Arm
        run: |
          set -euo pipefail
          mkdir -p proof
          rewriter_lib=$(find "$RUNNER_TEMP/rewriter" -name 'libs2a_rewriter.a' -print -quit)
          capstone_lib=$(find "$RUNNER_TEMP/rewriter" -name 'libcapstone.a' -print -quit)
          test -n "$rewriter_lib" && test -n "$capstone_lib"
          cc -O2 -Wall -Wextra -Werror -I native/s2arm/prepare -I "$RUNNER_TEMP/s2arm/runtime/rewriter" \
            -I "$RUNNER_TEMP/deps/lz4-4.4.5/lz4libs" \
            -o proof/s2arm_prepare_cli native/s2arm/prepare/s2arm_prepare.c native/s2arm/prepare/s2arm_addr_need.c \
            native/s2arm/prepare/s2arm_modules.c native/s2arm/prepare/s2arm_nro.c native/s2arm/prepare/s2arm_zbic.c \
            native/s2arm/prepare/s2arm_ns2_dump.c native/s2arm/prepare/s2arm_prepare_cli.c "$rewriter_lib" "$capstone_lib"
          bash tools/s2arm_prototype/run_prepare_test.sh proof/s2arm_prepare_cli "$RUNNER_TEMP/rewriter/s2a-rewrite" \
            "$RUNNER_TEMP/prepare-work" proof/prepare-report.txt
      - name: Compare the address-need table with S2Arm's addr_need.py
        run: |
          set -euo pipefail
          python3 tools/s2arm_prototype/run_addr_need_test.py "$RUNNER_TEMP/s2arm" proof/s2arm_prepare_cli \
            "$RUNNER_TEMP/addr-need-work" | tee proof/addr-need-report.txt
      - name: Compare the GPU driver list, NRO exports and NRO conversion with S2Arm
        run: |
          set -euo pipefail
          # Originals need only python-lz4 (installed above, pinned in S2Arm's tools/rewriter-requirements.txt); no zstandard, no capstone.
          python3 tools/s2arm_prototype/run_modules_test.py "$RUNNER_TEMP/s2arm" proof/s2arm_prepare_cli \
            "$RUNNER_TEMP/modules-work" | tee proof/modules-report.txt
      - name: Compare the ZBIC decoder and NSO normalisation with S2Arm's nx_unpack
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          python3 tools/s2arm_prototype/run_zbic_test.py "$RUNNER_TEMP/s2arm" proof/s2arm_prepare_cli "$bin/ZbicBatch" \
            "$bin/nx_unpack" "$bin/ZbicTest" "$RUNNER_TEMP/zbic-work" | tee proof/zbic-report.txt
      - name: Compare the export folder conversion with S2Arm's ns2_dump.py
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          python3 tools/s2arm_prototype/run_ns2_dump_test.py "$RUNNER_TEMP/s2arm" proof/s2arm_prepare_cli "$bin/nx_unpack" \
            "$RUNNER_TEMP/ns2-dump-work" "$bin/ZbicTest" | tee proof/ns2-dump-report.txt
      - name: Compare the whole code stage with the same steps run by S2Arm's tools
        run: |
          set -euo pipefail
          python3 tools/s2arm_prototype/run_code_stage_test.py "$RUNNER_TEMP/s2arm" "$RUNNER_TEMP/rewriter/s2a-rewrite" \
            proof/s2arm_prepare_cli "$RUNNER_TEMP/code-stage-work" "$RUNNER_TEMP/bin/nx_unpack" | tee proof/code-stage-report.txt
      - name: The library compiles for iOS arm64
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.4 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -Wall -Wextra -Werror -I native/s2arm/prepare -I "$RUNNER_TEMP/s2arm/runtime/rewriter" \
            -c native/s2arm/prepare/s2arm_prepare.c -o proof/ios-s2arm_prepare.o
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.4 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -Wall -Wextra -Werror -I native/s2arm/prepare -I "$RUNNER_TEMP/deps/lz4-4.4.5/lz4libs" \
            -c native/s2arm/prepare/s2arm_addr_need.c -o proof/ios-s2arm_addr_need.o
          for unit in s2arm_modules s2arm_nro s2arm_zbic s2arm_ns2_dump; do
            xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.4 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
              -Wall -Wextra -Werror -I native/s2arm/prepare -I "$RUNNER_TEMP/deps/lz4-4.4.5/lz4libs" \
              -c native/s2arm/prepare/$unit.c -o proof/ios-$unit.o
          done
          echo "iOS arm64 object compiled"
      - uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        if: always()
        with:
          name: s2arm-prepare-${{ runner.os }}-${{ github.sha }}
          path: |
            proof/prepare-report.txt
            proof/addr-need-report.txt
            proof/modules-report.txt
            proof/code-stage-report.txt
            proof/zbic-report.txt
            proof/ns2-dump-report.txt
          retention-days: 30
