name: Skin orientation checks
# Orientation lock of single-orientation skins (libretro and Dolphin bridges).
# Manual run only: compiles both bridges' orientation sources for iPhone, runs
# the portable libretro frontend tests (real store files, real skins) and the
# Dolphin orientation tests in the iOS Simulator. A simulator is not an iPhone.
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skin-orientation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Decision table and source order of calls
      run: |
        python3 -I test/skin_portrait_lock_contract_test.py
    - name: Libretro frontend modules, including the orientation selection on real store files and skins
      if: ${{ !cancelled() }}
      run: python3 test/libretro_frontend_test.py
    - name: Compile every libretro bridge source for iPhone
      if: ${{ !cancelled() }}
      run: python3 test/libretro_ios_syntax_test.py
    - name: Compile the Dolphin orientation and skin sources for iPhone
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
        CLASSES=packages/dolphin_internal_bridge/ios/Classes
        for source in DOLOrientation.mm DOLSkinOverlay.mm; do
          xcrun clang++ -fsyntax-only -fobjc-arc -std=gnu++20 -Wall -Werror -Wno-deprecated-declarations \
            -target arm64-apple-ios18.0 -isysroot "$SDK" -I "$CLASSES" -I "$CLASSES/TouchController" "$CLASSES/$source"
        done
    - name: Dolphin orientation tests in the iOS Simulator (coordinator, session menu, presentation, release)
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj
        ruby packages/dolphin_internal_bridge/ci/test_session_ui.rb
    - name: Keep the simulator result
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: skin-orientation-${{ github.sha }}
        path: build/dolphin-ci/session-ui/SessionUI.xcresult
        if-no-files-found: ignore
        retention-days: 7
