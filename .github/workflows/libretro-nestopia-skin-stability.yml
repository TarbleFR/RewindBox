name: NES NESThumbstick 100-launch lifetime and stability regression
on:
  push:
    branches: [Claude]
    paths:
      - .github/workflows/libretro-nestopia-skin-stability.yml
      - packages/libretro_internal_bridge/ios/Classes/LibretroSkin*
      - packages/libretro_internal_bridge/ios/Classes/LibretroCrashCapture.h
      - packages/libretro_internal_bridge/ios/Classes/LibretroSessionJournal.*
      - packages/libretro_internal_bridge/ios/Classes/LibretroGameViewController.m
      - packages/libretro_internal_bridge/ios/Classes/LibretroSession.m
      - packages/libretro_internal_bridge/ios/Classes/LibretroMetalPresenter.m
      - test/libretro_simulator/probe.m
      - test/libretro_simulator/skin_lifetime_probe.h
      - test/libretro_simulator_probe.py
      - test/libretro_crash_capture_test.*
      - test/libretro_nestopia_skin_stability_probe.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nestopia-skin-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-skin-on-real-nestopia:
    # Reuse unchanged 470/471 evidence; unified-cheats.yml covers the changed inputs.
    if: ${{ !contains(github.event.head_commit.message, '[unified-cheats]') }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: actions/download-artifact@v4
        with:
          name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
          run-id: '38638115521'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/libretro
      - name: Fetch the existing verified simulator inputs
        run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
      - name: Native fatal-signal capture behaviour
        run: python3 test/libretro_crash_capture_test.py
      - name: Reproduce 469 terminal-lifetime defects with unchanged renderer and view bodies
        run: |
          python3 test/libretro_nestopia_skin_stability_probe.py \
            --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
            --evidence evidence/nestopia-skins/baseline469 --label "$GITHUB_SHA" --baseline
      - name: Real Nestopia — original NESThumbstick and 100 game sessions
        run: |
          python3 test/libretro_nestopia_skin_stability_probe.py \
            --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
            --evidence evidence/nestopia-skins --label "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nestopia-skin-stability-${{ github.sha }}
          path: evidence/nestopia-skins/
          retention-days: 14
          if-no-files-found: warn
  memory-sanitizers:
    # Reuse unchanged 470/471 evidence; unified-cheats.yml covers the changed inputs.
    if: ${{ !contains(github.event.head_commit.message, '[unified-cheats]') }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Concurrent journal writes under ThreadSanitizer
        run: |
          mkdir -p "$RUNNER_TEMP/journal-tsan"
          clang -fobjc-arc -O1 -g -fsanitize=thread -fno-omit-frame-pointer \
            -I packages/libretro_internal_bridge/ios/Classes \
            packages/libretro_internal_bridge/ios/Classes/LibretroSessionJournal.m \
            test/libretro_host/frontend/session_journal_test.m -framework Foundation \
            -o "$RUNNER_TEMP/journal-tsan/probe"
          TSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/journal-tsan/probe" "$RUNNER_TEMP/journal-tsan"
      - uses: actions/download-artifact@v4
        with:
          name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
          run-id: '38638115521'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/libretro
      - name: Fetch pinned simulator inputs
        run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
      - name: Real Nestopia — 12 bridge AddressSanitizer sessions
        run: |
          python3 test/libretro_nestopia_skin_stability_probe.py \
            --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
            --evidence evidence/nestopia-asan --label "$GITHUB_SHA" --asan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nestopia-memory-sanitizers-${{ github.sha }}
          path: evidence/nestopia-asan/
          retention-days: 14
          if-no-files-found: warn
