name: Libretro cheat catalogues and real core checks
on:
  push:
    branches: [Claude]
    paths:
      - .github/workflows/libretro-cheats-checks.yml
      - packages/libretro_internal_bridge/ios/Classes/LibretroCheat*
      - lib/services/libretro_overlay_converter.dart
      - packages/libretro_internal_bridge/ios/Resources/Cheats/**
      - packages/libretro_internal_bridge/ios/libretro_internal_bridge.podspec
      - lib/l10n/libretro_locale.dart
      - test/cheat_bootstrap_test.py
      - test/cheat_bootstrap_ipa_test.py
      - build-utils/validate_cheat_bootstrap_ipa.py
      - test/libretro_cheat_probe.py
      - test/libretro_overlay_fixture_test.dart
      - test/libretro_simulator/overlay_preview_probe.h
      - test/fixtures/libretro_overlays/**
      - test/libretro_simulator/cheat_probe.h
      - test/libretro_host/frontend/cheat*_test.m
      - test/libretro_host/frontend/cheat_catalog_live_probe.m
      - test/libretro_simulator/cheat_menu_probe.h
      - test/libretro_simulator/cheat_automatic_probe.h
      - test/libretro_simulator/skin_failure_probe.h
      - test/libretro_simulator/skin_loading_probe.h
      - test/libretro_skin_loading_probe.py
      - test/libretro_simulator/skin_press_probe.h
      - test/fixtures/libretro_cheats/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: libretro-cheats-${{ github.ref }}
  # Keep the running evidence when a follow-up commit adds independent checks.
  cancel-in-progress: false
jobs:
  catalogues-and-cores:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Bounded parsers, adapters, two sources and offline storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import sys, tempfile, subprocess
          from pathlib import Path
          sys.path.insert(0, 'test')
          import libretro_frontend_test as test
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              for name in ('cheats_test.m', 'cheat_catalog_test.m', 'cheat_automatic_test.m', 'cheat_catalog_live_probe.m'):
                  executable = root / name.removesuffix('.m')
                  assert test.build(test.TESTS / name, executable), name
                  subprocess.run([str(executable), str(root), str(test.ROOT)], check=True)
          PY
      - name: Bundled index integrity and complete translations
        run: |
          python3 test/cheat_bootstrap_test.py
          python3 test/cheat_bootstrap_ipa_test.py
      - uses: actions/download-artifact@v4
        with:
          name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
          run-id: '38638115521'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/libretro
      - name: Fetch pinned simulator inputs
        run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Convert the actual Libretro overlay configurations used in the reported previews
        env:
          NEOSTATION_OVERLAY_FIXTURES: evidence/overlay-layouts
        run: |
          flutter pub get --enforce-lockfile
          flutter test test/libretro_overlay_fixture_test.dart
      - name: Real Nestopia and Snes9x cheat effects, original Ignited on Nestopia
        run: |
          # A pre-delegate stall can leave simctl's PID line buffered until
          # termination. Observe the actual installed Simulator process rather
          # than relying on that console line; preserve bounded stack samples.
          python3 -u - <<'PY' &
          import pathlib, subprocess, time
          folder = pathlib.Path('evidence/cheats/diagnostics')
          folder.mkdir(parents=True, exist_ok=True)
          seen, sampled = {}, set()
          while True:
              listing = subprocess.check_output(['ps', '-axo', 'pid=,args='], text=True)
              for line in listing.splitlines():
                  if '/CoreSimulator/Devices/' not in line or '/Probe.app/Probe' not in line:
                      continue
                  pid, command = line.strip().split(None, 1)
                  start = seen.setdefault(pid, time.monotonic())
                  age = time.monotonic() - start
                  for threshold in (90, 180):
                      key = (pid, threshold)
                      if age >= threshold and key not in sampled:
                          sampled.add(key)
                          (folder / f'process-{pid}.txt').write_text(command + '\n')
                          subprocess.run(['sample', pid, '3', '-file', str(folder / f'probe-{pid}-{threshold}s.txt')],
                                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              time.sleep(5)
          PY
          cheat_sampler_pid=$!
          trap 'kill "$cheat_sampler_pid" 2>/dev/null || true' EXIT
          python3 test/libretro_cheat_probe.py --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
            --evidence evidence/cheats --label "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libretro-cheats-${{ github.sha }}
          path: evidence/cheats/
          retention-days: 14
          if-no-files-found: warn
