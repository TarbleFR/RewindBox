# REWINDBOX_METAL_NATIVE: fast checks of the native Metal 4 renderer on the Metal branch (no IPA, no Core artifact).
# The renderer sources come from the canonical Core delta (Core 927: M1-M4, M5 part 1, the M3 gaps, the parity items, the timed report, the AC GPU levers, the 908 memo/profiler/freeze-dump levers, the 909 God of War III levers, the 910 PUT horizon, prehash budget and pass shape census the 911 SPU polling wait, the 912 captures, the 916 corrections, the 917 writer park spin, the 918 busy wait duration, the 919 ZCULL watched flush of Black Ops II, the 920 lever comparison on request, the 921 release of stale idle textures, the 922 savestate MLAA bypass, the 923 SPU region profile, the 924 deferral before the line lock, the 925 GPU memory packing, the 926 Black Ops II FPS levers and the 927 asynchronous MoltenVK submits folded), materialized
# on the pinned upstream commit, plus the work in progress of a next stage when the branch carries it
# (build-utils/rpcs3/metal-wip-from-927.patch; not a Core: the next Core folds it with its records).
name: RPCS3 Metal renderer checks
run-name: "RPCS3 Metal renderer checks • ${{ github.sha }}"
'on':
  push:
    branches: [work/rpcs3-metal-native-20261105, Claude]
    paths:
      - 'build-utils/rpcs3/embedded-core.patch'
      - 'build-utils/rpcs3/canonical-source.json'
      - 'build-utils/rpcs3/metal-wip-from-901.patch'
      - 'build-utils/rpcs3/metal-wip-from-902.patch'
      - 'build-utils/rpcs3/metal-wip-from-903.patch'
      - 'build-utils/rpcs3/metal-wip-from-904.patch'
      - 'build-utils/rpcs3/metal-wip-from-905.patch'
      - 'build-utils/rpcs3/metal-wip-from-906.patch'
      - 'build-utils/rpcs3/metal-wip-from-907.patch'
      - 'build-utils/rpcs3/metal-wip-from-908.patch'
      - 'build-utils/rpcs3/metal-wip-from-909.patch'
      - 'build-utils/rpcs3/metal-wip-from-910.patch'
      - 'build-utils/rpcs3/metal-wip-from-911.patch'
      - 'build-utils/rpcs3/metal-wip-from-912.patch'
      - 'build-utils/rpcs3/metal-wip-from-914.patch'
      - 'build-utils/rpcs3/metal-wip-from-916.patch'
      - 'build-utils/rpcs3/metal-wip-from-917.patch'
      - 'build-utils/rpcs3/metal-wip-from-918.patch'
      - 'build-utils/rpcs3/metal-wip-from-919.patch'
      - 'build-utils/rpcs3/metal-wip-from-920.patch'
      - 'build-utils/rpcs3/metal-wip-from-921.patch'
      - 'build-utils/rpcs3/metal-wip-from-922.patch'
      - 'build-utils/rpcs3/metal-wip-from-923.patch'
      - 'build-utils/rpcs3/metal-wip-from-924.patch'
      - 'build-utils/rpcs3/metal-wip-from-925.patch'
      - 'build-utils/rpcs3/metal-wip-from-926.patch'
      - 'build-utils/rpcs3/metal-wip-from-927.patch'
      - 'test/native/rpcs3_metal_*'
      - 'test/native/build_rpcs3_metal_shader_stack.sh'
      - '.github/workflows/rpcs3-metal-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rewindbox-rpcs3-metal-checks-${{ github.sha }}
  cancel-in-progress: false
jobs:
  metal:
    name: Native Metal 4 renderer (shader stack, offline MSL for iOS, iOS 26 SDK compile, host unit, Metal 4 probe)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26.3 (iOS 26 SDK with Metal 4)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Materialize the canonical Core source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/rpcs3-metal-source"
          git init -q "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/XITRIX/rpcs3.git
          UPSTREAM=$(python3 -c 'import json; print(json.load(open("build-utils/rpcs3/canonical-source.json"))["upstream_commit"])')
          git -C "$SOURCE" fetch --depth 1 origin "$UPSTREAM"
          git -C "$SOURCE" checkout -q --detach FETCH_HEAD
          python3 build-utils/materialize_rpcs3_core.py "$SOURCE"
          echo "RPCS3_SOURCE=$SOURCE" >> "$GITHUB_ENV"
      - name: Check the folded Metal M2 to M5 sources (Core 927)
        shell: bash
        run: |
          set -euo pipefail
          S="$RPCS3_SOURCE"
          # Core 902 folds the M2 work (metal-wip-from-901.patch) and the vendored SPIRV-Cross into the canonical delta:
          # the materialized source already contains both. The vendored files are the ones packages/neo_shader_kit tracks
          # (SOURCE.txt lists their SHA-256), byte for byte; CMakeLists.txt is RewindBox's own build of them.
          (cd packages/neo_shader_kit/ios/ThirdParty/SPIRV-Cross && shasum -a 256 -c <(sed -n 's/^\([0-9a-f]\{64\}\)  \(.*\)$/\1  \2/p' SOURCE.txt))
          for f in packages/neo_shader_kit/ios/ThirdParty/SPIRV-Cross/*; do
            cmp "$f" "$S/3rdparty/rewindbox-spirv-cross/$(basename "$f")"
          done
          test -f "$S/3rdparty/rewindbox-spirv-cross/CMakeLists.txt"
          # Core 903 folds the M3 and M4 work (metal-wip-from-902.patch, identical to core903-from-902.patch) over Core 902,
          # which folded the M2 work (metal-wip-from-901.patch): reverse the M3/M4 work, check that the M2 work reverses
          # from that Core 902 state, then apply the M3/M4 work again (the source is unchanged afterwards).
          # Core 927 folds metal-wip-from-926.patch (identical to core927-from-926.patch) over Core 926.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-926.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core927-from-926.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-926.patch"
          # Core 926 folds metal-wip-from-925.patch (identical to core926-from-925.patch) over Core 925.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-925.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core926-from-925.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-925.patch"
          # Core 925 folds metal-wip-from-924.patch (identical to core925-from-924.patch) over Core 924.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-924.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core925-from-924.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-924.patch"
          # Core 924 folds metal-wip-from-923.patch (identical to core924-from-923.patch) over Core 923.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-923.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core924-from-923.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-923.patch"
          # Core 923 folds metal-wip-from-922.patch (identical to core923-from-922.patch) over Core 922.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-922.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core923-from-922.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-922.patch"
          # Core 922 folds metal-wip-from-921.patch (identical to core922-from-921.patch) over Core 921.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-921.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core922-from-921.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-921.patch"
          # Core 921 folds metal-wip-from-920.patch (identical to core921-from-920.patch) over Core 920.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-920.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core921-from-920.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-920.patch"
          # Core 920 folds metal-wip-from-919.patch (identical to core920-from-919.patch) over Core 919.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-919.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core920-from-919.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-919.patch"
          # Core 919 folds metal-wip-from-918.patch (identical to core919-from-918.patch) over Core 918.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-918.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core919-from-918.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-918.patch"
          # Core 918 folds metal-wip-from-917.patch (identical to core918-from-917.patch) over Core 917.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-917.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core918-from-917.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-917.patch"
          # Core 917 folds metal-wip-from-916.patch (identical to core917-from-916.patch) over Core 916.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-916.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core917-from-916.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-916.patch"
          # Core 916 folds metal-wip-from-914.patch (identical to core916-from-914.patch) over Core 914 (915 was a witness of 914).
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-914.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core916-from-914.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-914.patch"
          # Core 914 folds metal-wip-from-912.patch (identical to core914-from-912.patch) over Core 912 (913 was a witness of 912).
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-912.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core914-from-912.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-912.patch"
          # Core 912 folds metal-wip-from-911.patch (identical to core912-from-911.patch) over Core 911.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-911.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core912-from-911.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-911.patch"
          # Core 911 folds metal-wip-from-910.patch (identical to core911-from-910.patch) over Core 910.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-910.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core911-from-910.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-910.patch"
          # Core 910 folds metal-wip-from-909.patch (identical to core910-from-909.patch) over Core 909.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-909.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core910-from-909.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-909.patch"
          # Core 909 folds metal-wip-from-908.patch (identical to core909-from-908.patch) over Core 908.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-908.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core909-from-908.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-908.patch"
          # Core 908 folds metal-wip-from-907.patch (identical to core908-from-907.patch) over Core 907.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-907.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core908-from-907.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-907.patch"
          # Core 907 folds metal-wip-from-906.patch (identical to core907-from-906.patch) over Core 906.
          # Core 906 folds metal-wip-from-905.patch (identical to core906-from-905.patch) over Core 905.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-906.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core907-from-906.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-906.patch"
          # Core 905 folds metal-wip-from-904.patch (identical to core905-from-904.patch) over Core 904, which folded
          # metal-wip-from-903.patch (identical to core904-from-903.patch) over Core 903: reverse them first.
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-905.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core906-from-905.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-905.patch"
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-904.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core905-from-904.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-904.patch"
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-903.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core904-from-903.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-903.patch"
          cmp "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-902.patch" "$GITHUB_WORKSPACE/build-utils/rpcs3/core903-from-902.patch"
          git -C "$S" apply --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-902.patch"
          git -C "$S" apply --reverse --check "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-901.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-902.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-903.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-904.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-905.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-906.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-907.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-908.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-909.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-910.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-911.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-912.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-914.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-916.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-917.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-918.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-919.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-920.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-921.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-922.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-923.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-924.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-925.patch"
          git -C "$S" apply --whitespace=nowarn "$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-926.patch"
          echo "PASS: the M2 to M5 work and the vendored SPIRV-Cross are part of the canonical source"
      - name: Apply the work in progress of a next stage (metal-wip-from-927.patch)
        shell: bash
        run: |
          set -euo pipefail
          WIP="$GITHUB_WORKSPACE/build-utils/rpcs3/metal-wip-from-927.patch"
          if [ ! -f "$WIP" ]; then
            echo "No work in progress over Core 927 on this commit"
            exit 0
          fi
          git -C "$RPCS3_SOURCE" apply --whitespace=nowarn "$WIP"
          echo "PASS: applied $(grep -c '^diff --git' "$WIP") files of the work in progress ($(shasum -a 256 "$WIP" | cut -c1-16))"
      - name: Toolchain
        shell: bash
        run: |
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version), macOS SDK $(xcrun --sdk macosx --show-sdk-version)"
          sw_vers
      - name: Shader stack (RSX programs -> GLSL -> SPIR-V -> MSL) on the host
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          JOBS=$(sysctl -n hw.ncpu) CXX=$(xcrun --sdk macosx --find clang++) CC=$(xcrun --sdk macosx --find clang) \
            SDKROOT=$(xcrun --sdk macosx --show-sdk-path) \
            bash test/native/build_rpcs3_metal_shader_stack.sh "$RPCS3_SOURCE" "$RUNNER_TEMP/shader-stack" "$RUNNER_TEMP/msl"
          ls -la "$RUNNER_TEMP/msl"
          echo "SHADER_STACK_WORK=$RUNNER_TEMP/shader-stack" >> "$GITHUB_ENV"
      - name: Compile the translated MSL for iOS with Apple's offline Metal compiler
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          if ! xcrun --sdk iphoneos --find metal > /dev/null 2>&1; then
            echo "The Metal toolchain is not installed with this Xcode: downloading the component"
            xcodebuild -downloadComponent MetalToolchain
          fi
          # Version banner only (written to a file: metal -v cut off by a closed pipe aborts, run 42129330100).
          xcrun --sdk iphoneos metal -v > "$RUNNER_TEMP/metal-version.txt" 2>&1 || true
          head -3 "$RUNNER_TEMP/metal-version.txt"
          # Every warning is an error except unused temporaries, which RSX programs always declare (MoltenVK and the
          # runtime MTL4 compiler accept them too).
          count=0
          failed=0
          for f in "$RUNNER_TEMP"/msl/*.metal; do
            if xcrun --sdk iphoneos metal -std=metal3.2 -target air64-apple-ios26.0 -Werror \
                 -Wno-unused-variable -Wno-unused-but-set-variable -Wno-unused-function -c "$f" -o "${f%.metal}.air"; then
              echo "compiled $(basename "$f") ($(wc -c < "${f%.metal}.air") bytes of AIR)"
              count=$((count + 1))
            else
              echo "::error::$(basename "$f") does not compile for iOS"
              failed=$((failed + 1))
            fi
          done
          [ "$failed" = 0 ] || exit 1
          [ "$count" -ge 5 ] || { echo "expected at least 5 translated programs, got $count"; exit 1; }
          echo "PASS: $count translated programs compile for iOS (MSL 3.2, warnings as errors except unused temporaries)"
      - name: Compile the Metal 4 renderer for iOS (arm64, deployment 16.3)
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          S="$RPCS3_SOURCE"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CXX=$(xcrun --sdk iphoneos --find clang++)
          FLAGS=(-target arm64-apple-ios16.3 -isysroot "$SDK" -std=gnu++20 -fsyntax-only -Wall -Wno-unused-parameter
                 -Werror=unguarded-availability-new -Werror=objc-method-access -DRPCS3_IOS
                 -I "$S/rpcs3" -I "$S" -I "$S/rpcs3/Emu" -I "$S/3rdparty")
          FLAGS+=(-I "$SHADER_STACK_WORK/asmjit/src" -I "$SHADER_STACK_WORK/stb" -I "$S/3rdparty/rewindbox-spirv-cross"
                  -DSPIRV_CROSS_NAMESPACE_OVERRIDE=rbx_spirv_cross -DSPIRV_CROSS_SPV_HEADER_NAMESPACE_OVERRIDE=rbx_spv)
          "$CXX" "${FLAGS[@]}" -x objective-c++ -fobjc-arc "$S/rpcs3/Emu/RSX/Metal/MTLAPIApple.mm"
          # Every renderer unit of the source (new stages add files): built without exceptions, except the translator.
          count=0
          for path in "$S"/rpcs3/Emu/RSX/Metal/*.cpp; do
            unit=$(basename "$path")
            [ "$unit" = MTLShaderTranslator.cpp ] && continue
            echo "compile $unit"
            "$CXX" "${FLAGS[@]}" -fno-exceptions -include "$S/rpcs3/stdafx.h" "$path"
            count=$((count + 1))
          done
          [ "$count" -ge 11 ] || { echo "expected at least 11 renderer units, got $count"; exit 1; }
          # The translator and SPIRV-Cross are the Metal sources built with exceptions (rpcs3/Emu/CMakeLists.txt).
          "$CXX" "${FLAGS[@]}" -fexceptions "$S/rpcs3/Emu/RSX/Metal/MTLShaderTranslator.cpp"
          for unit in spirv_cfg.cpp spirv_cross.cpp spirv_cross_parsed_ir.cpp spirv_glsl.cpp spirv_msl.cpp spirv_parser.cpp; do
            "$CXX" "${FLAGS[@]}" -fexceptions -w "$S/3rdparty/rewindbox-spirv-cross/$unit"
          done
          echo "PASS: iOS compile of MTLAPIApple.mm (ARC), the renderer, the decompilers, the translator and SPIRV-Cross"
      - name: Host unit test (display buffer conversion and fit)
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # UBSan only here: the ASan/UBSan run of this unit is part of the Linux checks; ASan stalled on this runner (run 42120780912).
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          CXX=$(xcrun --sdk macosx --find clang++)
          "$CXX" -isysroot "$SDK" -std=gnu++20 -O1 -Wall -I "$RPCS3_SOURCE/rpcs3" -fsanitize=undefined -fno-sanitize-recover=undefined \
            -o "$RUNNER_TEMP/metal_present_unit" test/native/rpcs3_metal_present_unit.cpp
          "$RUNNER_TEMP/metal_present_unit"
          # Host tests that the renderer sources carry (rpcs3/Emu/RSX/Metal/tests), with UBSan. A test given a directory
          # may write the MSL libraries it checks there (M4: compute and resolve kernels); they are compiled for iOS below.
          mkdir -p "$RUNNER_TEMP/msl-tests"
          for test in "$RPCS3_SOURCE"/rpcs3/Emu/RSX/Metal/tests/*.cpp; do
            [ -f "$test" ] || continue
            name=$(basename "$test" .cpp)
            "$CXX" -isysroot "$SDK" -std=gnu++20 -O1 -Wall -I "$RPCS3_SOURCE/rpcs3" -I "$RPCS3_SOURCE" -I "$RPCS3_SOURCE/rpcs3/Emu" \
              -I "$RPCS3_SOURCE/3rdparty" -fsanitize=undefined -fno-sanitize-recover=undefined -o "$RUNNER_TEMP/$name" "$test"
            "$RUNNER_TEMP/$name" "$RUNNER_TEMP/msl-tests"
          done
          count=0
          for f in "$RUNNER_TEMP"/msl-tests/*.metal; do
            [ -f "$f" ] || continue
            xcrun --sdk iphoneos metal -std=metal3.2 -target air64-apple-ios26.0 -Werror \
              -Wno-unused-variable -Wno-unused-but-set-variable -Wno-unused-function -c "$f" -o "${f%.metal}.air"
            echo "compiled $(basename "$f") for iOS ($(wc -c < "${f%.metal}.air") bytes of AIR)"
            count=$((count + 1))
          done
          echo "PASS: host tests; $count test-emitted MSL libraries compile for iOS"
      - name: Metal 4 probe on this runner's GPU
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          S="$RPCS3_SOURCE"
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          CXX=$(xcrun --sdk macosx --find clang++)
          COMMON=(-target arm64-apple-macos26.0 -isysroot "$SDK" -std=gnu++20 -O1 -Wall -Wno-unused-parameter -I "$S/rpcs3" -I "$S")
          "$CXX" "${COMMON[@]}" -x objective-c++ -fobjc-arc -c "$S/rpcs3/Emu/RSX/Metal/MTLAPIApple.mm" -o "$RUNNER_TEMP/mtlapi.o"
          "$CXX" "${COMMON[@]}" -c test/native/rpcs3_metal_m1_probe.cpp -o "$RUNNER_TEMP/probe.o"
          "$CXX" "${COMMON[@]}" "$RUNNER_TEMP/mtlapi.o" "$RUNNER_TEMP/probe.o" -framework Metal -framework QuartzCore -framework Foundation \
            -o "$RUNNER_TEMP/metal_probe"
          set +e
          "$RUNNER_TEMP/metal_probe"
          status=$?
          set -e
          if [ "$status" = "2" ]; then
            echo "::warning::This runner has no Metal 4 GPU: the probe was compiled and linked but could not run"
            exit 0
          fi
          exit "$status"
