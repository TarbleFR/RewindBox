name: Direct per-game cheats
on:
  push:
    branches: [Claude]
    paths: [.github/workflows/direct-cheats.yml, 'packages/**', 'test/*unified*', 'tools/cheats/unified*', 'native/cheats/catalogue/**']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: direct-cheats-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    if: ${{ contains(github.event.head_commit.message, '[direct-code]') }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Changed Foundation and shared iPhone SDK
        run: python3 test/unified_catalog_ios_test.py
      - name: Host routing, native startup and option isolation
        run: python3 test/unified_identity_test.py
      - name: Three native menus and actual disabled import stores
        run: python3 test/unified_native_ios_test.py
      - name: Compile and link changed Libretro bridge
        run: python3 test/libretro_ios_syntax_test.py
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Direct switches and changed native menus on UIKit
        run: python3 test/unified_catalog_browser_ui_test.py --native --result evidence/direct-cheats.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-cheats-native-${{ github.sha }}
          path: evidence/
          retention-days: 14
  data:
    if: ${{ contains(github.event.head_commit.message, '[direct-data]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Changed PNACH identities, complete groups and PS3 source
        run: python3 -m unittest discover -s test -p 'test_unified_cheat_catalogue.py' -v
      - name: Validate every active and retired pack member
        run: |
          python3 tools/cheats/unified_catalogue.py validate --input native/cheats/catalogue
          python3 test/unified_catalog_runtime_test.py
          python3 test/unified_catalog_browser_ui_test.py
  index:
    if: ${{ contains(github.event.head_commit.message, '[direct-data]') }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Actual Foundation full index and menu allocation
        run: python3 test/unified_catalog_published_index_test.py
