name: Direct per-game cheats
on:
  push:
    branches: [Claude]
    paths: [.github/workflows/direct-cheats.yml, 'packages/**', 'test/*unified*', 'tools/cheats/unified*', 'native/cheats/catalogue/**']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: direct-cheats-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    if: ${{ contains(github.event.head_commit.message, '[direct-code]') }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Changed Foundation and shared iPhone SDK
        run: python3 test/unified_catalog_ios_test.py
      - name: Host routing, native startup and option isolation
        run: python3 test/unified_identity_test.py
      - name: Three native menus and actual disabled import stores
        run: python3 test/unified_native_ios_test.py
      - name: Compile and link changed Libretro bridge
        run: python3 test/libretro_ios_syntax_test.py
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Direct switches and changed native menus on UIKit
        run: python3 test/unified_catalog_browser_ui_test.py --native --result evidence/direct-cheats.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-cheats-native-${{ github.sha }}
          path: evidence/
          retention-days: 14
  data:
    if: ${{ contains(github.event.head_commit.message, '[direct-data]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Changed PNACH identities, complete groups and PS3 source
        run: python3 -m unittest discover -s test -p 'test_unified_cheat_catalogue.py' -v
      - name: Validate every active and retired pack member
        run: |
          python3 tools/cheats/unified_catalogue.py validate --input native/cheats/catalogue
          python3 test/unified_catalog_runtime_test.py
          python3 test/unified_catalog_browser_ui_test.py
  index:
    if: ${{ contains(github.event.head_commit.message, '[direct-data]') }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Actual Foundation full index and menu allocation
        run: python3 test/unified_catalog_published_index_test.py

  additional-proofs:
    if: ${{ contains(github.event.head_commit.message, '[direct-proofs]') }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Final three-engine menu SDK adapters
        run: python3 test/unified_native_ios_test.py --menus-only
      - name: Actual RPCS3 binding store SDK and Foundation
        run: python3 test/unified_native_ios_test.py --rpcs3-store-only
      - name: Pinned Core executable identity log parser
        run: |
          clang++ -std=c++20 -Wall -Wextra -Werror -I packages/rpcs3_internal_bridge/ios/Classes test/unified_rpcs3_ppu_identity_test.cpp -o /tmp/ppu-identity
          /tmp/ppu-identity
      - name: Final shared iPhone SDK and Foundation
        run: python3 test/unified_catalog_ios_test.py
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Direct switches, late callbacks and retained restore guards
        run: python3 test/unified_catalog_browser_ui_test.py --native --direct-fix-only --result evidence/direct-fix.xcresult
      - name: New boot adapter Foundation cases
        run: python3 -m unittest discover -s test -p unified_catalog_runtime_test.py -k actual_foundation -v
      - name: Automatic arcade startup regression
        run: python3 test/unified_identity_test.py --only-fbneo

  final-ui:
    if: ${{ contains(github.event.head_commit.message, '[direct-ui]') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Final shared catalogue iPhone SDK link
        run: python3 test/unified_catalog_ios_test.py IPhoneCatalogTests
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Exact switches, one edition confirmation and late completion
        run: python3 test/unified_catalog_browser_ui_test.py --native --direct-toggle-only --result evidence/final-direct.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-cheats-final-ui-${{ github.sha }}
          path: evidence/
          retention-days: 14

  runtime-contract:
    if: ${{ contains(github.event.head_commit.message, '[direct-runtime]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Exact active plus retired member contract
        run: python3 test/unified_catalog_runtime_test.py

  manual-import:
    if: ${{ contains(github.event.head_commit.message, '[direct-manual]') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Shared import iPhone SDK link
        run: python3 test/unified_catalog_ios_test.py IPhoneCatalogTests
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Real UIKit JSON import and stable disabled reimport
        run: python3 test/unified_catalog_browser_ui_test.py --native --manual-only --result evidence/manual-json.xcresult
