name: MeloNX stall watch
run-name: Stall watch on macOS and iOS typecheck • ${{ github.sha }}
# Lot 9. The host performance journal's native stall watch (MeloNXStallWatch in MeloNXPerfJournal.swift), executed on
# a real macOS arm64 runner: an engine call blocked while a named thread spins and another waits must be recorded with
# the right states, CPU deltas and kernel/user images, bounded to six stalls. The journal files are then typechecked
# for the iOS SDK at the bridge's deployment target. Nothing is built for delivery, packaged or pinned.
'on':
  push:
    branches:
    - work/melonx-fps-stability-20261103
    paths:
    - .github/workflows/melonx-stall-watch.yml
    - packages/melonx_internal_bridge/ios/Classes/MeloNXPerfJournal.swift
    - packages/melonx_internal_bridge/ios/Classes/MeloNXHotSpots.swift
    - packages/melonx_internal_bridge/ios/Classes/MeloNXHeapSample.swift
    - packages/melonx_internal_bridge/ios/Classes/MeloNXHeapSampler.m
    - packages/melonx_internal_bridge/ios/Classes/MeloNXHeapSampler.h
    - packages/melonx_internal_bridge/ios/Classes/MeloNXStandaloneParity.swift
    - test/melonx_perf_journal_test.py
    - test/melonx_input_stick_test.py
    - packages/melonx_internal_bridge/ios/Classes/MeloNXS2ArmProbeHook.m
    - packages/melonx_internal_bridge/ios/Classes/MeloNXS2ArmProbeHook.h
    - packages/melonx_internal_bridge/ios/Classes/MeloNXInternalBridgePlugin.swift
    - test/melonx_s2arm_probe_hook_test.py
permissions:
  contents: read
concurrency:
  group: melonx-stall-watch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stall-watch:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Execute the performance journal and its stall watch on macOS
      run: python3 test/melonx_perf_journal_test.py
    - name: Execute the input journal checks on macOS
      run: python3 test/melonx_input_stick_test.py
    - name: Execute the S2Arm diagnostic hook on macOS (clang, the launch's Swift call, fake probe)
      run: python3 test/melonx_s2arm_probe_hook_test.py
    - name: Compile the S2Arm diagnostic hook for the iOS SDK (arm64, iOS 18.0)
      run: |
        xcrun --sdk iphoneos clang -fobjc-arc -Wall -Werror -target arm64-apple-ios18.0 \
          -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -c packages/melonx_internal_bridge/ios/Classes/MeloNXS2ArmProbeHook.m -o /tmp/hook.o
        echo "iOS compile passed"
    - name: Compile the heap sampler for the iOS SDK (arm64, iOS 18.0)
      run: |
        xcrun --sdk iphoneos clang -Wall -Wextra -Werror -Os -target arm64-apple-ios18.0 \
          -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -c packages/melonx_internal_bridge/ios/Classes/MeloNXHeapSampler.m -o /tmp/heap-sampler.o
        xcrun nm /tmp/heap-sampler.o | grep -E " T _MeloNXHeapSampler(Start|Stop|Report)$" | wc -l | grep -qx " *3"
        echo "iOS compile passed"
    - name: Typecheck the journal for the iOS SDK (arm64, iOS 18.0, the bridge's deployment target)
      run: |
        xcrun --sdk iphoneos swiftc -typecheck -swift-version 5 -target arm64-apple-ios18.0 \
          -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
          packages/melonx_internal_bridge/ios/Classes/MeloNXStandaloneParity.swift \
          packages/melonx_internal_bridge/ios/Classes/MeloNXPerfJournal.swift \
          packages/melonx_internal_bridge/ios/Classes/MeloNXHotSpots.swift \
          packages/melonx_internal_bridge/ios/Classes/MeloNXHeapSample.swift
        echo "iOS typecheck passed"
