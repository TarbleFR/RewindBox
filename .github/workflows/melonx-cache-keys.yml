name: MeloNX pipeline cache keys measure
run-name: Pipeline cache keys • ${{ github.sha }}
# Lot 10. MoltenVK v1.4.2 with the recipe patch built for macOS: a pipeline cache under MeloNX's descriptor set layouts,
# whole configurations (shipped) against cache keys (fifth part of the patch), on the runner's real Metal device, and
# the property test of the key on MoltenVK's own matches() and alignWith(). Nothing is packaged, pinned or delivered.
'on':
  push:
    branches:
    - work/melonx-fps-stability-20261103
    paths:
    - .github/workflows/melonx-cache-keys.yml
    - test/melonx_cache_keys/**
    - build-utils/melonx/moltenvk/**
permissions:
  contents: read
concurrency:
  group: melonx-cache-keys-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Build the patched MoltenVK for macOS, check the key's equivalence and measure the cache under MeloNX's layouts
      run: python3 test/melonx_cache_keys/run_cache_keys.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: MeloNX-cache-keys-${{ github.sha }}
        path: |
          dist/melonx-cache-keys/*.json
          dist/melonx-cache-keys/*.log
        retention-days: 14
        if-no-files-found: error
