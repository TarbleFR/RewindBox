        shasum -a 256 build/delivery-artifact/*.ipa > build/delivery-artifact/SHA256SUMS


        python3 build-utils/delivery_metrics.py artifact_encryption python3 build-utils/delivery_cipher.py artifact build/delivery-artifact
        build/encrypted-delivery

        '
