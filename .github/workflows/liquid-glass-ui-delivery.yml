        python3 - <<'PY'\nimport zipfile,plistlib,os\nwith zipfile.ZipFile('dist/'+os.environ['IPA_NAME']+'.ipa') as z:\n\
        \    apps={n.split('/')[1] for n in z.namelist() if n.startswith('Payload/') and len(n.split('/'))>2 and n.split('/')[1].endswith('.app')}\n\
        \    assert len(apps)==1,apps\n    root='Payload/'+apps.pop()+'/'\n    info=plistlib.loads(z.read(root+'Info.plist'))\n\
        \    assert info.get('CADisableMinimumFrameDurationOnPhone') is True, 'iPhone ProMotion opt-in missing'\n    bridge=z.read(root+'Frameworks/dolphin_internal_bridge.framework/dolphin_internal_bridge')\n\
        \    for marker in (b'DolphinFramePacing',b'DOLDisplaySettings',b'MTLUsePresentDrawable',b'ShaderCompilationMode',b'setPreferredFrameRateRange:'):\n\
        \        assert marker in bridge,marker\n    # Build 440: Wii touch Shake and its controller assignment are in the\
        \ bridge.\n    for marker in (b'NeoStation.Dolphin.TouchShake',b'shakeBinding'):\n        assert marker in bridge,marker\n\
        \    # Build 440 120 Hz interface: the Flutter seam exists and the plugin is linked into Runner.\n    flutter=z.read(root+'Frameworks/Flutter.framework/Flutter')\n\
        \    for marker in (b'FlutterDisplayLinkManager',b'displayRefreshRate',b'maxRefreshRateEnabledOnIPhone'):\n      \
        \  assert marker in flutter,marker\n    runner=z.read(root+info['CFBundleExecutable'])\n    for marker in (b'NeoStation.UI.HighRefreshRate.Enabled',b'UiRefreshRatePlugin',b'neostation/ui_refresh_rate'):\n\
        \        assert marker in runner,marker\n    assert not any(n.startswith(root+'Frameworks/ui_refresh_rate.framework/')\
        \ for n in z.namelist()),'ui_refresh_rate must be linked into Runner'\n    # Build 447 AirPlay/external display: the\
        \ external scene role names the plugin's delegate and the dynamic framework is embedded.\n    external_roles=((info.get('UIApplicationSceneManifest')\
        \ or {}).get('UISceneConfigurations') or {}).get('UIWindowSceneSessionRoleExternalDisplayNonInteractive') or []\n\
        \    assert any(isinstance(r,dict) and r.get('UISceneDelegateClassName')=='NeoExternalDisplaySceneDelegate' and r.get('UISceneConfigurationName')=='neostation-external-display'\
        \ for r in external_roles),'external display scene role missing from Info.plist'\n    external_path=root+'Frameworks/external_display.framework/external_display'\n\
        \    assert external_path in z.namelist(),'external_display must be embedded as a dynamic framework'\n    external=z.read(external_path)\n\
        \    for marker in (b'NeoExternalDisplaySceneDelegate',b'neostation/external_display',b'NeoStation.ExternalDisplay.Mode'):\n\
        \        assert marker in external,marker\n    # Build 447: every bridge that adopts NeoExternalRenderHost (docs/external-display-universal.md\
        \ § 5) still carries the protocol.\n    for pod in ('dolphin_internal_bridge','libretro_internal_bridge','rpcs3_internal_bridge','armsx2_internal_bridge'):\n\
        \        assert b'NeoExternalRenderHost' in z.read(root+'Frameworks/'+pod+'.framework/'+pod),pod+' must adopt NeoExternalRenderHost'\n\
        PY\nARMSX2_SOURCE_REVISION=\"$(python3 -c 'import json; print(json.load(open(\"build-utils/armsx2/source.json\"))[\"\
