    - name: Verify final signed motion assets and linked native and Dart components
      run: python3 build-utils/validate_motion507_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --report build/delivery/motion507-ipa-validation.json
    - name: Verify final signed GoW3 Core identity and compiler broker
      run: python3 build-utils/validate_rpcs3_546_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --report build/delivery/rpcs3-memory-audit-ipa.json
    - name: Verify the compiled Liquid Glass interface, its preference key and the translated settings
      run: python3 build-utils/validate_liquid_glass_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --report build/delivery/liquid-glass-ui-ipa-validation.json
    - name: Verify the final signed Switch retirement and deletion fix
      run: python3 build-utils/validate_melonx_delete509_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --report
        build/delivery/melonx-delete509-ipa.json
    - name: Verify complete selection tracks and compiled Cover Flow and header correction
      run: python3 build-utils/validate_ui_correction511_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --report
        build/delivery/ui-correction511-ipa-validation.json
    - name: Verify final signed direct Switch playlist and compact header
      run: python3 build-utils/validate_navigation512_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --report
        build/delivery/navigation512-ipa-validation.json
