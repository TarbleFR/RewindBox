name: RewindBox private IPA 548 — Liquid Glass interface on the complete Claude host (546 host, RPCS3 546 Core, MeloNX close teardown)
run-name: RewindBox Build 548 — Liquid Glass UI — ${{ github.sha }}
'on':
  push:
    branches:
    - Claude
    paths:
    - .github/workflows/liquid-glass-ui-delivery.yml
  workflow_dispatch:
    inputs:
      recipient:
        description: Private Build548 public recipient
        required: false
        type: string
        default: build-utils/delivery-548-recipient.pem
permissions:
  contents: read
  actions: read
concurrency:
  group: rewindbox-private548-${{ github.sha }}
  cancel-in-progress: false
jobs:
  checks:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[retroarch-delivery]')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_NUMBER: '548'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Put every path the interface does not own back to the validated 546 delivery tree (working tree only)
      run: python3 .github/diagnostics/liquidglass_ui_delivery.py --restore-fixed-state
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
    - name: Analyze the complete application and exercise the Liquid Glass interface
      run: |
        flutter pub get --enforce-lockfile
        flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
        # neo_glass_bubble_test's "rapid focus changes" case fails on the base
        # commit too (it expects a transform absent since ab7997a); left out.
        # Serial: suites sharing the SQLite file lock each other out when run in parallel.
        flutter test --no-pub --reporter expanded --concurrency=1 --name '^(?!rapid focus changes retarget)' \
          test/interface_style_settings_test.dart test/liquid_glass_theme_test.dart \
          test/glass_performance_governor_test.dart test/interface_style_locale_test.dart \
          test/main_menu_tab_strip_styles_test.dart test/liquid_glass_settings_spacing_test.dart \
          test/interface_style_screen_test.dart test/main_menu_tab_strip_test.dart \
          test/neo_glass_bubble_test.dart test/menu_carousel_correction_test.dart \
          test/navigation512_switch_test.dart test/airplay_navigation_test.dart \
          test/liquid_motion_test.dart test/chrome_surface_test.dart \
          test/builtin_theme_catalog_test.dart test/startup_theme_cache_test.dart \
          test/theme_provider_background_persistence_test.dart test/gamepad_settings_scrolling_test.dart \
          test/general_settings_ui_refresh_rate_test.dart test/general_settings_external_display_test.dart \
          test/confirm_action_dialog_test.dart test/systems_update_dialog_test.dart \
          test/notification_bell_idle_test.dart test/system_bubble_render_test.dart \
          test/console_bubble_transition_test.dart test/header_battery_test.dart \
          test/legal_credits_dialog_test.dart test/ambient_music_locale_test.dart \
          test/libretro_engine_settings_test.dart test/library_reader_settings_sections_test.dart \
          test/neoplay_dialog_test.dart test/neo_swap_dialog_test.dart
    - name: Retain final highlighted-game import checks and the Liquid Glass test receipt
      run: python3 .github/diagnostics/liquidglass_ui_delivery.py --retain-checks
    - name: Retain exact input-bound test receipts
      uses: actions/upload-artifact@v4
      with:
        name: LiquidGlass-ui-checks-${{ github.sha }}
        path: build/delivery/*.json
        if-no-files-found: error
        retention-days: 14
  cold:
    name: Release device build • cold
    runs-on: macos-15
    timeout-minutes: 90
    needs:
    - checks
    env:
      BUILD_NUMBER: '548'
      DELIVERY_RECIPIENT: ${{ inputs.recipient || 'build-utils/delivery-548-recipient.pem' }}
      IPA_NAME: NeoStation
      ARTIFACT_NAME: RewindBox-Build548-${{ github.sha }}-cold
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      DOLPHIN_CORE_HOST_SHA: ae7d46f90dff64ce698b8c18e0c12510dbae96fe
      ARMSX2_CORE_HOST_SHA: 1343906f05e33b40f10f7026a1a6e2327c338d0e
      ARMSX2_CORE_RUN_ID: '39178893158'
      RPCS3_CORE_HOST_SHA: 343649293c6c0d3b945dd9c1dd9a42090a385066
      RPCS3_CORE_RUN_ID: '40230183096'
      LIBRETRO_CORES_HOST_SHA: ab9361c29f7c9ab769c4263dd8b7427fc4f4c036
      LIBRETRO_CORES_VALIDATED_SHA: ab9361c29f7c9ab769c4263dd8b7427fc4f4c036
      LIBRETRO_CORES_RUN_ID: '39455712245'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
      DELIVERY_METRICS: ${{ github.workspace }}/build/delivery/timings.jsonl
      CACHE_NAMESPACE: ${{ (inputs.benchmark == true || contains(github.event.head_commit.message, '[benchmark-build]')) &&
        github.run_id || 'normal' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_PATH: ${{ github.workspace }}/build/ruby-gems
      DELIVERY_MODE: cold
    steps:
    - name: Checkout exact candidate
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Put every path the interface does not own back to the validated 546 delivery tree (working tree only)
      run: python3 .github/diagnostics/liquidglass_ui_delivery.py --restore-fixed-state
    - name: Load exact local import and historical Foundation receipts
      uses: actions/download-artifact@v4
      with:
        name: LiquidGlass-ui-checks-${{ github.sha }}
        path: build/delivery
    - name: Select Xcode 26.3 for NeoPlay and Google Cast
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Set up Flutter 3.47.2
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
        cache-key: neostation-benchmark-sdk-${{ runner.os }}-${{ runner.arch }}-3.47.2-${{ env.CACHE_NAMESPACE }}
        pub-cache-key: neostation-benchmark-pub-${{ runner.os }}-${{ runner.arch }}-3.47.2-${{ hashFiles('pubspec.lock') }}-${{
          env.CACHE_NAMESPACE }}
    - name: Record exact build environment and start measurement
      run: 'mkdir -p build/delivery

        python3 build-utils/delivery_benchmark.py environment

        python3 .github/diagnostics/liquidglass_ui_delivery.py --scope "${{ inputs.validation_scope || ''full'' }}"

        '
    - name: Record empty device build cache
      id: state
      uses: actions/cache/restore@v4
      with:
        path: .ci-cache
        key: neostation-device-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.3-flutter3.47.2-${{ github.sha }}-${{ env.BUILD_NUMBER
          }}-${{ hashFiles('pubspec.lock', 'build-utils/Gemfile.dolphin') }}-${{ env.CACHE_NAMESPACE }}
    - name: Assert the benchmark device cache is empty
      if: ${{ inputs.benchmark == true || contains(github.event.head_commit.message, '[benchmark-build]') }}
      run: test "${{ steps.state.outputs.cache-hit }}" != true
    - name: Resolve locked Dart dependencies
      run: python3 build-utils/delivery_metrics.py dart_dependencies flutter pub get --enforce-lockfile
    - name: Prepare lightweight build tools
      shell: bash
      run: 'set -euo pipefail

        export BUNDLE_PATH="$GITHUB_WORKSPACE/build/ruby-gems"

        echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

        python3 build-utils/delivery_metrics.py ruby_dependencies bundle install

        '
    - name: Generate iOS host
      shell: bash
      run: 'set -euo pipefail

        flutter config --no-enable-swift-package-manager

        test ! -d ios

        python3 build-utils/delivery_metrics.py host_scaffold_and_registrant python3 packages/dolphin_internal_bridge/ci/build_support.py
        scaffold

        '
    - name: Download last published RewindBox IPA 527 (release 0.0.9)
      shell: bash
      run: "set -euo pipefail\nmkdir -p build/native-baseline\ncurl --fail --location --retry 3 \\\n  https://github.com/TarbleFR/RewindBox/releases/download/0.0.9/RewindBox-Build527.ipa\
        \ \\\n  --output build/native-baseline/RewindBox-Build527.ipa\npython3 build-utils/game_content_gate.py build/native-baseline/RewindBox-Build527.ipa\n"
    - name: Reuse verified components and resources from published IPA 527
      shell: bash
      run: "set -euo pipefail\npython3 build-utils/prepare_release527_native_runtime.py \\\n  build/native-baseline/RewindBox-Build527.ipa\
        \ --build-number \"$BUILD_NUMBER\"\n"
    - name: Restore unchanged canonical StikJIT compilation interfaces
      id: stik
      uses: actions/cache@v4
      with:
        path: build/stikjit-current
        key: stikjit-interfaces-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('build-utils/stikjit/source.json','build-utils/patch_stikjit_rpcs3.py','build-utils/patch_stikjit_compat.py','build-utils/install_patched_stikjit.py','build-utils/build_patched_stikjit.py')
          }}-37844950677
    - name: Build canonical StikJIT from pinned sources for iOS 18 26 and 27
      shell: bash
      run: 'set -euo pipefail

        command -v xcodegen || brew install xcodegen

        python3 build-utils/build_patched_stikjit.py 2>&1 | tee "$RUNNER_TEMP/neoswap-stikjit-step.log"

        python3 test/stikjit_unified_build_test.py 2>&1 | tee -a "$RUNNER_TEMP/neoswap-stikjit-step.log"

        '
      if: ${{ steps.stik.outputs.cache-hit != 'true' }}
    - name: Install verified cached StikJIT interfaces
      if: ${{ steps.stik.outputs.cache-hit == 'true' }}
      run: python3 build-utils/install_patched_stikjit.py build/stikjit-current/StikJIT.xcframework
    - name: Require completed exact NeoSwap Core before artifact download
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\npython3 - <<'PYCOREWAIT'\nimport json,os,subprocess,time\nendpoint='repos/TarbleFR/RewindBox/actions/runs/'+os.environ['RPCS3_CORE_RUN_ID']\n\
        deadline=time.monotonic()+7200\nwhile True:\n    result=json.loads(subprocess.check_output(['gh','api',endpoint]))\n\
        \    assert result['head_sha']==os.environ['RPCS3_CORE_HOST_SHA'],result\n    if result['status']=='completed':\n\
        \        assert result['conclusion']=='success',result\n        print('Verified successful exact NeoSwap Core',result['id'],result['head_sha'])\n\
        \        break\n    assert time.monotonic()<deadline,'NeoSwap Core did not finish within the allowed wait'\n    print('Waiting\
        \ for exact Core',result['id'],result['status'],flush=True)\n    time.sleep(30)\nPYCOREWAIT\n"
    - name: Wait for the exact source-built546 RPCS3 Core
      run: python3 .github/diagnostics/liquidglass_ui_delivery.py --wait-for-components
    - name: Download pinned passive RPCS3 Core
      uses: actions/download-artifact@v4
      with:
        name: RPCS3Core-${{ env.RPCS3_CORE_HOST_SHA }}
        run-id: ${{ env.RPCS3_CORE_RUN_ID }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/rpcs3-native
    - name: Verify and install passive RPCS3 Core
      shell: bash
      run: "set -euo pipefail\nSOURCE=dist/rpcs3-native/libRPCS3Core.dylib\nIDENTITY=dist/rpcs3-native/identity.json\nCORE=packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib\n\
        test -s \"$SOURCE\"\ntest -s \"$IDENTITY\"\ntest -s \"$CORE\"\n# The artifact's source, canonical patch, compiler\
        \ recipe, binary\n# checks and native ABI must all be from the same Core commit.\nRPCS3_PIN_GUARD=.github/diagnostics/rpcs3cell546_delivery.py\n\
        # RPCS3_CORE_INPUTS_BEGIN\npython3 \"$RPCS3_PIN_GUARD\" --rpc-core-inputs \"$RPCS3_CORE_HOST_SHA\" -- \\\n  test/rpcs3_restore_eof_test.py\
        \ \\\n  test/native/rpcs3_savestate_harness.cpp \\\n  test/rpcs3_build265_core_test.py \\\n  packages/rpcs3_internal_bridge/ios/Classes/Rpcs3InternalBridgePlugin.mm\
        \ \\\n  test/rpcs3_gow3_restore_regression_test.py \\\n  test/fixtures/rpcs3_gow3_restore.diff \\\n  .github/diagnostics/rpcs3gow3_core.py\
        \ \\\n  test/rpcs3_gow3_boot_regression_test.py \\\n  test/fixtures/rpcs3_memory_audit/JITLLVM.diff \\\n  .github/workflows/rpcs3-memory-audit.yml\
        \ \\\n  test/rpcs3_core_syntax_gate_test.py \\\n  test/rpcs3_memory_audit_test.py \\\n  test/native/rpcs3_memory_audit_test.cpp\
        \ \\\n  packages/neo_swap/ios/Classes/NeoSwapCompilerAPI.h \\\n  packages/neo_swap/ios/Classes/NeoSwapCompilerBudget.h\
        \ \\\n  native/neoswap-storage/StorageABI.h \\\n  native/neoswap-storage/Client.h \\\n  native/neoswap-storage/ShaderKey.h\
        \ \\\n  test/rpcs3_shader_storage_test.py \\\n  test/native/rpcs3_shader_storage_client_test.cpp \\\n  native/neoswap-storage/SourceABI.h\
        \ \\\n  native/neoswap-storage/SourceClient.h \\\n  native/neoswap-storage/SourceClient.cpp \\\n  native/neoswap-storage/FrameClient.h\
        \ \\\n  native/neoswap-storage/VideoBuffer.h \\\n  test/rpcs3_video_frame_archive_test.py \\\n  test/native/rpcs3_video_frame_archive_test.cpp\
        \ \\\n  build-utils/run_vdec_archive_validation.sh \\\n  test/rpcs3_source_archive_test.py \\\n  test/native/rpcs3_source_archive_client_test.cpp\
        \ \\\n  build-utils/build_rpcs3_embedded_core.sh \\\n  build-utils/materialize_rpcs3_core.py \\\n  build-utils/apply_rpcs3_llvm_patch.py\
        \ \\\n  build-utils/rpcs3/canonical-source.json \\\n  build-utils/rpcs3/embedded-core.patch \\\n  build-utils/rpcs3/llvm-aarch64-ghc-emergency-spill.patch\
        \ \\\n  build-utils/rpcs3_core_syntax_gate.py \\\n  build-utils/validate_rpcs3_embedded_core.py \\\n  build-utils/validate_rpcs3_passive_dlopen.py\
        \ \\\n  build-utils/patch_rpcs3_build301_passive_dlopen.py \\\n  packages/rpcs3_internal_bridge/ios/Classes/Rpcs3CoreABI.h\
        \ \\\n  packages/neo_swap/ios/Classes/NeoSwap.h \\\n  packages/neo_swap/ios/Classes/NeoSwapClientStats.h \\\n  packages/neo_swap/ios/Classes/NeoSwapRelay.h\
        \ \\\n  native/neoswap/NeoSwapClient.h \\\n  test/neo_swap_core_pin_test.py \\\n  test/neoswap_rpcs3_allocator_test.cpp\
        \ \\\n  test/neoswap_cpu_buffers_test.cpp \\\n  test/rpcs3_neoswap_vulkan_buffer_test.py \\\n  test/native/rpcs3_neoswap_vulkan_buffer_test.cpp\
        \ \\\n  test/rpcs3_neoswap_relay_test.py \\\n  test/native/rpcs3_neoswap_relay_test.cpp \\\n  test/rpcs3_core_syntax_gate_test.py\
        \ \\\n  test/rpcs3_embedded_core_validator_test.py \\\n  test/rpcs3_preprocessor_balance_test.py \\\n  test/rpcs3_build301_passive_dlopen_test.py\
        \ \\\n  test/rpcs3_atomic_startup_test.py \\\n  test/rpcs3_failed_startup_test.py \\\n  test/rpcs3_build264_gow3_core_test.py\
        \ \\\n  test/rpcs3_build351_gow3_engine_test.py \\\n  test/rpcs3_build352_gow3_memory_test.py \\\n  test/rpcs3_build353_xitrix_v010_test.py\
        \ \\\n  test/rpcs3_armsx3_performance_patch_test.py \\\n  test/rpcs3_build435_core_delta_test.py \\\n  test/native/rpcs3_build435_core_delta_test.cpp\
        \ \\\n  test/rpcs3_build444_core_delta_test.py \\\n  test/native/rpcs3_build444_core_delta_test.cpp \\\n  test/rpcs3_build481_spu_object_cache_test.py\
        \ \\\n  test/native/rpcs3_build481_spu_object_cache_test.cpp \\\n  test/native/rpcs3_spu_object_relocation_test.cpp\
        \ \\\n  test/rpcs3_build483_llvm_pipeline_test.py \\\n  test/native/rpcs3_llvm_pipeline_harness.cpp \\\n  test/rpcs3_build499_spu_audit_test.py\
        \ \\\n  test/native/rpcs3_build499_spu_audit_test.cpp \\\n  test/rpcs3_build487_core_diagnostics_test.py \\\n  test/native/rpcs3_build487_profiler_helpers_test.cpp\
        \ \\\n  test/native/rpcs3_build487_boot_diagnostics_test.cpp \\\n  test/native/rpcs3_build487_lever_helpers_test.cpp\
        \ \\\n  test/native/rpcs3_build487_retention_sequence_test.cpp \\\n  test/rpcs3_build487_host_diagnostics_test.py\
        \ \\\n  test/rpcs3_build258_core_architecture_test.py \\\n  test/rpcs3_ios_ppu_compile_budget_test.cpp \\\n  test/rpcs3_ppu_no_size_split_policy_test.cpp\
        \ \\\n  test/rpcs3_xitrix_v0101_native_test.py \\\n  test/rpcs3_xitrix_v011_native_test.py \\\n  test/native/rpcs3_spu_analyzer_support.h\
        \ \\\n  test/native/rpcs3_spu_branch_analyzer_test.cpp \\\n  test/rpcs3_spu_warmup_test.py \\\n  test/native/rpcs3_spu_warmup_test.cpp\
        \ \\\n  test/native/rpcs3_vk_memory_pressure_test.cpp \\\n  test/native/rpcs3_vk_conditional_render_test.cpp \\\n\
        \  test/native/rpcs3_neoswap_stats_getter_test.cpp \\\n  .github/workflows/rpcs3-core.yml\n# RPCS3_CORE_INPUTS_END\n\
        # The independent host broker/donation is rebuilt by this IPA job.\n# Only the Core source, client ABI, recipe and\
        \ native tests are pinned.\n# The guard above validates all original Core inputs in an exact ABI view.\npython3 -\
        \ <<'PY'\nimport json, os, shutil, sys\nfrom pathlib import Path\nsys.path.insert(0, 'build-utils')\nsys.path.insert(0,\
        \ 'test')\nsys.path.insert(0, '.github/diagnostics')\nfrom rpcs3cell546_delivery import validate_rpc_core_identity\
        \ as validate_core_input_identity\nfrom validate_rpcs3_ipa import validate_core_identity\nfrom validate_rpcs3_embedded_core\
        \ import validate_core\nfrom validate_rpcs3_passive_dlopen import validate as validate_passive_dlopen\n\nsource =\
        \ Path('dist/rpcs3-native/libRPCS3Core.dylib')\nidentity_path = Path('dist/rpcs3-native/identity.json')\ndestination\
        \ = Path('packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib')\ndata = source.read_bytes()\nidentity\
        \ = validate_core_identity(data, identity_path, os.environ['RPCS3_CORE_HOST_SHA'])\nvalidate_core(data)\nassert identity['neoswap_client_abi']\
        \ == 1, identity\nassert identity['neoswap_client_stats_abi'] == 1, identity\nassert identity['neoswap_relay_abi']\
        \ == 1, identity\nassert identity['neoswap_prepared_relay_abi'] == 1, identity\nassert identity['neoswap_relay_client_stats_abi']\
        \ == 1, identity\nassert identity['neoswap_storage_abi'] == 1, identity\nassert identity['neoswap_source_archive_abi']\
        \ == 1, identity\nvalidate_core_input_identity(identity)\npassive = validate_passive_dlopen(data)\nassert passive['forbiddenReachability']\
        \ is False, passive\n\nshutil.copy2(source, destination)\ndestination.chmod(0o755)\nassert destination.read_bytes()\
        \ == data, 'RPCS3 Core installation changed artifact bytes'\nfast_path = Path('build/fast-native/identity.json')\n\
        fast = json.loads(fast_path.read_text())\nfast.update({\n    'rpcs3CoreSha256': identity['sha256'],\n    'rpcs3CoreHostCommit':\
        \ identity['host_commit'],\n    'rpcs3CoreSourceCommit': identity['source_commit'],\n    'rpcs3CorePatchSha256': identity['source_patch_sha256'],\n\
        \    'rpcs3CoreAbiVersion': identity['abi_version'],\n    'rpcs3CoreRunId': int(os.environ['RPCS3_CORE_RUN_ID']),\n\
        \    'rpcs3PassiveDlopen': passive,\n})\nfast_path.write_text(json.dumps(fast, indent=2) + '\\n')\nshutil.copy2(identity_path,\
        \ 'build/fast-native/rpcs3-core-identity.json')\nprint(json.dumps({'identity': identity, 'passiveDlopen': passive},\
        \ indent=2))\nPY\nfile \"$CORE\"\ntest \"$(lipo -archs \"$CORE\")\" = arm64\nnm -gU \"$CORE\" > build/rpcs3-core-exports.txt\n\
        python3 - <<'PY'\nimport sys\nfrom pathlib import Path\nsys.path.insert(0, 'build-utils')\nfrom validate_rpcs3_ipa\
        \ import REQUIRED_CORE_SYMBOLS, FORBIDDEN_CORE_SYMBOLS\nexports = Path('build/rpcs3-core-exports.txt').read_text().splitlines()\n\
        symbols = {line.split()[-1] for line in exports if line.split()}\nmissing = (set(REQUIRED_CORE_SYMBOLS) | {\n    '_rpcs3_ios_set_compiler_budget_api',\n\
        \    '_rpcs3_ios_set_neoswap_api', '_rpcs3_ios_get_neoswap_client_stats',\n    '_rpcs3_ios_install_patch_repository',\
        \ '_rpcs3_ios_enumerate_runtime_patches',\n    '_rpcs3_ios_set_runtime_patch_enabled', '_rpcs3_ios_enumerate_games',\n\
        }) - symbols\nforbidden = set(FORBIDDEN_CORE_SYMBOLS) & symbols\nassert not missing, f'Missing RPCS3 Core exports:\
        \ {sorted(missing)}'\nassert not forbidden, f'Retired RPCS3 Core exports: {sorted(forbidden)}'\nPY\n"
    - name: Verify retained Dolphin Core from IPA 527
      shell: bash
      run: "set -euo pipefail\nCORE=\"packages/dolphin_internal_bridge/ios/Frameworks/DolphinCore.framework/DolphinCore\"\n\
        test -s \"$CORE\"\ntest -d ios/Runner/Sys\ntest -s ios/Runner/cacert.pem\n\n# The published Build 527 IPA carries\
        \ the validated signed Dolphin\n# runtime. Refuse it if any source defining that ABI has changed.\ngit diff --exit-code\
        \ \"$DOLPHIN_CORE_HOST_SHA\" \"$GITHUB_SHA\" -- \\\n  build-utils/patch_dolphin_internal_core_v2.py \\\n  packages/dolphin_internal_bridge/core\
        \ \\\n  test/dolphin_cheat_manager_test.py \\\n  test/dolphin_cheats_menu_test.py\n\npython3 - <<'PY'\nimport hashlib\n\
        import json\nimport os\nfrom pathlib import Path\n\nimport subprocess\nrecipe = '.github/workflows/dolphin-core.yml'\n\
        original = subprocess.check_output(['git', 'show', os.environ['DOLPHIN_CORE_HOST_SHA'] + ':' + recipe])\ncurrent =\
        \ Path(recipe).read_bytes()\nassert current == original.replace(b'Checkout exact NeoStation commit', b'Checkout exact\
        \ RewindBox commit'), 'Unreviewed Dolphin recipe change'\n\n# This is a recompiled UIKit host API, not the retained\
        \ core's C ABI.\n# Permit exactly the added navigation callback, preserving every other declaration.\nimport subprocess\n\
