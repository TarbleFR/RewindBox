        build/delivery/melonx-launch514-ipa-validation.json
    - name: Verify the exact packaged key import correction
      run: python3 build-utils/validate_melonx_keys_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --core-source
        d9f35c2783f7368d31b61f644d970f41bb7bc47b --core-run 40210266656 --report build/delivery/melonx-keys517-ipa-validation.json
    - name: Verify the compiled foreground presentation correction
