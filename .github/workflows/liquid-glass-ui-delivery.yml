    - name: Seal every executable, framework and extension for SideStore
      run: 'python3 build-utils/delivery_metrics.py signature_and_ipa_export python3 build-utils/delivery_benchmark.py seal

        '
    - name: Preserve sealed IPA and source receipts before final compatibility validators
      run: 'set -euo pipefail

        mkdir -p build/recovery-artifact

        cp dist/NeoStation.ipa "build/recovery-artifact/RewindBox-Build${BUILD_NUMBER}-${GITHUB_SHA}-recovery.ipa"

        cp build/delivery/*.json build/recovery-artifact/

        shasum -a 256 build/recovery-artifact/*.ipa > build/recovery-artifact/SHA256SUMS

        python3 build-utils/delivery_cipher.py artifact build/recovery-artifact build/encrypted-recovery

        python3 build-utils/split_encrypted_delivery.py build/encrypted-recovery build/encrypted-recovery-parts

        '
    - name: Preserve sealed recovery piece 1 of 4
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}-recovery-part00
        path: build/encrypted-recovery-parts/part00/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - name: Preserve sealed recovery piece 2 of 4
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}-recovery-part01
        path: build/encrypted-recovery-parts/part01/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - name: Preserve sealed recovery piece 3 of 4
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}-recovery-part02
        path: build/encrypted-recovery-parts/part02/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - name: Preserve sealed recovery piece 4 of 4
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}-recovery-part03
        path: build/encrypted-recovery-parts/part03/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - name: Verify actual packaged MeloNX exports, helper identity and native notices
