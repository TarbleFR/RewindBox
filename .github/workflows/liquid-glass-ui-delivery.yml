      run: 'mkdir -p build/delivery-artifact

        cp dist/NeoStation.ipa "build/delivery-artifact/RewindBox-Build${BUILD_NUMBER}-${GITHUB_SHA}-${DELIVERY_MODE}.ipa"

        cp build/delivery/*.json build/delivery-artifact/

