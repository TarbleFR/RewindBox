name: RewindBox liquid glass and AirPlay rehearsal
on:
  push:
    branches: [work/liquid-glass-airplay-20261022]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rewindbox-liquid-airplay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Liquid material and sequential AirPlay navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Preserve the startup chantier, engines, storage and twelve languages
        run: |
          git diff --check
          git diff --exit-code 654263ac09ad192360064f92dedcb4f9442bde38 -- native packages assets ios build-utils pubspec.yaml pubspec.lock lib/main.dart lib/screens/systems_screen/system_content.dart lib/l10n lib/services lib/repositories lib/models lib/providers lib/screens/system_games_list
          python3 test/retroarch_baseline_scope_test.py
      - name: Rehearse only the deferred tab-dispatch integration
        run: |
          mkdir -p build/bubble-review
          git apply --check integration/liquid-airplay-app-screen.patch
          git apply integration/liquid-airplay-app-screen.patch
          git diff -- lib/screens/app_screen.dart > build/bubble-review/rehearsed-app-screen.patch
          git rev-parse HEAD > build/bubble-review/tested-commit.txt
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.2', channel: stable, cache: true}
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Analyze the full application with the rehearsed integration
        run: flutter analyze --no-pub
      - name: Exercise the material, inverse transition and every navigation source
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: >-
          flutter test --no-pub --reporter expanded --timeout 90s
          test/airplay_navigation_test.dart
          test/nav_tabs_test.dart
          test/main_menu_tab_strip_test.dart
          test/neo_glass_bubble_test.dart
          test/console_bubble_transition_test.dart
          test/system_bubble_render_test.dart
          test/neoplay_dialog_test.dart
          test/ios_gamepad_navigation_test.dart
          test/horizontal_swipe_test.dart
      - name: Retain reviewable source formatting
        if: always()
        run: |
          git diff --name-only 654263ac09ad192360064f92dedcb4f9442bde38 -- '*.dart' | xargs -r dart format
          git diff -- '*.dart' > build/bubble-review/format-and-integration.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RewindBox-liquid-airplay-review-${{ github.sha }}
          path: build/bubble-review
          if-no-files-found: error
          retention-days: 14
