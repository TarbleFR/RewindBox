name: Shader compiler coexistence
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-diagnosis:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Fetch the two pinned source inputs
      run: |
        git init -q "$RUNNER_TEMP/dolphin-ios"
        git -C "$RUNNER_TEMP/dolphin-ios" sparse-checkout set --no-cone /Externals/glslang/
        git -C "$RUNNER_TEMP/dolphin-ios" fetch -q --depth 1 --filter=blob:none https://github.com/OatmealDome/dolphin-ios 7cac54161659421ed95c2cd1c0b0746539a4cd38
        git -C "$RUNNER_TEMP/dolphin-ios" checkout -q FETCH_HEAD
        commit=$(python3 -c "import json; print(json.load(open('packages/neo_shader_kit/ios/Resources/slang-catalog.json'))['source']['commit'])")
        git init -q "$RUNNER_TEMP/slang-shaders"
        git -C "$RUNNER_TEMP/slang-shaders" fetch -q --depth 1 https://github.com/libretro/slang-shaders "$commit"
        git -C "$RUNNER_TEMP/slang-shaders" checkout -q FETCH_HEAD
    - name: Reproduce native compilation in Runner's dylib load order
      run: >-
        python3 test/neo_shader_compiler_coexistence.py --dolphin-ios "$RUNNER_TEMP/dolphin-ios"
        --slang-shaders "$RUNNER_TEMP/slang-shaders" --evidence evidence/compiler --diagnose
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: compiler-coexistence-${{ github.sha }}
        path: |
          evidence/compiler/*.txt
          evidence/compiler/*.json
        retention-days: 14
