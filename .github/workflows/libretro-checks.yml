name: Libretro engine checks
'on':
  push:
    branches:
    - Claude
    paths:
    - .github/workflows/libretro-checks.yml
    - packages/libretro_internal_bridge/**
    - packages/neo_shader_kit/ios/Classes/Public/**
    - packages/neo_shader_kit/ios/neo_shader_kit.podspec
    - lib/services/libretro_*.dart
    - lib/l10n/libretro_locale.dart
    - lib/widgets/libretro_internal_playlist_actions.dart
    - lib/services/game/game_launch_service.dart
    - lib/screens/game_screen/my_games_list.dart
    - lib/screens/game_screen/game_settings_dialog/game_settings_emulator_tab.dart
    - lib/screens/libretro/**
    - lib/screens/settings_screen/new_settings_options/directories_settings_content.dart
    - lib/services/ios_library_root_relocation.dart
    - lib/services/neostation_rom_library.dart
    - lib/widgets/setup_wizard.dart
    - lib/main.dart
    - test/libretro_*
    - test/ios_library_root_relocation_test.dart
    - test/neostation_rom_library_test.dart
    - lib/widgets/header.dart
    - lib/widgets/header_battery.dart
    - lib/services/controller_battery_service.dart
    - packages/neoplay_bridge/**
    - test/header_battery_test.dart
    - test/libretro_host/**
    - test/libretro_simulator/**
    - test/libretro_channel_codec/**
    - lib/services/embedded_ios_session_status.dart
    - build-utils/libretro/**
    - build-utils/validate_libretro_ipa.py
    - assets/data/libretro_bios_requirements.json
    - assets/data/libretro_skin_overlays.json
    - tools/build_skin_overlay_catalog.py
    - lib/utils/nav_tabs.dart
    - lib/widgets/main_menu_tab_strip.dart
    - lib/screens/app_screen.dart
    - lib/screens/settings_screen/new_settings_options/tools_settings_content.dart
    - lib/screens/storage/**
    - lib/services/storage/**
    - lib/repositories/storage_maintenance_repository.dart
    - lib/l10n/storage_locale.dart
    - test/storage_*
    - lib/widgets/libretro_engine_panel.dart
    - lib/widgets/system_emulator_settings_dialog.dart
    - lib/widgets/system_emulator_settings_dialog/**
    - lib/l10n/ios_setup_locale.dart
    - lib/l10n/app_locale_*.dart
    - test/nav_tabs_test.dart
    - test/main_menu_tab_strip_test.dart
    - test/jit_backend_preference_service_test.dart
    - test/fixtures/libretro_bios/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: libretro-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    # Room for the channel codec test (Build 454): the bridge built twice for
    # the iOS Simulator and one simulator boot.
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Run the portable host against a test core
      run: python3 test/libretro_host_test.py
    - name: Run the portable frontend modules (geometry, controls, settings, skins)
      # Runs even when an earlier native check failed, so one CI round reports every
      # native problem; the job still fails.
      if: ${{ !cancelled() }}
      run: python3 test/libretro_frontend_test.py
    - name: Compile and render every shader preset with Metal
      if: ${{ !cancelled() }}
      run: python3 test/libretro_shader_test.py
    - name: Compile every bridge and rcheevos source for iPhone
      if: ${{ !cancelled() }}
      run: python3 test/libretro_ios_syntax_test.py
    # Build 454: the plugin's isSessionActive answer encoded by the real
    # Flutter.framework of the pinned SDK in the iOS Simulator, compared with
    # the bytes the Dart tests feed to the MethodChannel
    # (test/libretro_session_envelopes.dart).
    - name: Fetch the pinned Flutter for the channel codec test
      if: ${{ !cancelled() }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
    - name: Encode isSessionActive with the real Flutter codec in the iOS Simulator
      if: ${{ !cancelled() }}
      run: |
        flutter precache --ios
        python3 test/libretro_channel_codec_test.py --evidence evidence/channel-codec/this-commit --label "${GITHUB_SHA}"
    - name: The same test on the Build 453 sources reproduces the int32 answer
      if: ${{ !cancelled() }}
      run: |
        git worktree add --detach "$RUNNER_TEMP/build-453" 81efc2109e1052678bd881b8fc7c8dc1c53aa8bc
        python3 test/libretro_channel_codec_test.py --sources "$RUNNER_TEMP/build-453/packages/libretro_internal_bridge/ios" \
          --expect unfixed --evidence evidence/channel-codec/build-453 --label 81efc2109e1052678bd881b8fc7c8dc1c53aa8bc
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-channel-codec-${{ github.sha }}
        path: evidence/channel-codec/
        if-no-files-found: warn
        retention-days: 14
  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
    - name: Analyze
      run: |
        flutter pub get --enforce-lockfile
        flutter analyze --no-fatal-infos
    - name: Libretro, launch and library tests
      run: |
        flutter test test/libretro_locale_test.dart test/libretro_core_catalog_test.dart test/frontend_media_gate_test.dart test/rom_folder_registration_test.dart test/library_scan_restart_test.dart test/retroarch_library_protocol_test.dart test/retroarch_library_cache_test.dart test/retroarch_launch_diagnostics_test.dart test/retroarch_sync_locale_test.dart test/ios_selective_rollback_test.dart test/armsx2_retroarch_routing_isolation_test.dart test/game_repository_test.dart test/system_repository_test.dart test/rpcs3_embedded_identity_test.dart test/audio_policy_service_test.dart test/libretro_skin_service_test.dart test/libretro_skin_catalog_test.dart test/libretro_skin_catalogs_test.dart test/libretro_skin_manager_test.dart test/libretro_playlist_actions_test.dart test/ios_library_root_relocation_test.dart test/neostation_rom_library_test.dart test/header_battery_test.dart test/libretro_main_menu_test.dart test/libretro_consoles_tab_test.dart test/nav_tabs_test.dart test/main_menu_tab_strip_test.dart test/libretro_bios_catalog_test.dart test/libretro_bios_check_service_test.dart test/libretro_bios_checker_screen_test.dart test/libretro_bios_launch_test.dart test/jit_backend_preference_service_test.dart test/libretro_engine_settings_test.dart test/gamepad_settings_scrolling_test.dart test/armsx2_embedded_library_contract_test.dart test/libretro_3ds_language_test.dart test/libretro_core_option_store_test.dart test/libretro_3ds_system_data_service_test.dart test/libretro_3ds_system_screen_test.dart test/libretro_3ds_launch_default_test.dart test/libretro_3ds_encrypted_launch_test.dart test/console_manager_test.dart test/libretro_session_probe_codec_test.dart test/libretro_resolution_test.dart test/libretro_resolution_screen_test.dart test/legal_credits_dialog_test.dart
        # Build 447: storage analysis and cleanup, with the fifth Tools row
        # (docs/storage-audit-cleanup.md § 5).
        flutter test test/storage_*_test.dart
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
        run-id: '38638115521'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Source contracts
      run: |
        python3 test/libretro_azahar_package_test.py
        python3 test/libretro_add_cores_test.py
        python3 test/libretro_core_options_test.py --cores dist/libretro
        python3 test/libretro_bios_requirements_test.py --cores dist/libretro
        python3 test/libretro_route_contract_test.py
        python3 test/libretro_shader_catalog_test.py
        python3 test/libretro_frontend_ui_contract_test.py
        python3 test/integrated_import_tab_contract_test.py
        python3 test/localization_12_locale_coverage_test.py
        python3 test/cheats_media_source_contract_test.py
        python3 test/retroarch_baseline_scope_test.py
        python3 test/game_audio_handoff_test.py
        python3 test/embedded_engine_route_contract_test.py

  skin-press:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Download the unchanged pinned libretro cores
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-fdeaef56f1acdeb3afa4fd0ef42e94114bc4a258
        run-id: '38638115521'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Fetch the pinned simulator renderer and original test content
      run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/probe-inputs"
    - name: Skin artwork and delivered inputs in actual embedded sessions
      run: |
        python3 test/libretro_skin_press_probe.py --cores dist/libretro --inputs "$RUNNER_TEMP/probe-inputs" \
          --evidence evidence/skin-press --label "${GITHUB_SHA}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libretro-skin-press-${{ github.sha }}
        path: evidence/skin-press/
        retention-days: 14
        if-no-files-found: warn
