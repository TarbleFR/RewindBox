name: Build 496 PSP relaunch and frozen HD catalogue
on:
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: psp496-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Reproduce the reservation gap on 495 and verify three corrected relaunches
        run: python3 test/psp_relaunch496.py native
      - uses: actions/download-artifact@v4
        with:
          name: LibretroCores-4c2186204ce06b50b989689a9c2322068f523a58
          run-id: '39366986940'
          github-token: ${{ github.token }}
          path: dist/libretro
      - name: Fetch pinned test content and Simulator dependencies
        run: python3 test/libretro_simulator_probe.py fetch --into "$RUNNER_TEMP/psp496-inputs"
      - name: Alternate 32 and 64 MiB PSP sessions and another core in one process
        run: python3 test/psp_relaunch496.py simulator run --cores dist/libretro --inputs "$RUNNER_TEMP/psp496-inputs" --evidence build/psp496/simulator --label "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psp496-${{ github.sha }}
          path: build/psp496/
          retention-days: 14
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify final generated catalogue and changed publication boundaries
        run: |
          python3 tools/textures/build_catalogue.py --check
          python3 test/texture_catalogue_publication_test.py
          python3 test/texture_yandex_host_test.py
          python3 test/texture_verify_checks_test.py
          python3 tools/textures/check_ci_records.py
          python3 tools/textures/count_packs.py
