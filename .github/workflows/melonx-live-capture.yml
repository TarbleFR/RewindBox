name: MeloNX live capture
run-name: Live capture on macOS and iOS typecheck • ${{ github.sha }}
# Lot 10. The freeze recorder and live copy of the performance journal (MeloNXLiveCapture.swift) executed on a real
# macOS arm64 runner against the computer-side receiver (tools/melonx/live_capture.py), then typechecked for the iOS
# SDK at the bridge's deployment target with the journal files it writes through. Nothing is built for delivery.
'on':
  push:
    branches:
    - work/melonx-lot10-20261112
    paths:
    - .github/workflows/melonx-live-capture.yml
    - packages/melonx_internal_bridge/ios/Classes/MeloNXLiveCapture.swift
    - packages/melonx_internal_bridge/ios/Classes/MeloNXPerfJournal.swift
    - packages/melonx_internal_bridge/ios/Classes/MeloNXHotSpots.swift
    - packages/melonx_internal_bridge/ios/Classes/MeloNXStandaloneParity.swift
    - tools/melonx/live_capture.py
    - test/melonx_live_capture_test.py
    - test/melonx_perf_journal_test.py
permissions:
  contents: read
concurrency:
  group: melonx-live-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-capture:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Execute the recorder against the receiver on macOS
      run: python3 test/melonx_live_capture_test.py
    - name: Execute the performance journal it shares its writer with
      run: python3 test/melonx_perf_journal_test.py
    - name: Typecheck for the iOS SDK (arm64, iOS 18.0, the bridge's deployment target)
      run: |
        xcrun --sdk iphoneos swiftc -typecheck -swift-version 5 -target arm64-apple-ios18.0 \
          -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
          packages/melonx_internal_bridge/ios/Classes/MeloNXStandaloneParity.swift \
          packages/melonx_internal_bridge/ios/Classes/MeloNXPerfJournal.swift \
          packages/melonx_internal_bridge/ios/Classes/MeloNXHotSpots.swift \
          packages/melonx_internal_bridge/ios/Classes/MeloNXHeapSample.swift \
          packages/melonx_internal_bridge/ios/Classes/MeloNXLiveCapture.swift
        echo "iOS typecheck passed"
