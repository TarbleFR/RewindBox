name: S2Arm engine (iOS) build check
# Builds S2Arm's own iOS engine at the pinned commit (`make ios`: runtime, graphics,
# NativeAOT services, codecs, NS2Pro), with no game, with only the patches of
# build-utils/s2arm/engine/patches applied (first one: build with an SDK older than iOS 27).
# It proves the toolchain on GitHub's macOS
# runners and records what the engine is made of (images, sizes, exported and undefined symbols),
# for the common IPA's authenticated engine pin. No game, key or Nintendo file is used.
# Claude pushes require [s2arm-engine] to compile or [s2arm-pin ...] to pin;
# Standalone shader or thermal checks run the host suites without producing another framework.
# A follow-up [s2arm-check-delivery] push checks out the exact preceding private IPA
# commit. It reruns the GPU fixtures without building or publishing a second engine.
'on':
  workflow_dispatch:
  push:
    branches: [Claude]
    paths:
      - .github/workflows/s2arm-engine.yml
      - build-utils/s2arm/engine/**
      - build-utils/embed_legal_bundle.py
      - tools/s2arm_prototype/pin.json
      - tools/s2arm_a18pro/pipeline_driver.*
      - tools/s2arm_a18pro/nvn2_metrics/**
      - tools/s2arm_a18pro/parallelism/**
      - docs/evidence/s2arm-0437-review/matrices/replay.py
      - docs/evidence/s2arm-0437-review/homebrew/pacing/measure.*
      - docs/evidence/s2arm-0437-review/homebrew/pacing/parallel_summary.py
      - build-utils/s2arm/engine-pin.json
      - build-utils/s2arm/engine_pin.py
permissions:
  contents: read
concurrency:
  # Builds and pins retain their own source identity; neither cancels an in-progress producer.
  group: s2arm-engine-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  engine:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[s2arm-engine]') || contains(github.event.head_commit.message, '[s2arm-check-delivery]') || (contains(github.event.head_commit.message, '[s2arm-shader-checks]') || (contains(github.event.head_commit.message, '[s2arm-thermal-checks]') || (contains(github.event.head_commit.message, '[s2arm-archive-check]') || (contains(github.event.head_commit.message, '[s2arm-gpu-textures]') || (contains(github.event.head_commit.message, '[s2arm-pipeline-driver]') || (contains(github.event.head_commit.message, '[s2arm-bounds-clamp]') || (contains(github.event.head_commit.message, '[s2arm-homebrew-pacing]') || contains(github.event.head_commit.message, '[s2arm-parallel-bench]') || contains(github.event.head_commit.message, '[s2arm-lab]'))))))))))) && !contains(github.event.head_commit.message, '[s2arm-pin ') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((contains(github.event.head_commit.message, '[s2arm-check-delivery]') || ((contains(github.event.head_commit.message, '[s2arm-shader-checks]') || (contains(github.event.head_commit.message, '[s2arm-thermal-checks]') || (contains(github.event.head_commit.message, '[s2arm-archive-check]') || (contains(github.event.head_commit.message, '[s2arm-gpu-textures]') || (contains(github.event.head_commit.message, '[s2arm-pipeline-driver]') || (contains(github.event.head_commit.message, '[s2arm-bounds-clamp]') || (contains(github.event.head_commit.message, '[s2arm-homebrew-pacing]') || contains(github.event.head_commit.message, '[s2arm-parallel-bench]') || contains(github.event.head_commit.message, '[s2arm-lab]')))))))) && !contains(github.event.head_commit.message, '[s2arm-engine]'))) && '["macos-26"]' || '["macos-26","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      TEST_ONLY: ${{ (contains(github.event.head_commit.message, '[s2arm-check-delivery]') || ((contains(github.event.head_commit.message, '[s2arm-shader-checks]') || (contains(github.event.head_commit.message, '[s2arm-thermal-checks]') || (contains(github.event.head_commit.message, '[s2arm-archive-check]') || (contains(github.event.head_commit.message, '[s2arm-gpu-textures]') || (contains(github.event.head_commit.message, '[s2arm-pipeline-driver]') || (contains(github.event.head_commit.message, '[s2arm-bounds-clamp]') || (contains(github.event.head_commit.message, '[s2arm-homebrew-pacing]') || contains(github.event.head_commit.message, '[s2arm-parallel-bench]') || contains(github.event.head_commit.message, '[s2arm-lab]')))))))) && !contains(github.event.head_commit.message, '[s2arm-engine]'))) && 'yes' || 'no' }}
      FIRST_RACE: ${{ (contains(github.event.head_commit.message, '[s2arm-first-race]') || contains(github.event.head_commit.message, '[s2arm-check-delivery]')) && 'yes' || 'no' }}
      CHECK_DELIVERY: ${{ contains(github.event.head_commit.message, '[s2arm-check-delivery]') && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ contains(github.event.head_commit.message, '[s2arm-check-delivery]') && github.event.before || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the exported symbol list tool
        run: python3 -B test/s2arm_engine_exports_test.py
      - name: Fetch S2Arm at the pinned commit
        env:
          COMPARE_BINDINGS: ${{ matrix.os == 'macos-26' && (contains(github.event.head_commit.message, '[s2arm-compare-bindings]') || (contains(github.event.head_commit.message, '[s2arm-bounds-repeat]') || contains(github.event.head_commit.message, '[s2arm-bounds-clamp]'))) }}
          COMPARE_UPLOAD: ${{ contains(github.event.head_commit.message, '[s2arm-compare-upload]') }}
        run: |
          set -euo pipefail
          commit=$(python3 -c "import json;print(json.load(open('tools/s2arm_prototype/pin.json'))['s2arm']['commit'])")
          repository=$(python3 -c "import json;print(json.load(open('tools/s2arm_prototype/pin.json'))['s2arm']['repository'])")
          git init -q "$RUNNER_TEMP/s2arm"
          for attempt in 1 2 3; do
            if git -C "$RUNNER_TEMP/s2arm" fetch -q --depth 1 "$repository" "$commit"; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$((attempt * 3))"
          done
          git -C "$RUNNER_TEMP/s2arm" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/s2arm" rev-parse HEAD)" = "$commit"
          mkdir -p proof
          echo "s2arm $commit" > proof/inputs.txt
          # RewindBox patch series against the pin (build-utils/s2arm/engine/patches, applied in order).
          for patch in $(ls build-utils/s2arm/engine/patches/*.patch 2>/dev/null | sort); do
            if [[ "$COMPARE_UPLOAD" == true ]]; then
              case "$(basename "$patch")" in
                0432-*) cp "$RUNNER_TEMP/s2arm/graphics/nvn/gfx/nvn/nvn_present_fi.inc" "$RUNNER_TEMP/fi-before-0432.inc" ;;
                0437-*) mkdir -p "$RUNNER_TEMP/0436/graphics/nvn"
                        cp -R "$RUNNER_TEMP/s2arm/graphics/nvn/gfx" "$RUNNER_TEMP/0436/graphics/nvn/" ;;
              esac
            fi
            if [[ "$COMPARE_BINDINGS" == true && "$(basename "$patch")" == 0442-* ]]; then
              nvn=graphics/nvn/gfx/nvn
              mkdir -p "$RUNNER_TEMP/0441/graphics/nvn/gfx"
              cp -R "$RUNNER_TEMP/s2arm/$nvn" "$RUNNER_TEMP/0441/graphics/nvn/gfx/"
            fi
            git -C "$RUNNER_TEMP/s2arm" apply --whitespace=nowarn "$GITHUB_WORKSPACE/$patch"
            echo "patch $(basename "$patch") $(shasum -a 256 "$patch" | cut -d' ' -f1)" | tee -a proof/inputs.txt
          done
      - name: Verify the tested source equals the delivered engine pin
        if: env.CHECK_DELIVERY == 'yes'
        env:
          DELIVERY_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DELIVERY_SHA"
          git log -1 --format=%s | grep -E '^\[ipa-delivery:[0-9]+\]'
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          pin = json.loads(Path("build-utils/s2arm/engine-pin.json").read_bytes())
          source = pin["identity"]["sourceIdentity"]
          upstream = json.loads(Path("tools/s2arm_prototype/pin.json").read_bytes())["s2arm"]["commit"]
          patches = [{"name": p.name, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
                     for p in sorted(Path("build-utils/s2arm/engine/patches").glob("*.patch"))]
          assert source["s2arm_commit"] == upstream and source["patches"] == patches
          print(f"Testing delivery {os.environ['DELIVERY_SHA']}, {len(patches)} pinned patches, engine {pin['packagedFingerprint']}")
          PYTHON
      - name: Select the newest installed Xcode with an iPhoneOS SDK
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app | tee proof/xcodes.txt
          best=
          for app in $(ls -d /Applications/Xcode*.app | sort -V); do
            [ -L "$app" ] && continue
            if DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version > /dev/null 2>&1; then best=$app; fi
          done
          test -n "$best"
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          {
            echo "selected $best"
            DEVELOPER_DIR="$best/Contents/Developer" xcodebuild -version
            echo "iphoneos SDK $(DEVELOPER_DIR="$best/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version)"
            echo "S2Arm pins: $(grep -E '^(IPHONEOS_DEPLOYMENT_TARGET|IPHONEOS_SDK_MAJOR)=' "$RUNNER_TEMP/s2arm/tools/toolchain.env" | tr '\n' ' ')"
          } | tee -a proof/inputs.txt
      - name: Check Zelda allocator, dispatch, probe and wake diagnostic policies
        if: contains(github.event.head_commit.message, '[s2arm-zelda-check]')
        run: |
          set -euo pipefail
          engine="$RUNNER_TEMP/s2arm"
          xcrun --sdk macosx clang -std=gnu11 -O2 -Wall -Wextra -Werror -pthread \
            -I"$engine/runtime/include" -I"$engine/runtime/src" -I"$engine/graphics/nvn/gfx/nvn" -I"$engine/graphics/nvn/gfx/nvn/include" \
            build-utils/s2arm/engine/tests/zelda_diag.c -o "$RUNNER_TEMP/zelda-diag"
          "$RUNNER_TEMP/zelda-diag" | tee proof/zelda-diag-clang.txt
          xcrun --sdk macosx clang -std=gnu11 -O1 -fobjc-arc -fblocks \
            -Werror=implicit-function-declaration -I"$engine/graphics/nvn/gfx/nvn" \
            -I"$engine/graphics/nvn/tests" -I"$engine/runtime/include" \
            build-utils/s2arm/engine/tests/test_metal_archive.m \
            -framework Foundation -framework Metal -o "$RUNNER_TEMP/archive-error-check"
          "$RUNNER_TEMP/archive-error-check" --error-nil | tee proof/archive-error-nil.txt
      - name: Check adaptive shader cache changes
        id: adaptive_shader_checks
        continue-on-error: true
        if: matrix.os == 'macos-26' && (contains(github.event.head_commit.message, '[s2arm-shader-checks]') || contains(github.event.head_commit.message, '[s2arm-archive-check]') || env.CHECK_DELIVERY == 'yes')
        run: |
          set -euo pipefail
          source_tree="$RUNNER_TEMP/s2arm"
          for fixture in spec_gate stage_input pso_trace archive_index local_stage look_budget working_set upload_stream file_hint pool_index registration_plan alias_key warm_order dsnap_rule; do
            xcrun --sdk macosx clang -std=gnu11 -D_DARWIN_C_SOURCE -O2 -Wall -Wextra -pthread \
              "$source_tree/graphics/nvn/tests/t_rb_$fixture.c" -o "$RUNNER_TEMP/t_rb_$fixture"
            "$RUNNER_TEMP/t_rb_$fixture"
          done
          xcrun --sdk macosx clang -x objective-c -std=gnu11 -fblocks -pthread -framework Foundation \
            "$source_tree/graphics/nvn/tests/t_dsh_stats.c" -o "$RUNNER_TEMP/t_dsh_stats"
          "$RUNNER_TEMP/t_dsh_stats" --rb-stage-recovery
          sh build-utils/s2arm/engine/tests/test_metal_archive.sh "$source_tree"
      - name: Measure gaps across concurrent submissions and presentation
        if: matrix.os == 'macos-26' && env.FIRST_RACE == 'yes'
        run: |
          set -eu
          xcrun clang -std=c11 -O2 -Wall -Wextra -Werror "$RUNNER_TEMP/s2arm/graphics/nvn/tests/t_rb_submit_gap.c" -o "$RUNNER_TEMP/submit-gap"
          "$RUNNER_TEMP/submit-gap"
          python3 -B test/s2arm_shader_session_metrics_test.py
          python3 -B "$RUNNER_TEMP/s2arm/graphics/tools/direct/tests/test_rb_mkw_external_profile.py"
          xcrun clang -std=c11 -O2 -Wall -Wextra -Werror "$RUNNER_TEMP/s2arm/graphics/nvn/tests/t_rb_course_history.c" -o "$RUNNER_TEMP/rb-course-history"
          "$RUNNER_TEMP/rb-course-history"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the build tools S2Arm's makefiles call
        run: |
          set -euo pipefail
          command -v rg > /dev/null || brew install ripgrep
          for tool in meson ninja; do command -v $tool > /dev/null || brew install $tool; done   # services/dav1d/build.sh
          echo "meson $(meson --version) ninja $(ninja --version)" | tee -a proof/inputs.txt
          rg --version | head -1 | tee -a proof/inputs.txt
          # GNU timeout only (services/nxaot.sh calls it); the BSD tools stay first on PATH.
          if ! command -v timeout > /dev/null; then
            brew list coreutils > /dev/null 2>&1 || brew install coreutils
            mkdir -p "$RUNNER_TEMP/shim"
            ln -sf "$(command -v gtimeout)" "$RUNNER_TEMP/shim/timeout"
            echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
          fi
          "$RUNNER_TEMP/shim/timeout" --version 2>/dev/null | head -1 | tee -a proof/inputs.txt || timeout --version | head -1 | tee -a proof/inputs.txt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: sources-cache
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/s2arm-build-cache/sources
          key: s2arm-sources-v1-${{ hashFiles('tools/s2arm_prototype/pin.json') }}
      - name: Prefetch and rehash the pinned codec source archives
        run: |
          set -euo pipefail
          python3 build-utils/s2arm/engine/prefetch_sources.py "$RUNNER_TEMP/s2arm" \
            "$RUNNER_TEMP/s2arm-build-cache/sources" | tee -a proof/inputs.txt
      - name: Locate the Metal compiler for the iOS framework
        if: env.TEST_ONLY != 'yes' || (matrix.os == 'macos-26' && (contains(github.event.head_commit.message, '[s2arm-gpu-textures]') || contains(github.event.head_commit.message, '[s2arm-pipeline-driver]') || contains(github.event.head_commit.message, '[s2arm-homebrew-check]') || contains(github.event.head_commit.message, '[s2arm-first-draw]') || contains(github.event.head_commit.message, '[s2arm-wide-mem-check]') || contains(github.event.head_commit.message, '[s2arm-global-opt-check]') || contains(github.event.head_commit.message, '[s2arm-gpu-ab]') || contains(github.event.head_commit.message, '[s2arm-shader-metrics]') || contains(github.event.head_commit.message, '[s2arm-mesh-barrier]')))
        run: |
          if ! xcrun --sdk iphoneos metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk iphoneos metal --version
      - name: Compare texture uploads and motion-vector shaders
        if: matrix.os == 'macos-26' && contains(github.event.head_commit.message, '[s2arm-compare-upload]')
        run: |
          set -euo pipefail
          evidence=docs/evidence/s2arm-0437-review
          engine="$RUNNER_TEMP/s2arm"
          baseline="$RUNNER_TEMP/0436"
          python3 "$evidence/compare.py" "$baseline" "$engine" proof/upload-times.csv | tee proof/upload-check.txt
          fi=graphics/nvn/gfx/nvn/nvn_present_fi.inc
          rc=0
          python3 "$evidence/fi_motion_check.py" "$RUNNER_TEMP/fi-before-0432.inc" "$baseline/$fi" "$engine/$fi" "$RUNNER_TEMP/fi-motion" | tee proof/fi-motion.txt || rc=$?
          case $rc in
            0) echo "GPU parity verified" >> proof/fi-motion.txt ;;
            77) echo "GPU comparison unavailable on this runner" >> proof/fi-motion.txt ;;
            *) exit "$rc" ;;
          esac
      - name: Compare bounds writes and feedback bookkeeping on synthetic bindings
        if: matrix.os == 'macos-26' && contains(github.event.head_commit.message, '[s2arm-compare-bindings]')
        run: |
          set -euo pipefail
          evidence=docs/evidence/s2arm-0437-review
          python3 "$evidence/feedback/replay.py" "$RUNNER_TEMP/0441" "$RUNNER_TEMP/s2arm" --csv proof/feedback.csv | tee proof/feedback.txt
          python3 "$evidence/pipeline/replay.py" "$RUNNER_TEMP/0441" "$RUNNER_TEMP/s2arm" --csv proof/pipeline-keys.csv | tee proof/pipeline-keys.txt
      - name: Compare arena bounds writes and cached lookups
        if: matrix.os == 'macos-26' && (contains(github.event.head_commit.message, '[s2arm-compare-bindings]') || contains(github.event.head_commit.message, '[s2arm-bounds-repeat]'))
        run: |
          set -euo pipefail
          evidence=docs/evidence/s2arm-0437-review
          python3 "$evidence/bounds/compare_ubolen.py" "$RUNNER_TEMP/0441" "$RUNNER_TEMP/s2arm" proof/bounds
          python3 "$evidence/bounds/report.py" proof/bounds/{forward,reverse,control}.tsv | tee proof/bounds/summary.txt
      - name: Compare effective uniform bounds with present and changing backing sizes
        if: matrix.os == 'macos-26' && contains(github.event.head_commit.message, '[s2arm-bounds-clamp]')
        run: |
          set -euo pipefail
          python3 docs/evidence/s2arm-0437-review/bounds/clamp/compare.py "$RUNNER_TEMP/0441" "$RUNNER_TEMP/s2arm" proof/effective-bounds | tee proof/effective-bounds.txt
      - name: Compare partial CPU writes to pitched two-dimensional textures
        if: matrix.os == 'macos-26' && contains(github.event.head_commit.message, '[s2arm-linear-region]')
        run: |
          set -euo pipefail
          src=docs/evidence/s2arm-0437-review/linear-region
          result="$RUNNER_TEMP/cpu-region"
          python3 "$src/run.py" "$RUNNER_TEMP/s2arm" "$result"
          mkdir -p proof/cpu-region
          cp "$result"/{verify.txt,edges.txt,warm0.csv,warm1.csv,cold0.csv,cold1.csv} proof/cpu-region/
          python3 "$src/analyze.py" "$result" > proof/cpu-region/comparison.csv
      - name: Check dirty linear texture regions with a native Metal round trip
        if: matrix.os == 'macos-26' && contains(github.event.head_commit.message, '[s2arm-linear-pages]')
        run: |
          set -euo pipefail
          python3 docs/evidence/s2arm-0437-review/linear-pages/compare.py "$RUNNER_TEMP/s2arm" "$RUNNER_TEMP/linear-pages" | tee proof/linear-pages.txt
      - name: Compare packed and padded linear CPU texture transfers
        if: matrix.os == 'macos-26' && contains(github.event.head_commit.message, '[s2arm-linear-copy]')
        run: |
          set -euo pipefail
          evidence=docs/evidence/s2arm-0437-review/linear-textures
          python3 "$evidence/run.py" "$RUNNER_TEMP/s2arm" "$RUNNER_TEMP/linear-copy"
          mkdir -p proof/linear-copy
          cp "$RUNNER_TEMP/linear-copy"/{verify.txt,timing-0.csv,timing-1.csv} proof/linear-copy/
          cat proof/linear-copy/verify.txt
          python3 "$evidence/report.py" proof/linear-copy/timing-{0,1}.csv | tee proof/linear-copy/summary.txt
      - name: Compare launch widths for native Metal texture uploads
        if: matrix.os == 'macos-26' && contains(github.event.head_commit.message, '[s2arm-gpu-textures]')
        env:
          CONFIRM: ${{ contains(github.event.head_commit.message, '[s2arm-texture-confirm]') }}
        run: |
          set -euo pipefail
          rc=0
          args=()
          if [[ "$CONFIRM" == true ]]; then args+=(--confirm); fi
          python3 docs/evidence/s2arm-0437-review/gpu-textures/compare.py "$RUNNER_TEMP/s2arm" "${args[@]}" | tee proof/gpu-texture.txt || rc=$?
          case $rc in
            0) echo "CPU reference matches every GPU workload" >> proof/gpu-texture.txt ;;
            77) echo "Metal device unavailable on runner" >> proof/gpu-texture.txt ;;
            *) exit "$rc" ;;
          esac
      - name: Measure CPU and GPU intervals for identical offscreen homebrew frames
        if: matrix.os == 'macos-26' && contains(github.event.head_commit.message, '[s2arm-homebrew-pacing]')
        env:
          HOST_REPORT: ${{ contains(github.event.head_commit.message, '[s2arm-pacing-host]') }}
        run: |
          set -euo pipefail
          rc=0
          args=()
          if [[ "$HOST_REPORT" == true ]]; then args+=(--host-report); fi
          python3 docs/evidence/s2arm-0437-review/homebrew/pacing/measure.py proof/pacing-frames.csv "${args[@]}" | tee proof/pacing-summary.csv || rc=$?
          if [[ "$rc" == 77 ]]; then echo 'No Metal device available'; elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
      - name: Measure four offscreen Metal submission policies
        if: matrix.os == 'macos-26' && contains(github.event.head_commit.message, '[s2arm-parallel-bench]')
        run: |
          set -euo pipefail
          rc=0
          python3 docs/evidence/s2arm-0437-review/homebrew/pacing/measure.py proof/parallel-frames.csv --parallel-depths | tee proof/parallel-summary.csv || rc=$?
          if [[ "$rc" == 77 ]]; then echo 'Metal device unavailable' | tee proof/parallel-unavailable.txt; elif [[ "$rc" != 0 ]]; then exit "$rc"; fi
      - name: Check encoder handoff, refused Metal presentation and ordered NVN replay
        if: matrix.os == 'macos-26' && contains(github.event.head_commit.message, '[s2arm-parallel-bench]')
        working-directory: ${{ runner.temp }}/s2arm
        env:
          S2A_DEVELOPER_DIR: ${{ env.DEVELOPER_DIR }}
          S2A_BUILD_CACHE: ${{ runner.temp }}/s2arm-build-cache
        run: |
          set -euo pipefail
          tests="$GITHUB_WORKSPACE/build-utils/s2arm/engine/tests"
          proof="$GITHUB_WORKSPACE/proof"
          make -C graphics/nvn mac
          make -j4 -f Makefile -f "$tests/host-tests.mk" build/tests/t_nvn_wait_event build/tests/t_nvn_gpu_halt build/tests/t_nvn_rb_replay_metrics
          for early in 0 1; do
            S2A_RB_REC_EARLY="$early" build/tests/t_nvn_wait_event --rb-encode-worker | tee "$proof/parallel-encode-$early.txt"
          done
          if [[ -f "$proof/parallel-unavailable.txt" ]]; then
            echo "Offscreen Metal unavailable. Replay and native GPU halt checks require a device." >> "$GITHUB_STEP_SUMMARY"
          else
            NXGAL_BE=mtl3 build/tests/t_nvn_gpu_halt | tee "$proof/parallel-gpu-halt.txt"
            python3 "$tests/parallel_replay.py" build/tests/t_nvn_rb_replay_metrics "$proof/parallel-replay" | tee "$proof/parallel-replay.txt"
            backend=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["baseline"]["backend"])' "$proof/parallel-replay/parallel-validation.json")
            if [[ "$backend" == Metal4 ]]; then
              NXGAL_BE=mtl3 python3 "$tests/parallel_replay.py" build/tests/t_nvn_rb_replay_metrics "$proof/parallel-replay-m3" | tee "$proof/parallel-replay-m3.txt"
            elif [[ "$backend" == Metal3 ]]; then
              echo "Native host selected Metal 3. Metal 4 execution unavailable." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Unrecognized replay backend: $backend" >&2
              exit 1
            fi
            for arm in baseline combined; do
              python3 "$GITHUB_WORKSPACE/tools/s2arm_a18pro/parallelism/timeline.py" "$proof/parallel-replay/${arm}_trace.diagnostic.log" --timeline "$proof/parallel-timeline-$arm.json" > "$proof/parallel-frames-$arm.json"
            done
          fi
      - name: Compare translated homebrew outputs to independent Vulkan reference bytes
        if: matrix.os == 'macos-26' && contains(github.event.head_commit.message, '[s2arm-homebrew-check]')
        run: |
          set -euo pipefail
          rc=0
