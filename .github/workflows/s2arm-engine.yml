name: S2Arm engine (iOS) build check
# Builds S2Arm's own iOS engine at the pinned commit, unmodified (`make ios`: runtime, graphics,
# NativeAOT services, codecs, NS2Pro), with no game. It proves the toolchain on GitHub's macOS
# runners and records what the engine is made of (images, sizes, exported and undefined symbols),
# before any change that would host it inside RewindBox. Switch 2 test line only; nothing here is
# part of the common IPA and no game, key or Nintendo file is used.
'on':
  workflow_dispatch:
  push:
    branches: [work/s2arm-switch2-prototype-20261110]
    paths:
      - .github/workflows/s2arm-engine.yml
      - build-utils/s2arm/engine/**
      - tools/s2arm_prototype/pin.json
permissions:
  contents: read
concurrency:
  group: s2arm-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch S2Arm at the pinned commit
        run: |
          set -euo pipefail
          commit=$(python3 -c "import json;print(json.load(open('tools/s2arm_prototype/pin.json'))['s2arm']['commit'])")
          repository=$(python3 -c "import json;print(json.load(open('tools/s2arm_prototype/pin.json'))['s2arm']['repository'])")
          git init -q "$RUNNER_TEMP/s2arm"
          git -C "$RUNNER_TEMP/s2arm" fetch -q --depth 1 "$repository" "$commit"
          git -C "$RUNNER_TEMP/s2arm" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/s2arm" rev-parse HEAD)" = "$commit"
          mkdir -p proof
          echo "s2arm $commit" > proof/inputs.txt
      - name: Select the newest installed Xcode with an iPhoneOS SDK
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app | tee proof/xcodes.txt
          best=
          for app in $(ls -d /Applications/Xcode*.app | sort -V); do
            [ -L "$app" ] && continue
            if DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version > /dev/null 2>&1; then best=$app; fi
          done
          test -n "$best"
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          {
            echo "selected $best"
            DEVELOPER_DIR="$best/Contents/Developer" xcodebuild -version
            echo "iphoneos SDK $(DEVELOPER_DIR="$best/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version)"
            echo "S2Arm pins: $(grep -E '^(IPHONEOS_DEPLOYMENT_TARGET|IPHONEOS_SDK_MAJOR)=' "$RUNNER_TEMP/s2arm/tools/toolchain.env" | tr '\n' ' ')"
          } | tee -a proof/inputs.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the build tools S2Arm's makefiles call
        run: |
          set -euo pipefail
          command -v rg > /dev/null || brew install ripgrep
          for tool in meson ninja; do command -v $tool > /dev/null || brew install $tool; done   # services/dav1d/build.sh
          echo "meson $(meson --version) ninja $(ninja --version)" | tee -a proof/inputs.txt
          rg --version | head -1 | tee -a proof/inputs.txt
          # GNU timeout only (services/nxaot.sh calls it); the BSD tools stay first on PATH.
          if ! command -v timeout > /dev/null; then
            brew list coreutils > /dev/null 2>&1 || brew install coreutils
            mkdir -p "$RUNNER_TEMP/shim"
            ln -sf "$(command -v gtimeout)" "$RUNNER_TEMP/shim/timeout"
            echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
          fi
          "$RUNNER_TEMP/shim/timeout" --version 2>/dev/null | head -1 | tee -a proof/inputs.txt || timeout --version | head -1 | tee -a proof/inputs.txt
      - name: Prefetch the codec sources hosted outside GitHub, with retries
        # Run 43024225545: downloads.xiph.org reset the connection on both runners. The archives go
        # where S2Arm's fetch_source.sh looks first (<cache>/sources/<sha256>/<file>), checked by SHA-256.
        working-directory: ${{ runner.temp }}/s2arm
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/s2arm-build-cache/sources"
          fetch() {  # <build script> <file pattern> <url pattern>, $VER substituted
            line=$(grep -m1 -E '^VER=[^;]+; SHA=[0-9a-f]{64}' "$1")
            ver=$(printf '%s' "$line" | sed -E 's/^VER=([^;]+);.*/\1/'); sha=$(printf '%s' "$line" | sed -E 's/.*SHA=([0-9a-f]{64}).*/\1/')
            file=${2//\$VER/$ver}; url=${3//\$VER/$ver}
            mkdir -p "$cache/$sha"
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o "$cache/$sha/$file.part" "$url"
            echo "$sha  $cache/$sha/$file.part" | shasum -a 256 -c -
            mv "$cache/$sha/$file.part" "$cache/$sha/$file"
            echo "prefetched $file $sha" | tee -a "$GITHUB_WORKSPACE/proof/inputs.txt"
          }
          fetch services/opus/build.sh 'opus-$VER.tar.gz' 'https://downloads.xiph.org/releases/opus/opus-$VER.tar.gz'
          fetch services/dav1d/build.sh 'dav1d-$VER.tar.xz' 'https://downloads.videolan.org/pub/videolan/dav1d/$VER/dav1d-$VER.tar.xz'
      - name: Build S2Arm's iOS engine with no game (make ios)
        working-directory: ${{ runner.temp }}/s2arm
        env:
          S2A_DEVELOPER_DIR: ${{ env.DEVELOPER_DIR }}
          S2A_RUN_ROOT: ${{ runner.temp }}/s2arm-run
          S2A_BUILD_CACHE: ${{ runner.temp }}/s2arm-build-cache
          NUGET_PACKAGES: ${{ runner.temp }}/nuget
        shell: bash --noprofile --norc {0}
        run: |
          set -u
          out="$GITHUB_WORKSPACE/proof"
          export DOTNET="$(command -v dotnet)"
          dotnet --info > "$out/dotnet-info.txt" 2>&1
          head -8 "$out/dotnet-info.txt" >> "$out/inputs.txt"
          start=$(date +%s)
          status=0
          make ios > "$out/make-ios.log" 2>&1 || status=$?
          echo "make ios exit=$status seconds=$(( $(date +%s) - start ))" | tee "$out/result.txt"
          tail -60 "$out/make-ios.log"
          for f in build/cs/*.err; do [ -s "$f" ] && { echo "== $f"; tail -60 "$f"; cp "$f" "$out/"; }; done
          find "$S2A_RUN_ROOT" -name publish.log -print 2>/dev/null | while read -r f; do
            echo "== $f"; grep -E " error |error [A-Z]+[0-9]+" "$f" | sort -u | head -40
            cp "$f" "$out/nxaot-publish-$(basename "$(dirname "$f")").log"
          done
          exit $status
      - name: Inventory the engine (images, sizes, symbols)
        if: always()
        working-directory: ${{ runner.temp }}/s2arm
        run: |
          set -uo pipefail
          out="$GITHUB_WORKSPACE/proof"
          app=build/ios/S2Arm.app
          [ -d "$app" ] || { echo "no $app" | tee "$out/inventory.txt"; exit 0; }
          {
            echo "== bundle"; du -sh "$app"
            echo "== files"; find "$app" -type f -exec ls -l {} + | awk '{print $5, $9}' | sort -k2
            echo "== Mach-O images"
            find "$app" -type f | while read -r f; do file "$f" | grep -q Mach-O && { echo "-- $f"; xcrun size -m "$f" | grep -E 'Segment|total' | head -12; otool -L "$f" | tail -n +2; }; done
            echo "== executable: defined external symbols"; nm -gU "$app/S2Arm" | wc -l
            echo "== executable: undefined symbols (count, then non-system)"; nm -u "$app/S2Arm" | wc -l
          } > "$out/inventory.txt" 2>&1
          nm -gU "$app/S2Arm" | awk '{print $3}' | sort > "$out/executable-exports.txt"
          nm -u "$app/S2Arm" | sort > "$out/executable-undefined.txt"
          lib=$(find "$S2A_RUN_ROOT" -name libs2a_cs.a 2>/dev/null | head -1)
          if [ -n "$lib" ]; then
            ls -l "$lib" >> "$out/inventory.txt"
            nm -gU "$lib" | awk '{print $3}' | sort > "$out/services-exports.txt"
            echo "services library external symbols: $(wc -l < "$out/services-exports.txt")" >> "$out/inventory.txt"
            cat "$(dirname "$lib")/ldflags.txt" > "$out/services-ldflags.txt" 2>/dev/null || true
          fi
          grep -h "_S2A_\|_s2a_" "$out/executable-exports.txt" | head -400 > "$out/executable-s2a-exports.txt" || true
          cat "$out/inventory.txt" | head -150
        env:
          S2A_RUN_ROOT: ${{ runner.temp }}/s2arm-run
      - uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        if: always()
        with:
          name: s2arm-engine-${{ matrix.os }}-${{ github.sha }}
          path: proof/
          retention-days: 30
