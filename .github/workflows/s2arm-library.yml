name: S2Arm library layer

# Flutter tests and analysis of the Switch 2 playlist (docs/s2arm-switch2-library.md).
# No build, no upload, no secret.
on:
  push:
    branches:
      - work/s2arm-switch2-library-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: >
          flutter test
          test/s2arm_internal_service_test.dart
          test/switch2_export_content_test.dart
          test/switch2_library_locale_test.dart
          test/console_manager_test.dart
          test/libretro_consoles_tab_test.dart
          test/rewindbox_glacier_test.dart

      - name: Storage contract (IMPORT_SITES)
        run: python3 test/storage_contract_test.py

      - name: Switch 2 Glacier tile review (legal gate controls)
        run: python3 -B test/switch2_glacier_tile_review_test.py

      - name: Libretro frontend UI contract
        run: python3 test/libretro_frontend_ui_contract_test.py
