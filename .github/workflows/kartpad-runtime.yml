name: KartPad runtime (game-free)
run-name: KartPad runtime 0.8.3 • ${{ inputs.stage }} • ${{ github.sha }}

# Builds the KartPad 0.8.3 runtime from its public sources. No disc image,
# extracted game file, Retro Rewind file or translated game code is used:
# a player's game pack is added only on their own computer, before signing.
# Every uploaded file passes build-utils/game_content_gate.py first, and no
# cache holds anything but public sources and their build products.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'pristine (reproduce the official game-free app), embedded (NeoStation KartPadCore) or both'
        default: both
        type: choice
        options: [both, pristine, embedded]

permissions:
  contents: read

concurrency:
  group: kartpad-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      WORK: ${{ runner.temp }}/kartpad-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select the newest Xcode on the runner
        shell: bash
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          [[ -n "$XCODE" ]] || XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version | head -n 1
          python3 --version

      - name: Repository tests for the KartPad runtime tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 test/game_content_gate_test.py
          python3 test/kartpad_runtime_tooling_test.py

      - name: Fetch pinned public sources and the official game-free reference
        shell: bash
        run: |
          set -euo pipefail
          bash build-utils/kartpad_runtime/build.sh fetch "$WORK"

      - name: Restore the DiscIO build (public Dolphin sources only)
        id: discio-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/kp/build/builder-dependencies
          key: kartpad-discio-v1-${{ runner.os }}-${{ hashFiles('build-utils/kartpad_runtime/source.json') }}

      - name: Build Dolphin DiscIO for iphoneos
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          bash build-utils/kartpad_runtime/build.sh discio "$WORK"
          echo "discio_seconds=$(( $(date +%s) - start ))"

      - name: Gate and save the DiscIO build
        if: steps.discio-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Only public Dolphin sources and objects are cached.
          python3 build-utils/game_content_gate.py "$WORK/kp/build/builder-dependencies"

      - uses: actions/cache/save@v4
        if: steps.discio-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.WORK }}/kp/build/builder-dependencies
          key: kartpad-discio-v1-${{ runner.os }}-${{ hashFiles('build-utils/kartpad_runtime/source.json') }}

      - name: Reproduce the official game-free app from source
        if: ${{ inputs.stage != 'embedded' }}
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          bash build-utils/kartpad_runtime/build.sh pristine "$WORK"
          echo "pristine_seconds=$(( $(date +%s) - start ))"

      - name: Build NeoStation's embedded KartPadCore
        if: ${{ inputs.stage != 'pristine' }}
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          bash build-utils/kartpad_runtime/embedded.sh "$WORK" "$GITHUB_SHA"
          echo "embedded_seconds=$(( $(date +%s) - start ))"

      - name: Gate every file before upload
        id: gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/upload"
          for item in pristine-identity.json embedded-identity.json; do
            [[ -f "$WORK/$item" ]] && cp "$WORK/$item" "$WORK/upload/"
          done
          [[ -d "$WORK/out" ]] && cp -R "$WORK/out/." "$WORK/upload/"
          python3 build-utils/game_content_gate.py "$WORK/upload" --report "$WORK/upload-content-gate.json"
          cp "$WORK/upload-content-gate.json" "$WORK/upload/"

      - uses: actions/upload-artifact@v4
        # Nothing is uploaded unless the content gate passed on every file.
        if: always() && steps.gate.outcome == 'success'
        with:
          name: KartPadRuntime-${{ github.sha }}
          path: ${{ env.WORK }}/upload
          if-no-files-found: warn
          retention-days: 14
