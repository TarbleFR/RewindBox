name: Exact expansion native follow-up 478
on:
  push:
    branches: [Claude]
    paths: ['test/cheats478*', '.github/workflows/cheats478-native.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  apple:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sources478-native]') }}
    runs-on: macos-15
    timeout-minutes: 25
    env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - run: python3 .github/diagnostics/cheats478_memory_reuse.py
      - name: Exact published native programs, reusing successful source and memory checks
        run: |
          git rev-parse HEAD
          python3 test/cheats478_sources.py --native-only --reuse-index-proof
      - name: Compile changed catalogue and RPCS3 helper with the iPhone SDK
        run: |
          python3 test/unified_catalog_ios_test.py IPhoneCatalogTests
          xcrun --sdk iphoneos clang++ -std=c++20 -fobjc-arc -fblocks -target arm64-apple-ios17.4 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -I packages/rpcs3_internal_bridge/ios/Classes -c packages/rpcs3_internal_bridge/ios/Classes/RPCS3UnifiedCheats.mm -o /tmp/RPCS3UnifiedCheats478.o
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Shared installation, revision diagnostics and source notes in UIKit
        run: python3 test/unified_catalog_browser_ui_test.py --native --followup478-only --result evidence/cheats478.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheats478-native-${{ github.sha }}
          path: evidence/
          retention-days: 14
