name: Integrate main branding into Claude for RewindBox fix 0.0.9
'on':
  push:
    branches:
      - Claude
    paths:
      - .github/workflows/reconcile-claude-main-fix009.yml
permissions:
  contents: write
jobs:
  merge-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge the four main-only branding commits without reviving removed ports
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "Claude"
          git merge-base --is-ancestor 21a788a085f9d7b8292a564b4d720b9b3b7352ab HEAD
          git fetch origin main
          test "$(git rev-parse origin/main)" = "8e9fc17b04bef2a9480b8cf4c4a2a471f71ee59a"
          git config user.name "RewindBox GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-ff --no-commit origin/main || true
          test -f .git/MERGE_HEAD
          python3 - <<'PY'
          import pathlib, subprocess
          data=subprocess.check_output(['git','diff','--name-only','--diff-filter=U','-z'])
          paths=[p.decode() for p in data.split(b'\0') if p]
          print('Resolve current-branch conflicts:',len(paths),flush=True)
          for path in paths:
              # Keep the current Claude emulator and port removals, while letting
              # Git's normal three-way merge keep non-conflicting main branding.
              exists=(subprocess.run(['git','cat-file','-e','HEAD:'+path],
                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode == 0)
              if exists:
                  content=subprocess.check_output(['git','show','HEAD:'+path])
                  output=pathlib.Path(path)
                  output.parent.mkdir(parents=True,exist_ok=True)
                  output.write_bytes(content)
                  subprocess.run(['git','add','--',path],check=True)
              else:
                  subprocess.run(['git','rm','-f','--ignore-unmatch','--',path],check=True)
              print(path, 'CLAUDE' if exists else 'REMOVED', flush=True)
          PY
          test -z "$(git diff --name-only --diff-filter=U)"
          if grep -E 'dusklight_internal_bridge|kartpad_internal_bridge' pubspec.yaml lib/main.dart; then
            echo "Unsupported game port references restored"; exit 1
          fi
          git add -A
          git diff --cached --check
          git status --porcelain | tail -35
          git commit -m "merge: reconcile main branding with Claude MeloNX fix [skip ci]"
          git push origin HEAD:refs/heads/Claude
          echo "Integration committed and pushed."
