permissions:
  contents: read
  actions: read
concurrency:
  group: melonx-engine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  core:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[melonx-launch-only]') || (!contains(github.event.head_commit.message, '[melonx-host-only]')
      && !contains(github.event.head_commit.message, '[retroarch-delivery]') && !contains(github.event.head_commit.message,
      '[melonx-validated-integration]')) }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.100
    - name: Pin the selected SDK for all new Apple gates
      run: |
        python3 - <<'PY_SDK'
        import json,pathlib
        path=pathlib.Path('global.json')
        assert not path.exists(), 'Review the existing repository SDK selection'
        path.write_text(json.dumps({'sdk':{'version':'10.0.100','rollForward':'disable'}})+'\n')
        PY_SDK
        test "$(dotnet --version)" = '10.0.100'
    - name: Authenticate engine82 evidence and reuse unchanged LibHac
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 build-utils/melonx/verify_gpu_core.py prepare_dependencies
    - name: Fetch exact MeloNX source
      run: |
        python3 - <<'PY_FETCH'
        import json,pathlib,subprocess
        pin=json.loads(pathlib.Path('build-utils/melonx/source.json').read_text())
        path='.native-sources/MeloNX'
        subprocess.run(['git','init',path],check=True)
        # Both transports must return the same authentic commit and tree.
        urls=[pin['repository'],'https://github.com/AzureDominus/melonx.git']
        for url in urls:
            try:
                subprocess.run(['git','-C',path,'-c','http.lowSpeedLimit=1000','-c','http.lowSpeedTime=30',
                    'fetch','--depth','1',url,pin['revision']],check=True,timeout=120)
                break
            except (subprocess.CalledProcessError,subprocess.TimeoutExpired):
                if url==urls[-1]:raise
                print('Primary source transfer failed; retrying identical commit via verified mirror',flush=True)
        subprocess.run(['git','-C',path,'checkout','--detach','FETCH_HEAD'],check=True)
        assert subprocess.check_output(['git','-C',path,'rev-parse','HEAD'],text=True).strip()==pin['revision']
        assert subprocess.check_output(['git','-C',path,'rev-parse','HEAD^{tree}'],text=True).strip()=='82a29e6f593f6244869481e9a489b8d5154175fe'
        PY_FETCH
    - name: Verify Apple ARM64, exact SDK and reviewed preparation inputs
      run: |
        python3 test/melonx_gpu_core_contract_test.py
        python3 build-utils/melonx/verify_gpu_core.py preflight
    - name: Run fifteen new Apple gates and retain fourteen unchanged Core85 results
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 build-utils/melonx/verify_gpu_core.py run_gates
    - name: Compile NativeAOT library and verify exported ABI
      env:
        MELONX_AUTHENTICATED_BASELINE: ${{ github.workspace }}/.native-sources/melonx-engine82.zip
        MELONX_BUILD_SIMULATOR: '1'
      run: bash build-utils/melonx/build_core.sh .native-sources/MeloNX .native-sources/LibHac
    - name: Bind both new libraries to reviewed sources and gate receipts
      run: python3 build-utils/melonx/verify_gpu_core.py compiled
    - uses: actions/download-artifact@v4
      with:
        name: MeloNX-native-dependencies-66737aa9c959eb5915264bf178f179bda8643314
        run-id: 39854858591
        github-token: ${{ github.token }}
        path: dist/melonx-native
    - name: Authenticate unchanged native frameworks
      run: python3 build-utils/melonx/reuse_core_baseline.py dependencies
    - name: Exercise this exact rebuilt engine in an ARM64 iOS app
      run: python3 test/melonx_runtime_smoke.py
    - name: Preserve the current runtime result including failures
      if: ${{ always() }}
      run: |
        python3 - <<'PY_SMOKE'
        import pathlib,shutil
        source=pathlib.Path('dist/melonx-smoke')
        if source.exists():shutil.copytree(source,'dist/melonx/runtime-smoke')
        PY_SMOKE
    - name: Verify fresh guest execution, teardown and backing release
      run: python3 build-utils/melonx/verify_gpu_core.py finalize
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: MeloNX-engine-${{ github.sha }}
        path: dist/melonx
        if-no-files-found: error
        retention-days: 14
