name: MeloNX embedded engine
run-name: MeloNX engine • ${{ github.sha }}
'on':
  push:
    branches:
    - Claude
    - work/melonx-embedded-20261022
    paths:
    - .github/workflows/melonx-core.yml
    - build-utils/melonx/source.json
    - build-utils/melonx/build_core.sh
    - build-utils/melonx/collect_managed_notices.py
    - build-utils/melonx/build_libhac.py
    - build-utils/melonx/libhac-reuse.json
    - build-utils/melonx/prepare_embedded.py
    - build-utils/melonx/adapt_session.py
    - build-utils/melonx/adapt_input.py
    - build-utils/melonx/adapt_memory.py
    - build-utils/melonx/adapt_runtime.py
    - build-utils/melonx/adapt_firmware.py
    - native/melonx/*.cs
    - test/melonx_homebrew_test.py
    - test/melonx_darwin_signal_test.py
    - test/melonx_bootstrap_test.py
    - test/melonx_session_test.py
    - test/melonx_input_test.py
    - test/melonx_firmware_transaction_test.py
    - test/melonx_firmware_archive_test.py
    - test/melonx_library_api_test.py
    - build-utils/melonx/reuse_library_validation.py
    - test/melonx_game_header_test.py
    - test/melonx_display_native_test.py
    - test/melonx_keys_native_test.py
    - test/fixtures/melonx_key_shape_517.json
    - test/melonx_runtime_smoke.py
    - test/melonx_ios_vulkan_host_import_test.py
    - build-utils/melonx/reuse_keys_validation.py
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: melonx-engine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  core:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[melonx-launch-only]') || (!contains(github.event.head_commit.message, '[melonx-host-only]')
      && !contains(github.event.head_commit.message, '[retroarch-delivery]') && !contains(github.event.head_commit.message,
      '[melonx-validated-integration]')) }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.100
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - uses: actions/download-artifact@v4
      with:
        name: MeloNX-engine-38d997064cd81c5f17de6187ab36d2c78b0ba97c
        run-id: 39858967222
        github-token: ${{ github.token }}
        path: dist/melonx
    - name: Execute the embedded storage boundary
      env:
        GH_TOKEN: ${{ github.token }}
        MELONX_REUSE_SESSION_RUN: '39577903252'
      run: python3 build-utils/melonx/check_bootstrap.py
    - name: Execute session ownership and render teardown
      env:
        GH_TOKEN: ${{ github.token }}
        MELONX_REUSE_SESSION_RUN: '39577903252'
      run: python3 build-utils/melonx/check_session.py
    - name: Reuse unchanged successful firmware and game header checks
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 build-utils/melonx/reuse_library_validation.py
    - name: Reuse unchanged firmware archive proof
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 build-utils/melonx/reuse_launch_library.py --firmware-only
    - name: Verify iOS Vulkan host-import fallback contract
      run: python3 test/melonx_ios_vulkan_host_import_test.py
    - name: Fetch exact MeloNX source
      run: |
        python3 - <<'PY_FETCH'
        import subprocess,time
        sources=[('MeloNX','https://starforgejo.dev/projects/MeloNX.git','13700519f3abc4e6d7ed8a065b118b2cc59bcd67'),
          ('LibHac','https://starforgejo.dev/archive/LibHac_Ryubing.git','23e402ebb6dedc517e34a98a033078dc0f6fd478')]
        for name,url,revision in sources:
            path='.native-sources/'+name
            subprocess.run(['git','init',path],check=True)
            subprocess.run(['git','-C',path,'remote','add','origin',url],check=True)
            for attempt in range(1,4):
                try:
                    subprocess.run(['git','-C',path,'-c','http.lowSpeedLimit=1000','-c','http.lowSpeedTime=30','fetch','--depth','1','origin',revision],check=True,timeout=120)
                    break
                except (subprocess.CalledProcessError,subprocess.TimeoutExpired):
                    if attempt==3:raise
                    print(name,'source transfer failed; retrying exact commit',revision,flush=True)
                    time.sleep(5)
            subprocess.run(['git','-C',path,'checkout','--detach','FETCH_HEAD'],check=True)
            assert subprocess.check_output(['git','-C',path,'rev-parse','HEAD'],text=True).strip()==revision
        PY_FETCH
    - name: Reuse exact successful Darwin and homebrew proofs
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 build-utils/melonx/reuse_keys_validation.py
    - name: Reuse exact successful key, personal configuration and launch validation
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 build-utils/melonx/reuse_display_validation.py
    - name: Execute production input driver ownership
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 build-utils/melonx/check_input.py .native-sources/MeloNX
    - name: Exercise display ratios, existing memory settings and stale-session refusal
      run: python3 test/melonx_display_native_test.py .native-sources/MeloNX
    - name: Compile NativeAOT library and verify exported ABI
      env:
        MELONX_REUSE_LIBHAC: '1'
        MELONX_BUILD_SIMULATOR: '1'
        GH_TOKEN: ${{ github.token }}
      run: bash build-utils/melonx/build_core.sh .native-sources/MeloNX .native-sources/LibHac
    - uses: actions/download-artifact@v4
      with:
        name: MeloNX-native-dependencies-66737aa9c959eb5915264bf178f179bda8643314
        run-id: 39854858591
        github-token: ${{ github.token }}
        path: dist/melonx-native
    - name: Exercise this exact rebuilt engine in an ARM64 iOS app
      run: python3 test/melonx_runtime_smoke.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: MeloNX-engine-${{ github.sha }}
        path: dist/melonx/
        if-no-files-found: ignore
        retention-days: 14
