name: Preserve validated MeloNX components
'on':
  push:
    branches: [Claude]
    paths: ['.github/workflows/melonx-preserve-validation.yml']
permissions: {contents: read, actions: write}
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - name: Cancel only redundant component runs on the already validated integration source
        run: |
          python3 - <<'PY'
          import json,subprocess
          source='07407ed87491eb5469d3ac694eeff8cf3bb41e01'
          selected={39970253480:'.github/workflows/libretro-checks.yml'}
          for run,path in selected.items():
              endpoint=f'repos/TarbleFR/RewindBox/actions/runs/{run}'
              data=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
              assert data['head_sha']==source and data['head_branch']=='Claude' and data['path']==path
              if data['status']=='completed':
                  print(run, 'already complete; left unchanged');continue
              result=subprocess.run(['gh','api','--method','POST',endpoint+'/cancel'],capture_output=True,text=True)
              if result.returncode:
                  current=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
                  assert current['status']=='completed',f'Could not stop redundant run {run}'
              print(run,'redundant component validation stopped; targeted MeloNX engine/host/Flutter proofs preserved')
          PY
