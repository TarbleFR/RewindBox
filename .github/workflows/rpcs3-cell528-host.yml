name: RPCS3 CELL528 two native host frameworks
run-name: "RPCS3 host528 • ${{ github.sha }}"
'on':
  push:
    branches: [Claude]
    paths: ['.github/workflows/rpcs3-cell528-host.yml', '.github/diagnostics/rpcs3cell528_host.py']
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  host:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rpcs3-cell528-host]') }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.2', channel: stable, cache: true}
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: .ci-cache
          key: neostation-device-v2-macOS-ARM64-xcode26.3-flutter3.47.2-c1f550f8be86c91d65dc564ebddff593f2e3fe46-523-09b8aa7d1bc439098e74eaba3735094714b3cd5740c469e7c84be8dd2fec6336-normal
      - name: Authenticate exact compilation dependencies
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.cache.outputs.cache-hit }}' = true
          command -v zstd >/dev/null || brew install zstd
          env GITHUB_SHA=c1f550f8be86c91d65dc564ebddff593f2e3fe46 BUILD_NUMBER=523 python3 build-utils/delivery_cipher.py cache-unpack
          python3 build-utils/configure_neoswap_storage.py
      - name: Build actual iPhone frameworks with current source
        run: python3 .github/diagnostics/rpcs3cell528_host.py
      - uses: actions/upload-artifact@v4
        with:
          name: RPCS3Host528-${{ github.sha }}
          path: dist/host528/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3Host528-diagnostics-${{ github.sha }}
          path: build/host528/*.log
          if-no-files-found: warn
          retention-days: 14
