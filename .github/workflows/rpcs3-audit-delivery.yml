        nm -gj "$APP/Frameworks/ARMSX2Core.framework/ARMSX2Core" > build/armsx2-exports.txt
        grep -qx '_NeoARMSX2_GetAPI' build/armsx2-exports.txt
    - name: Embed lazy-loaded libretro cores, MoltenVK and system assets
      run: |
        set -euo pipefail
        APP="build/ios/DolphinDerivedData/Build/Products/Release-iphoneos/Runner.app"
        for framework in dist/libretro/Frameworks/*.framework; do
          rm -rf "$APP/Frameworks/$(basename "$framework")"
          ditto "$framework" "$APP/Frameworks/$(basename "$framework")"
        done
        rm -rf "$APP/LibretroSystem" "$APP/Libretro-Licenses"
        ditto dist/libretro/LibretroSystem "$APP/LibretroSystem"
        ditto dist/libretro/Libretro-Licenses "$APP/Libretro-Licenses"
        cp dist/libretro/identity.json "$APP/Libretro-native-identity.json"
        ls "$APP/Frameworks" | grep -c '_libretro.framework'
    - name: Embed legal, license and source notices
      shell: python3 -c "import os,sys,subprocess,json,pathlib; expected='4fc50a8701db627607821ab393a1522d21fd00c4'; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
        assert actual==expected,(actual,expected); out=pathlib.Path('build/delivery'); out.mkdir(parents=True,exist_ok=True); (out/'workflow-checkout-identity.json').write_text(json.dumps(dict(workflowCommit=os.environ['GITHUB_SHA'],sourceCommit=expected,run=os.environ['GITHUB_RUN_ID']),indent=2));
        os.environ['NEOSTATION_WORKFLOW_SHA']=os.environ['GITHUB_SHA']; os.environ['GITHUB_SHA']=expected; os.execv('/bin/bash',['bash','--noprofile','--norc','-eo','pipefail',sys.argv[1]])"
        {0}
      run: |
        set -euo pipefail
        APP="build/ios/DolphinDerivedData/Build/Products/Release-iphoneos/Runner.app"
        python3 build-utils/embed_legal_bundle.py \
          --app "$APP" \
          --build-number "$BUILD_NUMBER" \
          --dolphin-sha "$DOLPHIN_SHA"
    - name: Package and validate NeoStation IPA
      shell: python3 -c "import os,sys,subprocess,json,pathlib; expected='4fc50a8701db627607821ab393a1522d21fd00c4'; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
        assert actual==expected,(actual,expected); out=pathlib.Path('build/delivery'); out.mkdir(parents=True,exist_ok=True); (out/'workflow-checkout-identity.json').write_text(json.dumps(dict(workflowCommit=os.environ['GITHUB_SHA'],sourceCommit=expected,run=os.environ['GITHUB_RUN_ID']),indent=2));
        os.environ['NEOSTATION_WORKFLOW_SHA']=os.environ['GITHUB_SHA']; os.environ['GITHUB_SHA']=expected; os.execv('/bin/bash',['bash','--noprofile','--norc','-eo','pipefail',sys.argv[1]])"
        {0}
      run: |
        set -euo pipefail
        git diff --check
        python3 packages/dolphin_internal_bridge/ci/build_support.py package
        python3 build-utils/validate_legal_bundle_ipa.py "dist/$IPA_NAME.ipa" \
          --build-number "$BUILD_NUMBER" --commit "$GITHUB_SHA"
        python3 build-utils/validate_rpcs3_ipa.py \
          --build-number "$BUILD_NUMBER" --commit "$GITHUB_SHA" \
          --core-identity build/fast-native/rpcs3-core-identity.json \
          --core-host-commit "$RPCS3_CORE_HOST_SHA" \
          --core-run-id "$RPCS3_CORE_RUN_ID"
        python3 build-utils/validate_single_ipa_distribution.py \
          "dist/$IPA_NAME.ipa" --report dist/localdevvpn-distribution.json
        python3 build-utils/validate_neoswap_ipa.py "dist/$IPA_NAME.ipa" \
          --build-number "$BUILD_NUMBER" --report dist/neoswap-validation.json
        python3 build-utils/validate_debugger_probe_ipa.py "dist/$IPA_NAME.ipa"
        python3 build-utils/validate_cheat_bulk_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --report dist/cheat-bulk-validation.json
        python3 build-utils/validate_unified_cheats_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --report build/delivery/unified-cheats-ipa-validation.json
        python3 build-utils/validate_hd_textures_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --report build/delivery/hd-textures-ipa-validation.json
        python3 build-utils/validate_rpcs3_diag487_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --report build/delivery/rpcs3-diag487-ipa-validation.json
        python3 build-utils/validate_cheat_bootstrap_ipa.py "dist/$IPA_NAME.ipa" --report dist/cheat-bootstrap-validation.json
        python3 build-utils/validate_release002_ipa.py "dist/$IPA_NAME.ipa" \
          --build-number "$BUILD_NUMBER" --report dist/release-version-validation.json
        python3 build-utils/validate_stikjit_ipa.py "dist/$IPA_NAME.ipa" \
          --identity build/stikjit-current/identity.json \
          --report dist/stikjit-compatibility.json
        python3 - <<'PY'
        import zipfile,plistlib,os
        with zipfile.ZipFile('dist/'+os.environ['IPA_NAME']+'.ipa') as z:
            apps={n.split('/')[1] for n in z.namelist() if n.startswith('Payload/') and len(n.split('/'))>2 and n.split('/')[1].endswith('.app')}
            assert len(apps)==1,apps
            root='Payload/'+apps.pop()+'/'
            info=plistlib.loads(z.read(root+'Info.plist'))
            assert info.get('CADisableMinimumFrameDurationOnPhone') is True, 'iPhone ProMotion opt-in missing'
            bridge=z.read(root+'Frameworks/dolphin_internal_bridge.framework/dolphin_internal_bridge')
            for marker in (b'DolphinFramePacing',b'DOLDisplaySettings',b'MTLUsePresentDrawable',b'ShaderCompilationMode',b'setPreferredFrameRateRange:'):
                assert marker in bridge,marker
            # Build 440: Wii touch Shake and its controller assignment are in the bridge.
            for marker in (b'NeoStation.Dolphin.TouchShake',b'shakeBinding'):
                assert marker in bridge,marker
            # Build 440 120 Hz interface: the Flutter seam exists and the plugin is linked into Runner.
            flutter=z.read(root+'Frameworks/Flutter.framework/Flutter')
            for marker in (b'FlutterDisplayLinkManager',b'displayRefreshRate',b'maxRefreshRateEnabledOnIPhone'):
                assert marker in flutter,marker
            runner=z.read(root+info['CFBundleExecutable'])
            for marker in (b'NeoStation.UI.HighRefreshRate.Enabled',b'UiRefreshRatePlugin',b'neostation/ui_refresh_rate'):
                assert marker in runner,marker
            assert not any(n.startswith(root+'Frameworks/ui_refresh_rate.framework/') for n in z.namelist()),'ui_refresh_rate must be linked into Runner'
            # Build 447 AirPlay/external display: the external scene role names the plugin's delegate and the dynamic framework is embedded.
            external_roles=((info.get('UIApplicationSceneManifest') or {}).get('UISceneConfigurations') or {}).get('UIWindowSceneSessionRoleExternalDisplayNonInteractive') or []
            assert any(isinstance(r,dict) and r.get('UISceneDelegateClassName')=='NeoExternalDisplaySceneDelegate' and r.get('UISceneConfigurationName')=='neostation-external-display' for r in external_roles),'external display scene role missing from Info.plist'
            external_path=root+'Frameworks/external_display.framework/external_display'
            assert external_path in z.namelist(),'external_display must be embedded as a dynamic framework'
            external=z.read(external_path)
            for marker in (b'NeoExternalDisplaySceneDelegate',b'neostation/external_display',b'NeoStation.ExternalDisplay.Mode'):
                assert marker in external,marker
            # Build 447: every bridge that adopts NeoExternalRenderHost (docs/external-display-universal.md § 5) still carries the protocol.
            for pod in ('dolphin_internal_bridge','libretro_internal_bridge','rpcs3_internal_bridge','armsx2_internal_bridge'):
                assert b'NeoExternalRenderHost' in z.read(root+'Frameworks/'+pod+'.framework/'+pod),pod+' must adopt NeoExternalRenderHost'
        PY
        ARMSX2_SOURCE_REVISION="$(python3 -c 'import json; print(json.load(open("build-utils/armsx2/source.json"))["revision"])')"
        python3 build-utils/validate_armsx2_ipa.py "dist/$IPA_NAME.ipa" \
          --build-number "$BUILD_NUMBER" \
          --source-revision "$ARMSX2_SOURCE_REVISION"
        python3 build-utils/validate_libretro_ipa.py "dist/$IPA_NAME.ipa" \
          --identity dist/libretro/identity.json --build-number "$BUILD_NUMBER" \
          --report dist/libretro-validation.json
        python3 build-utils/validate_shader_compiler_ipa.py "dist/$IPA_NAME.ipa" \
          --build-number "$BUILD_NUMBER" --report dist/shader-compiler-validation.json
        # KartPad left NeoStation: no part of it and no file of game origin.
        python3 build-utils/validate_no_kartpad_ipa.py "dist/$IPA_NAME.ipa" \
          --build-number "$BUILD_NUMBER" --report dist/no-kartpad-validation.json
        # Dusklight and the Ports playlist left NeoStation
        # (docs/ports-removal-2026-10-20.md): no part of them in the IPA.
        python3 build-utils/validate_no_dusklight_ipa.py "dist/$IPA_NAME.ipa" \
          --build-number "$BUILD_NUMBER" --report dist/no-dusklight-validation.json
        cp build/fast-native/identity.json dist/fast-native-identity.json
        cp build/fast-native/rpcs3-core-identity.json dist/rpcs3-core-identity.json
        python3 build-utils/validate_neoplay_ipa.py "dist/$IPA_NAME.ipa" --build-number "$BUILD_NUMBER" --commit "$GITHUB_SHA" --report dist/neoplay-validation.json
        shasum -a 256 dist/*.ipa | tee "dist/$IPA_NAME.sha256"
        ls -lah dist
    - name: Seal every executable, framework and extension for SideStore
      run: |
        python3 build-utils/delivery_metrics.py signature_and_ipa_export python3 build-utils/delivery_benchmark.py seal
    - name: Validate native RAR and public-host capability in the final sealed IPA
      run: |
        python3 .github/diagnostics/rpcs3audit499_delivery.py --ipa dist/NeoStation.ipa --build-number "$BUILD_NUMBER" --output build/delivery/rpcs3-audit-final-ipa.json
    - name: Finalize observed timings and artifact identity
      if: always()
      run: |
        python3 build-utils/delivery_benchmark.py report
    - name: Prepare encrypted delivery and evidence
      run: |
        mkdir -p build/delivery-artifact
        cp dist/NeoStation.ipa "build/delivery-artifact/RewindBox-Build${BUILD_NUMBER}-${GITHUB_SHA}-${DELIVERY_MODE}.ipa"
        cp build/delivery/*.json build/delivery-artifact/
        cp docs/retroarch-rollback-2026-10-08.md build/delivery-artifact/
        shasum -a 256 build/delivery-artifact/*.ipa > build/delivery-artifact/SHA256SUMS

        python3 build-utils/delivery_metrics.py artifact_encryption python3 build-utils/delivery_cipher.py artifact build/delivery-artifact build/encrypted-delivery
    - name: Upload encrypted IPA and verification reports
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: build/encrypted-delivery/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - name: Collect diagnostic evidence
      if: always()
      run: |
        mkdir -p build/delivery
        cp "$RUNNER_TEMP/neostation-fast-xcodebuild.log" build/delivery/xcodebuild.log 2>/dev/null || true
        cp "$RUNNER_TEMP/flutter-aot-timings.json" build/delivery/flutter-aot-timings.json 2>/dev/null || true

        python3 build-utils/delivery_cipher.py artifact build/delivery build/encrypted-diagnostics
    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}-diagnostics
        path: build/encrypted-diagnostics/
        if-no-files-found: warn
        retention-days: 14
    - name: Remove temporary secrets
      if: always()
      shell: python3 -c "import os,sys,subprocess,json,pathlib; expected='4fc50a8701db627607821ab393a1522d21fd00c4'; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
        assert actual==expected,(actual,expected); out=pathlib.Path('build/delivery'); out.mkdir(parents=True,exist_ok=True); (out/'workflow-checkout-identity.json').write_text(json.dumps(dict(workflowCommit=os.environ['GITHUB_SHA'],sourceCommit=expected,run=os.environ['GITHUB_RUN_ID']),indent=2));
        os.environ['NEOSTATION_WORKFLOW_SHA']=os.environ['GITHUB_SHA']; os.environ['GITHUB_SHA']=expected; os.execv('/bin/bash',['bash','--noprofile','--norc','-eo','pipefail',sys.argv[1]])"
        {0}
      run: rm -f .dart-defines.json
