# Reusable recipe, invoked only by registered rpcs3-core phase delivery499.
# Do not edit the frozen 497 workflow. Candidate C keeps 4fc50a8701db627607821ab393a1522d21fd00c4; workflow-only W resolves it.
# Core, host and expanded PS1 catalogue inputs are proved independently.
name: RewindBox RPCS3 audit • Build 499 • reusable private delivery
'on':
  workflow_call:
    inputs:
      build_number:
        description: Dedicated candidate number; this closed recipe requires 499
        required: true
        default: '499'
        type: string
      recipient:
        description: Dedicated public PEM; private key stays with this delivery session
        required: true
        default: build-utils/delivery-499-recipient.pem
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: neostation-rpcs3-audit-delivery-${{ github.ref }}-${{ inputs.build_number }}
  cancel-in-progress: false
defaults:
  run:
    shell: python3 -c "import os,sys,subprocess,json,pathlib; expected='4fc50a8701db627607821ab393a1522d21fd00c4'; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
      assert actual==expected,(actual,expected); out=pathlib.Path('build/delivery'); out.mkdir(parents=True,exist_ok=True); (out/'workflow-checkout-identity.json').write_text(json.dumps(dict(workflowCommit=os.environ['GITHUB_SHA'],sourceCommit=expected,run=os.environ['GITHUB_RUN_ID']),indent=2));
      os.environ['NEOSTATION_WORKFLOW_SHA']=os.environ['GITHUB_SHA']; os.environ['GITHUB_SHA']=expected; os.execv('/bin/bash',['bash','--noprofile','--norc','-eo','pipefail',sys.argv[1]])"
      {0}
jobs:
  checks:
    name: Build 498 host reuse, PS1 catalogue and new RPCS3 Core proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      HD_FINAL_SOURCE: '4fc50a8701db627607821ab393a1522d21fd00c4'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: '4fc50a8701db627607821ab393a1522d21fd00c4'
        fetch-depth: 0
        persist-credentials: false
    - name: Verify closed product inputs, exact PS1 catalogue and successful Core evidence
      run: python3 .github/diagnostics/rpcs3audit499_delivery.py --output build/delivery/rpcs3-audit-source.json
    - uses: actions/upload-artifact@v4
      with:
        name: rpcs3-audit-499-validation-${{ github.sha }}
        path: build/delivery/
        if-no-files-found: error
        retention-days: 14
  cold:
    name: Release device build • cold • RPCS3 audit
    runs-on: macos-15
    timeout-minutes: 60
    needs:
    - checks
    env:
      BUILD_NUMBER: ${{ inputs.build_number || '499' }}
      DELIVERY_RECIPIENT: ${{ inputs.recipient }}
      IPA_NAME: NeoStation
      ARTIFACT_NAME: RewindBox-Build-${{ inputs.build_number || '499' }}-4fc50a8701db627607821ab393a1522d21fd00c4-cold
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      DOLPHIN_CORE_HOST_SHA: ae7d46f90dff64ce698b8c18e0c12510dbae96fe
      ARMSX2_CORE_HOST_SHA: 1343906f05e33b40f10f7026a1a6e2327c338d0e
      ARMSX2_CORE_RUN_ID: '39178893158'
      RPCS3_CORE_HOST_SHA: '0b18a23460b0a9840406fda2e3d6da4c5cdb7273'
      RPCS3_CORE_RUN_ID: '39472233521'
      LIBRETRO_CORES_HOST_SHA: ab9361c29f7c9ab769c4263dd8b7427fc4f4c036
      LIBRETRO_CORES_VALIDATED_SHA: ab9361c29f7c9ab769c4263dd8b7427fc4f4c036
      LIBRETRO_CORES_RUN_ID: '39455712245'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
      DELIVERY_METRICS: ${{ github.workspace }}/build/delivery/timings.jsonl
      CACHE_NAMESPACE: rpcs3-audit-499
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_PATH: ${{ github.workspace }}/build/ruby-gems
      DELIVERY_MODE: cold
      HD_FINAL_SOURCE: '4fc50a8701db627607821ab393a1522d21fd00c4'
    steps:
    - name: Checkout exact candidate
      uses: actions/checkout@v4
      with:
        ref: '4fc50a8701db627607821ab393a1522d21fd00c4'
        fetch-depth: 0
        persist-credentials: false
    - name: Require the closed HD-native candidate and exact successful prior evidence
      run: python3 .github/diagnostics/rpcs3audit499_delivery.py --skin-session-evidence --output build/delivery/skin-session-evidence.json
    - name: Select Xcode 26.3 for NeoPlay and Google Cast
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Set up Flutter 3.47.2
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
        cache-key: neostation-benchmark-sdk-${{ runner.os }}-${{ runner.arch }}-3.47.2-${{ env.CACHE_NAMESPACE }}
        pub-cache-key: neostation-benchmark-pub-${{ runner.os }}-${{ runner.arch }}-3.47.2-${{ hashFiles('pubspec.lock') }}-${{ env.CACHE_NAMESPACE }}
    - name: Record exact build environment and start measurement
      run: |
        mkdir -p build/delivery
        python3 build-utils/delivery_benchmark.py environment
        python3 .github/diagnostics/rpcs3audit499_delivery.py --output build/delivery/rpcs3-audit-build-inputs.json
    - name: Resolve locked Dart dependencies
      run: python3 build-utils/delivery_metrics.py dart_dependencies flutter pub get --enforce-lockfile
    - name: Prepare lightweight build tools
      shell: python3 -c "import os,sys,subprocess,json,pathlib; expected='4fc50a8701db627607821ab393a1522d21fd00c4'; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
        assert actual==expected,(actual,expected); out=pathlib.Path('build/delivery'); out.mkdir(parents=True,exist_ok=True); (out/'workflow-checkout-identity.json').write_text(json.dumps(dict(workflowCommit=os.environ['GITHUB_SHA'],sourceCommit=expected,run=os.environ['GITHUB_RUN_ID']),indent=2));
        os.environ['NEOSTATION_WORKFLOW_SHA']=os.environ['GITHUB_SHA']; os.environ['GITHUB_SHA']=expected; os.execv('/bin/bash',['bash','--noprofile','--norc','-eo','pipefail',sys.argv[1]])"
        {0}
      run: |
        set -euo pipefail
        export BUNDLE_PATH="$GITHUB_WORKSPACE/build/ruby-gems"
        echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
        python3 build-utils/delivery_metrics.py ruby_dependencies bundle install
    - name: Generate iOS host
      shell: python3 -c "import os,sys,subprocess,json,pathlib; expected='4fc50a8701db627607821ab393a1522d21fd00c4'; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
        assert actual==expected,(actual,expected); out=pathlib.Path('build/delivery'); out.mkdir(parents=True,exist_ok=True); (out/'workflow-checkout-identity.json').write_text(json.dumps(dict(workflowCommit=os.environ['GITHUB_SHA'],sourceCommit=expected,run=os.environ['GITHUB_RUN_ID']),indent=2));
        os.environ['NEOSTATION_WORKFLOW_SHA']=os.environ['GITHUB_SHA']; os.environ['GITHUB_SHA']=expected; os.execv('/bin/bash',['bash','--noprofile','--norc','-eo','pipefail',sys.argv[1]])"
        {0}
      run: |
        set -euo pipefail
        flutter config --no-enable-swift-package-manager
        test ! -d ios
        python3 build-utils/delivery_metrics.py host_scaffold_and_registrant python3 packages/dolphin_internal_bridge/ci/build_support.py scaffold
    - name: Download validated Build 350 native donor without KartPad
      shell: python3 -c "import os,sys,subprocess,json,pathlib; expected='4fc50a8701db627607821ab393a1522d21fd00c4'; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
        assert actual==expected,(actual,expected); out=pathlib.Path('build/delivery'); out.mkdir(parents=True,exist_ok=True); (out/'workflow-checkout-identity.json').write_text(json.dumps(dict(workflowCommit=os.environ['GITHUB_SHA'],sourceCommit=expected,run=os.environ['GITHUB_RUN_ID']),indent=2));
        os.environ['NEOSTATION_WORKFLOW_SHA']=os.environ['GITHUB_SHA']; os.environ['GITHUB_SHA']=expected; os.execv('/bin/bash',['bash','--noprofile','--norc','-eo','pipefail',sys.argv[1]])"
        {0}
      run: |
        set -euo pipefail
        # Artifact 10932894067 (run 36323843067) was purged on 7 October 2026.
        # The same Build 350 IPA is published as release 0.0.1. It also holds
        # the old KartPad donor (code translated from Mario Kart Wii), which
        # must never enter this job: only the members the native preparer
        # reuses are fetched by range from its pinned central directory, and
        # their names and hashes must match a pinned aggregate.
        mkdir -p build/native-donor
        python3 build-utils/fetch_native_donor_subset.py build/native-donor/NeoStation.ipa \
          --report build/native-donor/subset-report.json
        python3 build-utils/game_content_gate.py build/native-donor/NeoStation.ipa
    - name: Reuse validated native runtimes
      shell: python3 -c "import os,sys,subprocess,json,pathlib; expected='4fc50a8701db627607821ab393a1522d21fd00c4'; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
        assert actual==expected,(actual,expected); out=pathlib.Path('build/delivery'); out.mkdir(parents=True,exist_ok=True); (out/'workflow-checkout-identity.json').write_text(json.dumps(dict(workflowCommit=os.environ['GITHUB_SHA'],sourceCommit=expected,run=os.environ['GITHUB_RUN_ID']),indent=2));
        os.environ['NEOSTATION_WORKFLOW_SHA']=os.environ['GITHUB_SHA']; os.environ['GITHUB_SHA']=expected; os.execv('/bin/bash',['bash','--noprofile','--norc','-eo','pipefail',sys.argv[1]])"
        {0}
      run: |
        set -euo pipefail
        # Core/resource bootstrap only. JIT comes exclusively from source below.
        python3 build-utils/prepare_fast_native_runtime.py \
          build/native-donor --build-number "$BUILD_NUMBER"
    - name: Restore unchanged canonical StikJIT compilation interfaces
      id: stik
      uses: actions/cache@v4
      with:
        path: build/stikjit-current
        key: stikjit-interfaces-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('build-utils/stikjit/source.json','build-utils/patch_stikjit_rpcs3.py','build-utils/patch_stikjit_compat.py','build-utils/install_patched_stikjit.py','build-utils/build_patched_stikjit.py')
          }}-37844950677
    - name: Build canonical StikJIT from pinned sources for iOS 18 26 and 27
      shell: python3 -c "import os,sys,subprocess,json,pathlib; expected='4fc50a8701db627607821ab393a1522d21fd00c4'; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
        assert actual==expected,(actual,expected); out=pathlib.Path('build/delivery'); out.mkdir(parents=True,exist_ok=True); (out/'workflow-checkout-identity.json').write_text(json.dumps(dict(workflowCommit=os.environ['GITHUB_SHA'],sourceCommit=expected,run=os.environ['GITHUB_RUN_ID']),indent=2));
        os.environ['NEOSTATION_WORKFLOW_SHA']=os.environ['GITHUB_SHA']; os.environ['GITHUB_SHA']=expected; os.execv('/bin/bash',['bash','--noprofile','--norc','-eo','pipefail',sys.argv[1]])"
        {0}
      run: |
        set -euo pipefail
        command -v xcodegen || brew install xcodegen
        python3 build-utils/build_patched_stikjit.py 2>&1 | tee "$RUNNER_TEMP/neoswap-stikjit-step.log"
        python3 test/stikjit_unified_build_test.py 2>&1 | tee -a "$RUNNER_TEMP/neoswap-stikjit-step.log"
      if: ${{ steps.stik.outputs.cache-hit != 'true' }}
    - name: Install verified cached StikJIT interfaces
      if: ${{ steps.stik.outputs.cache-hit == 'true' }}
      run: python3 build-utils/install_patched_stikjit.py build/stikjit-current/StikJIT.xcframework
    - name: Require completed exact NeoSwap Core before artifact download
      shell: python3 -c "import os,sys,subprocess,json,pathlib; expected='4fc50a8701db627607821ab393a1522d21fd00c4'; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
        assert actual==expected,(actual,expected); out=pathlib.Path('build/delivery'); out.mkdir(parents=True,exist_ok=True); (out/'workflow-checkout-identity.json').write_text(json.dumps(dict(workflowCommit=os.environ['GITHUB_SHA'],sourceCommit=expected,run=os.environ['GITHUB_RUN_ID']),indent=2));
        os.environ['NEOSTATION_WORKFLOW_SHA']=os.environ['GITHUB_SHA']; os.environ['GITHUB_SHA']=expected; os.execv('/bin/bash',['bash','--noprofile','--norc','-eo','pipefail',sys.argv[1]])"
        {0}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        python3 - <<'PYCOREWAIT'
        import json,os,subprocess,time
        endpoint='repos/TarbleFR/RewindBox/actions/runs/'+os.environ['RPCS3_CORE_RUN_ID']
        deadline=time.monotonic()+7200
        while True:
            result=json.loads(subprocess.check_output(['gh','api',endpoint]))
            assert result['head_sha']==os.environ['RPCS3_CORE_HOST_SHA'],result
            if result['status']=='completed':
                assert result['conclusion']=='success',result
                print('Verified successful exact NeoSwap Core',result['id'],result['head_sha'])
                break
            assert time.monotonic()<deadline,'NeoSwap Core did not finish within the allowed wait'
            print('Waiting for exact Core',result['id'],result['status'],flush=True)
            time.sleep(30)
        PYCOREWAIT
    - name: Download pinned passive RPCS3 Core
      uses: actions/download-artifact@v4
      with:
        name: RPCS3Core-${{ env.RPCS3_CORE_HOST_SHA }}
        run-id: ${{ env.RPCS3_CORE_RUN_ID }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/rpcs3-native
    - name: Verify and install passive RPCS3 Core
      shell: python3 -c "import os,sys,subprocess,json,pathlib; expected='4fc50a8701db627607821ab393a1522d21fd00c4'; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
        assert actual==expected,(actual,expected); out=pathlib.Path('build/delivery'); out.mkdir(parents=True,exist_ok=True); (out/'workflow-checkout-identity.json').write_text(json.dumps(dict(workflowCommit=os.environ['GITHUB_SHA'],sourceCommit=expected,run=os.environ['GITHUB_RUN_ID']),indent=2));
        os.environ['NEOSTATION_WORKFLOW_SHA']=os.environ['GITHUB_SHA']; os.environ['GITHUB_SHA']=expected; os.execv('/bin/bash',['bash','--noprofile','--norc','-eo','pipefail',sys.argv[1]])"
        {0}
      run: |
        set -euo pipefail
        SOURCE=dist/rpcs3-native/libRPCS3Core.dylib
        IDENTITY=dist/rpcs3-native/identity.json
        CORE=packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib
        test -s "$SOURCE"
        test -s "$IDENTITY"
        test -s "$CORE"
        # The artifact's source, canonical patch, compiler recipe, binary
        # checks and native ABI must all be from the same Core commit.
        RPCS3_PIN_GUARD=.github/diagnostics/rpcs3audit499_delivery.py
        # RPCS3_CORE_INPUTS_BEGIN
        python3 "$RPCS3_PIN_GUARD" --rpc-core-inputs "$RPCS3_CORE_HOST_SHA" -- \
          build-utils/build_rpcs3_embedded_core.sh \
          build-utils/materialize_rpcs3_core.py \
          build-utils/apply_rpcs3_llvm_patch.py \
          build-utils/rpcs3/canonical-source.json \
          build-utils/rpcs3/embedded-core.patch \
          build-utils/rpcs3/llvm-aarch64-ghc-emergency-spill.patch \
          build-utils/rpcs3_core_syntax_gate.py \
          build-utils/validate_rpcs3_embedded_core.py \
          build-utils/validate_rpcs3_passive_dlopen.py \
          build-utils/patch_rpcs3_build301_passive_dlopen.py \
          packages/rpcs3_internal_bridge/ios/Classes/Rpcs3CoreABI.h \
          packages/neo_swap/ios/Classes/NeoSwap.h \
          packages/neo_swap/ios/Classes/NeoSwapClientStats.h \
          packages/neo_swap/ios/Classes/NeoSwapRelay.h \
          native/neoswap/NeoSwapClient.h \
          test/neo_swap_core_pin_test.py \
          test/neoswap_rpcs3_allocator_test.cpp \
          test/neoswap_cpu_buffers_test.cpp \
          test/rpcs3_neoswap_vulkan_buffer_test.py \
          test/native/rpcs3_neoswap_vulkan_buffer_test.cpp \
          test/rpcs3_neoswap_relay_test.py \
          test/native/rpcs3_neoswap_relay_test.cpp \
          test/rpcs3_core_syntax_gate_test.py \
          test/rpcs3_embedded_core_validator_test.py \
          test/rpcs3_preprocessor_balance_test.py \
          test/rpcs3_build301_passive_dlopen_test.py \
          test/rpcs3_atomic_startup_test.py \
          test/rpcs3_failed_startup_test.py \
          test/rpcs3_build264_gow3_core_test.py \
          test/rpcs3_build351_gow3_engine_test.py \
          test/rpcs3_build353_xitrix_v010_test.py \
          test/rpcs3_armsx3_performance_patch_test.py \
          test/rpcs3_build435_core_delta_test.py \
          test/native/rpcs3_build435_core_delta_test.cpp \
          test/rpcs3_build444_core_delta_test.py \
          test/native/rpcs3_build444_core_delta_test.cpp \
          test/rpcs3_build481_spu_object_cache_test.py \
          test/native/rpcs3_build481_spu_object_cache_test.cpp \
          test/native/rpcs3_spu_object_relocation_test.cpp \
          test/rpcs3_build483_llvm_pipeline_test.py \
          test/native/rpcs3_llvm_pipeline_harness.cpp \
          test/rpcs3_build499_spu_audit_test.py \
          test/native/rpcs3_build499_spu_audit_test.cpp \
          test/rpcs3_build487_core_diagnostics_test.py \
          test/native/rpcs3_build487_profiler_helpers_test.cpp \
          test/native/rpcs3_build487_boot_diagnostics_test.cpp \
          test/native/rpcs3_build487_lever_helpers_test.cpp \
          test/native/rpcs3_build487_retention_sequence_test.cpp \
          test/rpcs3_build487_host_diagnostics_test.py \
          test/rpcs3_build258_core_architecture_test.py \
          test/rpcs3_build352_gow3_memory_test.py \
          test/rpcs3_ios_ppu_compile_budget_test.cpp \
          test/rpcs3_ppu_no_size_split_policy_test.cpp \
          test/rpcs3_xitrix_v0101_native_test.py \
          test/rpcs3_xitrix_v011_native_test.py \
          test/native/rpcs3_spu_analyzer_support.h \
          test/native/rpcs3_spu_branch_analyzer_test.cpp \
          test/rpcs3_spu_warmup_test.py \
          test/native/rpcs3_spu_warmup_test.cpp \
          test/native/rpcs3_vk_memory_pressure_test.cpp \
          test/native/rpcs3_vk_conditional_render_test.cpp \
          test/native/rpcs3_neoswap_stats_getter_test.cpp \
          .github/workflows/rpcs3-core.yml \
          native/neoswap-storage/StorageABI.h \
          native/neoswap-storage/Client.h \
          native/neoswap-storage/ShaderKey.h \
