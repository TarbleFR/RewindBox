name: Dispatch integrated Build 470 regression checks
on:
  push:
    branches: [Claude]
    paths: [.github/workflows/libretro-build470-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[libretro-validate-470]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: TarbleFR/neostation-ios
    steps:
      - name: Verify branch identity and dispatch the existing exact-source suites
        run: |
          test "$(gh api repos/TarbleFR/neostation-ios/branches/Claude --jq .commit.sha)" = "$GITHUB_SHA"
          # Preserve run history while releasing macOS slots held by our
          # superseded candidates. Do not cancel unrelated maintainer runs.
          for run in 39068915352 39068915366 39068915383 39068915356 39069274170 39069274197 39069274165 39069274205 39069274297 39069354076 39069355850 39069418680 39069418690 39069418679 39069434569 39069436384 39069497371 39069498785; do
            state="$(gh api repos/TarbleFR/neostation-ios/actions/runs/$run --jq .status)"
            if test "$state" = in_progress; then
              gh api -X POST "repos/TarbleFR/neostation-ios/actions/runs/$run/force-cancel" || gh run cancel "$run"
            elif test "$state" != completed; then
              gh run cancel "$run"
            fi
          done
          gh workflow run libretro-cheats-checks.yml --ref Claude
          gh workflow run libretro-catalog-checks.yml --ref Claude
          gh workflow run libretro-skin-loading-checks.yml --ref Claude
          gh workflow run libretro-skin-checks.yml --ref Claude
