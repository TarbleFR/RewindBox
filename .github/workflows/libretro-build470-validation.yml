name: Dispatch integrated Build 470 regression checks
on:
  push:
    branches: [Claude]
    paths: [.github/workflows/libretro-build470-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[libretro-validate-470]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: TarbleFR/RewindBox
    steps:
      - name: Verify branch identity and dispatch the existing exact-source suites
        run: |
          test "$(gh api repos/TarbleFR/RewindBox/branches/Claude --jq .commit.sha)" = "$GITHUB_SHA"
          # Scope the dispatch to the repaired historical compile controls.
          # Current-product 100-session and other-core evidence remains intact.
          gh workflow run libretro-simulator.yml --ref Claude -f legacy_only=true
