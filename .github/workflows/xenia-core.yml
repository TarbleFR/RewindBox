name: XeniOS native core
run-name: XeniOS native core • ${{ github.sha }}
# The main session owns Core builds, pins and IPA delivery
# (docs/AI_TASK_BOARD.md). docs/xenios-playlist.md § Core adaptation plan.
# Claude owns the integrated producers after component branches are archived.
# Relevant pushes require [xenia-checks], [xenia-core] or [xenia-pin run=<id>].
# Normal Core builds do not run the optional [xenia-checks] development suites.
on:
  push:
    branches: [Claude]
    paths:
      - .github/workflows/xenia-core.yml
      - build-utils/xenia/**
      - packages/xenia_internal_bridge/**
      - packages/xenia_jit_helper/**
      - lib/services/xenia*.dart
      - lib/screens/xenia/**
      - lib/widgets/xenia*.dart
      - lib/l10n/xenia_locale.dart
      - test/xenia*.py
      - test/xenia*.sh
      - test/xenia*.dart
      - test/xenios*.py
      - tools/xenia/**
      - docs/evidence/xenios-core-delivery-declarations-*.json
  workflow_dispatch:
    inputs:
      build_core:
        description: 'Also compile XeniaCore.framework (needs Xcode 27)'
        type: boolean
        default: false
      runner:
        description: 'macOS runner label with Xcode 27 (XeniOS uses a self-hosted xcode-27 image)'
        type: string
        default: 'macos-26'
permissions:
  contents: read
concurrency:
  # Push and dispatched Core producers and pins keep their source identity and cannot be cancelled
  # by later checks. Explicit checks-only runs replace older checks on the same branch;
  # an ordinary push whose jobs are skipped must not displace an authorized check.
  group: xenia-native-core-${{ github.ref }}-${{ (!inputs.build_core && !contains(github.event.head_commit.message, '[xenia-core]') && !contains(github.event.head_commit.message, '[xenia-pin run=') && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[xenia-checks]'))) && 'checks' || github.sha }}
  cancel-in-progress: ${{ !inputs.build_core && !contains(github.event.head_commit.message, '[xenia-core]') && !contains(github.event.head_commit.message, '[xenia-pin run=') && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[xenia-checks]')) }}
jobs:
  checks:
    name: Patch, shader converter, facade C++ and host plugin
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[xenia-checks]') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Full history: the StikJIT build's baseline test reads files at a pinned
      # older commit (git show), as in every workflow that builds StikJIT.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Read immutable source revision
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          source = json.loads(Path('build-utils/xenia/source.json').read_text())
          assert source['abi_version'] == 4
          assert source['repository'] == 'https://github.com/xenios-jp/XeniOS.git'
          assert re.fullmatch('[0-9a-f]{40}', source['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('revision=' + source['revision'], file=output)
          PY
      - uses: actions/checkout@v4
        with:
          repository: xenios-jp/XeniOS
          ref: ${{ steps.source.outputs.revision }}
          path: .native-sources/XeniOS
          persist-credentials: false
      - name: Header-only submodules for the facade check
        run: git -C .native-sources/XeniOS submodule update --init --depth=1 third_party/tomlplusplus third_party/fmt third_party/cxxopts
      - name: Pin, upstream API files and adaptation patch
        run: python3 test/xenia_core_patch_test.py --upstream .native-sources/XeniOS
      - name: Bridge Objective-C classes never share a name with XeniOS
        run: python3 test/xenia_objc_namespace_test.py --upstream .native-sources/XeniOS
      - name: Launch ends its JIT transaction on every failure
        run: python3 test/xenia_launch_transaction_test.py
      - name: Every JIT attach uses RewindBox's full-width StikJIT
        run: python3 -B test/xenia_jit_transport_test.py
      - name: The embedding answers what XeniOS's app layer answers for a running game
        run: python3 -B test/xenia_embedding_test.py --upstream .native-sources/XeniOS
      - name: Shader converter validator
        run: python3 test/xenia_shader_converter_validator_test.py
      - name: Build-path check of the Core
        run: python3 -B test/xenia_verify_core_test.py
      # A Core rebuild changes the recipe the delivery review binds, by design:
      # its new pin and review come with the pin commit, where this runs again.
      - name: The delivery review gate binds the pinned Core and its recipe
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.build_core) || contains(github.event.head_commit.message, '[xenia-core]')) }}
        run: python3 -B test/xenios_core_delivery_review_test.py
      - name: IPA closed sets for an engine packaged with its identity file
        run: |
          python3 -B test/ipa_identity_engines_test.py
          python3 -B test/single_ipa_distribution_test.py
      - name: Dedicated JIT helper matches its ARMSX2 reference
        run: python3 tools/xenia/derive_jit_helper.py --check
      - name: Touch controls contract and shared catalogues
        run: |
          python3 test/xenia_touch_controls_test.py
          python3 tools/touch_layout/generate_strings.py --check
      - name: Facade C++ against the pinned headers
        run: CXX="xcrun clang++" bash test/xenia_core_cpp_test.sh .native-sources/XeniOS
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter precache --ios
      - name: Compile the bridge plugin against Flutter (iOS 18 target)
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FLUTTER_FRAMEWORK=$(find "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios" -path '*/Flutter.framework' -type d | head -1)
          test -n "$FLUTTER_FRAMEWORK"
          # Public headers of the pods the bridge imports (<neo_touch_layout/...>),
          # staged as CocoaPods exposes them, like the ARMSX2 host check.
          STAGE="$RUNNER_TEMP/xenia-host-stage"
          python3 - "$STAGE" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'test')
          from libretro_ios_syntax_test import stage_dependency_headers
          from touch_layout_support import stage_touch_layout
          include = stage_touch_layout(stage_dependency_headers(Path(sys.argv[1])))
          assert (include / 'neo_touch_layout/NeoTouchLayout.h').is_file()
          PY
          for source in XeniaInternalBridgePlugin.mm XeniaJitBridgePlugin.mm XeniaTouchControls.mm; do
            xcrun clang++ -std=c++20 -fobjc-arc -fblocks -fsyntax-only -x objective-c++ \
              -isysroot "$SDK" -target arm64-apple-ios18.0 -F "$(dirname "$FLUTTER_FRAMEWORK")" \
              -I "$STAGE/include" "packages/xenia_internal_bridge/ios/Classes/$source"
          done
      # StikJIT is source-built from its pin, exactly as the delivery workflows do.
      - name: Restore canonical StikJIT interfaces
        id: stik
        uses: actions/cache@v4
        with:
          path: build/stikjit-current
          key: stikjit-interfaces-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('build-utils/stikjit/source.json','build-utils/patch_stikjit_rpcs3.py','build-utils/patch_stikjit_compat.py','build-utils/install_patched_stikjit.py','build-utils/build_patched_stikjit.py') }}-37844950677
      - name: Build canonical StikJIT from pinned sources
        if: ${{ steps.stik.outputs.cache-hit != 'true' }}
        run: |
          command -v xcodegen || brew install xcodegen
          python3 build-utils/build_patched_stikjit.py
      - name: Install verified StikJIT interfaces
        if: ${{ steps.stik.outputs.cache-hit == 'true' }}
        run: python3 build-utils/install_patched_stikjit.py build/stikjit-current/StikJIT.xcframework
      - name: Type-check the XeniOS JIT helper extension against StikJIT
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          STIK=packages/stikjit_bridge/ios/Frameworks/StikJIT.xcframework/ios-arm64
          xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios17.4 -application-extension \
            -F "$STIK" -module-name xenia_jit_helper \
            packages/xenia_jit_helper/ios/Classes/XeniaJITRequestHandlerBase.swift

  plugin_app:
    name: Plugin compiles and links in a Flutter app (simulator, no XeniaCore)
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[xenia-checks]') }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      # The app's own pubspec is a workspace whose other plugins need prebuilt
      # engines; this throwaway app holds only the XeniOS bridge and the shared
      # touch layer, compiled and linked exactly as CocoaPods builds them in
      # the app (Core loaded at run time, so not needed here).
      - name: Throwaway app with xenia_internal_bridge
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/xenia_plugin_app"
          flutter create --platforms ios --org com.rewindbox.check --project-name xenia_plugin_app "$APP"
          mkdir -p "$APP/local"
          cp -R packages/xenia_internal_bridge packages/neo_touch_layout "$APP/local/"
          python3 - "$APP" <<'PY'
          import re, sys
          from pathlib import Path
          app = Path(sys.argv[1])
          for name in ('xenia_internal_bridge', 'neo_touch_layout'):
              manifest = app / 'local' / name / 'pubspec.yaml'
              manifest.write_text(re.sub(r'(?m)^resolution: workspace\n', '', manifest.read_text()))
          pubspec = app / 'pubspec.yaml'
          text = pubspec.read_text()
          text = text.replace('dependencies:\n  flutter:\n    sdk: flutter\n',
                              'dependencies:\n  flutter:\n    sdk: flutter\n'
                              '  xenia_internal_bridge:\n    path: local/xenia_internal_bridge\n'
                              '  neo_touch_layout:\n    path: local/neo_touch_layout\n', 1)
          assert 'xenia_internal_bridge' in text
          pubspec.write_text(text)
          main = app / 'lib' / 'main.dart'
          main.write_text("import 'package:flutter/widgets.dart';\n"
                          "import 'package:xenia_internal_bridge/xenia_internal_bridge.dart';\n\n"
                          "void main() {\n  WidgetsFlutterBinding.ensureInitialized();\n"
                          "  XeniaInternalBridge.availability(isIOS: true);\n}\n")
          PY
          rm -rf "$APP/test"
          cd "$APP"
          # pub get writes ios/Podfile from Flutter's template once plugins exist.
          flutter pub get
          test -f ios/Podfile
          # RewindBox's minimum (iOS 18), not Flutter's template default.
          sed -i '' -E "s/^# ?platform :ios, '[0-9.]+'/platform :ios, '18.0'/" ios/Podfile
          grep -q "platform :ios, '18.0'" ios/Podfile
          flutter build ios --simulator --debug --no-codesign
          APPDIR=build/ios/iphonesimulator/Runner.app
          test -d "$APPDIR"
          # Proof the bridge was compiled and linked into the app, whatever the
          # pod linkage: its Objective-C class names are in the built binaries.
          for class in XeniaInternalBridgePlugin XeniaJitBridgePlugin RBXeniaSessionController \
                       RBXeniaTouchControlsView RBXeniaJitSession NeoTouchLayoutPlugin; do
            grep -rlaq "$class" "$APPDIR" || { echo "::error::$class is not in the built app"; exit 1; }
            echo "$class: linked"
          done

  core:
    name: Compile pinned XeniaCore iOS framework
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_core) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xenia-core]')) }}
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read immutable source revision and converter mirror
        id: source
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pin = json.loads(Path('build-utils/xenia/source.json').read_text())
          mirror = pin['shader_converter']['upstream_mirror']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('revision=' + pin['revision'], file=output)
              print('msc_repo=' + mirror['repository'], file=output)
              print('msc_tag=' + mirror['release_tag'], file=output)
              print('msc_sha256=' + mirror['sha256'], file=output)
          PY
      # The pinned sources target the iOS 27 SDK; GitHub's macos-26 images have
      # Xcode 26.x only. rewindbox-core.patch compiles the two iOS 27 SDK uses of
      # xenia-ui-ios (StateReporting, scene accessories) only when the SDK has
      # them, so the newest Xcode 26 builds the Core; Xcode 27 is taken when present.
      - name: Select Xcode (27 when present, else the newest 26.x)
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$xcode" ]; then
            xcode="$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 or 27 on this runner."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: Install the Metal toolchain
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo xcodebuild -downloadComponent MetalToolchain; then exit 0; fi
            sleep $((attempt * 30))
          done
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: xenios-jp/XeniOS
          ref: ${{ steps.source.outputs.revision }}
          path: .native-sources/XeniOS
          persist-credentials: false
      - name: Submodules and data of the pinned revision (as XeniOS's apple-publish.yml)
        working-directory: .native-sources/XeniOS
        run: |
          set -euo pipefail
          git submodule update --init --depth=1 -j"$(sysctl -n hw.ncpu)" \
            $(grep -oE 'path = .+' .gitmodules | sed 's/path = //' | grep -v 'DirectXShaderCompiler')
          git submodule update --init --recursive --depth=1 -j"$(sysctl -n hw.ncpu)" third_party/wxWidgets
          ./xenia-build.py slang
          ./xenia-build.py msc
          ./xenia-build.py fetchdata
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install --upgrade cmake ninja meson mako pyyaml packaging
      - name: Fetch the iPhoneOS shader converter from its pinned mirror (never uploaded)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/msc-ios"
          mkdir -p "$dir"
          gh release download "${{ steps.source.outputs.msc_tag }}" --repo "${{ steps.source.outputs.msc_repo }}" \
            --pattern libmetalirconverter.dylib --dir "$dir" --clobber
          echo "${{ steps.source.outputs.msc_sha256 }}  $dir/libmetalirconverter.dylib" | shasum -a 256 -c -
          echo "MSC_IOS_LIBRARY=$dir/libmetalirconverter.dylib" >> "$GITHUB_ENV"
      - name: Configure optional C/C++ compiler cache
        id: ccache
        run: |
          set -euo pipefail
          command -v ccache >/dev/null || brew install ccache || true
          if ! command -v ccache >/dev/null; then
            echo '::warning::ccache unavailable; building cold'
            exit 0
          fi
          # Toolchain/recipe prefix permits reuse across upstream revisions only.
          identity=$( { uname -s; uname -m; xcodebuild -version;
            xcrun --sdk iphoneos --show-sdk-version; xcrun --sdk iphoneos --show-sdk-build-version;
            xcrun --sdk macosx --show-sdk-version; xcrun --sdk macosx --show-sdk-build-version;
            xcrun clang --version; xcrun --sdk iphoneos clang --version; ccache --version;
            shasum -a 256 "$(xcrun --find clang)" "$(xcrun --sdk iphoneos --find clang)";
            shasum -a 256 build-utils/xenia/build_core.sh build-utils/xenia/ccache.sh \
              build-utils/xenia/rewindbox-core.patch packages/xenia_internal_bridge/core/target.cmake;
          } | shasum -a 256 | cut -d' ' -f1)
          echo "prefix=xenia-ccache-v1-$identity-" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo 'XENIA_CCACHE=1' >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/xenia-ccache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: ccache-restore
        if: steps.ccache.outputs.enabled == 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/xenia-ccache
          key: ${{ steps.ccache.outputs.prefix }}${{ steps.source.outputs.revision }}-${{ github.sha }}
          restore-keys: ${{ steps.ccache.outputs.prefix }}
      - name: Compile and verify XeniaCore.framework
        run: bash build-utils/xenia/build_core.sh .native-sources/XeniOS "$MSC_IOS_LIBRARY"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: success() && steps.ccache.outputs.enabled == 'true' && steps.ccache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/xenia-ccache
          key: ${{ steps.ccache.outputs.prefix }}${{ steps.source.outputs.revision }}-${{ github.sha }}
      - name: Keep the converter out of the artifact
        run: test ! -e dist/xenia/libmetalirconverter.dylib && ! find dist/xenia -name 'libmetalirconverter*' | grep -q .
      - uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        with:
          name: XeniaCore-${{ github.sha }}
          path: dist/xenia/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Collect native diagnostics
        if: always()
        run: |
          mkdir -p build/xenia-diagnostics
          cp build/xenia-core/*.log build/xenia-core/*.json build/xenia-core/*.txt build/xenia-diagnostics/ 2>/dev/null || true
          cp build/xenia-core/ios/CMakeCache.txt build/xenia-diagnostics/ 2>/dev/null || true
          printf 'host=%s\nxenios=%s\n' "$GITHUB_SHA" '${{ steps.source.outputs.revision }}' > build/xenia-diagnostics/identity.txt
      - uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        if: always()
        with:
          name: XeniaCore-diagnostics-${{ github.sha }}
          path: build/xenia-diagnostics/
          if-no-files-found: error
          retention-days: 7
  # Pins a XeniaCore artifact the core job built: it is downloaded by id through
  # the REST API (the component session cannot reach the artifact store), then
  # core_pin.py pin (with codesign's report of the converter from that run's
  # diagnostics) and core_pin.py verify run on the real zip. The log prints
  # core-pin.json, its SHA-256 and its exact bytes (base64) for the component to
  # commit. Uploads nothing. A push whose commit message contains
  # [xenia-pin run=<id>] runs it.
  pin:
    name: Pin a built XeniaCore artifact (prints core-pin.json, uploads nothing)
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[xenia-pin run=') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Authenticate the producing run and its artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          run="$(printf '%s\n' "$MESSAGE" | sed -nE 's/.*\[xenia-pin run=([0-9]+)\].*/\1/p' | head -n 1)"
          [ -n "$run" ] || { echo "::error::No [xenia-pin run=<id>] in the commit message"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pin"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$RUNNER_TEMP/pin/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" > "$RUNNER_TEMP/pin/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > "$RUNNER_TEMP/pin/artifacts.json"
          python3 - "$RUNNER_TEMP/pin" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          from pathlib import Path
          folder = Path(sys.argv[1])
          run = json.loads((folder / 'run.json').read_text())
          if (run['path'] != '.github/workflows/xenia-core.yml' or run['status'] != 'completed' or
                  run['conclusion'] != 'success'):
              sys.exit(f"run {run['id']} is not a successful xenia-core.yml run")
          head = run['head_sha']
          jobs = [job for job in json.loads((folder / 'jobs.json').read_text())['jobs']
                  if job['name'] == 'Compile pinned XeniaCore iOS framework']
          if len(jobs) != 1 or jobs[0]['conclusion'] != 'success' or jobs[0]['run_attempt'] != run['run_attempt']:
              sys.exit('the core job of that run did not succeed in its latest attempt')
          artifacts = json.loads((folder / 'artifacts.json').read_text())['artifacts']
          # A rerun keeps the artifacts of the failed attempt, and its diagnostics share the name
          # (run 43158794942): only what the core job of the latest attempt uploaded counts.
          started = jobs[0]['started_at']
          def one(name):
              found = [item for item in artifacts if item['name'] == name and not item['expired']
                       and item['created_at'] >= started]
              if len(found) != 1 or not str(found[0].get('digest', '')).startswith('sha256:'):
                  sys.exit(f'not exactly one unexpired artifact {name} with a digest')
              return found[0]
          core, diagnostics = one('XeniaCore-' + head), one('XeniaCore-diagnostics-' + head)
          print(f"PIN_RUN={run['id']}\nPIN_ATTEMPT={run['run_attempt']}\nPIN_JOB={jobs[0]['id']}")
          print(f"PIN_ARTIFACT={core['id']}\nPIN_NAME={core['name']}\nPIN_EXPIRES={core['expires_at']}")
          print(f"PIN_DIGEST={core['digest']}\nPIN_BYTES={core['size_in_bytes']}")
          print(f"PIN_DIAGNOSTICS={diagnostics['id']}\nPIN_DIAGNOSTICS_DIGEST={diagnostics['digest']}")
          PY
      - name: Download both artifacts by id and check their digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch() {
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              -o "$2" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip"
          }
          fetch "$PIN_ARTIFACT" "$RUNNER_TEMP/pin/XeniaCore.zip"
          fetch "$PIN_DIAGNOSTICS" "$RUNNER_TEMP/pin/diagnostics.zip"
          test "sha256:$(sha256sum "$RUNNER_TEMP/pin/XeniaCore.zip" | cut -d' ' -f1)" = "$PIN_DIGEST"
          test "$(stat -c %s "$RUNNER_TEMP/pin/XeniaCore.zip")" = "$PIN_BYTES"
          test "sha256:$(sha256sum "$RUNNER_TEMP/pin/diagnostics.zip" | cut -d' ' -f1)" = "$PIN_DIAGNOSTICS_DIGEST"
          unzip -p "$RUNNER_TEMP/pin/diagnostics.zip" shader-converter-signature.txt > "$RUNNER_TEMP/pin/signature.txt"
          echo "codesign -dvvv of the converter in run $PIN_RUN:"
          cat "$RUNNER_TEMP/pin/signature.txt"
      - name: Pin and verify
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Replacing a pin needs its reason, a "Pin-Reason: ..." line of the commit message.
          reason="$(printf '%s\n' "$MESSAGE" | sed -nE 's/^Pin-Reason: (.+)$/\1/p' | head -n 1)"
          if [ -f build-utils/xenia/core-pin.json ] && [ -z "$reason" ]; then
            echo "::error::A pin exists: the commit message needs a Pin-Reason: line"; exit 1
          fi
          python3 build-utils/xenia/core_pin.py pin "$RUNNER_TEMP/pin/XeniaCore.zip" \
            --run "$PIN_RUN" --job "$PIN_JOB" --attempt "$PIN_ATTEMPT" --artifact "$PIN_ARTIFACT" \
            --name "$PIN_NAME" --expires "$PIN_EXPIRES" --converter-signature "$RUNNER_TEMP/pin/signature.txt" \
            --replaces-reason "$reason" > /dev/null
          python3 build-utils/xenia/core_pin.py verify "$RUNNER_TEMP/pin/XeniaCore.zip"
          echo "core-pin.json SHA-256: $(sha256sum build-utils/xenia/core-pin.json | cut -d' ' -f1)"
          echo "core-pin.json base64 (exact bytes):"
          base64 -w0 build-utils/xenia/core-pin.json
          echo
          cat build-utils/xenia/core-pin.json
