name: XeniOS native core
run-name: XeniOS native core • ${{ github.sha }}
# The main session owns Core builds, pins and IPA delivery
# (docs/AI_TASK_BOARD.md). docs/xenios-playlist.md § Core adaptation plan.
# A push to the playlist's own branch runs the host checks (asked by the main
# session before #172 merged; to be revisited before it is removed). Compiling
# XeniaCore is a dispatch with build_core, or, since a workflow absent from
# main cannot be dispatched, a push to that branch whose commit message
# contains [xenia-core] (asked by the main session for the Core pin).
on:
  push:
    branches: [work/playlists-xenios-20261110]
  workflow_dispatch:
    inputs:
      build_core:
        description: 'Also compile XeniaCore.framework (needs Xcode 27)'
        type: boolean
        default: false
      runner:
        description: 'macOS runner label with Xcode 27 (XeniOS uses a self-hosted xcode-27 image)'
        type: string
        default: 'macos-26'
permissions:
  contents: read
concurrency:
  # A Core build has its own group: a later checks-only push never cancels it.
  group: xenia-native-core-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[xenia-core]') && github.sha || 'checks' }}
  cancel-in-progress: true
jobs:
  checks:
    name: Patch, shader converter, facade C++ and host plugin
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Full history: the StikJIT build's baseline test reads files at a pinned
      # older commit (git show), as in every workflow that builds StikJIT.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Read immutable source revision
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          source = json.loads(Path('build-utils/xenia/source.json').read_text())
          assert source['abi_version'] == 2
          assert source['repository'] == 'https://github.com/xenios-jp/XeniOS.git'
          assert re.fullmatch('[0-9a-f]{40}', source['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('revision=' + source['revision'], file=output)
          PY
      - uses: actions/checkout@v4
        with:
          repository: xenios-jp/XeniOS
          ref: ${{ steps.source.outputs.revision }}
          path: .native-sources/XeniOS
          persist-credentials: false
      - name: Header-only submodules for the facade check
        run: git -C .native-sources/XeniOS submodule update --init --depth=1 third_party/tomlplusplus third_party/fmt third_party/cxxopts
      - name: Pin, upstream API files and adaptation patch
        run: python3 test/xenia_core_patch_test.py --upstream .native-sources/XeniOS
      - name: Bridge Objective-C classes never share a name with XeniOS
        run: python3 test/xenia_objc_namespace_test.py --upstream .native-sources/XeniOS
      - name: Launch ends its JIT transaction on every failure
        run: python3 test/xenia_launch_transaction_test.py
      - name: Shader converter validator
        run: python3 test/xenia_shader_converter_validator_test.py
      - name: Dedicated JIT helper matches its ARMSX2 reference
        run: python3 tools/xenia/derive_jit_helper.py --check
      - name: Touch controls contract and shared catalogues
        run: |
          python3 test/xenia_touch_controls_test.py
          python3 tools/touch_layout/generate_strings.py --check
      - name: Facade C++ against the pinned headers
        run: CXX="xcrun clang++" bash test/xenia_core_cpp_test.sh .native-sources/XeniOS
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter precache --ios
      - name: Compile the bridge plugin against Flutter (iOS 18 target)
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FLUTTER_FRAMEWORK=$(find "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios" -path '*/Flutter.framework' -type d | head -1)
          test -n "$FLUTTER_FRAMEWORK"
          # Public headers of the pods the bridge imports (<neo_touch_layout/...>),
          # staged as CocoaPods exposes them, like the ARMSX2 host check.
          STAGE="$RUNNER_TEMP/xenia-host-stage"
          python3 - "$STAGE" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'test')
          from libretro_ios_syntax_test import stage_dependency_headers
          from touch_layout_support import stage_touch_layout
          include = stage_touch_layout(stage_dependency_headers(Path(sys.argv[1])))
          assert (include / 'neo_touch_layout/NeoTouchLayout.h').is_file()
          PY
          for source in XeniaInternalBridgePlugin.mm XeniaJitBridgePlugin.mm XeniaTouchControls.mm; do
            xcrun clang++ -std=c++20 -fobjc-arc -fblocks -fsyntax-only -x objective-c++ \
              -isysroot "$SDK" -target arm64-apple-ios18.0 -F "$(dirname "$FLUTTER_FRAMEWORK")" \
              -I "$STAGE/include" "packages/xenia_internal_bridge/ios/Classes/$source"
          done
      # StikJIT is source-built from its pin, exactly as the delivery workflows do.
      - name: Restore canonical StikJIT interfaces
        id: stik
        uses: actions/cache@v4
        with:
          path: build/stikjit-current
          key: stikjit-interfaces-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('build-utils/stikjit/source.json','build-utils/patch_stikjit_rpcs3.py','build-utils/patch_stikjit_compat.py','build-utils/install_patched_stikjit.py','build-utils/build_patched_stikjit.py') }}-37844950677
      - name: Build canonical StikJIT from pinned sources
        if: ${{ steps.stik.outputs.cache-hit != 'true' }}
        run: |
          command -v xcodegen || brew install xcodegen
          python3 build-utils/build_patched_stikjit.py
      - name: Install verified StikJIT interfaces
        if: ${{ steps.stik.outputs.cache-hit == 'true' }}
        run: python3 build-utils/install_patched_stikjit.py build/stikjit-current/StikJIT.xcframework
      - name: Type-check the XeniOS JIT helper extension against StikJIT
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          STIK=packages/stikjit_bridge/ios/Frameworks/StikJIT.xcframework/ios-arm64
          xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios17.4 -application-extension \
            -F "$STIK" -module-name xenia_jit_helper \
            packages/xenia_jit_helper/ios/Classes/XeniaJITRequestHandlerBase.swift

  plugin_app:
    name: Plugin compiles and links in a Flutter app (simulator, no XeniaCore)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      # The app's own pubspec is a workspace whose other plugins need prebuilt
      # engines; this throwaway app holds only the XeniOS bridge and the shared
      # touch layer, compiled and linked exactly as CocoaPods builds them in
      # the app (Core loaded at run time, so not needed here).
      - name: Throwaway app with xenia_internal_bridge
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/xenia_plugin_app"
          flutter create --platforms ios --org com.rewindbox.check --project-name xenia_plugin_app "$APP"
          mkdir -p "$APP/local"
          cp -R packages/xenia_internal_bridge packages/neo_touch_layout "$APP/local/"
          python3 - "$APP" <<'PY'
          import re, sys
          from pathlib import Path
          app = Path(sys.argv[1])
          for name in ('xenia_internal_bridge', 'neo_touch_layout'):
              manifest = app / 'local' / name / 'pubspec.yaml'
              manifest.write_text(re.sub(r'(?m)^resolution: workspace\n', '', manifest.read_text()))
          pubspec = app / 'pubspec.yaml'
          text = pubspec.read_text()
          text = text.replace('dependencies:\n  flutter:\n    sdk: flutter\n',
                              'dependencies:\n  flutter:\n    sdk: flutter\n'
                              '  xenia_internal_bridge:\n    path: local/xenia_internal_bridge\n'
                              '  neo_touch_layout:\n    path: local/neo_touch_layout\n', 1)
          assert 'xenia_internal_bridge' in text
          pubspec.write_text(text)
          main = app / 'lib' / 'main.dart'
          main.write_text("import 'package:flutter/widgets.dart';\n"
                          "import 'package:xenia_internal_bridge/xenia_internal_bridge.dart';\n\n"
                          "void main() {\n  WidgetsFlutterBinding.ensureInitialized();\n"
                          "  XeniaInternalBridge.availability(isIOS: true);\n}\n")
          PY
          rm -rf "$APP/test"
          cd "$APP"
          # pub get writes ios/Podfile from Flutter's template once plugins exist.
          flutter pub get
          test -f ios/Podfile
          # RewindBox's minimum (iOS 18), not Flutter's template default.
          sed -i '' -E "s/^# ?platform :ios, '[0-9.]+'/platform :ios, '18.0'/" ios/Podfile
          grep -q "platform :ios, '18.0'" ios/Podfile
          flutter build ios --simulator --debug --no-codesign
          APPDIR=build/ios/iphonesimulator/Runner.app
          test -d "$APPDIR"
          # Proof the bridge was compiled and linked into the app, whatever the
          # pod linkage: its Objective-C class names are in the built binaries.
          for class in XeniaInternalBridgePlugin XeniaJitBridgePlugin RBXeniaSessionController \
                       RBXeniaTouchControlsView RBXeniaJitSession NeoTouchLayoutPlugin; do
            grep -rlaq "$class" "$APPDIR" || { echo "::error::$class is not in the built app"; exit 1; }
            echo "$class: linked"
          done

  core:
    name: Compile pinned XeniaCore iOS framework
    needs: checks
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_core) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xenia-core]')) }}
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read immutable source revision and converter mirror
        id: source
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pin = json.loads(Path('build-utils/xenia/source.json').read_text())
          mirror = pin['shader_converter']['upstream_mirror']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('revision=' + pin['revision'], file=output)
              print('msc_repo=' + mirror['repository'], file=output)
              print('msc_tag=' + mirror['release_tag'], file=output)
              print('msc_sha256=' + mirror['sha256'], file=output)
          PY
      - name: Select Xcode 27 (the pinned sources need the iOS 27 SDK)
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner (StateReporting needs the iOS 27 SDK). Dispatch with a runner that has it."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install the Metal toolchain
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo xcodebuild -downloadComponent MetalToolchain; then exit 0; fi
            sleep $((attempt * 30))
          done
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: xenios-jp/XeniOS
          ref: ${{ steps.source.outputs.revision }}
          path: .native-sources/XeniOS
          persist-credentials: false
      - name: Submodules and data of the pinned revision (as XeniOS's apple-publish.yml)
        working-directory: .native-sources/XeniOS
        run: |
          set -euo pipefail
          git submodule update --init --depth=1 -j"$(sysctl -n hw.ncpu)" \
            $(grep -oE 'path = .+' .gitmodules | sed 's/path = //' | grep -v 'DirectXShaderCompiler')
          git submodule update --init --recursive --depth=1 -j"$(sysctl -n hw.ncpu)" third_party/wxWidgets
          ./xenia-build.py slang
          ./xenia-build.py msc
          ./xenia-build.py fetchdata
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install --upgrade cmake ninja meson mako pyyaml packaging
      - name: Fetch the iPhoneOS shader converter from its pinned mirror (never uploaded)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/msc-ios"
          mkdir -p "$dir"
          gh release download "${{ steps.source.outputs.msc_tag }}" --repo "${{ steps.source.outputs.msc_repo }}" \
            --pattern libmetalirconverter.dylib --dir "$dir" --clobber
          echo "${{ steps.source.outputs.msc_sha256 }}  $dir/libmetalirconverter.dylib" | shasum -a 256 -c -
          echo "MSC_IOS_LIBRARY=$dir/libmetalirconverter.dylib" >> "$GITHUB_ENV"
      - name: Compile and verify XeniaCore.framework
        run: bash build-utils/xenia/build_core.sh .native-sources/XeniOS "$MSC_IOS_LIBRARY"
      - name: Keep the converter out of the artifact
        run: test ! -e dist/xenia/libmetalirconverter.dylib && ! find dist/xenia -name 'libmetalirconverter*' | grep -q .
      - uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        with:
          name: XeniaCore-${{ github.sha }}
          path: dist/xenia/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Collect native diagnostics
        if: always()
        run: |
          mkdir -p build/xenia-diagnostics
          cp build/xenia-core/*.log build/xenia-core/*.json build/xenia-core/*.txt build/xenia-diagnostics/ 2>/dev/null || true
          cp build/xenia-core/ios/CMakeCache.txt build/xenia-diagnostics/ 2>/dev/null || true
          printf 'host=%s\nxenios=%s\n' "$GITHUB_SHA" '${{ steps.source.outputs.revision }}' > build/xenia-diagnostics/identity.txt
      - uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        if: always()
        with:
          name: XeniaCore-diagnostics-${{ github.sha }}
          path: build/xenia-diagnostics/
          if-no-files-found: error
          retention-days: 7
