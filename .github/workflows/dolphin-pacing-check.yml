name: Dolphin display 120Hz and pacing regression tests
on:
  push:
    branches: [experimental]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dolphin-pacing-tests-${{ github.sha }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[retroarch-delivery]') }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Check core bindings and compile production display policy
        run: |
          set -euo pipefail
          python3 test/dolphin_pacing362_contract_test.py
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          # Build 447: DolphinFramePacing.mm and DolphinExternalDisplay.mm import
          # <external_display/...>. Stage the headers the external_display pod
          # publishes (public_header_files), and only those, as the framework
          # exposes them: the same staging as the libretro iPhone check, so an
          # unpublished import fails here too.
          STAGE="$RUNNER_TEMP/external-display-stage"
          python3 - "$STAGE" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'test')
          from libretro_ios_syntax_test import stage_external_display
          stage_external_display(Path(sys.argv[1]))
          PY
          xcrun clang++ -std=c++20 -fobjc-arc -fblocks -fsyntax-only -x objective-c++ -isysroot "$SDK" -target arm64-apple-ios17.4 -Ipackages/dolphin_internal_bridge/ios/Classes -I"$STAGE/include" packages/dolphin_internal_bridge/ios/Classes/DolphinFramePacing.mm
          xcrun clang++ -std=c++20 -fobjc-arc -fblocks -fsyntax-only -x objective-c++ -isysroot "$SDK" -target arm64-apple-ios17.4 -Ipackages/dolphin_internal_bridge/ios/Classes -I"$STAGE/include" packages/dolphin_internal_bridge/ios/Classes/DolphinExternalDisplay.mm
          xcrun clang++ -std=c++20 -fobjc-arc -fblocks -fsyntax-only -x objective-c++ -isysroot "$SDK" -target arm64-apple-ios17.4 -Ipackages/dolphin_internal_bridge/ios/Classes packages/dolphin_internal_bridge/ios/Classes/DolphinSessionMenu.mm
          python3 test/dolphin_external_display_test.py
      - name: Exercise real INI rollback and interrupted-launch recovery
        run: |
          clang++ -std=c++20 -fobjc-arc -fblocks -Ipackages/dolphin_internal_bridge/ios/Classes test/dolphin_display_trial362_test.mm -framework Foundation -o /tmp/display-trial
          /tmp/display-trial
      - name: Exercise actual UIKit settings and CADisplayLink lifecycle
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 test/dolphin_pacing362_ui_test.py > /tmp/pacing.log 2>&1 || { tail -n 100 /tmp/pacing.log; exit 1; }
          tail -n 38 /tmp/pacing.log
      - name: Upload simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Pacing-Tests-Diagnostics-${{ github.run_id }}
          path: /tmp/pacing.log
          retention-days: 3
