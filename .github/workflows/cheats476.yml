name: PS2 PS3 catalogue follow-up
on:
  push:
    branches: [Claude]
    paths: ['packages/neo_cheat_catalog/**', 'packages/rpcs3_internal_bridge/ios/Classes/Rpcs3SessionMenu.mm', 'test/*476*', 'test/unified_catalog*', '.github/workflows/cheats476.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cheats476-${{ github.sha }}
  cancel-in-progress: false
jobs:
  targeted:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cheats476]') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Reproduce delivered PS2 mismatch then verify real PS2 PS3 downloads and offline repair
        if: ${{ !contains(github.event.head_commit.message, '[476-ui-guard]') }}
        run: python3 test/cheats476_regression.py --prove-baseline --prove-queue-baseline
      - name: Compile shared catalogue with iPhone SDK
        run: python3 test/unified_catalog_ios_test.py IPhoneCatalogTests
      - name: Compile consumers of the changed catalogue API
        if: ${{ !contains(github.event.head_commit.message, '[476-ui-guard]') && !contains(github.event.head_commit.message, '[476-service-only]') }}
        run: python3 test/unified_native_ios_test.py --menus-only
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Visible button progress partial refresh and protected PS3 list on UIKit
        if: ${{ !contains(github.event.head_commit.message, '[476-service-only]') }}
        run: python3 test/unified_catalog_browser_ui_test.py --native --followup476-only --result evidence/cheats476.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheats476-${{ github.sha }}
          path: evidence/
          retention-days: 14
