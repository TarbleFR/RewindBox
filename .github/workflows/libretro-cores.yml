name: Libretro cores for RewindBox
'on':
  push:
    branches:
    - Claude
    paths:
    - .github/workflows/libretro-cores.yml
    - build-utils/libretro/**
    - build-utils/libretro_source_cores.py
    - native/azahar/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: libretro-cores-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cores:
    # Official buildbot route. A commit marked [libretro-source-cores] runs only the source route below.
    if: ${{ !contains(github.event.head_commit.message, '[libretro-source-cores]') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Retrieve the verified core collection the delivery pins
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-c3408821b2b9c47c6e31ae25b45c113aa9fd3f74
        run-id: 39081741396
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro-base
    - name: Test the packaging scripts (base preserved, only missing cores added)
      run: |
        python3 test/libretro_azahar_package_test.py
        python3 test/libretro_add_cores_test.py
    - name: Add the new official iOS cores to the unchanged collection
      run: python3 build-utils/libretro/add_cores.py dist/libretro-base dist/libretro
    - name: Show the packaged identity
      run: |
        python3 - <<'PY'
        import json
        identity = json.load(open('dist/libretro/identity.json'))
        for core in identity['cores']:
            print(core['id'], core['archive'], core['bytes'], core['minimumOS'], core['dependencies'])
        print('MoltenVK', identity['moltenVK'])
        print('files', len(identity['files']))
        PY
        du -sh dist/libretro
    - uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: LibretroCores-${{ github.sha }}
        path: dist/libretro/
        if-no-files-found: error
        retention-days: 14
  source-cores:
    # Cores RewindBox builds from their pinned, patched source with its JIT interface
    # (build-utils/libretro_source_cores.py, native/<core>/source.json), on the collection the current delivery
    # retains: every other core, MoltenVK and system file stays byte for byte.
    if: ${{ github.repository == 'TarbleFR/RewindBox' && contains(github.event.head_commit.message, '[libretro-source-cores]') }}
    runs-on: macos-15
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Retrieve the libretro collection the current delivery retains (republished by Build 801)
      uses: actions/download-artifact@v4
      with:
        name: RewindBox-Build801-f1d0df55a93680a4bd9b43922af1375cf0d66715-attempt1-component-libretro
        run-id: 44733205671
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro-base
    - name: Build the pinned source cores
      # The bundle holds original.zip (the producer archive 825.json retains) and republication.json; the script
      # checks both against the manifest's pin before it unpacks the base collection.
      run: python3 build-utils/libretro_source_cores.py --base-bundle dist/libretro-base --manifest build-utils/delivery/825.json --output dist/libretro --work "$RUNNER_TEMP/source-cores" --cores azahar
    - name: Show the packaged identity
      run: |
        python3 - <<'PY'
        import json
        identity = json.loads(open('dist/libretro/identity.json').read())
        for core in identity['cores']:
            if core.get('compiled'):
                print(core['id'], core['sha256'], core['bytes'], core['minimumOS'], core.get('jitInterface'))
        PY
        du -sh dist/libretro
    - uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      with:
        name: LibretroCores-${{ github.sha }}
        path: dist/libretro/
        if-no-files-found: error
        retention-days: 14
    - uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
      if: always()
      with:
        name: libretro-source-cores-logs-${{ github.sha }}
        path: ${{ runner.temp }}/source-cores/*/*-build.log
        if-no-files-found: warn
        retention-days: 14
