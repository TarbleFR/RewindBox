name: Libretro cores for NeoStation iOS
'on':
  push:
    branches:
    - Claude
    paths:
    - .github/workflows/libretro-cores.yml
    - build-utils/libretro/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: libretro-cores-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cores:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Retrieve the verified core collection the delivery pins
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-8b9e87ba39edb647f8cddca5ee8d924319bcbacb
        run-id: 38352378859
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro-base
    - name: Test the packaging scripts (base preserved, only missing cores added)
      run: |
        python3 test/libretro_azahar_package_test.py
        python3 test/libretro_add_cores_test.py
    - name: Add the new official iOS cores to the unchanged collection
      run: python3 build-utils/libretro/add_cores.py dist/libretro-base dist/libretro
    - name: Show the packaged identity
      run: |
        python3 - <<'PY'
        import json
        identity = json.load(open('dist/libretro/identity.json'))
        for core in identity['cores']:
            print(core['id'], core['archive'], core['bytes'], core['minimumOS'], core['dependencies'])
        print('MoltenVK', identity['moltenVK'])
        print('files', len(identity['files']))
        PY
        du -sh dist/libretro
    - uses: actions/upload-artifact@v4
      with:
        name: LibretroCores-${{ github.sha }}
        path: dist/libretro/
        if-no-files-found: error
        retention-days: 14
