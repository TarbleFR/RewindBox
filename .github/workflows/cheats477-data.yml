name: Reviewed PS2 PS3 edition supplement 477
on:
  push:
    branches: [Claude]
    paths: ['tools/cheats/**', 'test/cheats477_editions*', 'tools/cheats/unified_browser_labels.py', '.github/workflows/cheats477-data.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cheats477-editions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[editions477]') || contains(github.event.head_commit.message, '[editions477-native]') }}
    permissions: {contents: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tested_commit: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Generate only reviewed immutable additions and preserve delivered packs
        if: ${{ !contains(github.event.head_commit.message, '[editions477-native]') }}
        run: |
          python3 tools/cheats/unified477.py
          python3 test/cheats477_editions.py
          python3 tools/cheats/unified_browser_labels.py
          python3 test/unified_catalog_browser_ui_test.py
      - name: Publish the bounded data on the authorized branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/Claude | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/cheats/unified-sources.json packages/neo_cheat_catalog/ios/Resources/labels.json native/cheats/catalogue/manifest.json.gz native/cheats/catalogue/audit.json.gz native/cheats/catalogue/packs/pack-2e1b142f0a03297148b4160e.json.gz packages/neo_cheat_catalog/ios/Resources/manifest.json.gz docs/evidence/cheats477-editions.json
          git diff --exit-code -- packages/neo_cheat_catalog/ios/Resources/labels.json
          if ! git diff --cached --quiet; then
            git commit -m '[direct-followup] Publish pinned edition supplement for Build 477 [skip ci]'
            git push origin HEAD:refs/heads/Claude
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  apple:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.tested_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Actual appended programs, discovery, staging and full index memory
        run: |
          git rev-parse HEAD
          python3 test/cheats477_editions.py --native --reuse-manifest-proof
      - name: Compile and link the changed shared list with the iPhone SDK
        run: python3 test/unified_catalog_ios_test.py IPhoneCatalogTests
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Shared state and localized completion action in real UIKit
        run: python3 test/unified_catalog_browser_ui_test.py --native --followup477-only --result evidence/cheats477-final.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheats477-editions-${{ needs.publish.outputs.tested_commit }}
          path: evidence/
          retention-days: 14
