name: Retire obsolete delivery launchers
run-name: Retire four obsolete launchers and preserve unconfirmed queued records
on:
  push:
    branches: [Claude]
    paths:
      - build-utils/maintenance/obsolete-actions-2026-11-13-final.json
permissions:
  contents: read
concurrency:
  group: rewindbox-retire-obsolete-launchers
  cancel-in-progress: false
jobs:
  retire:
    if: >-
      github.repository == 'TarbleFR/RewindBox' &&
      github.ref == 'refs/heads/Claude' &&
      github.event_name == 'push' &&
      github.event.before == 'f61b2bdea4a8bb10943953e5ffb5686086dc05f6' &&
      contains(github.event.head_commit.message, '[actions-retire-final-2026-11-13]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - name: Read exact maintenance sources only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /build-utils/maintenance/
            /tools/coordination/
            /test/obsolete_actions_retirement_test.py
      - name: Check mutation guards
        run: |
          python3 -m unittest discover -s test -p obsolete_actions_retirement_test.py -v
      - name: Apply reviewed retire plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -u build-utils/maintenance/retire_obsolete_actions.py
          --plan build-utils/maintenance/obsolete-actions-2026-11-13-final.json
          --expected-plan-sha256 d2ddbb369d432924c000260767bacc61aae34a6f3472f3b03ca8a1114fd2640e --execute
      - name: Preserve receipts
        if: always()
        uses: TarbleFR/RewindBox/.github/actions/upload-protected-artifact@3bd75a37a4056eb9324987c76f32b002a89d58cb
        with:
          name: Repository-retire-${{ github.run_id }}
          path: cleanup-output/
          if-no-files-found: error
          retention-days: 90
