name: Streaming scraping MD5 480
on:
  push:
    branches: [Claude]
    paths:
      - lib/utils/optimized_md5_utils.dart
      - lib/services/screenscraper/rom_hasher.dart
      - test/scraping_streaming_md5_test.*
      - .github/workflows/scraping-streaming-md5.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.2', channel: stable, cache: true}
      - name: Restore exact locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze changed hash and diagnostics
        run: dart analyze lib/utils/optimized_md5_utils.dart lib/services/screenscraper/rom_hasher.dart test/scraping_streaming_md5_test.dart
      - name: Correct I/O guard and reuse four unchanged successful MD5 scenarios
        run: python3 test/scraping_streaming_md5_test.py
      - name: Preserve exact targeted proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraping480-${{ github.sha }}
          path: build/scraping480/
          if-no-files-found: warn
          retention-days: 14
