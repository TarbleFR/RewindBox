name: Shader kit checks
'on':
  push:
    branches:
    - Claude
    paths:
    - .github/workflows/shader-kit-checks.yml
    - packages/neo_shader_kit/**
    - test/neo_shader_kit/**
    - test/neo_shader_kit_test.py
    - test/neo_shader_kit_catalog_test.py
    - tools/shaders/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shader-kit-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    # Preset and source rules, reflection and MSL bindings of the portable
    # core (vendored glslang and SPIRV-Cross), on Linux.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Portable core tests
      run: python3 test/neo_shader_kit_test.py
  metal:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Metal runtime render tests (pixels read back from the GPU)
      run: python3 test/neo_shader_kit_test.py --require-metal --build-directory build/neo-shader-kit
    - name: Fetch libretro/slang-shaders at the commit the catalog pins
      if: ${{ !cancelled() }}
      run: |
        commit=$(python3 -c "import json; print(json.load(open('packages/neo_shader_kit/ios/Resources/slang-catalog.json'))['source']['commit'])")
        git init -q "$RUNNER_TEMP/slang-shaders"
        git -C "$RUNNER_TEMP/slang-shaders" fetch -q --depth 1 https://github.com/libretro/slang-shaders "$commit"
        git -C "$RUNNER_TEMP/slang-shaders" checkout -q FETCH_HEAD
        test "$(git -C "$RUNNER_TEMP/slang-shaders" rev-parse HEAD)" = "$commit"
    - name: Every catalog entry compiles for iPhone and renders visibly with Metal
      if: ${{ !cancelled() }}
      run: >-
        python3 test/neo_shader_kit_catalog_test.py --slang-shaders "$RUNNER_TEMP/slang-shaders"
        --build-directory build/neo-shader-kit --verdicts build/slang-metal-verdicts.json
    - name: Upload the verdicts
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: slang-metal-verdicts-${{ github.sha }}
        path: build/slang-metal-verdicts.json
        if-no-files-found: ignore
        retention-days: 14
