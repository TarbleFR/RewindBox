name: Upload artifact without private IPA disclosure
description: Reject plaintext IPA packages before uploading CI evidence or encrypted delivery.
inputs:
  name:
    description: Artifact name
    default: artifact
  path:
    description: The same paths accepted by upload-artifact
    required: true
  if-no-files-found:
    description: Missing file behavior
    default: warn
  retention-days:
    description: Artifact retention
    default: '0'
  compression-level:
    description: ZIP compression level
    default: '6'
  overwrite:
    description: Replace an artifact of the same name
    default: 'false'
  include-hidden-files:
    description: Include hidden files
    default: 'false'
outputs:
  artifact-id:
    value: ${{ steps.upload.outputs.artifact-id }}
    description: Uploaded artifact ID
  artifact-url:
    value: ${{ steps.upload.outputs.artifact-url }}
    description: Uploaded artifact URL
  artifact-digest:
    value: ${{ steps.upload.outputs.artifact-digest }}
    description: Uploaded artifact digest
runs:
  using: composite
  steps:
    - name: Reject plaintext IPA files and nested application packages
      id: guard
      if: ${{ always() }}
      shell: bash
      env:
        IPA_ARTIFACT_PATHS: ${{ inputs.path }}
        IPA_GUARD_SCRIPT: ${{ github.action_path }}/scan.py
      run: |
        for ipa_python in python3 python; do
          if command -v "$ipa_python" >/dev/null && "$ipa_python" -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then
            exec "$ipa_python" "$IPA_GUARD_SCRIPT"
          fi
        done
        echo 'Artifact inspection requires Python 3.11 or newer.' >&2
        exit 1
    - name: Upload inspected artifact
      id: upload
      if: ${{ always() && steps.guard.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
